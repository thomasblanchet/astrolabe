# TypedSeries' own methods: `.cast()` (a real hook, dtype-changing) and
# a Tier-1-style passthrough audit of methods that only reorder,
# subset, or copy rows and so never change the dtype. Written before
# `CastHook`/the new `TypedSeries` overrides exist, so every narrowing
# case here is expected to fail (red) until they are implemented.
#
# `.cast()`/`.round()` also check dtype validity, the same as the
# identical operation on a TypedExpr: confirmed empirically against real
# polars 1.43.2, `Series(String).cast(pl.Boolean)` raises
# InvalidOperationError, and `Series(Boolean).round()`/
# `Series(String).round()` both raise InvalidOperationError (rounding
# only supports numeric types).
#
# Confirmed against real polars 1.43.2, not assumed: `Series.cast`
# declares `-> Self` despite being dtype-changing. `append`, `extend`,
# `filter`, `sort`, `rechunk`, `clone`, and `set_sorted` already declare
# `-> Self` in the real stub, so they should already narrow correctly
# through plain inheritance, with no new code. `drop_nulls`, `slice`, `head`, `tail`, `limit`, `gather_every`, `top_k`,
# `bottom_k`, `unique`, `reverse`, `clear`, `round`, `shift`, `shuffle`,
# and `sample` all declare a plain, non-`Self` `Series` return in the
# real stub, confirmed to actually preserve dtype at runtime, so each
# needs a new `Self`-typed override. `alias` and `rename` change the
# name, so a hook gives the result the new name.
#
# TypedSeries carries [Name, DType], matching TypedExpr's own order:
# `.cast()`/`.round()` both keep the receiver's own name unchanged,
# whether they succeed or fall back to Unchecked, the same as every
# single-column TypedExpr per-op hook already carries Name through.

- case: cast_to_bare_class_narrows
  main: |
    from typing import Literal
    import polars as pl
    from astrolabe import Columns, TypedDataFrame, TypedSeries

    class FrameSchema(Columns):
        a: pl.Int64

    Frame = TypedDataFrame[FrameSchema]

    df: Frame
    s: TypedSeries[Literal["a"], pl.Int64] = df["a"]
    narrowed: TypedSeries[Literal["a"], pl.Float64] = s.cast(pl.Float64)

