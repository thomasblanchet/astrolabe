- case: cast_to_an_unread_dtype_keeps_the_name_under_unchecked
  main: |
    from typing import Literal
    import polars as pl
    from astrolabe import Columns, TypedDataFrame, TypedSeries

    class FrameSchema(Columns):
        a: pl.Int64

    Frame = TypedDataFrame[FrameSchema]

    df: Frame
    s: TypedSeries[Literal["a"], pl.Int64] = df["a"]
    # The series takes the data type that the target holds at run time.
    target: pl.DataType | type[pl.DataType]
    reveal_type(s.cast(target))  # N: Revealed type is "astrolabe.frame.TypedSeries[Literal['a'], astrolabe.frame.Unchecked]"

    # A series of a data type in a type variable takes the target of the cast.
    def generic[D: pl.DataType](g: TypedSeries[Literal["a"], D]) -> None:
        reveal_type(g.cast(pl.Int64))  # N: Revealed type is "astrolabe.frame.TypedSeries[Literal['a'], polars.datatypes.classes.Int64]"

