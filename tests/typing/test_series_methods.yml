- case: a_series_cast_gives_the_data_type_that_polars_gives
  skip: __import__("tests.releases").releases.polars_before("2.0.0")
  main: |
    from typing import Literal
    import polars as pl
    from astrolabe import Column, Columns, List, Struct, TypedDataFrame, TypedSeries

    class FrameSchema(Columns):
        ls: List[pl.String]
        li: List[pl.Int64]
        b: pl.Boolean
        st: Struct[Column[Literal["a"], pl.String]]

    df: TypedDataFrame[FrameSchema]
    ls: TypedSeries[Literal["ls"], List[pl.String]] = df["ls"]
    li: TypedSeries[Literal["li"], List[pl.Int64]] = df["li"]
    b: TypedSeries[Literal["b"], pl.Boolean] = df["b"]
    st: TypedSeries[Literal["st"], Struct[Column[Literal["a"], pl.String]]] = df["st"]
    # A cast reads the element of a list and the fields of a struct.
    reveal_type(ls.cast(pl.List(pl.Boolean)))  # E: This Series cannot cast from List(String) to List(Boolean)  [invalid-cast] # N: Revealed type is "astrolabe.frame.TypedSeries[Literal['ls'], astrolabe.frame.Unchecked]"
    reveal_type(ls.cast(pl.List(pl.Int64)))  # N: Revealed type is "astrolabe.frame.TypedSeries[Literal['ls'], astrolabe.frame.List[polars.datatypes.classes.Int64]]"
    reveal_type(st.cast(pl.Boolean))  # E: This Series cannot cast from Struct({'a': String}) to Boolean  [invalid-cast] # N: Revealed type is "astrolabe.frame.TypedSeries[Literal['st'], astrolabe.frame.Unchecked]"
    reveal_type(st.cast(pl.List(pl.Int64)))  # E: This Series cannot cast from Struct({'a': String}) to List(Int64)  [invalid-cast] # N: Revealed type is "astrolabe.frame.TypedSeries[Literal['st'], astrolabe.frame.Unchecked]"
    # The answer of a cast is not always its target.
    reveal_type(li.cast(pl.List(pl.Null)))  # N: Revealed type is "astrolabe.frame.TypedSeries[Literal['li'], astrolabe.frame.List[polars.datatypes.classes.Int64]]"
    reveal_type(b.cast(pl.List(pl.Categorical)))  # E: This Series cannot cast from Boolean to List(Categorical)  [invalid-cast] # N: Revealed type is "astrolabe.frame.TypedSeries[Literal['b'], astrolabe.frame.Unchecked]"

