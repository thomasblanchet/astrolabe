    i: TypedSeries[Literal["a"], pl.Int64] = s.top_k()
    j: TypedSeries[Literal["a"], pl.Int64] = s.bottom_k()
    k: TypedSeries[Literal["a"], pl.Int64] = s.unique()
    l: TypedSeries[Literal["a"], pl.Int64] = s.reverse()
    m: TypedSeries[Literal["a"], pl.Int64] = s.clear()
    n: TypedSeries[Literal["a"], pl.Int64] = s.round()
    o: TypedSeries[Literal["a"], pl.Int64] = s.shift()
