- case: a_renamed_series_carries_its_new_name_into_hstack
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class FrameSchema(Columns):
        a: pl.Int64

    df: TypedDataFrame[FrameSchema]

    class WideSchema(Columns):
        a: pl.Int64
        b: pl.Int64

    wide: TypedDataFrame[WideSchema] = df.hstack([df["a"].alias("b")])

    def rename(name: str) -> None:
        reveal_type(df["a"].rename(name))  # N: Revealed type is "astrolabe.frame.TypedSeries[str, polars.datatypes.classes.Int64]"

- case: a_series_cast_agrees_with_the_cast_of_an_expression
  main: |
    from typing import Literal
    import polars as pl
    from astrolabe import Columns, TypedDataFrame, TypedSeries

    class FrameSchema(Columns):
