- case: series_constructor_with_unresolvable_dtype_substitutes_unchecked
  main: |
    from typing import Literal
    import polars as pl
    from astrolabe import Unchecked, TypedSeries

    # dtype= was given, but its own value is not a recognizable dtype
    # expression: the name is still known, so this substitutes Unchecked
    # rather than falling all the way back to a plain Series.
    dtype: pl.DataType | type[pl.DataType]
    s = pl.Series("price", [1, 2, 3], dtype=dtype)
    narrowed: TypedSeries[Literal["price"], Unchecked] = s

- case: series_cast_of_a_struct_recasts_every_field
  skip: __import__("tests.releases").releases.polars_before("2.0.0")
  main: |
    from typing import Literal
    import polars as pl
    from astrolabe import Column, Columns, List, Struct, TypedDataFrame, TypedSeries

    class FrameSchema(Columns):
        s: Struct[Column[Literal["x"], pl.Int64], Column[Literal["y"], pl.Float64]]
        l: List[pl.Int64]

    Frame = TypedDataFrame[FrameSchema]

    df: Frame
    s: TypedSeries[Literal["s"], Struct[Column[Literal["x"], pl.Int64], Column[Literal["y"], pl.Float64]]] = df["s"]
    recast: TypedSeries[
        Literal["s"], Struct[Column[Literal["x"], pl.Float64], Column[Literal["y"], pl.Float64]]
    ] = s.cast(pl.Float64)
    text: TypedSeries[Literal["s"], pl.String] = s.cast(pl.String)
    boxed: TypedSeries[
        Literal["s"], Struct[Column[Literal["x"], List[pl.Int64]], Column[Literal["y"], List[pl.Int64]]]
    ] = s.cast(pl.List(pl.Int64))  # E: This Series cannot cast from Struct({'x': Int64, 'y': Float64}) to List(Int64)  [invalid-cast] # E: Incompatible types in assignment (expression has type "TypedSeries[Literal['s'], Unchecked]", variable has type "TypedSeries[Literal['s'], Struct[tuple[Column[Literal['x'], astrolabe.frame.List[Int64]], Column[Literal['y'], astrolabe.frame.List[Int64]]]]]")  [assignment]
    l: TypedSeries[Literal["l"], List[pl.Int64]] = df["l"]
    reveal_type(l.cast(pl.Int64))  # E: This Series cannot cast from List(Int64) to Int64  [invalid-cast] # N: Revealed type is "astrolabe.frame.TypedSeries[Literal['l'], astrolabe.frame.Unchecked]"
    widened: TypedSeries[Literal["l"], List[pl.Float64]] = l.cast(pl.List(pl.Float64))

