- case: series_constructor_narrows_name_and_dtype
  main: |
    from typing import Literal
    import polars as pl
    from astrolabe import TypedSeries

    # The actual bug this fix targets: pl.Series(...)'s own return type
    # is masked directly (SeriesConstructorHook), so a bound variable
    # narrows exactly the same as the inline call would.
    s = pl.Series("price", [1, 2, 3], dtype=pl.Int64)
    narrowed: TypedSeries[Literal["price"], pl.Int64] = s

- case: series_constructor_with_no_dtype_substitutes_unchecked
  main: |
    from typing import Literal
    import polars as pl
    from astrolabe import Unchecked, TypedSeries

    # With no explicit dtype=, the name is still known, but the dtype
    # cannot be inferred from values' own inferred type -- there is no
    # real pl.Series constructor facade for that, so Unchecked
    # substitutes for it instead of losing the whole result.
    s = pl.Series("price", [1, 2, 3])
    narrowed: TypedSeries[Literal["price"], Unchecked] = s

- case: series_constructor_with_non_literal_name_falls_back_to_plain_series
