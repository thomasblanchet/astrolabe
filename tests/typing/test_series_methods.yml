    a: TypedSeries[Literal["a"], pl.Int64] = s.drop_nulls()
    b: TypedSeries[Literal["renamed"], pl.Int64] = s.alias("renamed")
    c: TypedSeries[Literal["renamed"], pl.Int64] = s.rename("renamed")
    d: TypedSeries[Literal["a"], pl.Int64] = s.slice(0, 2)
    e: TypedSeries[Literal["a"], pl.Int64] = s.head()
    f: TypedSeries[Literal["a"], pl.Int64] = s.tail()
    g: TypedSeries[Literal["a"], pl.Int64] = s.limit()
