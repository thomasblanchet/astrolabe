- case: read_csv_with_dict_literal_final_str_key_narrows_like_inline_literal
  main: |
    from typing import Final
    import polars as pl
    from astrolabe import Column, TypedDataFrame

    # A Final-declared string variable names the column the same way
    # the equivalent inline string literal key does (see
    # read_csv_with_dict_literal_schema_returns_frame_type, above).
    NAME: Final = "foo"

    reveal_type(pl.read_csv("data.csv", schema={NAME: pl.Int64}))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'foo': polars.datatypes.classes.Int64}, closed=True), None]"

