- case: read_csv_with_dict_literal_non_literal_value_narrows_to_unchecked
  main: |
    import polars as pl
    from astrolabe import Unchecked, Column, TypedDataFrame

    # The column's own name is still known outright even though its
    # dtype is not: this narrows with Unchecked substituted for "foo",
    # instead of losing the whole schema.
    dtype_var: type[pl.DataType] = pl.Int64
    reveal_type(pl.read_csv("data.csv", schema={"foo": dtype_var}))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'foo': astrolabe.frame.Unchecked}, closed=True), None]"

- case: read_csv_with_dict_literal_partial_schema_narrows_the_resolvable_columns
  main: |
    import polars as pl
    from astrolabe import Unchecked, Column, TypedDataFrame

    # "bar"'s own value does not resolve to a recognizable dtype, but
    # this must not discard "foo"'s own already-resolved dtype: each
    # column in a schema dict literal is independent.
    dtype_var: type[pl.DataType] = pl.Int64
    reveal_type(pl.read_csv("data.csv", schema={"foo": pl.String, "bar": dtype_var}))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'foo': polars.datatypes.classes.String, 'bar': astrolabe.frame.Unchecked}, closed=True), None]"

