# pl.read_csv()/pl.scan_csv(): recovering a typed frame from a declared
# schema. Recognizes two shapes of schema= and narrows the call's result
# accordingly, instead of plain pl.DataFrame/pl.LazyFrame:
#
# - schema=SomeAlias.schema, SomeAlias a module-level alias for a
#   concrete TypedDataFrame[...]/TypedLazyFrame[...]: narrows to
#   SomeAlias itself.
# - schema={"foo": pl.String, ...}, a dict literal with string-literal
#   keys: mints a fresh TypedDataFrame[...]/TypedLazyFrame[...].
#
# The dict-literal shape needs astrolabe.frame's Column/TypedDataFrame/
# TypedLazyFrame TypeInfo. AstrolabePlugin.get_additional_deps
# (plugin.py) forces every file in the build to depend on
# astrolabe.frame/astrolabe.remainder, specifically so this always
# resolves even when nothing in the user's own code imports astrolabe
# — see the last case, which pins this down.
#
# Scope: read_csv/read_parquet/read_json/read_ndjson narrow to
# TypedDataFrame; scan_csv/scan_parquet/scan_ndjson narrow to
# TypedLazyFrame. Each is the exact same SchemaArgFrameHook, registered
# once per function in _hooks/dispatch/function.py -- confirmed each of
# these functions' own schema= parameter accepts the same two shapes
# (a SchemaDict/SchemaDefinition dict literal, or a `.schema` alias
# access), so no new parsing logic is needed per function. The
# DataFrame()/LazyFrame() constructors are still an explicit non-goal.
# A .schema access's receiver need not be a class alias: a concrete
# instance's own .schema access narrows too, and so does a single-column
# inline subscript with no intermediate alias name (see the cases below
# for both). A schema= alias of the "wrong" frame kind for the call is
# not an error: the result is always rebuilt as this call's own expected
# kind, since read_csv()/scan_csv() both validate schema= against the
# file at runtime the same way regardless of which alias kind named it.
#
# Every edge case of the shared parsing logic itself (a non-literal
# key/value, an inline subscript, and so on) is exercised once, against
# read_csv/scan_csv; the other five functions each get one alias-schema
# and one dict-literal-schema case, to prove they are correctly wired to
# the same hook, not to re-prove logic that does not vary by caller.
#
# Every case below falls back through the shared UntypedFallback, same
# as every other hook. This is silent here because allow_unproven
# defaults to "omitted", which lets a missing schema pass. This
# sandboxed yaml can only reach that default. See
# test_allow_unproven_integration.py for the reported and
# per-operation-override cases, which need a real pyproject.toml.
#
# Every unresolvable schema= shape, named "_falls_back_to_untyped"
# below, falls back to the plain, erased pl.DataFrame/pl.LazyFrame of
# this call's own expected kind: read_csv()/scan_csv() have no receiver
# of their own to preserve otherwise, the same reasoning that applies
# to every other operation's fallback. This holds even when nothing in
# the user's own code imports astrolabe at all, since
# get_additional_deps (see above) guarantees TypedDataFrame/
# TypedLazyFrame are always resolvable.

- case: read_csv_with_alias_schema_returns_frame_type
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class FrameSchema(Columns):
        foo: pl.String
        bar: pl.Int64

    Frame = TypedDataFrame[FrameSchema]

    reveal_type(pl.read_csv("data.csv", schema=Frame.schema))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'foo': polars.datatypes.classes.String, 'bar': polars.datatypes.classes.Int64}, closed=True), None]"

- case: scan_csv_with_alias_schema_returns_lazyframe_type
  main: |
    import polars as pl
    from astrolabe import Columns, TypedLazyFrame

    class LazyFrameSchema(Columns):
