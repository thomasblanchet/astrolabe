    LazyFrame = TypedLazyFrame[LazyFrameSchema]

    reveal_type(pl.scan_csv("data.csv", schema=LazyFrame.schema))  # N: Revealed type is "astrolabe.frame.TypedLazyFrame[TypedDict({'foo': polars.datatypes.classes.String}, closed=True), None]"

