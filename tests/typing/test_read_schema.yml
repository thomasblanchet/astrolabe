- case: read_csv_with_instance_schema_access_narrows
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class FrameSchema(Columns):
        foo: pl.String

    # A concrete receiver's own .schema access is at least as easy to
    # resolve as the supported alias case: the receiver's own type is
    # already the resolved frame Instance directly, no synthesized
    # constructor signature to unwrap.
    Frame = TypedDataFrame[FrameSchema]

    df: Frame
    reveal_type(pl.read_csv("data.csv", schema=df.schema))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'foo': polars.datatypes.classes.String}, closed=True), None]"

- case: read_csv_with_mismatched_frame_kind_schema_narrows_to_hooks_own_kind
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame, TypedLazyFrame

    class FrameSchema(Columns):
        foo: pl.String

    # read_csv()/scan_csv() both validate schema= against the file at
    # runtime the same way. The alias's own frame kind has no bearing
    # on which kind the call itself produces: scan_csv() always narrows
    # to TypedLazyFrame, even from a TypedDataFrame alias.
    Frame = TypedDataFrame[FrameSchema]

    narrowed: TypedLazyFrame[FrameSchema] = pl.scan_csv("data.csv", schema=Frame.schema)

- case: read_csv_with_inline_subscript_schema_narrows
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class Schema1(Columns):
        foo: pl.String

    # A frame type written as a value takes one argument, as an annotation does.
    reveal_type(
        pl.read_csv("data.csv", schema=TypedDataFrame[Schema1].schema)  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'foo': polars.datatypes.classes.String}, closed=True), None]"
    )

- case: read_csv_with_dict_literal_schema_narrows_even_when_astrolabe_is_never_imported
  main: |
    import polars as pl

    # This file imports nothing from astrolabe at all. Without
    # AstrolabePlugin.get_additional_deps forcing astrolabe.frame/
    # astrolabe.remainder into the build graph regardless, TypedDataFrame's
    # own TypeInfo would be unresolvable here, and this would silently
    # fall back to the plain, erased pl.DataFrame instead.
    reveal_type(pl.read_csv("data.csv", schema={"foo": pl.String}))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'foo': polars.datatypes.classes.String}, closed=True), None]"

