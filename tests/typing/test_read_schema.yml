- case: read_csv_with_open_alias_schema_falls_back_to_untyped
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame, other_columns

    class FrameSchema(Columns):
        foo: pl.String

    Rest = other_columns()
    Frame = TypedDataFrame[FrameSchema, Rest]

    # The type of an open frame does not name all of its columns, so its schema cannot give the columns of the result.
    reveal_type(pl.read_csv("data.csv", schema=Frame.schema))  # N: Revealed type is "polars.dataframe.frame.DataFrame"
