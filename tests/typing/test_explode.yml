# .explode(): each named List or Array column takes its inner data type,
# in place.
#
# The names are literal strings: a bare string, or a literal list or tuple
# for the first `columns` argument, as in polars' own
# `explode(columns, *more_columns)`. Each named column must be a List or
# an Array. An open receiver keeps its remainder.

- case: explode_list_column_unwraps_to_inner_dtype
  main: |
    import polars as pl
    from astrolabe import Columns, List, TypedDataFrame

    class FrameSchema(Columns):
        foo: pl.Int64
        bar: List[pl.Int64]

    Frame = TypedDataFrame[FrameSchema]

    df: Frame

    class NarrowedSchema(Columns):
        foo: pl.Int64
        bar: pl.Int64

    narrowed: TypedDataFrame[NarrowedSchema] = df.explode("bar")

- case: explode_array_column_unwraps_to_inner_dtype
  main: |
    from typing import Literal
    import polars as pl
    from astrolabe import Array, Columns, TypedDataFrame

    class FrameSchema(Columns):
        foo: pl.Int64
        bar: Array[pl.Int64, Literal[3]]

    Frame = TypedDataFrame[FrameSchema]

    df: Frame

    class NarrowedSchema(Columns):
        foo: pl.Int64
        bar: pl.Int64

    narrowed: TypedDataFrame[NarrowedSchema] = df.explode("bar")

