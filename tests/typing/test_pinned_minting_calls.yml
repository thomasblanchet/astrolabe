- case: a_call_with_a_missing_argument_keeps_the_plain_type
  main: |
    import polars as pl
    import polars.selectors as cs

    # A call with too few arguments is a mypy error. The checker then keeps the plain type.
    reveal_type(pl.col("i").__add__())  # E: Too few arguments for "__add__" of "Expr"  [call-arg]  # N: Revealed type is "astrolabe.expr.TypedExpr[astrolabe.expr.Deferred[Literal["pl.col('i').__add__()"]]]"
    reveal_type(pl.col("i").__radd__())  # E: Too few arguments for "__radd__" of "Expr"  [call-arg]  # N: Revealed type is "astrolabe.expr.TypedExpr[astrolabe.expr.Deferred[Literal["pl.col('i').__radd__()"]]]"
    reveal_type(cs.numeric().__add__())  # E: Too few arguments for "__add__" of "Selector"  [call-arg]  # N: Revealed type is "astrolabe.expr.TypedExpr[astrolabe.expr.Deferred[Literal['cs.numeric().__add__()']]]"
    reveal_type(abs())  # E: Too few arguments for "abs"  [call-arg] # N: Revealed type is "Never"
    reveal_type((5).__eq__())  # E: Too few arguments for "__eq__" of "int"  [call-arg] # N: Revealed type is "bool"

- case: a_when_chain_reads_one_condition_at_each_step
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class FrameSchema(Columns):
        i: pl.Int64
        b: pl.Boolean

    df: TypedDataFrame[FrameSchema]

    # Each when and then step reads its one argument.
    chain = pl.when(pl.col("b")).then(pl.col("i")).when(pl.col("b")).then(1).otherwise(2)
