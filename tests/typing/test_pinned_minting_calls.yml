- case: list_agg_reads_the_element_expression
  main: |
    import polars as pl
    from astrolabe import Columns, List, TypedDataFrame

    class FrameSchema(Columns):
        l: List[pl.Int64]
        x: pl.Int64

    df: TypedDataFrame[FrameSchema]

