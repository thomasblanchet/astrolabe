- case: a_list_dtype_over_a_function_binds_the_plain_list
  main: |
    import polars as pl
    from astrolabe import column

    def element() -> None: ...

    # A name that is not a data type class gives no inner data type.
    Nested = pl.List(element)  # type: ignore[arg-type]
    reveal_type(Nested)  # N: Revealed type is "polars.datatypes.classes.List"
    # A declaration over that list gives no column type.
    Lots = column("lots", Nested)
    reveal_type(Lots)  # N: Revealed type is "Any"

- case: a_join_key_list_can_mix_names_and_bare_columns
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class LeftSchema(Columns):
        a: pl.Int64
        b: pl.Int64
        x: pl.String

    class RightSchema(Columns):
        a: pl.Int64
        b: pl.Int64
        y: pl.Float64

    left: TypedDataFrame[LeftSchema]
    right: TypedDataFrame[RightSchema]

    # A key list reads each item as a name or as a bare pl.col(name).
    reveal_type(left.join(right, on=[pl.col("a"), "b"]))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'a': polars.datatypes.classes.Int64, 'b': polars.datatypes.classes.Int64, 'x': polars.datatypes.classes.String, 'y': polars.datatypes.classes.Float64}, closed=True), None]"

- case: a_bare_boolean_variable_is_a_boolean_column
  main: |
    from typing import Final, Literal
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class FrameSchema(Columns):
        i: pl.Int64

    df: TypedDataFrame[FrameSchema]
    flag: Literal[True] = True
    FLAG: Final = False

    # A bare boolean value gives a Boolean column.
    reveal_type(df.select(a=flag, b=FLAG, c=True))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'a': polars.datatypes.classes.Boolean, 'b': polars.datatypes.classes.Boolean, 'c': polars.datatypes.classes.Boolean}, closed=True), None]"

- case: a_namespace_wrapper_over_an_unknown_type_keeps_the_plain_type
  main: |
    import polars as pl
    from astrolabe.expr import TypedExprStrNamespace

    # A namespace wrapper whose argument is neither an expression nor a selection gives the plain type.
    def upper(w: TypedExprStrNamespace[int]) -> None:
        reveal_type(w.to_uppercase())  # N: Revealed type is "astrolabe.expr.TypedExpr[astrolabe.expr.Deferred[Literal["hole('expr').str.to_uppercase()"]]]"
