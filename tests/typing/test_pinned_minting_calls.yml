    reveal_type(df.select(pl.col("l").list.agg(pl.element().sum())))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'l': polars.datatypes.classes.Int64}, closed=True), None]"

- case: list_agg_rejects_a_read_of_a_named_column
  main: |
    import polars as pl
    from astrolabe import Columns, List, TypedDataFrame

    class FrameSchema(Columns):
        l: List[pl.Int64]
        x: pl.Int64

    df: TypedDataFrame[FrameSchema]

    # Only pl.element() can be read inside list.agg.
    df.select(pl.col("l").list.agg(pl.col("x").sum()))  # E: "l" has no result type at this frame's column types: named columns are not allowed in `eval` functions; consider using `element`, and polars raises ComputeError  [unsupported-dtype-op]

