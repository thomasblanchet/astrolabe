- case: by_dtype_reads_one_or_several_data_types
  main: |
    import polars as pl
    import polars.selectors as cs
    from astrolabe import Columns, TypedDataFrame

    class FrameSchema(Columns):
        i: pl.Int64
        s: pl.String
        f: pl.Float64

    df: TypedDataFrame[FrameSchema]

    # cs.by_dtype picks the columns of each listed data type.
    reveal_type(df.select(cs.by_dtype(pl.Int64)))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'i': polars.datatypes.classes.Int64}, closed=True), None]"
    reveal_type(df.select(cs.by_dtype(pl.Int64, pl.String)))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'i': polars.datatypes.classes.Int64, 's': polars.datatypes.classes.String}, closed=True), None]"
    # A data type that the checker cannot read gives the plain type.
    dtype: pl.DataType = pl.Int64()
    reveal_type(cs.by_dtype(dtype))  # N: Revealed type is "astrolabe.expr.TypedSelector[astrolabe.expr.Deferred[Literal["cs.by_dtype(hole('value'))"]]]"

- case: a_col_name_is_a_pattern_only_between_caret_and_dollar
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class FrameSchema(Columns):
        a: pl.Int64
        ab: pl.Int64

    df: TypedDataFrame[FrameSchema]

    # A plain name picks only the column of that name.
    reveal_type(df.select(pl.col("a")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'a': polars.datatypes.classes.Int64}, closed=True), None]"
    # A name that starts with a caret and ends with a dollar sign is a regular expression.
    reveal_type(df.select(pl.col("^a.*$")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict(main.FrameSchema, {'a': polars.datatypes.classes.Int64, 'ab': polars.datatypes.classes.Int64}, closed=True), None]"
    reveal_type(df.select(pl.col("^$")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({}, closed=True), None]"

- case: a_col_name_with_only_a_dollar_sign_is_a_literal_name
