    from astrolabe import Columns, TypedDataFrame

    class FrameSchema(Columns):
        ab: pl.Int64
        ba: pl.Int64
        c: pl.Int64

    df: TypedDataFrame[FrameSchema]

    # cs.starts_with picks a column that starts with any of its prefixes.
    reveal_type(df.select(cs.starts_with("a", "b")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'ab': polars.datatypes.classes.Int64, 'ba': polars.datatypes.classes.Int64}, closed=True), None]"
    # cs.matches ignores a leading ".*" in its pattern.
    reveal_type(df.select(cs.matches(".*b")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'ab': polars.datatypes.classes.Int64, 'ba': polars.datatypes.classes.Int64}, closed=True), None]"

- case: selector_set_operations_need_two_bare_selectors
  main: |
    import polars as pl
    import polars.selectors as cs

    # A set operation with an operand that is not a bare selector keeps the plain type.
    reveal_type(cs.numeric() & pl.col("i"))  # N: Revealed type is "astrolabe.expr.TypedExpr[astrolabe.expr.Deferred[Literal["cs.numeric() & pl.col('i')"]]]"
    name: str = "i"
