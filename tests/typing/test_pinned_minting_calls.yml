# Cases that pin the readers of literal arguments and the recorder.
# Each case pins one rule that a mutation audit found without a test.
# Every frame type here is confirmed against real polars.

- case: a_negative_bare_value_keeps_its_sign_in_repeat
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class FrameSchema(Columns):
        i: pl.Int64

    df: TypedDataFrame[FrameSchema]

    # The smallest Int32 value fits Int32. Its positive twin needs Int64.
    reveal_type(df.select(pl.repeat(-2147483648, 3)))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'repeat': polars.datatypes.classes.Int32}, closed=True), None]"
    reveal_type(df.select(pl.repeat(2147483648, 3)))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'repeat': polars.datatypes.classes.Int64}, closed=True), None]"

- case: a_lit_call_with_one_argument_is_read_as_its_value
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class FrameSchema(Columns):
        i: pl.Int64

    df: TypedDataFrame[FrameSchema]

    # The checker reads the value inside pl.lit(value).
    reveal_type(df.select(pl.repeat(pl.lit(5), 3)))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'repeat': polars.datatypes.classes.Int32}, closed=True), None]"
    reveal_type(df.select(pl.repeat(pl.lit(-2147483649), 3)))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'repeat': polars.datatypes.classes.Int64}, closed=True), None]"
    # A pl.lit call with a dtype argument is not a bare value. The call keeps its plain type.
    reveal_type(df.select(pl.repeat(pl.lit(5, dtype=pl.Int8), 3)))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'repeat': polars.datatypes.classes.Int8}, closed=True), None]"

- case: a_true_value_in_on_columns_names_the_column_true
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class FrameSchema(Columns):
        id: pl.Int64
        flag: pl.Boolean
        v: pl.Int64

    df: TypedDataFrame[FrameSchema]

    # polars names the pivoted column of True "true".
    reveal_type(df.pivot(on="flag", on_columns=[True], index="id", values="v"))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'id': polars.datatypes.classes.Int64, 'true': polars.datatypes.classes.Int64}, closed=True), None]"
    # polars names the pivoted column of False "false".
    reveal_type(df.pivot(on="flag", on_columns=[False], index="id", values="v"))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'id': polars.datatypes.classes.Int64, 'false': polars.datatypes.classes.Int64}, closed=True), None]"

- case: a_decimal_call_reads_its_integer_arguments
  main: |
    import polars as pl

    # The checker reads the precision and the scale of a pl.Decimal call.
    reveal_type(pl.Decimal(10, 2))  # N: Revealed type is "astrolabe.frame.Decimal[Literal[10], Literal[2]]"
    # A missing scale is 0.
    reveal_type(pl.Decimal(10))  # N: Revealed type is "astrolabe.frame.Decimal[Literal[10], Literal[0]]"
    # A leading minus sign is part of the number.
    reveal_type(pl.Decimal(10, -2))  # N: Revealed type is "astrolabe.frame.Decimal[Literal[10], Literal[-2]]"
    # A scale that is not an integer literal gives the plain type.
    scale: int = 2
    reveal_type(pl.Decimal(10, scale))  # N: Revealed type is "polars.datatypes.classes.Decimal"
    reveal_type(pl.Decimal(10, +2))  # N: Revealed type is "polars.datatypes.classes.Decimal"

- case: an_array_call_reads_its_integer_width
  main: |
    import polars as pl

    # The checker reads the width of a pl.Array call.
    reveal_type(pl.Array(pl.Int64, 2))  # N: Revealed type is "astrolabe.frame.Array[polars.datatypes.classes.Int64, Literal[2]]"
    # A leading minus sign is part of the number. polars builds this data type with the width -1.
    reveal_type(pl.Array(pl.Int64, -1))  # N: Revealed type is "astrolabe.frame.Array[polars.datatypes.classes.Int64, Literal[-1]]"
    # A width that is not an integer literal gives the plain type.
    width: int = 2
    reveal_type(pl.Array(pl.Int64, width))  # N: Revealed type is "polars.datatypes.classes.Array"
    # A leading plus sign is part of the number too.
    reveal_type(pl.Array(pl.Int64, +2))  # N: Revealed type is "astrolabe.frame.Array[polars.datatypes.classes.Int64, Literal[2]]"

- case: the_outermost_alias_names_an_untyped_chain_through_a_cast
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class FrameSchema(Columns):
        i: pl.Int64

    df: TypedDataFrame[FrameSchema]
    e: pl.Expr

    # A cast with one argument keeps the name of the alias under it.
    reveal_type(df.select(e.alias("b").cast(pl.Int64)))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'b': astrolabe.frame.Unchecked}, closed=True), None]"

- case: the_alias_walk_stops_at_a_step_it_cannot_pass
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class FrameSchema(Columns):
        i: pl.Int64

    df: TypedDataFrame[FrameSchema]
    e: pl.Expr

    # The walk passes only an alias and a cast with one argument. A frame with an unknown name keeps its plain type.
    reveal_type(df.select(e.alias("b").fill_null(0)))  # N: Revealed type is "polars.dataframe.frame.DataFrame"
    reveal_type(df.select(e.alias("b").cast(pl.Int64, strict=False)))  # N: Revealed type is "polars.dataframe.frame.DataFrame"
    name: str = "b"
    reveal_type(df.select(e.alias(name)))  # N: Revealed type is "polars.dataframe.frame.DataFrame"
    reveal_type(df.select(e.alias()))  # N: Revealed type is "polars.dataframe.frame.DataFrame" # E: Missing positional argument "name" in call to "alias" of "Expr"  [call-arg]

- case: a_constructor_with_an_unreadable_part_keeps_the_plain_type
  main: |
    import polars as pl

    e: pl.Expr
    name: str = "a"

    # A constructor whose operand the checker cannot read keeps the plain type.
    reveal_type(pl.sum(name))  # N: Revealed type is "astrolabe.expr.TypedExpr[astrolabe.expr.Deferred[Literal["pl.sum(hole('str'))"]]]"
    reveal_type(pl.date(e, 1, 1))  # N: Revealed type is "astrolabe.expr.TypedExpr[astrolabe.expr.Deferred[Literal["pl.date(hole('expr'), 1, 1)"]]]"

- case: a_member_of_an_unnest_or_a_selection_that_the_hook_cannot_read_keeps_the_plain_type
  main: |
    from typing import Literal
    import polars as pl
    import polars.selectors as cs
    from astrolabe import Column, Columns, Struct, TypedDataFrame

    class FrameSchema(Columns):
        i: pl.Int64
        s: Struct[Column[Literal["a"], pl.Int64]]

    df: TypedDataFrame[FrameSchema]
    u = pl.col("s").struct.unnest()

    # The checker does not type these members on a struct unnest. They keep the plain type.
    reveal_type(u.abs())  # N: Revealed type is "astrolabe.expr.TypedExpr[astrolabe.expr.Deferred[Literal["pl.col('s').struct.unnest().abs()"]]]"
    reveal_type(u.str.to_uppercase())  # N: Revealed type is "astrolabe.expr.TypedExpr[astrolabe.expr.Deferred[Literal["pl.col('s').struct.unnest().str.to_uppercase()"]]]"
    reveal_type(u.map_batches(lambda x: x, return_dtype=pl.Int64))  # N: Revealed type is "astrolabe.expr.TypedExpr[astrolabe.expr.Deferred[Literal["pl.col('s').struct.unnest().map_batches(hole('function'), return_dtype=pl.Int64)"]]]"
    reveal_type(u.over("i"))  # N: Revealed type is "astrolabe.expr.TypedExpr[astrolabe.expr.Deferred[Literal["pl.col('s').struct.unnest().over('i')"]]]"
    reveal_type(u.rank())  # N: Revealed type is "astrolabe.expr.TypedExpr[astrolabe.expr.Deferred[Literal["pl.col('s').struct.unnest().rank()"]]]"
    reveal_type(1 + u)  # N: Revealed type is "astrolabe.expr.TypedExpr[astrolabe.expr.Deferred[Literal["1 + pl.col('s').struct.unnest()"]]]"
    # The checker does not type these members on a selection. They keep the plain type.
    reveal_type(cs.numeric().struct.unnest())  # N: Revealed type is "astrolabe.expr.TypedExpr[astrolabe.expr.Deferred[Literal['cs.numeric().struct.unnest()']]]"
    reveal_type(1 + cs.numeric())  # N: Revealed type is "astrolabe.expr.TypedExpr[astrolabe.expr.Deferred[Literal['1 + cs.numeric()']]]"

- case: a_dtype_call_with_a_variable_argument_binds_the_plain_dtype
  main: |
    import polars as pl

    scale: int = 2
    unit: str = "ms"
    categories: list[str] = ["a"]

    # A data type call whose argument is not a literal binds the plain data type.
    Money = pl.Decimal(10, scale)
    Span = pl.Duration(unit)  # type: ignore[arg-type]
    Kinds = pl.Enum(categories)
    reveal_type(Money)  # N: Revealed type is "polars.datatypes.classes.Decimal"
    reveal_type(Span)  # N: Revealed type is "polars.datatypes.classes.Duration"
    reveal_type(Kinds)  # N: Revealed type is "polars.datatypes.classes.Enum"

- case: an_operator_types_each_arrangement_of_expression_selection_and_literal
  main: |
    import polars as pl
    import polars.selectors as cs
    from astrolabe import Columns, TypedDataFrame

    class FrameSchema(Columns):
        i: pl.Int64
        f: pl.Float64

    df: TypedDataFrame[FrameSchema]

    # An expression plus a literal gives one column.
    reveal_type(df.select(pl.col("i") + 1))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'i': polars.datatypes.classes.Int64}, closed=True), None]"
    # A literal on the left gives the column "literal".
    reveal_type(df.select(1 + pl.col("i")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'literal': polars.datatypes.classes.Int64}, closed=True), None]"
    # A selection plus a literal gives one column for each picked column.
    reveal_type(df.select(cs.numeric() + 1))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict(main.FrameSchema, {'i': polars.datatypes.classes.Int64, 'f': polars.datatypes.classes.Float64}, closed=True), None]"
    # An expression plus a selection takes the name of the expression.
    reveal_type(df.select(pl.col("i") + cs.float()))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'i': polars.datatypes.classes.Float64}, closed=True), None]"

- case: a_mirror_function_reads_one_column_name
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class FrameSchema(Columns):
        i: pl.Int64
        f: pl.Float64

    df: TypedDataFrame[FrameSchema]

    # pl.sum(name) is pl.col(name).sum().
    reveal_type(df.select(pl.sum("i")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'i': polars.datatypes.classes.Int64}, closed=True), None]"
    # pl.std has a second parameter, and it still reads the one name.
    reveal_type(df.select(pl.std("i")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'i': polars.datatypes.classes.Float64}, closed=True), None]"
    # Two names give the plain type.
    reveal_type(pl.sum("i", "f"))  # N: Revealed type is "astrolabe.expr.TypedExpr[astrolabe.expr.Deferred[Literal["pl.sum('i', 'f')"]]]"

