- case: a_name_requirement_is_not_proven_by_an_unrelated_text_rule
  main: |
    import polars as pl
    from astrolabe import Columns, Except, Contains, TypedDataFrame, other_columns
    from typing import Literal

    class Keys(Columns):
        k: pl.Int64

    NoA = other_columns(without=["a"])
    NoT = other_columns(without_prefix="t")
    NoTail = other_columns(without_suffix="t")

    def needs_no_a(df: TypedDataFrame[Keys, NoA]) -> None: ...
    def needs_no_t_prefix(df: TypedDataFrame[Keys, NoT]) -> None: ...
    def needs_no_t_suffix(df: TypedDataFrame[Keys, NoTail]) -> None: ...

    NoX = other_columns(without_prefix="x")
    NoY = other_columns(without_suffix="y")
    C = other_columns()

    no_x: TypedDataFrame[Keys, NoX]
    no_y: TypedDataFrame[Keys, NoY]
    no_z: TypedDataFrame[Keys, Except[C, Contains[Literal["z"]]]]
    # A remainder with no name that starts with "x" can hold "a".
    needs_no_a(no_x)  # E: The argument's own remainder does not prove the requirements of "NoA". Declare the missing requirement on the argument's own remainder  [forbidden-column] # N: set allow_unproven = "asserted" in [tool.astrolabe] to allow this, or set [tool.astrolabe.allow_unproven_overrides] fit = "asserted"
    # A remainder with no name that ends with "y" can hold "a".
    needs_no_a(no_y)  # E: The argument's own remainder does not prove the requirements of "NoA". Declare the missing requirement on the argument's own remainder  [forbidden-column] # N: set allow_unproven = "asserted" in [tool.astrolabe] to allow this, or set [tool.astrolabe.allow_unproven_overrides] fit = "asserted"
    # A remainder with no name that holds "z" can hold "a".
    needs_no_a(no_z)  # E: The argument's own remainder does not prove the requirements of "NoA". Declare the missing requirement on the argument's own remainder  [forbidden-column] # N: set allow_unproven = "asserted" in [tool.astrolabe] to allow this, or set [tool.astrolabe.allow_unproven_overrides] fit = "asserted"
    # A remainder with no name that ends with "y" can hold a name that starts with "t".
    needs_no_t_prefix(no_y)  # E: The argument's own remainder does not prove the requirements of "NoT". Declare the missing requirement on the argument's own remainder  [forbidden-column] # N: set allow_unproven = "asserted" in [tool.astrolabe] to allow this, or set [tool.astrolabe.allow_unproven_overrides] fit = "asserted"
    # A remainder with no name that starts with "x" can hold a name that ends with "t".
    needs_no_t_suffix(no_x)  # E: The argument's own remainder does not prove the requirements of "NoTail". Declare the missing requirement on the argument's own remainder  [forbidden-column] # N: set allow_unproven = "asserted" in [tool.astrolabe] to allow this, or set [tool.astrolabe.allow_unproven_overrides] fit = "asserted"

- case: two_selections_in_a_row_keep_both_tests_unless_one_contains_the_other
  main: |
    import polars as pl
    import polars.selectors as cs
    from astrolabe import Columns, TypedDataFrame, other_columns

    class Keys(Columns):
        k: pl.Int64

    Rest = other_columns()

    def f(df: TypedDataFrame[Keys, Rest]) -> None:
        # A name test is not inside a test that also demands a numeric data type.
        reveal_type(df.select(cs.starts_with("ab")).select(cs.starts_with("a") & cs.numeric()))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({}, closed=True), astrolabe.remainder.Only[main.Rest, astrolabe.remainder.SelAnd[astrolabe.remainder.Matching[Literal['ab.*']], astrolabe.remainder.SelAnd[astrolabe.remainder.Matching[Literal['a.*']], astrolabe.remainder.OfType[polars.datatypes.classes.NumericType]]]]]"
        # A union with a numeric test is not inside a name test.
        reveal_type(df.select(cs.starts_with("ab") | cs.numeric()).select(cs.starts_with("a")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({}, closed=True), astrolabe.remainder.Only[main.Rest, astrolabe.remainder.SelAnd[astrolabe.remainder.Matching[Literal['a.*']], astrolabe.remainder.SelOr[astrolabe.remainder.Matching[Literal['ab.*']], astrolabe.remainder.OfType[polars.datatypes.classes.NumericType]]]]]"
        # A union of two name tests is one name test.
        reveal_type(df.select(cs.starts_with("a") | cs.starts_with("b")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({}, closed=True), astrolabe.remainder.Only[main.Rest, astrolabe.remainder.Matching[Literal['[ab].*']]]]"
        # A name that holds "x" is not inside a name that starts with "a", so both tests stay.
        reveal_type(df.select(cs.starts_with("a")).select(cs.contains("x")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({}, closed=True), astrolabe.remainder.Only[main.Rest, astrolabe.remainder.Matching[Literal['0[[^ax]>1;a>2;x>1]|1[[^ax]>1;a>1;x>1]|2[[^ax]>2;a>2;x>3]|3F[[^ax]>3;a>3;x>3]']]]]"

