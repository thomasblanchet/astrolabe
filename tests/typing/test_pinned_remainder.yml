        reveal_type(df.select(cs.datetime("us", "UTC") & cs.starts_with("a")).select(cs.numeric()))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({}, closed=True), None]"
        # A UTC column of unit "us" can have a name that does not start with "a".
        reveal_type(df.select(cs.datetime("us", "UTC") | cs.starts_with("a")).select(cs.starts_with("a")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({}, closed=True), astrolabe.remainder.Only[main.Rest, astrolabe.remainder.Matching[Literal['a.*']]]]"
        # A UTC column of unit "us" whose name starts with "a" can exist, so the selection keeps it.
