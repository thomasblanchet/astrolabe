- case: matches_pattern_splits_only_at_a_top_level_bar
  main: |
    import polars as pl
    import polars.selectors as cs
    from astrolabe import Columns, TypedDataFrame

    class Q(Columns):
        ab: pl.Int64
        bc: pl.String
        x: pl.Int64
        y: pl.Int64

    df: TypedDataFrame[Q]
    # Each top-level branch has its own anchors.
    reveal_type(df.select(cs.matches("^x$|^y$")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'x': polars.datatypes.classes.Int64, 'y': polars.datatypes.classes.Int64}, closed=True), None]"
    # A bar inside a group does not split the pattern.
    reveal_type(df.select(cs.matches("^(ab|bc)$")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'ab': polars.datatypes.classes.Int64, 'bc': polars.datatypes.classes.String}, closed=True), None]"

- case: matches_pattern_with_escapes_in_a_class_survives_the_type_round_trip
  main: |
    import polars as pl
    import polars.selectors as cs
    from astrolabe import Columns, TypedDataFrame

    class Q(Columns):
        ab: pl.Int64
        bx: pl.String
        x: pl.Int64

    df: TypedDataFrame[Q]
    # A class that starts with an escaped bracket picks the names that start with "a" or "]".
    first = cs.matches(r"^[\]a]")
    reveal_type(df.select(first))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'ab': polars.datatypes.classes.Int64}, closed=True), None]"
    # A class that ends with an escaped bracket picks the names that start with "A" or "]".
    last = cs.matches(r"^[A\]]")
    reveal_type(df.select(last))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({}, closed=True), None]"
    # A range in a class picks each character of the range.
    ranged = cs.matches("^[a-c]x")
    reveal_type(df.select(ranged))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'bx': polars.datatypes.classes.String}, closed=True), None]"

- case: matches_pattern_on_the_remainder_is_a_name_list_up_to_128_names
  main: |
    import polars as pl
    import polars.selectors as cs
    from astrolabe import Columns, TypedDataFrame, other_columns

    class Q(Columns):
        ab: pl.Int64

    Rest = other_columns()

    def f(o: TypedDataFrame[Q, Rest]) -> None:
        # A set of 128 names is spelled as a list of names.
        reveal_type(o.select(cs.matches("^[a-h][a-p]$")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict(main.Q, {'ab': polars.datatypes.classes.Int64}, closed=True), astrolabe.remainder.Only[main.Rest, astrolabe.remainder.OneOf[Literal['aa'] | Literal['ab'] | Literal['ac'] | Literal['ad'] | Literal['ae'] | Literal['af'] | Literal['ag'] | Literal['ah'] | Literal['ai'] | Literal['aj'] | Literal['ak'] | Literal['al'] | Literal['am'] | Literal['an'] | Literal['ao'] | Literal['ap'] | Literal['ba'] | Literal['bb'] | Literal['bc'] | Literal['bd'] | Literal['be'] | Literal['bf'] | Literal['bg'] | Literal['bh'] | Literal['bi'] | Literal['bj'] | Literal['bk'] | Literal['bl'] | Literal['bm'] | Literal['bn'] | Literal['bo'] | Literal['bp'] | Literal['ca'] | Literal['cb'] | Literal['cc'] | Literal['cd'] | Literal['ce'] | Literal['cf'] | Literal['cg'] | Literal['ch'] | Literal['ci'] | Literal['cj'] | Literal['ck'] | Literal['cl'] | Literal['cm'] | Literal['cn'] | Literal['co'] | Literal['cp'] | Literal['da'] | Literal['db'] | Literal['dc'] | Literal['dd'] | Literal['de'] | Literal['df'] | Literal['dg'] | Literal['dh'] | Literal['di'] | Literal['dj'] | Literal['dk'] | Literal['dl'] | Literal['dm'] | Literal['dn'] | Literal['do'] | Literal['dp'] | Literal['ea'] | Literal['eb'] | Literal['ec'] | Literal['ed'] | Literal['ee'] | Literal['ef'] | Literal['eg'] | Literal['eh'] | Literal['ei'] | Literal['ej'] | Literal['ek'] | Literal['el'] | Literal['em'] | Literal['en'] | Literal['eo'] | Literal['ep'] | Literal['fa'] | Literal['fb'] | Literal['fc'] | Literal['fd'] | Literal['fe'] | Literal['ff'] | Literal['fg'] | Literal['fh'] | Literal['fi'] | Literal['fj'] | Literal['fk'] | Literal['fl'] | Literal['fm'] | Literal['fn'] | Literal['fo'] | Literal['fp'] | Literal['ga'] | Literal['gb'] | Literal['gc'] | Literal['gd'] | Literal['ge'] | Literal['gf'] | Literal['gg'] | Literal['gh'] | Literal['gi'] | Literal['gj'] | Literal['gk'] | Literal['gl'] | Literal['gm'] | Literal['gn'] | Literal['go'] | Literal['gp'] | Literal['ha'] | Literal['hb'] | Literal['hc'] | Literal['hd'] | Literal['he'] | Literal['hf'] | Literal['hg'] | Literal['hh'] | Literal['hi'] | Literal['hj'] | Literal['hk'] | Literal['hl'] | Literal['hm'] | Literal['hn'] | Literal['ho'] | Literal['hp']]]]"
        # A set of 129 names is spelled by its automaton.
        reveal_type(o.select(cs.matches("^([a-h][a-p]|zz)$")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict(main.Q, {'ab': polars.datatypes.classes.Int64}, closed=True), astrolabe.remainder.Only[main.Rest, astrolabe.remainder.Matching[Literal['[a-h][a-p]|z{2}']]]]"
        # The automaton numbers its states breadth first.
        reveal_type(o.select(cs.matches("^(abc|de)")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({}, closed=True), astrolabe.remainder.Only[main.Rest, astrolabe.remainder.Matching[Literal['(abc|de).*']]]]"

- case: a_generic_return_type_keeps_its_prefix_suffix_and_data_type_over_an_open_caller
  main: |
    from typing import Literal
    import polars as pl
    from astrolabe import Columns, Prefixed, Retyped, Suffixed, TypedDataFrame, other_columns

    class Keys(Columns):
        k: pl.Int64

    Rest = other_columns()

    def renamed(
        df: TypedDataFrame[Keys, Rest],
    ) -> TypedDataFrame[Keys, Prefixed[Literal["p_"], Suffixed[Rest, Literal["_s"]]]]:
        raise NotImplementedError

    def counted(df: TypedDataFrame[Keys, Rest]) -> TypedDataFrame[Keys, Retyped[Rest, pl.UInt32]]:
        raise NotImplementedError

    C = other_columns()

    def caller(c: TypedDataFrame[Keys, C]) -> None:
        # The prefix and the suffix of the return type apply to the caller's remainder.
        reveal_type(renamed(c))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict(main.Keys, {'k': polars.datatypes.classes.Int64}, closed=True), astrolabe.remainder.Prefixed[Literal['p_'], astrolabe.remainder.Suffixed[main.C, Literal['_s']]]]"
        # The new data type of the return type applies to the caller's remainder.
        reveal_type(counted(c))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict(main.Keys, {'k': polars.datatypes.classes.Int64}, closed=True), astrolabe.remainder.Retyped[main.C, polars.datatypes.classes.UInt32]]"

- case: an_effect_over_a_written_union_applies_to_each_part
  main: |
    from typing import Literal
    import polars as pl
    from astrolabe import Both, Columns, Prefixed, Retyped, TypedDataFrame, other_columns

    class Keys(Columns):
        k: pl.Int64

    A = other_columns()
    B = other_columns()

    # A prefix over a union applies to each part of the union.
    prefixed: TypedDataFrame[Keys, Prefixed[Literal["p_"], Both[A, B]]]
    reveal_type(prefixed)  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict(main.Keys, {'k': polars.datatypes.classes.Int64}, closed=True), astrolabe.remainder.Both[astrolabe.remainder.Prefixed[Literal['p_'], main.A], astrolabe.remainder.Prefixed[Literal['p_'], main.B]]]"
    # A new data type over a union applies to each part of the union.
    retyped: TypedDataFrame[Keys, Retyped[Both[A, B], pl.UInt32]]
    reveal_type(retyped)  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict(main.Keys, {'k': polars.datatypes.classes.Int64}, closed=True), astrolabe.remainder.Both[astrolabe.remainder.Retyped[main.A, polars.datatypes.classes.UInt32], astrolabe.remainder.Retyped[main.B, polars.datatypes.classes.UInt32]]]"
    # A union of one remainder with itself is that remainder.
    twice: TypedDataFrame[Keys, Both[A, A]]
    reveal_type(twice)  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict(main.Keys, {'k': polars.datatypes.classes.Int64}, closed=True), main.A]"

- case: a_union_proves_a_name_absent_only_if_every_part_proves_it
  main: |
    import polars as pl
    from astrolabe import Both, Columns, other_columns, TypedDataFrame

    class Keys(Columns):
        k: pl.Int64

    Anything = other_columns()
    NoIdx = other_columns(without=["idx"])
    Silent = other_columns()

    # The part "Anything" can hold "idx", so the union can hold it.
    first_silent: TypedDataFrame[Keys, Both[Anything, NoIdx]]
    first_silent.with_row_index("idx")  # E: with_row_index would produce duplicate column "idx"  [duplicate-column]
    # The part "Silent" can hold "idx", so the union can hold it.
    second_silent: TypedDataFrame[Keys, Both[NoIdx, Silent]]
    second_silent.with_row_index("idx")  # E: with_row_index would produce duplicate column "idx"  [duplicate-column]

