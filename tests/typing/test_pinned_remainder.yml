- case: matches_pattern_size_limits_decide_when_the_pattern_is_read
  main: |
    import polars as pl
    import polars.selectors as cs
    from astrolabe import Columns, TypedDataFrame

    class Q(Columns):
        ab: pl.Int64
        bc: pl.String

    df: TypedDataFrame[Q]
    # A pattern of 32 tokens is read.
    reveal_type(df.select(cs.matches("^abcdefghijklmnopqrstuvwxyzabcd$")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({}, closed=True), None]"
    # Five wildcards with no repeat after them are read.
    reveal_type(df.select(cs.matches("^[ab][ab][ab][ab][ab]$")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({}, closed=True), None]"
    # A wildcard with a star after it does not count toward the limit.
    reveal_type(df.select(cs.matches("^a.*b.*c.*d.*e.*f.*$")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({}, closed=True), None]"
    # An escaped character is no wildcard.
    reveal_type(df.select(cs.matches(r"^\.\.\.\.\.\.$")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({}, closed=True), None]"
    # Six dots with no repeat after them are too many, so the pattern is not read.
    reveal_type(df.select(cs.matches("^......$")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({}, closed=True), None]"
    # A counted repeat is not read.
    reveal_type(df.select(cs.matches("^a{3}$")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({}, closed=True), None]"

- case: matches_pattern_reads_only_syntax_that_polars_reads_the_same_way
  main: |
    import polars as pl
    import polars.selectors as cs
    from astrolabe import Columns, TypedDataFrame

    class Q(Columns):
        ab: pl.Int64
        bc: pl.String

    df: TypedDataFrame[Q]
    # An escaped bracket outside a class is a literal character.
    reveal_type(df.select(cs.matches(r"^\[")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({}, closed=True), None]"
    # Polars reads "&&" in a class as an intersection, so the pattern is not read.
    reveal_type(df.select(cs.matches("^[a&&b]")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({}, closed=True), None]"
    # Polars reads "\d" in a class as every Unicode digit, so the pattern is not read.
    reveal_type(df.select(cs.matches(r"^[\d]")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({}, closed=True), None]"
    # The parser cannot read a class with a trailing "-", so the pattern is not read.
    reveal_type(df.select(cs.matches("^[a-]x")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({}, closed=True), None]"
    # Polars rejects an empty class at every frame, so the checker reports the call.
    reveal_type(df.select(cs.matches("^x[]")))  # N: Revealed type is "polars.dataframe.frame.DataFrame"  # E: This call has no result at any frame: invalid regex in selector '^x[]', and polars raises InvalidOperationError  [invalid-call-shape]

