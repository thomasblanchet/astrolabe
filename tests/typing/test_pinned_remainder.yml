- case: a_generic_return_type_over_closed_callers_lists_their_columns
  main: |
    from typing import Literal
    import polars as pl
    from astrolabe import Both, Columns, Only, StartsWith, TypedDataFrame, other_columns

    class Keys(Columns):
        k: pl.Int64

    Rest = other_columns()
    L = other_columns()
    R = other_columns(disjoint_from=L)

    def prices(df: TypedDataFrame[Keys, Rest]) -> TypedDataFrame[Keys, Only[Rest, StartsWith[Literal["p"]]]]:
        raise NotImplementedError

    def merge(left: TypedDataFrame[Keys, L], right: TypedDataFrame[Keys, R]) -> TypedDataFrame[Keys, Both[L, R]]:
        raise NotImplementedError

    class Snapshot(Columns):
        k: pl.Int64
        price: pl.Float64
        venue: pl.String

    class Other(Columns):
        k: pl.Int64
        qty: pl.Int64

    snap: TypedDataFrame[Snapshot]
    other: TypedDataFrame[Other]
    # The filter of the return type keeps the caller's columns that start with "p".
    reveal_type(prices(snap))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'k': polars.datatypes.classes.Int64, 'price': polars.datatypes.classes.Float64}, closed=True), None]"
    # The union of the return type holds the columns of both callers.
    reveal_type(merge(snap, other))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'k': polars.datatypes.classes.Int64, 'price': polars.datatypes.classes.Float64, 'qty': polars.datatypes.classes.Int64, 'venue': polars.datatypes.classes.String}, closed=True), None]"

