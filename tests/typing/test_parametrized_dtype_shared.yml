- case: decimal_dtype_column_with_no_precision_declares_and_narrows
  main: |
    from typing import Literal
    import polars as pl
    from astrolabe import Columns, Decimal, TypedDataFrame

    class FrameSchema(Columns):
        bar: Decimal[None, Literal[2]]

    # Real polars' own Decimal.__init__ substitutes 38 unconditionally
    # when precision is omitted, so an omitted Precision resolves to
    # Literal[38], not None -- Decimal[None, ...] and
    # Decimal[Literal[38], ...] are the identical runtime object, and
    # narrow identically here.
    Frame = TypedDataFrame[FrameSchema]

    df: Frame

    class NarrowedSchema(Columns):
        bar: Decimal[Literal[38], Literal[2]]

    narrowed: TypedDataFrame[NarrowedSchema] = df.select("bar")

