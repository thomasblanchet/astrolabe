- case: a_datetime_selector_with_no_zone_picks_every_zone_of_its_unit
  main: |
    from typing import Literal
    import polars as pl
    import polars.selectors as cs
    from astrolabe import Columns, Datetime, TypedDataFrame

    class FrameSchema(Columns):
        naive: Datetime[Literal["us"], None]
        zoned: Datetime[Literal["us"], Literal["UTC"]]
        coarse: Datetime[Literal["ms"], None]
        n: pl.Int64

    # `cs.datetime("us")` names no zone, which takes every zone of that
    # unit, the naive columns included. One partial rendering per unit
    # states it, so the unit still tells one column from another.
    Frame = TypedDataFrame[FrameSchema]
    df: Frame

    class UsSchema(Columns):
        naive: Datetime[Literal["us"], None]
        zoned: Datetime[Literal["us"], Literal["UTC"]]

    picked: TypedDataFrame[UsSchema] = df.select(cs.datetime("us"))
    listed: TypedDataFrame[UsSchema] = df.select(cs.datetime("us", ["*", None]))

    # `"*"` alone takes every named zone and leaves the naive columns
    # out, which is the whole unit met with the negation of the naive
    # data type.
    class StarredSchema(Columns):
        zoned: Datetime[Literal["us"], Literal["UTC"]]

    starred: TypedDataFrame[StarredSchema] = df.select(cs.datetime("us", "*"))

    class NaiveSchema(Columns):
        naive: Datetime[Literal["us"], None]

    one: TypedDataFrame[NaiveSchema] = df.select(cs.datetime("us", None))

- case: any_zone_states_the_requirement_one_unit_holds
  main: |
    from typing import Literal
    import polars as pl
    from astrolabe import AnyZone, Columns, Datetime, TypedDataFrame, other_columns

    # `AnyZone` fills a zone slot with every zone of the unit. A
    # remainder of one zone proves it, and a remainder of every
    # `Datetime` does not, because another unit is still allowed.
    UsAnyZone = Datetime[Literal["us"], AnyZone]
    UsNaive = Datetime[Literal["us"], None]

    Us = other_columns(all_of=UsAnyZone)
    Naive = other_columns(all_of=UsNaive)
    Every = other_columns(all_of=pl.Datetime)

    class Keys(Columns):
        k: pl.Int64

    def takes_us(df: TypedDataFrame[Keys, Us]) -> None: ...

    def passes(df: TypedDataFrame[Keys, Naive]) -> None:
        takes_us(df)

    def refused(df: TypedDataFrame[Keys, Every]) -> None:
        takes_us(df)  # E: The argument's own remainder does not prove the requirements of "Us". Declare the missing requirement on the argument's own remainder  [forbidden-column] # N: set allow_unproven = "asserted" in [tool.astrolabe] to allow this, or set [tool.astrolabe.allow_unproven_overrides] fit = "asserted"
