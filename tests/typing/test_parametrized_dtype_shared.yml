# Datetime[Unit, Zone], Duration[Unit], Decimal[Precision, Scale],
# Enum[*Categories]: the DType-level grammar needed to declare a
# parametrized dtype column. Real polars' own pl.Datetime/pl.Duration/
# pl.Decimal/pl.Enum constructors take real arguments
# (time_unit/time_zone/precision/scale/categories), unlike List/Array/
# Struct, which have no real polars constructor argument to mirror at
# all. Written before the corresponding get_type_analyze_hooks exist.
# These tests are expected to fail (red) until type_analysis.py
# implements them.
#
# Categorical is deliberately not covered here, and never will be: its
# own real parametrization is a runtime-registered Categories object
# with no compile-time literal encoding, so it stays a bare,
# unparametrized marker permanently, unlike Enum's own plain
# string-literal categories.

- case: datetime_dtype_column_declares_and_narrows
  main: |
    from typing import Literal
    import polars as pl
    from astrolabe import Columns, Datetime, TypedDataFrame

    class FrameSchema(Columns):
        foo: pl.String
        bar: Datetime[Literal["us"], None]

    Frame = TypedDataFrame[FrameSchema]

    df: Frame

    class NarrowedSchema(Columns):
        bar: Datetime[Literal["us"], None]

    narrowed: TypedDataFrame[NarrowedSchema] = df.select("bar")

