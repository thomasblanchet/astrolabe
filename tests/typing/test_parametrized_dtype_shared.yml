    import polars as pl
    from astrolabe import Column, Decimal

    # Confirmed empirically: real polars raises InvalidOperationError at
    # schema materialization for a Decimal whose Scale exceeds its own
    # implicit precision of 38, the same "reject impossible values"
    # class as every other Decimal Precision/Scale check in this file.
    # Before Stage 17, an omitted Precision resolved to None, so this
    # cross-check never ran at all for this shape.
    x: Column[  # E: Decimal[...] scale must not exceed precision  [marker-arg]
