# The functions of `pl` that build one column from several:
# `concat_str`, `concat_list`, `concat_arr`, `coalesce`, `corr`, `cov`,
# `arg_where` and `format`. Each names its result after its first input
# (`concat_str`, `concat_list`, `coalesce`: the first of `exprs`;
# `corr`, `cov`: `a`; `arg_where`: `condition`; `format`: the first of
# `*args`), confirmed against real polars 1.43.2. A bare string input is
# a column name here.
#
# `concat_str` and `format` give `String`. `concat_list` and `coalesce`
# join their inputs by the supertype, and `concat_list` wraps it in a
# `List`. `concat_arr` refuses inputs of different data types and gives
# an `Array` as wide as its inputs. `corr` and `cov` give `Float64`, and
# `arg_where` gives `UInt32`. `struct()` has its own file,
# `test_struct_build.yml`.

- case: select_concat_str_iterable_arg_narrows
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class FrameSchema(Columns):
        a: pl.Int64
        b: pl.String

    Frame = TypedDataFrame[FrameSchema]

    df: Frame

    class NarrowedSchema(Columns):
        a: pl.String

    narrowed: TypedDataFrame[NarrowedSchema] = df.select(pl.concat_str(["a", "b"]))

- case: select_concat_str_variadic_args_narrows
