- case: select_coalesce_single_operand_is_pure_identity
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class FrameSchema(Columns):
        d: pl.Boolean

    # A lone Boolean input stays Boolean under coalesce, where + gives
    # UInt32.
    Frame = TypedDataFrame[FrameSchema]

    df: Frame
    narrowed: TypedDataFrame[FrameSchema] = df.select(pl.coalesce(["d"]))

