- case: select_format_with_no_variadic_args_narrows_to_literal_name
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class FrameSchema(Columns):
        a: pl.Int64

    # pl.format's own *args can be empty when the format string has no
    # substitution placeholders. Confirmed empirically the result still
    # narrows, named "literal" the same way every other name-less
    # result in this project already is.
    Frame = TypedDataFrame[FrameSchema]

    df: Frame

    class NarrowedSchema(Columns):
        literal: pl.String

    narrowed: TypedDataFrame[NarrowedSchema] = df.select(pl.format("no args here"))

