- case: global_function_over_two_columns_of_a_plain_frame_is_unchecked
  main: |
    import polars as pl

    df: pl.DataFrame
    # The two columns of a plain frame give too many choices of data types,
    # so the checker does not try them, and the answer is Unchecked.
    reveal_type(df.select(pl.concat_str(pl.col("a"), pl.col("b"))))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'a': astrolabe.frame.Unchecked}, closed=True), None]"
    reveal_type(df.select(pl.corr(pl.col("a"), pl.col("b"))))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'a': astrolabe.frame.Unchecked}, closed=True), None]"

- case: select_any_horizontal_with_unchecked_operand_still_narrows_to_boolean
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame, Unchecked

    class FrameSchema(Columns):
        a: Unchecked
        b: pl.Boolean

    Frame = TypedDataFrame[FrameSchema]

    # The Boolean gate is defined at (Boolean, Boolean) only, so the
    # unchecked operand lifts to its one surviving member and the
    # answer stays Boolean, not Unchecked.
    df: Frame

    class NarrowedSchema(Columns):
        a: pl.Boolean

    narrowed: TypedDataFrame[NarrowedSchema] = df.select(pl.any_horizontal("a", "b"))

- case: pl_first_last_nth_are_left_unmodeled
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class FrameSchema(Columns):
        a: pl.Int64
        b: pl.String

    Frame = TypedDataFrame[FrameSchema]

    df: Frame
    reveal_type(df.select(pl.first()))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'a': polars.datatypes.classes.Int64}, closed=True), None]"
    reveal_type(df.select(pl.last()))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'b': polars.datatypes.classes.String}, closed=True), None]"
    reveal_type(df.select(pl.nth(1)))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'b': polars.datatypes.classes.String}, closed=True), None]"
    reveal_type(df.select(pl.nth(-1)))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'b': polars.datatypes.classes.String}, closed=True), None]"
    reveal_type(df.select(pl.nth(5)))  # N: Revealed type is "polars.dataframe.frame.DataFrame"

- case: pl_select_builds_a_frame_from_expressions_alone
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame, TypedLazyFrame

    # pl.select reads no column, so every argument is a literal or an
    # expression over no column at all. eager=False gives a lazy frame.
    class LiteralSchema(Columns):
        a: pl.Int32
        b: pl.String

    built: TypedDataFrame[LiteralSchema] = pl.select(a=pl.lit(1), b=pl.lit("x"))
    lazy: TypedLazyFrame[LiteralSchema] = pl.select(a=pl.lit(1), b=pl.lit("x"), eager=False)
    reveal_type(pl.select(pl.lit(1).alias("a")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'a': polars.datatypes.classes.Int32}, closed=True), None]"

- case: pl_select_refuses_a_duplicate_output_name
  main: |
    import polars as pl

    # Two outputs of one name are the same duplicate polars raises on.
    reveal_type(pl.select(pl.lit(1).alias("a"), pl.lit(2).alias("a")))  # E: select would produce duplicate column "a"  [duplicate-column] # N: Revealed type is "polars.dataframe.frame.DataFrame"

- case: coalesce_joins_the_parameters_of_two_decimals
  skip: __import__("tests.releases").releases.polars_before("2.0.0")
  main: |
    from typing import Literal
    import polars as pl
    from astrolabe import Columns, Decimal, TypedDataFrame

    class Prices(Columns):
        d1: Decimal[Literal[10], Literal[2]]
        d2: Decimal[Literal[12], Literal[4]]
        d3: Decimal[Literal[12], Literal[2]]
        d4: Decimal[Literal[10], Literal[4]]
        i: pl.Int32

    df: TypedDataFrame[Prices]

    # Two decimals meet at the larger precision and the larger scale.
    reveal_type(df.select(pl.coalesce(pl.col("d1"), pl.col("d2")).alias("k")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'k': astrolabe.frame.Decimal[Literal[12], Literal[4]]}, closed=True), None]"
    reveal_type(df.select(pl.coalesce(pl.col("d3"), pl.col("d4")).alias("k")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'k': astrolabe.frame.Decimal[Literal[14], Literal[4]]}, closed=True), None]"

    # An integer beside a decimal: polars gives the whole precision to a
    # decimal whose integer digits cannot hold an Int32, and keeps the
    # precision of one that can.
    reveal_type(df.select(pl.coalesce(pl.col("d1"), pl.col("i")).alias("k")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'k': astrolabe.frame.Decimal[Literal[38], Literal[2]]}, closed=True), None]"
    reveal_type(df.select(pl.coalesce(pl.col("d3"), pl.col("i")).alias("k")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'k': astrolabe.frame.Decimal[Literal[12], Literal[2]]}, closed=True), None]"

