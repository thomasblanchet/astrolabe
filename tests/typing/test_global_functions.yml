- case: select_corr_final_str_operand_names_result_after_column
  main: |
    from typing import Final, Literal
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    # A Final-declared string variable names the result after the
    # column the same as the equivalent inline string would (see
    # select_corr_narrows_to_float64, above).
    NAME: Final = "a"

    class FrameSchema(Columns):
        a: pl.Int64
        c: pl.Float64

    Frame = TypedDataFrame[FrameSchema]

    df: Frame

    class NarrowedSchema(Columns):
        a: pl.Float64

    narrowed: TypedDataFrame[NarrowedSchema] = df.select(pl.corr(NAME, "c"))

