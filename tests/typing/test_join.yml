    reveal_type(df.join(df, on=pl.map_batches([pl.col("a"), pl.col("b")], lambda s: s[0] + s[1], is_elementwise=True)))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'a': polars.datatypes.classes.Int64, 'b': polars.datatypes.classes.Int64, 'a_right': polars.datatypes.classes.Int64, 'b_right': polars.datatypes.classes.Int64}, closed=True), None]"
