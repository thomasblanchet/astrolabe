- case: a_join_key_with_an_alias_is_an_error
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class Schema(Columns):
        a: pl.Int64
        b: pl.Int64

    df: TypedDataFrame[Schema]
    # Polars refuses an alias anywhere in the tree of a key, in a
    # variable too, and the schema of a lazy join raises as well.
    reveal_type(df.join(df, on=pl.col("a").alias("b")))  # E: join() with an alias in a join key raises InvalidOperationError: 'alias' is not allowed in a join key, use 'with_columns' first  [invalid-call-shape]  # N: Revealed type is "polars.dataframe.frame.DataFrame"
    df.join(df, on=pl.col("a").alias("x") + 1)  # E: join() with an alias in a join key raises InvalidOperationError: 'alias' is not allowed in a join key, use 'with_columns' first  [invalid-call-shape]
    df.join(df, left_on=pl.col("a").alias("x"), right_on="a")  # E: join() with an alias in a join key raises InvalidOperationError: 'alias' is not allowed in a join key, use 'with_columns' first  [invalid-call-shape]
    df.join(df, on=["a", pl.struct(pl.col("b").alias("x"))])  # E: join() with an alias in a join key raises InvalidOperationError: 'alias' is not allowed in a join key, use 'with_columns' first  [invalid-call-shape]
    df.lazy().join(df.lazy(), on=pl.col("a").over(pl.col("b").alias("q")))  # E: join() with an alias in a join key raises InvalidOperationError: 'alias' is not allowed in a join key, use 'with_columns' first  [invalid-call-shape]
    alias_key = pl.col("a").alias("z")
    df.join(df, left_on=pl.col("a"), right_on=alias_key)  # E: join() with an alias in a join key raises InvalidOperationError: 'alias' is not allowed in a join key, use 'with_columns' first  [invalid-call-shape]
    # A rename through `.name` is no alias, and the key transforms its
    # column, so coalescing is off.
    reveal_type(df.join(df, on=pl.col("a").name.suffix("x")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'a': polars.datatypes.classes.Int64, 'b': polars.datatypes.classes.Int64, 'a_right': polars.datatypes.classes.Int64, 'b_right': polars.datatypes.classes.Int64}, closed=True), None]"

- case: a_join_key_that_changes_the_rows_is_an_error
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class Schema(Columns):
        a: pl.Int64
        b: pl.Int64

    df: TypedDataFrame[Schema]
    # A key must work value by value at each node, or give one value.
    df.join(df, on=pl.col("a").shift(1))  # E: join() with a join key that changes the rows raises InvalidOperationError: all join key expressions must be elementwise  [invalid-call-shape]
    df.join(df, left_on=pl.col("a").over("b"), right_on="a")  # E: join() with a join key that changes the rows raises InvalidOperationError: all join key expressions must be elementwise  [invalid-call-shape]
    df.join(df, on=pl.col("a") + pl.col("b").sum())  # E: join() with a join key that changes the rows raises InvalidOperationError: all join key expressions must be elementwise  [invalid-call-shape]
    df.join(df, on=pl.col("a").is_in(pl.col("b").implode()))  # E: join() with a join key that changes the rows raises InvalidOperationError: all join key expressions must be elementwise  [invalid-call-shape]
    reveal_type(df.join(df, on=pl.col("a").sum()))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'a': polars.datatypes.classes.Int64, 'b': polars.datatypes.classes.Int64, 'a_right': polars.datatypes.classes.Int64, 'b_right': polars.datatypes.classes.Int64}, closed=True), None]"
    reveal_type(df.join(df, on=pl.col("a").is_in([1])))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'a': polars.datatypes.classes.Int64, 'b': polars.datatypes.classes.Int64, 'a_right': polars.datatypes.classes.Int64, 'b_right': polars.datatypes.classes.Int64}, closed=True), None]"

- case: a_join_key_reads_a_function_of_the_user_by_the_flags_of_its_call
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class Schema(Columns):
        a: pl.Int64
        b: pl.Int64

    df: TypedDataFrame[Schema]
    flag: bool
    # Polars reads from the call whether the function works value by value
    # and whether it gives one value. map_batches takes both from its flags.
    df.join(df, on=pl.col("a").map_batches(lambda s: s, return_dtype=pl.Int64))  # E: join() with a join key that changes the rows raises InvalidOperationError: all join key expressions must be elementwise  [invalid-call-shape]
    df.join(df, on=pl.col("a").rolling_map(lambda s: s.sum(), window_size=1))  # E: join() with a join key that changes the rows raises InvalidOperationError: all join key expressions must be elementwise  [invalid-call-shape]
    df.join(df, on=pl.col("a").shift(1).map_batches(lambda s: s, return_dtype=pl.Int64, is_elementwise=True))  # E: join() with a join key that changes the rows raises InvalidOperationError: all join key expressions must be elementwise  [invalid-call-shape]
    reveal_type(df.join(df, on=pl.col("a").map_batches(lambda s: s, return_dtype=pl.Int64, is_elementwise=True)))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'a': polars.datatypes.classes.Int64, 'b': polars.datatypes.classes.Int64, 'a_right': polars.datatypes.classes.Int64, 'b_right': polars.datatypes.classes.Int64}, closed=True), None]"
    reveal_type(df.join(df, on=pl.col("a").map_batches(lambda s: s.max(), return_dtype=pl.Int64, returns_scalar=True)))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'a': polars.datatypes.classes.Int64, 'b': polars.datatypes.classes.Int64, 'a_right': polars.datatypes.classes.Int64, 'b_right': polars.datatypes.classes.Int64}, closed=True), None]"
    reveal_type(df.join(df, on=pl.col("a").map_elements(lambda v: v, return_dtype=pl.Int64)))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'a': polars.datatypes.classes.Int64, 'b': polars.datatypes.classes.Int64, 'a_right': polars.datatypes.classes.Int64, 'b_right': polars.datatypes.classes.Int64}, closed=True), None]"
    # A function of pl that takes a function of the user has the same flags.
    # fold and reduce never work value by value, and cum_fold names its
