# .join(): joining two frames on shared or matching key columns. Written
# before the corresponding get_method_hook implementation exists. This
# test is expected to fail (red) until plugin.py implements it.
#
# Scope: how="inner"/"left"/"right"/"full"/"semi"/"anti"/"cross".
# on=/left_on=/right_on= are literal strings, bare pl.col(name)
# expressions, or lists
# mixing either. suffix= is a literal string. coalesce= is a literal
# bool or omitted (the literal None is the same as omitted, its own
# documented default).
#
# A bare pl.col(name) key behaves identically to passing its own
# literal name directly, confirmed empirically against real polars
# 1.43.2: same coalescing, same dtype rule. A transforming key
# (pl.col(name).str.to_lowercase(), .cast(...), or any
# other chaining beyond a bare column reference) always forces
# coalescing off for the *whole* call, confirmed empirically that real
# polars silently overrides even an explicit coalesce=True request the
# same way (with its own UserWarning) -- an uncoalesced keyed join
# already merges every column from both sides verbatim, so a
# transforming key's own output is simply the underlying real column
# it reads from, untouched by the transformation (confirmed empirically
# with a dtype-changing .cast(...) key, whose own output column keeps
# the *source* column's dtype, not the cast's target). This needs no
# name or dtype resolution for the transforming key itself at all: see
# `_JoinKeyResolver.has_transforming_key`'s own docstring.
# how="outer" is a deprecated alias for "full" that real polars still
# accepts, and is normalized to "full" before this hook resolves the
# call, confirmed against real polars 1.43.2.
#
# coalesce's effective default depends on how: inner/left/right default
# to coalescing (drop the redundant key), full defaults to keeping both
# keys, confirmed against real polars 1.43.2. how="right"'s coalesced
# key uses the *right* side's key name, not the left's, and is
# positioned after every left non-key column but before any right
# non-key column, also confirmed against real polars 1.43.2 -- a
# genuinely different layout from inner/left/full's coalesced case,
# which keeps the left side's key name and position. how="cross" takes
# no keys at all: its result is always every column from both sides,
# suffixed on collision, regardless of coalesce=.
#
# A join key pair needs the same family to reconcile, not an exact
# dtype match: any integer width with any integer width (signed and
# unsigned freely mixed), or Float32 with Float64, confirmed against
# real polars 1.43.2. A family-incompatible pair reports
# [join-key-dtype] and falls back. Every layout except
# how="full"+coalesce=True keeps whichever side it already keeps
# verbatim, with no widening, confirmed against real polars 1.43.2 even
# when the kept side is the narrower one. how="full"+coalesce=True
# alone promotes a same-family pair to its own closed-form supertype:
# same signedness widens to the wider side; mixed signed/unsigned keeps
# the signed side unchanged if it is already wider, else promotes to a
# signed integer at double the unsigned side's own width.

- case: join_inner_merges_and_suffixes_collision
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class LeftSchema(Columns):
        foo: pl.Int64
        bar: pl.String
        baz: pl.Int64

    Left = TypedDataFrame[LeftSchema]

    class RightSchema(Columns):
        foo: pl.Int64
        baz: pl.Int64
        qux: pl.Float64

    Right = TypedDataFrame[RightSchema]

    left: Left
    right: Right

    class JoinedSchema(Columns):
        foo: pl.Int64
        bar: pl.String
        baz: pl.Int64
        baz_right: pl.Int64
        qux: pl.Float64

    joined: TypedDataFrame[JoinedSchema] = left.join(right, on="foo")

