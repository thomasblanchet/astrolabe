    # join() call site itself.
    x = pl.col("a")

    class JoinedSchema(Columns):
        a: pl.Int64
        b: pl.String
        d: pl.String

    joined: TypedDataFrame[JoinedSchema] = left.join(right, left_on=x, right_on="c")

