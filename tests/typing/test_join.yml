- case: join_key_dtype_unresolved_typevar_falls_back_to_untyped_silently
  main: |
    from typing import Literal
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class Ids[T: pl.DataType](Columns):
        id: T

    # A generic function's own unbound key dtype is neither a resolved
    # Instance nor Unchecked, so it cannot be checked for family
    # compatibility -- left unresolved rather than reporting an error
    # against a dtype nothing concrete is known about.
    def join_generic[T: pl.DataType](
        left: TypedDataFrame[Ids[T]],
        right: TypedDataFrame[Ids[pl.Int64]],
    ) -> None:
        reveal_type(left.join(right, on="id"))  # N: Revealed type is "polars.dataframe.frame.DataFrame"

