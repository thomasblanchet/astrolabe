- case: a_trusted_read_recovers_what_the_lifting_recovers
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame, Unchecked, column, typed_expr

    TrustedQuantity = column("quantity", Unchecked)
    TrustedFlag = typed_expr(TrustedQuantity, gives=pl.Boolean, named="is_buy")

    def buy_flag(quantity: TrustedQuantity) -> TrustedFlag:
        return (quantity > 0).alias("is_buy")

    def probe(quantity: TrustedQuantity) -> None:
        reveal_type(quantity > 0)  # N: Revealed type is "astrolabe.expr.TypedExpr[astrolabe.expr.Deferred[Literal['$0 > 0'], astrolabe.expr.TypedColumn[Literal['quantity'], astrolabe.frame.Unchecked]]]"
        reveal_type(quantity + 1)  # N: Revealed type is "astrolabe.expr.TypedExpr[astrolabe.expr.Deferred[Literal['$0 + 1'], astrolabe.expr.TypedColumn[Literal['quantity'], astrolabe.frame.Unchecked]]]"
        reveal_type(quantity.abs())  # N: Revealed type is "astrolabe.expr.TypedExpr[astrolabe.expr.Deferred[Literal['$0.abs()'], astrolabe.expr.TypedColumn[Literal['quantity'], astrolabe.frame.Unchecked]]]"
        reveal_type(quantity.cast(pl.String))  # N: Revealed type is "astrolabe.expr.TypedExpr[astrolabe.expr.Deferred[Literal['$0.cast(pl.String)'], astrolabe.expr.TypedColumn[Literal['quantity'], astrolabe.frame.Unchecked]]]"
        reveal_type(quantity.str.len_chars())  # N: Revealed type is "astrolabe.expr.TypedExpr[astrolabe.expr.Deferred[Literal['$0.str.len_chars()'], astrolabe.expr.TypedColumn[Literal['quantity'], astrolabe.frame.Unchecked]]]"
        reveal_type(quantity.implode())  # N: Revealed type is "astrolabe.expr.TypedExpr[astrolabe.expr.Deferred[Literal['$0.implode()'], astrolabe.expr.TypedColumn[Literal['quantity'], astrolabe.frame.Unchecked]]]"
        reveal_type(pl.col("a") + quantity)  # N: Revealed type is "astrolabe.expr.TypedExpr[astrolabe.expr.Deferred[Literal["pl.col('a') + $0"], astrolabe.expr.TypedColumn[Literal['quantity'], astrolabe.frame.Unchecked]]]"
        reveal_type(quantity.diff())  # N: Revealed type is "astrolabe.expr.TypedExpr[astrolabe.expr.Deferred[Literal['$0.diff()'], astrolabe.expr.TypedColumn[Literal['quantity'], astrolabe.frame.Unchecked]]]"

    class Trades(Columns):
        quantity: pl.Int64

    trades: TypedDataFrame[Trades]
    reveal_type(trades.select(buy_flag(pl.col("quantity"))))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'is_buy': polars.datatypes.classes.Boolean}, closed=True), None]"
    reveal_type(trades.select(buy_flag(pl.col("quantity").cast(pl.String))))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'is_buy': polars.datatypes.classes.Boolean}, closed=True), None]"
    buy_flag(pl.col("quantity").alias("q"))  # E: Argument "quantity" does not match its declared type: it names the column "q", but the declared name is "quantity"  [expression-fit]

- case: total_quantity_aggregates
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame, column, row, same, typed_agg
    from polars.datatypes.classes import NumericType

    Quantity = column("quantity", pl.Int64)
    TotalQuantity = typed_agg(Quantity, gives=pl.Int64)

    def total_quantity(quantity: Quantity) -> TotalQuantity:
        return quantity.sum()

    class Trades(Columns):
        symbol: pl.String
        quantity: pl.Int64

    trades: TypedDataFrame[Trades]
    reveal_type(trades.select(total_quantity(pl.col("quantity"))))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'quantity': polars.datatypes.classes.Int64}, closed=True), None]"
    reveal_type(trades.group_by("symbol").agg(total_quantity(pl.col("quantity"))))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'symbol': polars.datatypes.classes.String, 'quantity': polars.datatypes.classes.Int64}, closed=True), None]"

    NumericQuantity = column("quantity", NumericType)
    Total = typed_agg(
        row(column("quantity", {pl.Int8, pl.Int16, pl.UInt8, pl.UInt16}), gives=pl.Int64),
        row(column("quantity", {pl.Int32, pl.Int64, pl.UInt32, pl.UInt64, pl.Float32, pl.Float64}), gives=same),
    )

    def total(quantity: NumericQuantity) -> Total:
        return quantity.sum()

    Mean = typed_agg(NumericQuantity, gives=same)

    def wrong(quantity: NumericQuantity) -> Mean:
        return quantity.mean()  # E: This expression does not match its declared type: it makes a Float64 column, but the declared type is Decimal(precision=10, scale=2)  [expression-fit]

- case: a_blank_binds_the_argument_name_at_each_call
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame, some_column, same, typed_expr
    from polars.datatypes.classes import FloatType

    Standardised = typed_expr(some_column(FloatType), gives=same)

    def zscore(e: Standardised) -> Standardised:
        return (e - e.mean()) / e.std()

    class Trades(Columns):
        symbol: pl.String
        price: pl.Float64

    class Readings(Columns):
        temp: pl.Float32

    trades: TypedDataFrame[Trades]
    readings: TypedDataFrame[Readings]
    reveal_type(zscore(pl.col("price")))  # N: Revealed type is "astrolabe.expr.TypedColumn[Literal['price'], polars.datatypes.classes.FloatType]"
    reveal_type(trades.select(zscore(pl.col("price"))))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'price': polars.datatypes.classes.Float64}, closed=True), None]"
    reveal_type(readings.select(zscore(pl.col("temp"))))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict(main.Readings, {'temp': polars.datatypes.classes.Float32}, closed=True), None]"
    trades.select(zscore(pl.col("symbol")))  # E: "symbol" has no result type at this frame's column types: the declaration gives no result at the data types of this frame  [unsupported-dtype-op]
    zscore(pl.col("price").sum())  # E: Argument "e" does not match its declared type: it combines rows into one value, but the declared type works row by row  [expression-fit]
    zscore(pl.col("price").alias("z"))  # E: Argument "e" does not match its declared type: it must give back the one column it uses, under the same name  [expression-fit]

    def inside(e: Standardised) -> None:
        trades.select(e)  # E: A blank read (some_column) has no name until a call binds it  [unknown-column]

    def renaming(e: Standardised) -> Standardised:
        return e.alias("z")  # E: This expression does not match its declared type: it must give back the one column it uses, under the same name  [expression-fit]

- case: a_declared_float64_is_not_the_float_column_back
  main: |
    import polars as pl
    from astrolabe import some_column, same, typed_expr
    from polars.datatypes.classes import FloatType

    Standardised = typed_expr(some_column(FloatType), gives=same)
    Rounded = typed_expr(some_column(FloatType), gives=pl.Float64)

    def zscore(e: Standardised) -> Rounded:
        return (e - e.mean()) / e.std()  # E: Incompatible return value type (got "TypedExpr[Deferred[Literal['($0 - $0.mean()) / $0.std()'], TypedColumn[Blank, FloatType]]]", expected "TypedExpr[Reads[Column[Blank, FloatType]], Column[Blank, Rows[Row[Float64, Same[Blank]], Row[Float16 | Float32, Float64]]]]")  [return-value]

    def widened(e: Standardised) -> Rounded:
        return ((e - e.mean()) / e.std()).cast(pl.Float64)

- case: a_function_consumes_a_rule_over_a_schema
  main: |
    from typing import Literal
    import polars as pl
    from astrolabe import Columns, Minus, TypedDataFrame, other_columns, typed_expr

    class Trades(Columns):
        symbol: pl.String
        price: pl.Float64
        quantity: pl.Int64

    class TradesWithFlag(Columns):
        symbol: pl.String
        price: pl.Float64
        quantity: pl.Int64
        flag: pl.Boolean

    Rest = other_columns()
    FlagRule = typed_expr(Trades, gives=pl.Boolean, named="flag")

    def flagged(
        df: TypedDataFrame[Trades, Rest],
        rule: FlagRule,
    ) -> TypedDataFrame[TradesWithFlag, Minus[Rest, Literal["flag"]]]:
        return df.with_columns(rule)

    trades: TypedDataFrame[Trades]
    reveal_type(flagged(trades, (pl.col("price") > 100.0).alias("flag")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict(main.TradesWithFlag, {'symbol': polars.datatypes.classes.String, 'price': polars.datatypes.classes.Float64, 'quantity': polars.datatypes.classes.Int64, 'flag': polars.datatypes.classes.Boolean}, closed=True), None]"
    flagged(trades, (pl.col("price") * pl.col("quantity") > 1e6).alias("flag"))
    flagged(trades, (pl.col("price") > 100.0).alias("suspect"))  # E: Argument "rule" does not match its declared type: it names the column "suspect", but the declared name is "flag"  [expression-fit]
    flagged(trades, pl.col("price").alias("flag"))  # E: Argument "rule" does not match its declared type: it makes a Float64 column, but the declared type is Boolean  [expression-fit]
    flagged(trades, (pl.col("venue") == "X").alias("flag"))  # E: Argument "rule" does not match its declared type: it uses column "venue", which the declared type does not allow  [expression-fit]
    flagged(trades, pl.lit(True).alias("flag"))  # E: Argument "rule" does not match its declared type: it is a fixed value, but the declared type works row by row  [expression-fit]

