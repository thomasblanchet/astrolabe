# Fit at every boundary. A call fits each declared expression
# parameter against the code of its argument in three clauses: the
# argument reads only declared columns, its output name and its answer
# agree with the declaration at every declared cell, and the
# characters are equal. A body's return, an annotated variable and a
# declared argument are judged by the same fit through the type
# context. The worked functions of the expression specification's
# section 7 appear verbatim.

- case: discounted_price_reads_one_column_and_gives_it_back
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame, column

    Price = column("price", pl.Float64)

    def discounted(price: Price) -> Price:
        return price * 0.9

    class Trades(Columns):
        symbol: pl.String
        price: pl.Float64
        quantity: pl.Int64

    class Sizes(Columns):
        price: pl.Int32

    trades: TypedDataFrame[Trades]
    sizes: TypedDataFrame[Sizes]
    reveal_type(discounted(pl.col("price")))  # N: Revealed type is "astrolabe.expr.TypedColumn[Literal['price'], polars.datatypes.classes.Float64]"
    reveal_type(trades.select(discounted(pl.col("price"))))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'price': polars.datatypes.classes.Float64}, closed=True), None]"
    sizes.select(discounted(pl.col("price")))  # E: "price" has no result type at this frame's column types: the declaration gives no result at the data types of this frame  [unsupported-dtype-op]
    discounted(pl.col("quantity"))  # E: Argument "price" does not match its declared type: it uses column "quantity", which the declared type does not allow  [expression-fit]
    discounted(pl.col("price").cast(pl.String))  # E: Argument "price" does not match its declared type: it makes a String column, but the declared type is Float64  [expression-fit]
    discounted(pl.col("price").sum())  # E: Argument "price" does not match its declared type: it combines rows into one value, but the declared type works row by row  [expression-fit]

