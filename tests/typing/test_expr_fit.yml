- case: unchecked_fits_both_ways_and_nothing_else_widens
  main: |
    import polars as pl
    from astrolabe import Unchecked, column, typed_expr

    Quantity = column("quantity", pl.Int64)
    Trusted = column("quantity", Unchecked)
    Exact = typed_expr(Quantity, gives=pl.Int64, named="q")
    Anything = typed_expr(Quantity, gives=Unchecked, named="q")

    def exact(q: Exact) -> None: ...
    def anything(q: Anything) -> None: ...

    def lifted(quantity: Trusted) -> None:
        # The lifting cannot decide `+ 1` over a trusted read, so the
        # answer is the marker, and the marker fits any declared type.
        reveal_type((quantity + 1).alias("q"))  # N: Revealed type is "astrolabe.expr.TypedExpr[astrolabe.expr.Deferred[Literal["($0 + 1).alias('q')"], astrolabe.expr.TypedColumn[Literal['quantity'], astrolabe.frame.Unchecked]]]"
        exact((quantity + 1).alias("q"))

    anything(pl.col("quantity").alias("q"))
    anything(pl.col("quantity").cast(pl.String).alias("q"))
    exact(pl.col("quantity").cast(pl.Int32).alias("q"))  # E: Argument "q" does not match its declared type: it makes an Int32 column, but the declared type is Int64  [expression-fit]

