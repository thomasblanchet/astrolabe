# A literal whose value decides its data type joins a column by the range
# of its value, so it fits no `typed_lit` of a fixed data type.
- case: a_literal_whose_value_decides_its_type_fits_no_typed_lit
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame, typed_lit

    One = typed_lit(gives=pl.Int32)

    class Small(Columns):
        u: pl.UInt8

    def bump(df: TypedDataFrame[Small], one: One) -> None:
        reveal_type(df.select(pl.col("u") + one))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'u': polars.datatypes.classes.Int32}, closed=True), None]"

    def run(df: TypedDataFrame[Small], n: int) -> None:
        bump(df, pl.lit(1))  # E: Argument "one" does not match its declared type: its value decides its data type beside a column, but the declared type is Int32: write pl.lit(..., dtype=pl.Int32)  [expression-fit]
        bump(df, pl.lit(n))  # E: Argument "one" does not match its declared type: its value decides its data type beside a column, but the declared type is Int32: write pl.lit(..., dtype=pl.Int32)  [expression-fit]
        bump(df, pl.lit(1, dtype=pl.Int32))

- case: a_fit_reads_a_large_cell_at_its_kinds_and_a_declared_unchecked_takes_any_answer
  main: |
    import polars as pl
    from astrolabe import Unchecked, column, typed_expr

    # Two reads of the kind List hold more samples than the fit tries, so
    # the cell gives one point of its kinds.
    Pair = typed_expr(column("a", pl.List), column("b", pl.List), gives=pl.Boolean, named="p")
    # A declared Unchecked result agrees with every answer, a refusal included.
    Loose = typed_expr(column("s", pl.String), gives=Unchecked, named="s")

