- case: a_rebound_argument_is_judged_at_each_call
  mypy_config: |
    allow_redefinition = true
  main: |
    import polars as pl
    from astrolabe import column, typed_expr

    Quantity = column("quantity", pl.Int64)
    Flag = typed_expr(Quantity, gives=pl.Boolean, named="f")

    def flag(q: Flag) -> Flag:
        return q

    def choose(big: bool) -> None:
        e = (pl.col("quantity") > 0).alias("f")
        if big:
            e = (pl.col("quantity") > 100).alias("f")
        reveal_type(e)  # N: Revealed type is "astrolabe.expr.TypedExpr[astrolabe.expr.Deferred[Literal["(pl.col('quantity') > 0).alias('f')"]]] | astrolabe.expr.TypedExpr[astrolabe.expr.Deferred[Literal["(pl.col('quantity') > 100).alias('f')"]]]"
        reveal_type(flag(e))  # N: Revealed type is "astrolabe.expr.TypedExpr[astrolabe.expr.Reads[astrolabe.frame.Column[Literal['quantity'], polars.datatypes.classes.Int64]], astrolabe.frame.Column[Literal['f'], polars.datatypes.classes.Boolean]]"
        e = pl.col("quantity").alias("f")
        flag(e)  # E: Argument "q" does not match its declared type: it makes an Int64 column, but the declared type is Boolean  [expression-fit]

