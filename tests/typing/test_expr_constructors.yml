  skip: __import__("tests.releases").releases.polars_before("1.40.0")
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class FrameSchema(Columns):
        f: pl.Float32
        u: pl.UInt8
        n: pl.Null

    df: TypedDataFrame[FrameSchema]

    # A float variable can hold any int or a float, and an int variable any
    # int. The join answers where every value that the checker tries gives
    # one data type.
    share: float = 1
    count: int = 2**40
    reveal_type(df.select(pl.max_horizontal(pl.col("f"), share)))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'f': polars.datatypes.classes.Float32}, closed=True), None]"
    reveal_type(df.select(pl.min_horizontal(count, pl.col("f"))))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'literal': polars.datatypes.classes.Float32}, closed=True), None]"
    reveal_type(df.select(pl.coalesce(pl.col("f"), count)))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'f': polars.datatypes.classes.Float32}, closed=True), None]"
    reveal_type(df.select(pl.coalesce(share, pl.col("f"))))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'literal': polars.datatypes.classes.Float32}, closed=True), None]"
    reveal_type(df.select(pl.sum_horizontal(pl.col("u"), share)))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'u': astrolabe.frame.Unchecked}, closed=True), None]"
    # Alone, or after a Null column, each value has a type of its own.
    reveal_type(df.select(pl.sum_horizontal(pl.col("n"), share)))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'n': astrolabe.frame.Unchecked}, closed=True), None]"
    reveal_type(df.select(pl.coalesce(pl.col("n"), count, pl.col("f"))))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'n': polars.datatypes.classes.Float32}, closed=True), None]"
    reveal_type(df.select(pl.coalesce(share)))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'literal': astrolabe.frame.Unchecked}, closed=True), None]"
    reveal_type(df.select(pl.coalesce(share) + pl.col("u")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'literal': astrolabe.frame.Unchecked}, closed=True), None]"
    # Arithmetic of two literals of unknown values has no known type after a
    # Null column.
    reveal_type(df.select(pl.sum_horizontal(pl.col("n"), pl.lit(1) + pl.lit(1))))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'n': polars.datatypes.classes.Int32}, closed=True), None]"

