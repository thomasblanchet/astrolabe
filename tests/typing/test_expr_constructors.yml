- case: repeat_reads_its_count_as_an_operand
  main: |
    from typing import Any
    import polars as pl
    from astrolabe import Columns, List, TypedDataFrame

    class FrameSchema(Columns):
        g: pl.Int64
        s: pl.String
        l: List[pl.String]

    df: TypedDataFrame[FrameSchema]

    # Polars runs an expression count: the frame must hold its columns,
    # the count must have an answer, and its kind must be an integer.
    reveal_type(df.select(pl.repeat(1, pl.col("g").max())))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'repeat': polars.datatypes.classes.Int32}, closed=True), None]"
    reveal_type(df.select(pl.repeat(1, pl.col("g").max()).name.keep()))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'g': polars.datatypes.classes.Int32}, closed=True), None]"
    reveal_type(df.select(pl.repeat(1, n=pl.lit(2), dtype=pl.Int8)))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'repeat': polars.datatypes.classes.Int8}, closed=True), None]"
    df.select(pl.repeat(1, pl.col("zz")))  # E: This call has no result at any frame: 'n' must be a scalar value, and polars raises ShapeError  [invalid-call-shape]
    df.select(pl.repeat(1, pl.col("l").diff().null_count()))  # E: "repeat" has no result type at this frame's column types: cannot sub two list columns with non-numeric inner types, and polars raises InvalidOperationError  [unsupported-dtype-op]
    df.select(pl.repeat(1, pl.col("s").max()))  # E: "repeat" has no result type at this frame's column types: expected expression of dtype 'integer', got 'String', and polars raises SchemaError  [unsupported-dtype-op]
    df.select(pl.repeat(1, pl.lit(2.0)))  # E: This call has no result at any frame: expected expression of dtype 'integer', got 'Float64', and polars raises SchemaError  [invalid-call-shape]

    def counted(count: Any) -> None:
        reveal_type(pl.repeat(1, count))  # N: Revealed type is "astrolabe.expr.TypedExpr[astrolabe.expr.Deferred[Literal["pl.repeat(1, hole('any'))"]]]"

    reveal_type(pl.repeat(1, 3, eager=True))  # N: Revealed type is "polars.series.series.Series"

- case: horizontal_folds_join_their_operands
  main: |
    import polars as pl
    from astrolabe import Columns, List, TypedDataFrame

    class FrameSchema(Columns):
        i: pl.Int64
        f: pl.Float64
        b: pl.Boolean
        s: pl.String

    Frame = TypedDataFrame[FrameSchema]

    df: Frame

    class NarrowedSchema(Columns):
        i: pl.Float64
        largest: pl.Float64
        first_non_null: pl.Float64
        b: pl.Boolean
        joined: pl.String
        formatted: pl.String
        listed: List[pl.Float64]
        correlation: pl.Float64
        positions: pl.UInt32

    narrowed: TypedDataFrame[NarrowedSchema] = df.select(
        pl.sum_horizontal("i", "f"),
        largest=pl.max_horizontal(pl.col("i"), pl.col("f")),
        first_non_null=pl.coalesce(["i", "f"]),
        b=pl.all_horizontal("b", "b"),
        joined=pl.concat_str("s", "i", separator="-"),
        formatted=pl.format("{}-{}", "s", "i"),
        listed=pl.concat_list("i", "f"),
        correlation=pl.corr("i", "f"),
        positions=pl.arg_where(pl.col("b")),
    )

- case: a_value_horizontal_folds_any_number_of_operands
  main: |
    from typing import Literal
    import polars as pl
    from astrolabe import Columns, Decimal, Duration, TypedDataFrame, Unchecked

    class FrameSchema(Columns):
        i: pl.Int64
        f: pl.Float32
        n: pl.Int8
        b: pl.Boolean
        m: Decimal[Literal[10], Literal[2]]
        fast: Duration[Literal["ns"]]
        slow: Duration[Literal["ms"]]

    # The supertype of every operand decides the data type of the
    # answer, with the parameters of the operands joined onto it.
    Frame = TypedDataFrame[FrameSchema]
    df: Frame

    class NarrowedSchema(Columns):
        counted: pl.UInt32
        averaged: pl.Float64
        three: pl.Float64
        span: Duration[Literal["ms"]]
        widened: Decimal[Literal[38], Literal[2]]
        mixed: Unchecked

    narrowed: TypedDataFrame[NarrowedSchema] = df.select(  # E: "mixed" has no result type at this frame's column types: the fast addition of Int64 and Decimal(precision=10, scale=2) is unreachable, and polars panics  [unsupported-dtype-op]
        counted=pl.sum_horizontal("b"),
        averaged=pl.mean_horizontal("i"),
        three=pl.sum_horizontal("i", "f", "n"),
        span=pl.min_horizontal("fast", "slow"),
        widened=pl.sum_horizontal("m", "i"),
        mixed=pl.mean_horizontal("i", "m"),
    )

- case: a_null_operand_lets_format_print_a_duration
  main: |
    from typing import Literal
    import polars as pl
    from astrolabe import Columns, Duration, TypedDataFrame, Unchecked

    class FrameSchema(Columns):
        n: pl.Null
        d: Duration[Literal["ms"]]

    # A duration prints no string. A null operand before it makes
    # every row null, and polars never prints the duration.
    Frame = TypedDataFrame[FrameSchema]
    df: Frame

    class NarrowedSchema(Columns):
        excused: pl.String

    narrowed: TypedDataFrame[NarrowedSchema] = df.select(
        excused=pl.format("{}{}", pl.col("n"), pl.col("d")),
    )

    class RefusedSchema(Columns):
        d: Unchecked

    refused: TypedDataFrame[RefusedSchema] = df.select(pl.format("{}{}", pl.col("d"), pl.col("n")))  # E: "d" has no result type at this frame's column types: casting from Duration(time_unit='ms') to String not supported, and polars raises InvalidOperationError  [unsupported-dtype-op]

# From five inputs, the number of threads of polars decides the order in
# which `sum_horizontal` and `mean_horizontal` add them. Where two orders
# give different answers, here a panic and `Float64`, the answer is
# Unchecked. Where every order agrees, it is the answer.
