- case: a_member_over_a_container_joins_by_its_full_type
  main: |
    from typing import Literal

    import polars as pl
    from astrolabe import Array, Columns, List, TypedDataFrame

    class FrameSchema(Columns):
        b: pl.Boolean
        u: pl.UInt8
        l: List[pl.Int16]
        m: List[pl.Float32]
        a: Array[pl.Int16, Literal[1]]
        w: Array[pl.Int16, Literal[2]]

    df: TypedDataFrame[FrameSchema]

    # `first` over an Array keeps the width, so it joins the same Array.
    reveal_type(df.select(pl.col("a").fill_null(pl.col("a").first())))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'a': astrolabe.frame.Array[polars.datatypes.classes.Int16, Literal[1]]}, closed=True), None]"
    reveal_type(df.select(pl.col("a").first().fill_null(pl.col("a"))))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'a': astrolabe.frame.Array[polars.datatypes.classes.Int16, Literal[1]]}, closed=True), None]"
    reveal_type(df.select(pl.coalesce(pl.col("a"), pl.col("a").first())))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'a': astrolabe.frame.Array[polars.datatypes.classes.Int16, Literal[1]]}, closed=True), None]"
    reveal_type(df.select(pl.when(pl.col("b")).then(pl.col("a")).otherwise(pl.col("a").first())))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'a': astrolabe.frame.Array[polars.datatypes.classes.Int16, Literal[1]]}, closed=True), None]"
    reveal_type(df.select(pl.when(pl.col("b")).then(pl.col("a").first()).otherwise(pl.col("a"))))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'a': astrolabe.frame.Array[polars.datatypes.classes.Int16, Literal[1]]}, closed=True), None]"
    # Another width, or a List, gives a List.
    reveal_type(df.select(pl.coalesce(pl.col("a"), pl.col("w").first())))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'a': astrolabe.frame.List[polars.datatypes.classes.Int16]}, closed=True), None]"
    reveal_type(df.select(pl.when(pl.col("b")).then(pl.col("a")).otherwise(pl.col("w").first())))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'a': astrolabe.frame.List[polars.datatypes.classes.Int16]}, closed=True), None]"
    reveal_type(df.select(pl.col("l").fill_null(pl.col("a").first())))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'l': astrolabe.frame.List[polars.datatypes.classes.Int16]}, closed=True), None]"
    # A shift has no fill over an Array: two widths give a List, and one width is refused.
    reveal_type(df.select(pl.col("a").shift(1, fill_value=pl.col("w").first())))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'a': astrolabe.frame.List[polars.datatypes.classes.Int16]}, closed=True), None]"
    df.select(pl.col("w").shift(1, fill_value=pl.col("w").first()))  # E: "w" has no result type at this frame's column types: `shift_and_fill` operation not supported for dtype `Array(Int16, shape=(2,))`, and polars raises InvalidOperationError  [unsupported-dtype-op]
    # `first` over a List joins the elements in a chain too.
    reveal_type(df.select(pl.when(pl.col("b")).then(pl.col("l")).otherwise(pl.col("m").first())))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'l': astrolabe.frame.List[polars.datatypes.classes.Float32]}, closed=True), None]"
    reveal_type(df.select(pl.when(pl.col("b")).then(pl.col("l").first()).otherwise(pl.col("l"))))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'l': astrolabe.frame.List[polars.datatypes.classes.Int16]}, closed=True), None]"
    # A comparison with the Array reads the full types as well.
    reveal_type(df.select(pl.col("a").first() == pl.col("a")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'a': polars.datatypes.classes.Boolean}, closed=True), None]"
    # A scalar kind beside the Array has no join.
    df.select(pl.col("u").fill_null(pl.col("a").first()))  # E: "u" has no result type at this frame's column types: failed to determine supertype of UInt8 and Array(Int16, shape=(1,)), and polars raises SchemaError  [unsupported-dtype-op]
    df.select(pl.when(pl.col("b")).then(pl.col("u")).otherwise(pl.col("a").first()))  # E: "u" has no result type at this frame's column types: failed to determine supertype of UInt8 and Array(Int16, shape=(1,)), and polars raises SchemaError  [unsupported-dtype-op]

