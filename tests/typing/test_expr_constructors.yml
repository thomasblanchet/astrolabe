        i: pl.Int64
        f: pl.Float32
        m: List[pl.Int8]
        s: List[pl.String]
        n: List[List[pl.Int64]]

    df: TypedDataFrame[FrameSchema]

    # The kinds do not name the element of a list, so the join reads the
    # element at the frame, as it reads a column of the element type.
    reveal_type(df.select(pl.coalesce(pl.col("m").list.first(), pl.col("i"))))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'m': polars.datatypes.classes.Int64}, closed=True), None]"
    reveal_type(df.select(pl.coalesce(pl.col("f"), pl.col("m").list.first())))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'f': polars.datatypes.classes.Float32}, closed=True), None]"
    reveal_type(df.select(pl.coalesce(pl.col("m").list.first(), 300)))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'m': polars.datatypes.classes.Int16}, closed=True), None]"
    reveal_type(df.select(pl.col("m").list.first().fill_null(pl.col("f"))))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'m': polars.datatypes.classes.Float32}, closed=True), None]"
    reveal_type(df.select(pl.col("i").fill_null(pl.col("s").list.first())))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'i': polars.datatypes.classes.String}, closed=True), None]"
    reveal_type(df.select(pl.coalesce(pl.col("m").list.first(), pl.col("s").list.first())))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'m': polars.datatypes.classes.String}, closed=True), None]"
    # A list element beside a scalar is refused, as a list column is.
    df.select(pl.coalesce(pl.col("n").list.first(), pl.col("i")))  # E: "n" has no result type at this frame's column types: failed to determine supertype of List(Int64) and Int64, and polars raises SchemaError  [unsupported-dtype-op]

- case: a_coalesce_of_a_container_that_a_rule_builds_joins_by_its_kind
  main: |
    from typing import Literal

    import polars as pl
    from astrolabe import Array, Columns, List, TypedDataFrame

    class FrameSchema(Columns):
        i: pl.Int64
        n: pl.Null
        m: List[pl.Int64]
        a: Array[pl.Int64, Literal[1]]

    df: TypedDataFrame[FrameSchema]

    # The sum of a list and a number is a list, so polars refuses it beside
    # a scalar kind, in either order, and in fill_null and append too.
    df.select(pl.coalesce(pl.col("m") + pl.col("i"), pl.col("i")))  # E: "m" has no result type at this frame's column types: failed to determine supertype of List(Int64) and Int64, and polars raises SchemaError  [unsupported-dtype-op]
    df.select(pl.coalesce(pl.col("i"), pl.col("m") + pl.col("i")))  # E: "i" has no result type at this frame's column types: failed to determine supertype of Int64 and List(Int64), and polars raises SchemaError  [unsupported-dtype-op]
    df.select((pl.col("m") + pl.col("i")).fill_null(pl.col("i")))  # E: "m" has no result type at this frame's column types: failed to determine supertype of List(Int64) and Int64, and polars raises SchemaError  [unsupported-dtype-op]
    df.select(pl.col("i").fill_null(pl.col("m") + pl.col("i")))  # E: "i" has no result type at this frame's column types: failed to determine supertype of Int64 and List(Int64), and polars raises SchemaError  [unsupported-dtype-op]
    df.select((pl.col("m") + pl.col("i")).append(pl.col("i")))  # E: "m" has no result type at this frame's column types: failed to determine supertype of List(Int64) and Int64, and polars raises SchemaError  [unsupported-dtype-op]
    # Beside Null or a second container, the full types decide at the frame.
    reveal_type(df.select(pl.coalesce(pl.col("m") + pl.col("i"), pl.col("m"))))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'m': astrolabe.frame.List[polars.datatypes.classes.Int64]}, closed=True), None]"
    reveal_type(df.select(pl.coalesce(pl.col("m") + pl.col("i"), pl.col("n"))))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'m': astrolabe.frame.List[polars.datatypes.classes.Int64]}, closed=True), None]"
    reveal_type(df.select(pl.coalesce(pl.col("a") + pl.col("i"), pl.col("a"))))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'a': astrolabe.frame.Array[polars.datatypes.classes.Int64, Literal[1]]}, closed=True), None]"

- case: sum_horizontal_of_null_inputs_gives_the_rows_of_the_first_input
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class Rows(Columns):
        g: pl.Int64
        n: pl.Null

    df: TypedDataFrame[Rows]
    df.group_by("g").agg(pl.sum_horizontal(pl.lit(None), pl.col("n")).alias("o"))  # E: "o" has no result type at this frame's column types: output length of `map` (1) must be equal to the input length, and polars raises InvalidOperationError  [unsupported-dtype-op]
    reveal_type(df.group_by("g").agg(pl.sum_horizontal(pl.col("n"), pl.lit(None)).alias("o")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'g': polars.datatypes.classes.Int64, 'o': astrolabe.frame.List[polars.datatypes.classes.Null]}, closed=True), None]"

- case: an_expression_built_with_no_argument_reads_as_plain
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class FrameSchema(Columns):
        a: pl.Int64

    df: TypedDataFrame[FrameSchema]

    # pl.Expr() with no argument holds no tree, no name and no read. The
    # checker cannot read it, so a frame operation gives the plain frame.
    reveal_type(df.select(pl.Expr()))  # N: Revealed type is "polars.dataframe.frame.DataFrame"
