- case: a_boolean_horizontal_reads_each_operand_as_a_truth_value
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class FrameSchema(Columns):
        i: pl.Int64
        f: pl.Float64
        b: pl.Boolean
        s: pl.String

    # Polars reads a numeric or Boolean operand as a truth value, and
    # fails on a String or temporal operand with any non-null value.
    Frame = TypedDataFrame[FrameSchema]

    df: Frame

    class NarrowedSchema(Columns):
        i: pl.Boolean
        f: pl.Boolean
        any: pl.Boolean

    narrowed: TypedDataFrame[NarrowedSchema] = df.select(
