# The `pl.*` constructors: mirrors over a column, fresh values,
# horizontal folds, and the builtin `abs`. Every expected frame is
# confirmed against real polars.

- case: mirror_constructors_serve_the_root_member_over_a_column
  main: |
    import polars as pl
    from astrolabe import Columns, List, TypedDataFrame

    class FrameSchema(Columns):
        k: pl.String
        i: pl.Int64
        f: pl.Float64
        s: pl.String

    Frame = TypedDataFrame[FrameSchema]

    df: Frame

    class NarrowedSchema(Columns):
        i: pl.Int64
        s: pl.String
        average: pl.Float64
        first: pl.String
        count: pl.UInt32
        distinct: pl.UInt32
        spread: pl.Float64
        imploded: List[pl.Int64]
        running: pl.Int64

    narrowed: TypedDataFrame[NarrowedSchema] = df.select(
        pl.sum("i"),
        pl.max("s"),
        average=pl.mean("i"),
        first=pl.first("s"),
        count=pl.count("s"),
        distinct=pl.n_unique("s"),
        spread=pl.std("f"),
        imploded=pl.implode("i"),
        running=pl.cum_sum("i"),
    )

    class GroupedSchema(Columns):
        k: pl.String
        i: pl.Int64

    grouped: TypedDataFrame[GroupedSchema] = df.group_by("k").agg(pl.sum("i"))

