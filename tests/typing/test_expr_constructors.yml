- case: struct_with_a_schema_takes_the_fields_of_the_schema
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class FrameSchema(Columns):
        a: pl.Int64
        b: pl.String
        d: pl.Date
        c: pl.Float64

    df: TypedDataFrame[FrameSchema]

    # The schema casts the field it names and drops the operand it does not.
    reveal_type(df.select(pl.struct("a", "b", schema={"a": pl.Float32})))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'a': astrolabe.frame.Struct[tuple[astrolabe.frame.Column[Literal['a'], polars.datatypes.classes.Float32]]]}, closed=True), None]"
    # A key that no operand gives is a field of nulls of its type.
    reveal_type(df.select(pl.struct("a", schema={"a": pl.Int8, "z": pl.String})))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'a': astrolabe.frame.Struct[tuple[astrolabe.frame.Column[Literal['a'], polars.datatypes.classes.Int8], astrolabe.frame.Column[Literal['z'], polars.datatypes.classes.String]]]}, closed=True), None]"
    # With no operand, the keys name the columns to read, in the schema's order.
    reveal_type(df.select(pl.struct(schema={"c": pl.Int32, "a": pl.Int8})))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'c': astrolabe.frame.Struct[tuple[astrolabe.frame.Column[Literal['c'], polars.datatypes.classes.Int32], astrolabe.frame.Column[Literal['a'], polars.datatypes.classes.Int8]]]}, closed=True), None]"
    # polars refuses the cast, and still reads a dropped column.
    df.select(pl.struct("d", schema={"d": pl.Boolean}))  # E: This expression cannot cast from Struct({'d': Date}) to Struct({'d': Boolean})  [invalid-cast]
    df.select(pl.struct("a", "zzz", schema={"a": pl.Int8}))  # E: Unknown column "zzz"  [unknown-column]

- case: an_integer_that_no_data_type_holds_is_an_error
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class FrameSchema(Columns):
        a: pl.Int64

    df: TypedDataFrame[FrameSchema]

    # polars raises when it builds the expression from 2**127.
    pl.lit(170141183460469231731687303715884105728)  # E: an integer that no polars data type holds raises InvalidOperationError: integer too large for Polars  [invalid-call-shape]
    pl.col("a") + 170141183460469231731687303715884105728  # E: an integer that no polars data type holds raises InvalidOperationError: integer too large for Polars  [invalid-call-shape]
    # On the left of an operator, the value has no answer at any data type.
    df.select(170141183460469231731687303715884105728 + pl.col("a"))  # E: an integer that no polars data type holds raises InvalidOperationError: integer too large for Polars  [invalid-call-shape]
    # -2**127 is the smallest Int128, which polars holds.
    reveal_type(df.select(pl.col("a") + -170141183460469231731687303715884105728))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict(main.FrameSchema, {'a': polars.datatypes.classes.Int64}, closed=True), None]"

