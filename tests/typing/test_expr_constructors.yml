- case: the_mean_horizontal_tree_makes_the_operand_order_count
  main: |
    from typing import Literal
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class FrameSchema(Columns):
        h: pl.Float16
        i: pl.Int8
        u: pl.UInt8
        b: pl.Boolean

    # Polars combines the operands as a balanced binary tree. Two
    # operands that hold no float add first, so the same three
    # operands answer two widths in two orders.
    Frame = TypedDataFrame[FrameSchema]
    df: Frame

    class WidthSchema(Columns):
        joined: pl.Float32
        apart: pl.Float16
        pair: pl.Float16
        flags: pl.Float64

    widths: TypedDataFrame[WidthSchema] = df.select(
        joined=pl.mean_horizontal("h", "i", "u"),
        apart=pl.mean_horizontal("i", "h", "u"),
        pair=pl.mean_horizontal("h", "i"),
        flags=pl.mean_horizontal("b", "b"),
    )

- case: lit_types_none_and_refuses_an_expression
  main: |
    import polars as pl

    reveal_type(pl.lit(None))  # N: Revealed type is "astrolabe.expr.TypedExpr[astrolabe.expr.Deferred[Literal['pl.lit(None)']]]"
    pl.lit(pl.lit(5))  # E: This call raises TypeError before any frame meets it: cannot create expression literal for value of type Expr.  [invalid-call-shape]
