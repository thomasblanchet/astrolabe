    # every other unresolvable-item shape.
    Frame = TypedDataFrame[FrameSchema]

    df: Frame
    reveal_type(df.hstack([1]))  # N: Revealed type is "polars.dataframe.frame.DataFrame" # E: List item 0 has incompatible type "int"; expected "Series"  [list-item]

