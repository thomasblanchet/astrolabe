- case: hstack_with_series_variable_list_falls_back_to_untyped
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class FrameSchema(Columns):
        foo: pl.Int64

    # A pre-declared list[Series] variable carries no static per-item
    # column name: unlike the inline literal list case below, there is
    # no pl.Series(...) call left in the AST at the .hstack() call site
    # to read a name off at all.
    Frame = TypedDataFrame[FrameSchema]

    df: Frame
    series_list: list[pl.Series] = [pl.Series("bar", ["x"])]
    reveal_type(df.hstack(series_list))  # N: Revealed type is "polars.dataframe.frame.DataFrame"

- case: hstack_with_inline_series_list_narrows_names_to_unchecked
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame, Unchecked

    class FrameSchema(Columns):
        foo: pl.Int64

    # An inline literal list of pl.Series(name, values) calls, right at
    # the call site, keeps each one's own literal name in the AST: the
    # names are known even with no pl.Series constructor facade (still
    # deferred) to infer a dtype from values' own inferred type.
    Frame = TypedDataFrame[FrameSchema]

    df: Frame

    class NarrowedSchema(Columns):
        foo: pl.Int64
        bar: Unchecked

    narrowed: TypedDataFrame[NarrowedSchema] = df.hstack([pl.Series("bar", ["x"])])

