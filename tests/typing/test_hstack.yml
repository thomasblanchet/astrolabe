- case: hstack_on_an_open_frame_needs_the_new_names_free
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame, other_columns

    class FrameSchema(Columns):
        b: pl.Int64

    class OtherSchema(Columns):
        z: pl.Int64

    Rest = other_columns()
    NoZ = other_columns(without=["z"])
    NoB = other_columns(without=["b"])

    def widen(
        df: TypedDataFrame[FrameSchema, Rest],
        free: TypedDataFrame[FrameSchema, NoZ],
        other: TypedDataFrame[OtherSchema],
        other_open: TypedDataFrame[OtherSchema, NoB],
    ) -> None:
        reveal_type(free.hstack([pl.Series("z", [1], dtype=pl.Int64)]))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'b': polars.datatypes.classes.Int64, 'z': polars.datatypes.classes.Int64}, closed=True), main.NoZ]"
        reveal_type(free.hstack(other))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'b': polars.datatypes.classes.Int64, 'z': polars.datatypes.classes.Int64}, closed=True), main.NoZ]"
        df.hstack([pl.Series("z", [1], dtype=pl.Int64)])  # E: This hstack combines columns differently for some callers: another frame's remainder can hold "z". Exclude the names with without=/without_prefix=  [concat-collision]  # N: set allow_unproven = "possible" in [tool.astrolabe] to allow this, or set [tool.astrolabe.allow_unproven_overrides] hstack = "possible"
        free.hstack(other_open)  # E: This hstack combines columns differently for some callers: two remainders can share a name. Declare disjoint_from= on one of them  [concat-collision]  # N: set allow_unproven = "possible" in [tool.astrolabe] to allow this, or set [tool.astrolabe.allow_unproven_overrides] hstack = "possible"

