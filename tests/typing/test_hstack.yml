# .hstack(): merging another frame's columns in, side by side. Written
# before the corresponding get_method_hook implementation exists. This
# test is expected to fail (red) until plugin.py implements it.
#
# `pl.DataFrame.hstack(columns: list[Series] | DataFrame, *, in_place:
# bool = False) -> DataFrame` (confirmed via inspect.signature; no
# `pl.LazyFrame.hstack` exists). A `TypedDataFrame`-typed `columns`
# argument is resolved statically in full. An inline literal list is
# also recovered, one column per item, by reading each item's own
# resolved type: `SeriesConstructorHook` (typed_series_constructor.py)
# narrows a `pl.Series(name, ...)` call to a real `TypedSeries[Literal[name],
# dtype]`, so this works the same whether that call is written inline or
# bound to its own local variable first -- with no explicit `dtype=`,
# the column's own dtype substitutes Unchecked: there is still no way to
# infer one from `values`' own inferred type. A `list[Series]` passed as
# a pre-declared variable still falls back to the plain, erased
# pl.DataFrame: a `list[X]`'s own declared/inferred type does not
# preserve each element's own precise type the way reading the literal
# list's own items directly does, the same "cannot check what we cannot
# see" discipline as everywhere else. `in_place=True` mutates and
# returns the same receiver object at runtime, but its result schema is
# identical to `in_place=False`'s (confirmed empirically), so it needs
# no special handling. A name collision between the two frames raises a
# real `DuplicateError` at runtime, confirmed by actually running it.

- case: hstack_merges_columns_from_another_typed_dataframe
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class LeftSchema(Columns):
        foo: pl.Int64

    Left = TypedDataFrame[LeftSchema]

    class RightSchema(Columns):
        bar: pl.String

    Right = TypedDataFrame[RightSchema]

    left: Left
    right: Right

    class NarrowedSchema(Columns):
        foo: pl.Int64
        bar: pl.String

    narrowed: TypedDataFrame[NarrowedSchema] = left.hstack(right)

