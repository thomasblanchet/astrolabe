- case: hstack_with_variable_bound_inline_series_narrows_to_unchecked
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame, Unchecked

    class FrameSchema(Columns):
        foo: pl.Int64

    # The actual bug this fix targets: a pl.Series(...) call assigned to
    # a plain variable first, then referenced in the literal list, used
    # to fall back to the plain, erased pl.DataFrame -- the old
    # AST-walking recognition only ever saw the call written inline.
    # SeriesConstructorHook now masks the constructor call's own return
    # type directly, so the variable's own inferred type already
    # carries the parametrized TypedSeries marker.
    Frame = TypedDataFrame[FrameSchema]

    df: Frame
    s = pl.Series("bar", ["x"])

    class NarrowedSchema(Columns):
        foo: pl.Int64
        bar: Unchecked

    narrowed: TypedDataFrame[NarrowedSchema] = df.hstack([s])

- case: hstack_with_inline_series_call_via_non_ref_callee_narrows_to_unchecked
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame, Unchecked

    class FrameSchema(Columns):
        foo: pl.Int64

    # The item is a call through a lambda expression, not a bare
    # pl.Series reference -- but reading the item's own resolved type
    # narrows it the same as any other pl.Series(...) call, inline or
    # not: there is no AST shape left to match against at all.
    Frame = TypedDataFrame[FrameSchema]

    df: Frame

    class NarrowedSchema(Columns):
        foo: pl.Int64
        x: Unchecked

    narrowed: TypedDataFrame[NarrowedSchema] = df.hstack([(lambda: pl.Series("x", [1]))()])

- case: hstack_with_inline_non_series_item_falls_back_to_untyped
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class FrameSchema(Columns):
        foo: pl.Int64

    # A literal list is recognized, but an item whose own resolved type
