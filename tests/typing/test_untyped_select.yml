# `.select()` on a bare, never-typed `pl.DataFrame`/`pl.LazyFrame`, via
# `UntypedSelectHook` (`_hooks/untyped_select.py`). The setting
# `elevate_untyped_select` of `[tool.astrolabe]` turns it on, and it is on
# by default.

- case: the_setting_off_keeps_the_plain_frame
  main: |
    import polars as pl

    df: pl.DataFrame
    reveal_type(df.select(pl.col("a")))  # N: Revealed type is "polars.dataframe.frame.DataFrame"
  files:
    - path: pyproject.toml
      content: |
        [tool.mypy]
        plugins = ["astrolabe.plugin"]
        strict = true
        allow_redefinition = true

        [tool.astrolabe]
        elevate_untyped_select = false

- case: bare_pl_col_narrows_to_unchecked
  main: |
    import polars as pl

    df: pl.DataFrame
    reveal_type(df.select(pl.col("a")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'a': astrolabe.frame.Unchecked}, closed=True), None]"

- case: cast_gives_a_concrete_dtype
  main: |
    import polars as pl

    df: pl.DataFrame
    reveal_type(df.select(pl.col("a"), pl.col("b").cast(pl.Int64)))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'a': astrolabe.frame.Unchecked, 'b': polars.datatypes.classes.Int64}, closed=True), None]"

- case: alias_renames_a_bare_column
  main: |
    import polars as pl

    df: pl.DataFrame
    reveal_type(df.select(pl.col("x").alias("y")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'y': astrolabe.frame.Unchecked}, closed=True), None]"

- case: bare_string_shorthand_narrows_to_unchecked
  main: |
    import polars as pl

    df: pl.DataFrame
    reveal_type(df.select("c"))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'c': astrolabe.frame.Unchecked}, closed=True), None]"

- case: named_exprs_keyword_becomes_the_output_name
  main: |
    import polars as pl

    df: pl.DataFrame
    reveal_type(df.select(cost=pl.col("d")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'cost': astrolabe.frame.Unchecked}, closed=True), None]"

- case: bare_generic_non_literal_name_operand_falls_back_to_untyped
  main: |
    import polars as pl
    from astrolabe.expr import TypedExpr

    # e's own Name is a still-unbound TypeVar, not a literal string: a
    # bare positional argument has no forced_name to rescue it, so
    # there is no output name at all to build a result column with.
    def f[N: str](df: pl.DataFrame, e: TypedExpr[N, pl.Int64]) -> None:
        reveal_type(df.select(e))  # N: Revealed type is "polars.dataframe.frame.DataFrame"

- case: bare_literal_needs_no_receiver_schema
  main: |
    import polars as pl

    df: pl.DataFrame
    reveal_type(df.select(1))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'literal': polars.datatypes.classes.Int32}, closed=True), None]"

- case: computed_expression_narrows_to_unchecked
  main: |
    import polars as pl

    # Every operand's own dtype is unresolvable (no receiver schema to
    # read it from), so each degrades to Unchecked, exactly like an
    # unresolved leaf already degrades against a real, merely
    # incomplete receiver schema.
    df: pl.DataFrame
    reveal_type(df.select(pl.col("a") + pl.col("b")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'a': astrolabe.frame.Unchecked}, closed=True), None]"

- case: reducer_expression_narrows_to_unchecked
  main: |
    import polars as pl

    df: pl.DataFrame
    reveal_type(df.select(pl.col("a").sum()))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'a': astrolabe.frame.Unchecked}, closed=True), None]"

- case: selector_call_falls_back_to_plain
  main: |
    import polars as pl
    import polars.selectors as cs

    df: pl.DataFrame
    reveal_type(df.select(cs.numeric()))  # N: Revealed type is "polars.dataframe.frame.DataFrame"

- case: duplicate_output_names_fall_back_to_plain
  main: |
    import polars as pl

    df: pl.DataFrame
    df.select(pl.col("a"), pl.col("b").alias("a"))  # E: select would produce duplicate column "a"  [duplicate-column]

- case: lazyframe_receiver_narrows_to_typed_lazy_frame
  main: |
    import polars as pl

    lf: pl.LazyFrame
    reveal_type(lf.select(pl.col("x")))  # N: Revealed type is "astrolabe.frame.TypedLazyFrame[TypedDict({'x': astrolabe.frame.Unchecked}, closed=True), None]"

- case: a_selection_shaped_chain_falls_back_to_plain
  main: |
    import polars as pl
    import polars.selectors as cs

    # A chain whose first `then` took a selection is a selection
    # itself, and a plain frame has no schema to match it against.
    df: pl.DataFrame
    reveal_type(df.select(pl.when(pl.col("a") > 0).then(cs.numeric())))  # N: Revealed type is "polars.dataframe.frame.DataFrame"

- case: a_selection_under_one_name_falls_back_to_plain
  main: |
    import polars as pl
    import polars.selectors as cs

    # The columns of a plain frame decide how many outputs take the name.
    df: pl.DataFrame
    reveal_type(df.select(pl.all().alias("o")))  # N: Revealed type is "polars.dataframe.frame.DataFrame"
    reveal_type(df.select(pl.col("a") + cs.numeric()))  # N: Revealed type is "polars.dataframe.frame.DataFrame"
    reveal_type(df.select(cs.numeric().sum()))  # N: Revealed type is "polars.dataframe.frame.DataFrame"
