- case: drop_expands_columns_and_selectors_to_names
  main: |
    from typing import Literal

    import polars as pl
    import polars.selectors as cs
    from astrolabe import Columns, TypedDataFrame, Unchecked, other_columns
    from astrolabe.expr import TypedColumn

    Rest = other_columns()

    class FrameSchema(Columns):
        k: pl.String
        n: pl.Int64
        f: pl.Float64

    class Loose(Columns):
        k: pl.String
        u: Unchecked

    def run(
        df: TypedDataFrame[FrameSchema],
        wide: TypedDataFrame[FrameSchema, Rest],
        loose: TypedDataFrame[Loose],
        c: TypedColumn[Literal["n"], pl.Int64],
        pattern: str,
    ) -> None:
        reveal_type(df.drop(cs.numeric()))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'k': polars.datatypes.classes.String}, closed=True), None]"
        reveal_type(df.drop(pl.col("n")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'k': polars.datatypes.classes.String, 'f': polars.datatypes.classes.Float64}, closed=True), None]"
        reveal_type(df.drop([cs.float(), "k"]))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'n': polars.datatypes.classes.Int64}, closed=True), None]"
        reveal_type(df.drop(c))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'k': polars.datatypes.classes.String, 'f': polars.datatypes.classes.Float64}, closed=True), None]"
        # A selector also takes the columns that it picks out of the
        # undeclared columns.
        reveal_type(wide.drop(cs.numeric()))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'k': polars.datatypes.classes.String}, closed=True), astrolabe.remainder.Only[main.Rest, astrolabe.remainder.SelAnd[astrolabe.remainder.SelNot[astrolabe.remainder.OneOf[Literal['f'] | Literal['n']]], astrolabe.remainder.SelNot[astrolabe.remainder.OfType[polars.datatypes.classes.NumericType]]]]]"
        # A column, and a name that a selector lists, must exist whatever
        # strict= says.
        df.drop(cs.by_name("x"), strict=False)  # E: Unknown column "x"  [unknown-column]
        # No name follows from an expression that is no column and no selector.
        df.drop(pl.col("n") + 1)  # E: drop() with an expression that is not a selector raises InvalidOperationError: polars takes only the columns that a name or a selector picks. Pass a column name, pl.col(...) or a selector  [invalid-call-shape]
        # The data decide whether cs.numeric() picks "u", and which columns
        # a pattern from a variable picks.
        reveal_type(loose.drop(cs.numeric()))  # N: Revealed type is "polars.dataframe.frame.DataFrame"
        reveal_type(df.drop(cs.matches(pattern)))  # N: Revealed type is "polars.dataframe.frame.DataFrame"

