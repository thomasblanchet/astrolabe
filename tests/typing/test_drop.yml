# `strict=False`: real polars ignores a requested name it does not find,
# instead of raising ColumnNotFoundError. Confirmed against real polars
# 1.43.2, eager and lazy. So the name is not an error, and on an open
# receiver the result says the remainder no longer holds it:
# `Minus[Rest, Literal[name]]`.

- case: drop_missing_column_with_strict_false_is_not_an_error
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class FrameSchema(Columns):
        foo: pl.String
        bar: pl.Int64

    Frame = TypedDataFrame[FrameSchema]

    df: Frame
    reveal_type(df.drop("missing", strict=False))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict(main.FrameSchema, {'foo': polars.datatypes.classes.String, 'bar': polars.datatypes.classes.Int64}, closed=True), None]"

