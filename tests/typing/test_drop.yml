- case: drop_on_open_receiver_with_strict_false_removes_the_name_from_the_remainder
  main: |
    from typing import Literal
    import polars as pl
    from astrolabe import Columns, Minus, other_columns, TypedDataFrame

    Rest = other_columns()

    class DfSchema(Columns):
        a: pl.Int64

    # "nope" is not declared, so the frame's remainder can hold it.
    # Real polars drops it there and raises nothing. The result says
    # exactly that, with no assumption about the remainder at all.
    df: TypedDataFrame[DfSchema, Rest]
    narrowed: TypedDataFrame[DfSchema, Minus[Rest, Literal["nope"]]] = df.drop("nope", strict=False)

- case: drop_on_open_receiver_removes_a_declared_name_from_the_remainder_too
  main: |
    from typing import Literal
    import polars as pl
    from astrolabe import Columns, Minus, other_columns, TypedDataFrame

    Rest = other_columns()

    class DfSchema(Columns):
        a: pl.Int64
        b: pl.String

    # A declared name gets the same `Minus` node an undeclared one
    # gets. While "b" was declared, the schema itself proved the
    # remainder lacks "b"; the drop frees the name, so the node is
    # what carries that proof forward.
    df: TypedDataFrame[DfSchema, Rest]

    class NarrowedSchema(Columns):
        a: pl.Int64

    narrowed: TypedDataFrame[NarrowedSchema, Minus[Rest, Literal["b"]]] = df.drop("b")

- case: drop_on_open_receiver_leaves_an_already_excluded_name_alone
  main: |
    import polars as pl
    from astrolabe import Columns, other_columns, TypedDataFrame

    Rest = other_columns(without=["nope"])

    class DfSchema(Columns):
        a: pl.Int64

    # The declaration already proves "nope" absent, so nothing is
    # removed and the remainder passes through unchanged.
    df: TypedDataFrame[DfSchema, Rest]
    narrowed: TypedDataFrame[DfSchema, Rest] = df.drop(
        "nope", strict=False
    )

- case: drop_on_open_receiver_with_strict_true_still_errors_for_an_undeclared_name
  main: |
    import polars as pl
    from astrolabe import Columns, other_columns, TypedDataFrame

    Rest = other_columns()

    class DfSchema(Columns):
        a: pl.Int64

    # Real polars raises for every caller whose own remainder does not
    # hold "nope", so the default mode is still an error.
    df: TypedDataFrame[DfSchema, Rest]
    df.drop("nope")  # E: Column "nope" is not declared and cannot be proven to exist  [undeclared-column] # N: set allow_unproven = "possible" in [tool.astrolabe] to allow this, or set [tool.astrolabe.allow_unproven_overrides] drop = "possible"

- case: drop_with_a_runtime_strict_value_narrows_only_for_declared_names
  main: |
    from typing import Literal
    import polars as pl
    from astrolabe import Columns, Minus, other_columns, TypedDataFrame

    Rest = other_columns()

    class DfSchema(Columns):
        a: pl.Int64
        b: pl.String

    # `strict` is a plain variable here, so which of the two modes runs
    # is not knowable. For a declared name both modes agree on the whole
    # result, so the call still narrows. For an undeclared one they do
    # not, and neither mode's own diagnostic can be claimed, so the
    # call erases with no error.
    df: TypedDataFrame[DfSchema, Rest]
    flag: bool

    class NarrowedSchema(Columns):
        a: pl.Int64

    narrowed: TypedDataFrame[NarrowedSchema, Minus[Rest, Literal["b"]]] = df.drop("b", strict=flag)
    reveal_type(df.drop("nope", strict=flag))  # N: Revealed type is "polars.dataframe.frame.DataFrame"
    # An expression in place of the flag gives no value either.
    also_narrowed: TypedDataFrame[NarrowedSchema, Minus[Rest, Literal["b"]]] = df.drop("b", strict=not flag)

- case: drop_frees_a_declared_name_for_with_row_index
  main: |
    import polars as pl
    from astrolabe import Columns, other_columns, TypedDataFrame

    Rest = other_columns()

    class DfSchema(Columns):
        k: pl.Int64

    # Real polars accepts this and gives Schema({'k': UInt32, ...}),
    # measured against polars 1.43.2. While "k" was declared, the
    # schema itself proved the remainder does not hold it. The drop
    # frees the name, and the `Minus` node it mints keeps that proof
    # for with_row_index to read back.
    df: TypedDataFrame[DfSchema, Rest]
    reveal_type(df.drop("k").with_row_index("k"))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'k': polars.datatypes.classes.UInt32}, closed=True), astrolabe.remainder.Minus[main.Rest, Literal['k']]]"

- case: dropping_two_names_in_sequence_merges_into_one_minus_node
  main: |
    import polars as pl
    from astrolabe import Columns, other_columns, TypedDataFrame

    Rest = other_columns()

    class DfSchema(Columns):
        a: pl.Int64
        b: pl.String

    # Removing two names one at a time and removing both at once give
    # one canonical remainder, so the two-step spelling shows the same
    # single `Minus` node the one-step spelling would.
    df: TypedDataFrame[DfSchema, Rest]
    reveal_type(df.drop("a").drop("b"))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({}, closed=True), astrolabe.remainder.Minus[main.Rest, Literal['a'] | Literal['b']]]"
