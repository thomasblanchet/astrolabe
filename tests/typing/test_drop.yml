# .drop(): taking columns out of a frame, by literal names, columns and
# selectors, which polars expands to names.
#
# Uses Column[Literal["foo"], dtype] (not the bare-string shorthand). See
# the comment at the top of test_column_parsing.yml for why this is the
# reliable spelling for alias assignments like `Frame =
# TypedDataFrame[...]`.
#
# A non-literal argument falls back to the plain, erased pl.DataFrame/
# pl.LazyFrame, not "schema unchanged": drop always removes the
# requested column(s) on success, so "unchanged" could claim a dropped
# column still exists.

- case: drop_narrows_precisely
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class FrameSchema(Columns):
        foo: pl.String
        bar: pl.Int64

    Frame = TypedDataFrame[FrameSchema]

    df: Frame

    class NarrowedSchema(Columns):
        foo: pl.String

    narrowed: TypedDataFrame[NarrowedSchema] = df.drop("bar")

- case: drop_final_str_narrows_like_inline_literal
  main: |
    from typing import Final, Literal
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    # A Final-declared string variable narrows the same way the
    # equivalent inline string literal does (see drop_narrows_precisely,
    # above).
    NAME: Final = "bar"

    class FrameSchema(Columns):
        foo: pl.String
        bar: pl.Int64

    Frame = TypedDataFrame[FrameSchema]

    df: Frame

    class NarrowedSchema(Columns):
        foo: pl.String

    narrowed: TypedDataFrame[NarrowedSchema] = df.drop(NAME)

- case: drop_with_list_literal_narrows
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class FrameSchema(Columns):
        foo: pl.String
        bar: pl.Int64
        baz: pl.Float64

    # Real polars flattens a single list literal passed to drop()'s own
    # *columns identically to writing out separate positional arguments.
    Frame = TypedDataFrame[FrameSchema]

    df: Frame

    class NarrowedSchema(Columns):
        foo: pl.String

    narrowed: TypedDataFrame[NarrowedSchema] = df.drop(["bar", "baz"])

