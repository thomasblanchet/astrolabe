- case: a_branch_with_an_unchecked_member_keeps_its_own_frame
  mypy_config: |
    allow_redefinition = true
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame, Unchecked

    class FrameSchema(Columns):
        any_col: Unchecked
        known: pl.Int64

    Frame = TypedDataFrame[FrameSchema]
    df: Frame
    flag = True
    if flag:
        w = pl.col("any_col")
    else:
        w = pl.col("known").round()
    # Each branch gives its own frame: Unchecked for the column of the
    # frame that declares it so, and Int64 for the other branch.
    reveal_type(df.select(w.alias("u")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'u': astrolabe.frame.Unchecked}, closed=True), None] | astrolabe.frame.TypedDataFrame[TypedDict({'u': polars.datatypes.classes.Int64}, closed=True), None]"

- case: a_list_method_over_an_unchecked_column_answers
  main: |
    import polars as pl
    from astrolabe import Columns, List, TypedDataFrame, Unchecked

    class FrameSchema(Columns):
        a: Unchecked
        b: List[pl.Int64]

    df: TypedDataFrame[FrameSchema]

    class OutSchema(Columns):
        a: List[Unchecked]

    class LengthSchema(Columns):
        a: pl.UInt32

    # The read covers the List member, where the method answers.
    lengths: TypedDataFrame[LengthSchema] = df.select(pl.col("a").list.len())
    joined: TypedDataFrame[OutSchema] = df.select(pl.col("a").list.concat(pl.col("b")))

- case: a_container_beside_an_unchecked_column_answers_for_every_kind
  main: |
    from typing import Literal

    import polars as pl
    from astrolabe import Array, Columns, List, TypedDataFrame, Unchecked, column

    class FrameSchema(Columns):
        b: pl.Boolean
        l: List[pl.Int16]
        a: Array[pl.Int16, Literal[1]]
        q: Unchecked

    df: TypedDataFrame[FrameSchema]

    # q can be Null, which gives List(Int16), or List(Float32), which gives
    # List(Float32), so no one type holds.
    reveal_type(df.select(pl.when(pl.col("b")).then(pl.col("l")).otherwise(pl.col("q"))))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'l': astrolabe.frame.List[astrolabe.frame.Unchecked]}, closed=True), None]"
    reveal_type(df.select(pl.coalesce(pl.col("q"), pl.col("l"))))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'q': astrolabe.frame.List[astrolabe.frame.Unchecked]}, closed=True), None]"
    reveal_type(df.select(pl.col("l").fill_null(pl.col("q"))))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'l': astrolabe.frame.List[astrolabe.frame.Unchecked]}, closed=True), None]"
    reveal_type(df.select(pl.col("a").fill_null(pl.col("q"))))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'a': astrolabe.frame.Unchecked}, closed=True), None]"
    # A member over q reads an element that no kind names.
    reveal_type(df.select(pl.col("l").fill_null(pl.col("q").first())))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'l': astrolabe.frame.List[astrolabe.frame.Unchecked]}, closed=True), None]"
    reveal_type(df.select(pl.col("l").shift(1, fill_value=pl.col("q").first())))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'l': astrolabe.frame.List[astrolabe.frame.Unchecked]}, closed=True), None]"

    Trusted = column("q", Unchecked)

    class ListSchema(Columns):
        l: List[pl.Int16]
        q: List[pl.Float32]

    lists: TypedDataFrame[ListSchema]

    # A declared Unchecked operand joins the list by the type that the frame gives it.
    def joined(q: Trusted) -> None:
        reveal_type(lists.select(pl.coalesce(pl.col("l"), q)))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'l': astrolabe.frame.List[polars.datatypes.classes.Float32]}, closed=True), None]"
        reveal_type(lists.select(pl.col("l").fill_null(q)))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'l': astrolabe.frame.List[polars.datatypes.classes.Float32]}, closed=True), None]"
        reveal_type(lists.select(pl.col("l").shift(1, fill_value=q.first())))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'l': astrolabe.frame.List[polars.datatypes.classes.Float32]}, closed=True), None]"

- case: an_expression_with_no_answer_at_any_data_type_fails_over_an_unchecked_column
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame, Unchecked

    class FrameSchema(Columns):
        q: Unchecked

    df: TypedDataFrame[FrameSchema]

    # replace_time_zone gives a Datetime, and list.first then meets it.
    df.select(pl.col("q").dt.replace_time_zone("UTC").list.first())  # E: "q" has no result type at this frame's column types: replace-time-zone operation not supported for dtype `Null`, and polars raises InvalidOperationError  [unsupported-dtype-op]
    # len_chars gives a UInt32, and dt.year then meets it.
    df.select(pl.col("q").str.len_chars().dt.year())  # E: "q" has no result type at this frame's column types: str.len_chars does not accept Null, and polars raises SchemaError  [unsupported-dtype-op]
    # The sum is a number, a list or a struct, and none of them has a time zone.
    df.select((pl.col("q") + 1).dt.replace_time_zone("UTC").list.first())  # E: "q" has no result type at this frame's column types: replace-time-zone operation not supported for dtype `List(Unknown)`, and polars raises InvalidOperationError  [unsupported-dtype-op]

- case: implode_over_an_unchecked_column_gives_a_list_of_unchecked
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame, Unchecked

    class FrameSchema(Columns):
        u: Unchecked
        g: pl.Int64

    df: TypedDataFrame[FrameSchema]

    # The answer is a list at every data type of u.
    reveal_type(df.select(pl.col("u").implode()))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'u': astrolabe.frame.List[astrolabe.frame.Unchecked]}, closed=True), None]"
    reveal_type(df.group_by("g").agg(pl.col("u")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'g': polars.datatypes.classes.Int64, 'u': astrolabe.frame.List[astrolabe.frame.Unchecked]}, closed=True), None]"
    reveal_type(df.select(pl.col("u").implode().list.len()))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'u': polars.datatypes.classes.UInt32}, closed=True), None]"

# A declared read of every data type over an `Unchecked` column gives the
# column back as `Unchecked`, with no report: the frame wrote `Unchecked`.
- case: a_declared_read_over_an_unchecked_column_gives_it_back
  main: |
    import polars as pl
    from astrolabe import Columns, EveryDType, TypedDataFrame, Unchecked, column

    Loose = column("p", EveryDType)

    class Opaque(Columns):
        p: Unchecked

    def picked(df: TypedDataFrame[Opaque], loose: Loose) -> None:
        reveal_type(df.select(loose))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict(main.Opaque, {'p': astrolabe.frame.Unchecked}, closed=True), None]"
