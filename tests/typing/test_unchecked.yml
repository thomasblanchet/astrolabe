# `Unchecked` is the data type of a column whose name is known and whose
# data type is not, as `typing.Any` is for a value. A column gets it in
# two ways:
#
# 1. The user writes it, for example `payload: Unchecked` in a `Columns`
#    class.
# 2. An operation gives it where it knows the name of an output column
#    and not its data type. The other columns keep their own types.
#
# An operation on an `Unchecked` column gives `Unchecked` again, with no
# error, also for a method that only some data types allow (`.round()`).

- case: unchecked_column_can_be_declared_manually
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame, Unchecked

    class FrameSchema(Columns):
        id: pl.Int64
        payload: Unchecked

    Frame = TypedDataFrame[FrameSchema]
    df: Frame
    reveal_type(df.select("payload"))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'payload': astrolabe.frame.Unchecked}, closed=True), None]"

