  main: |
    from typing import Literal
    import polars as pl
    import datetime
    from astrolabe import Columns, TypedDataFrame

    class FrameSchema(Columns):
        a: pl.Int64

    # A time_unit no literal supplies leaves the unit unknown: the
    # output keeps its name under Unchecked instead of losing the
    # whole result.
    Frame = TypedDataFrame[FrameSchema]

    df: Frame

    def use(unit: Literal["ms", "us"]) -> None:
