- case: select_datetime_range_with_tz_aware_expr_operands_infers_the_real_zone
  main: |
    from typing import Literal
    import polars as pl
    from astrolabe import Columns, Datetime, TypedDataFrame

    class FrameSchema(Columns):
        a: Datetime[Literal["ns"], Literal["UTC"]]
        b: Datetime[Literal["ns"], Literal["UTC"]]

    # time_zone omitted infers the real zone from start/end, confirmed
    # against real polars 1.43.2 -- no longer hardcoded to None. Both
    # operands share the same Unit too, so it stays unchanged.
    # start's own name ("a") wins, the same leftmost-name convention
    # every other operation in this project follows, confirmed
    # empirically -- the "datetime"-shaped name only applies when no
    # operand carries a real name of its own (see this file's own
    # select_datetime_range_with_expr_start_narrows_to_datetime_name
    # case, using pl.datetime(...), which has none).
    Frame = TypedDataFrame[FrameSchema]

    df: Frame

    class NarrowedSchema(Columns):
        a: Datetime[Literal["ns"], Literal["UTC"]]

    narrowed: TypedDataFrame[NarrowedSchema] = df.select(pl.datetime_range(pl.col("a").first(), pl.col("b").first()))

- case: select_datetime_range_with_options_beside_column_bounds_sets_them
  main: |
    import datetime
    from typing import Literal
    import polars as pl
    from astrolabe import Columns, Datetime, TypedDataFrame

    class FrameSchema(Columns):
        a: Datetime[Literal["ns"], Literal["UTC"]]
        b: Datetime[Literal["ns"], Literal["UTC"]]
        d: pl.Date
        e: pl.Date

    # An option sets its parameter of the joined bounds, and the other
    # parameter comes from the bounds. Two Date bounds count in
    # microseconds.
    Frame = TypedDataFrame[FrameSchema]

    df: Frame
    reveal_type(df.select(pl.datetime_range(pl.col("a").first(), pl.col("b").first(), time_unit="ms")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'a': astrolabe.frame.Datetime[Literal['ms'], Literal['UTC']]}, closed=True), None]"
    reveal_type(df.select(pl.datetime_ranges(pl.col("a"), pl.col("b"), time_zone="Asia/Tokyo")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'a': astrolabe.frame.List[astrolabe.frame.Datetime[Literal['ns'], Literal['Asia/Tokyo']]]}, closed=True), None]"
    reveal_type(df.select(pl.datetime_ranges(pl.col("d"), pl.col("e"), time_unit="ms")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'d': astrolabe.frame.List[astrolabe.frame.Datetime[Literal['ms'], None]]}, closed=True), None]"
    reveal_type(df.select(pl.datetime_ranges(pl.col("d"), pl.col("e"), time_zone="UTC")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'d': astrolabe.frame.List[astrolabe.frame.Datetime[Literal['us'], Literal['UTC']]]}, closed=True), None]"

