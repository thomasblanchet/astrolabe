- case: select_datetime_range_narrows
  main: |
    from typing import Literal
    import polars as pl
    import datetime
    from astrolabe import Columns, Datetime, TypedDataFrame

    class FrameSchema(Columns):
        a: pl.Int64

    Frame = TypedDataFrame[FrameSchema]

    df: Frame

    class NarrowedSchema(Columns):
        literal: Datetime[Literal["us"], None]

    # A TypedDict-backed schema compares each column's own dtype
    # invariantly (real TypedDict/Mapping value semantics), unlike the
    # old tuple-backed schema's incidental per-item covariance: the
    # declared type must name the exact narrowed Datetime[Unit, Zone]
    # marker, not the bare, unparametrized pl.Datetime a subclass
    # relationship alone used to let through.
    narrowed: TypedDataFrame[NarrowedSchema] = df.select(pl.datetime_range(datetime.datetime(2020, 1, 1), datetime.datetime(2020, 1, 3)))

