# The range builders: `date_range`/`datetime_range`/`time_range`/
# `int_range` and their `_ranges` plural forms. Each names its output
# after an expression start bound, else `literal`, reads every column
# the bounds read, and answers a fixed type: `int_range` reads an
# optional `dtype=` option, `datetime_range` its `time_unit=` and
# `time_zone=` options, and the plural forms wrap the answer in
# `List[D]`.

- case: select_int_range_narrows_to_default_int64
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class FrameSchema(Columns):
        a: pl.Int64

    Frame = TypedDataFrame[FrameSchema]

    df: Frame

    class NarrowedSchema(Columns):
        a: pl.Int64
        literal: pl.Int64

    narrowed: TypedDataFrame[NarrowedSchema] = df.with_columns(pl.int_range(0, 3))

