- case: a_function_of_pl_over_several_expressions_has_the_type_of_its_return_dtype
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class Schema(Columns):
        k: pl.Int64
        a: pl.Int64
        b: pl.Float64

    df: TypedDataFrame[Schema]
    # A fold is named after its accumulator, and the other functions after
    # their first expression. A cumulative fold gives a field for each expression.
    reveal_type(df.select(pl.fold(pl.lit(0.0), lambda acc, x: acc + x, [pl.col("a"), pl.col("b")], return_dtype=pl.Float64)))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'literal': polars.datatypes.classes.Float64}, closed=True), None]"
    reveal_type(df.select(pl.reduce(lambda acc, x: acc + x, [pl.col("b"), pl.col("a")], return_dtype=pl.Float64)))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'b': polars.datatypes.classes.Float64}, closed=True), None]"
    # A name stands for its column, and a value for a literal.
    reveal_type(df.select(pl.reduce(lambda acc, x: acc + x, ["b", "a"], return_dtype=pl.Float64)))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'b': polars.datatypes.classes.Float64}, closed=True), None]"
    reveal_type(df.select(pl.fold(0.0, lambda acc, x: acc + x, ["a", "b"], return_dtype=pl.Float64)))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'literal': polars.datatypes.classes.Float64}, closed=True), None]"
    reveal_type(df.select(pl.cum_fold(pl.lit(0.0), lambda acc, x: acc + x, [pl.col("a"), pl.col("b")], return_dtype=pl.Float64)))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'cum_fold': astrolabe.frame.Struct[tuple[astrolabe.frame.Column[Literal['a'], polars.datatypes.classes.Float64], astrolabe.frame.Column[Literal['b'], polars.datatypes.classes.Float64]]]}, closed=True), None]"
    # With its accumulator, the run keeps the type of the accumulator.
    reveal_type(df.select(pl.cum_fold(pl.col("a"), lambda acc, x: acc + x, [pl.col("b")], return_dtype=pl.Float64, include_init=True)))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'cum_fold': astrolabe.frame.Unchecked}, closed=True), None]"
    reveal_type(df.select(pl.cum_reduce(lambda acc, x: acc + x, [pl.col("b"), pl.col("a")], return_dtype=pl.Float64)))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'cum_reduce': astrolabe.frame.Struct[tuple[astrolabe.frame.Column[Literal['b'], polars.datatypes.classes.Float64], astrolabe.frame.Column[Literal['a'], polars.datatypes.classes.Float64]]]}, closed=True), None]"
    reveal_type(df.select(pl.map_batches([pl.col("a"), pl.col("b")], lambda s: s[0].cast(pl.Int8), return_dtype=pl.Int8)))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'a': polars.datatypes.classes.Int8}, closed=True), None]"
    reveal_type(df.select(pl.map_groups([pl.col("a")], lambda s: s[0].cast(pl.Int8), return_dtype=pl.Int8)))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'a': polars.datatypes.classes.Int8}, closed=True), None]"
    # In `agg`, the function gives a list for each group, unless it returns one value.
    reveal_type(df.group_by("k").agg(pl.fold(pl.lit(0), lambda acc, x: acc + x, [pl.col("a")], return_dtype=pl.Int64)))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'k': polars.datatypes.classes.Int64, 'literal': astrolabe.frame.List[polars.datatypes.classes.Int64]}, closed=True), None]"
    reveal_type(df.group_by("k").agg(pl.reduce(lambda acc, x: acc + x, [pl.col("a").sum()], return_dtype=pl.Int64, returns_scalar=True)))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'k': polars.datatypes.classes.Int64, 'a': polars.datatypes.classes.Int64}, closed=True), None]"
    reveal_type(df.group_by("k").agg(pl.map_batches([pl.col("a")], lambda s: s[0].sum(), return_dtype=pl.Int64, returns_scalar=True)))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'k': polars.datatypes.classes.Int64, 'a': polars.datatypes.classes.Int64}, closed=True), None]"
    # With no return_dtype=, the function decides the type.
    reveal_type(df.select(pl.map_batches([pl.col("a")], lambda s: s[0])))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'a': astrolabe.frame.Unchecked}, closed=True), None]"
    df.select(pl.fold(pl.lit(0), lambda acc, x: acc + x, [pl.col("zz")], return_dtype=pl.Int64))  # E: Unknown column "zz"  [unknown-column]
