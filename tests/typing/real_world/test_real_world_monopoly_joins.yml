- case: real_world_monopoly_cross_join_players_and_tokens_narrows
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class PlayersSchema(Columns):
        name: pl.String
        cash: pl.Int64

    Players = TypedDataFrame[PlayersSchema]

    class TokensSchema(Columns):
        monopoly_token: pl.String

    Tokens = TypedDataFrame[TokensSchema]

    players: Players
    tokens: Tokens

    class NamesSchema(Columns):
        name: pl.String

    names: TypedDataFrame[NamesSchema] = players.select(pl.col("name"))

    class ResultSchema(Columns):
        name: pl.String
        monopoly_token: pl.String

    result: TypedDataFrame[ResultSchema] = names.join(tokens, how="cross")

- case: real_world_monopoly_join_where_non_equi_narrows
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class PlayersSchema(Columns):
        name: pl.String
        cash: pl.Int64

    Players = TypedDataFrame[PlayersSchema]

    class PropsPricesSchema(Columns):
        property_name: pl.String
        cost: pl.Int64

    PropsPrices = TypedDataFrame[PropsPricesSchema]

    players: Players
    props_prices: PropsPrices

    class ResultSchema(Columns):
        name: pl.String
        cash: pl.Int64
        property_name: pl.String
        cost: pl.Int64

    # join_where() is a genuinely different method from join(), handled
    # by its own JoinWhereHook: its result is always every column from
    # both sides, regardless of the predicate, so this narrows exactly
    # like a how="cross" join would.
    result: TypedDataFrame[ResultSchema] = players.join_where(props_prices, pl.col("cash") > pl.col("cost"))
