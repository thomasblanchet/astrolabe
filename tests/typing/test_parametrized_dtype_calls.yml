- case: a_struct_of_a_field_type_in_a_variable_keeps_the_names_of_its_fields
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class Schema(Columns):
        b: pl.Int64

    def f(df: TypedDataFrame[Schema], t: pl.DataType, s: pl.Struct) -> None:
        # A field type that the checker cannot read is Unchecked, and the name stays.
        reveal_type(pl.Struct({"x": t}))  # N: Revealed type is "astrolabe.frame.Struct[tuple[astrolabe.frame.Column[Literal['x'], astrolabe.frame.Unchecked]]]"
        # The cast gives the type that t holds, so the column is Unchecked, and no field is invented.
        out = df.select(pl.col("b").cast(pl.Struct({"x": t})))
        reveal_type(out)  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'b': astrolabe.frame.Unchecked}, closed=True), None]"
        reveal_type(out.select(pl.col("b").struct.field("x")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'x': astrolabe.frame.Unchecked}, closed=True), None]"
        # A struct in a variable can hold exactly the field that the code reads.
        reveal_type(df.select(pl.col("b").cast(s)))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'b': astrolabe.frame.Unchecked}, closed=True), None]"
        reveal_type(df.select(pl.col("b").cast(s).struct.field("x")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'x': astrolabe.frame.Unchecked}, closed=True), None]"
        # Polars casts a value that is not a struct only to a struct of one field.
        df.select(pl.col("b").cast(pl.Struct({})))  # E: This expression cannot cast from Int64 to Struct({})  [invalid-cast]
