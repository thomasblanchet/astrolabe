- case: select_cast_to_parametrized_datetime_with_non_literal_unit_narrows_to_the_bare_dtype
  skip: __import__("tests.releases").releases.polars_before("2.0.0")
  main: |
    from typing import Literal
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    # unit's own declared type satisfies real polars' own TimeUnit
    # stub, so this is not a mypy [arg-type] error on its own -- but
    # its own AST node is a plain name reference, not a string literal,
    # so DtypeConstructorArgs cannot read it. The whole dtype falls back
    # to the plain, argless real Datetime instead of losing the whole
    # result: not a partially-unknown Datetime[<unknown>, ...], but not
    # unrecognized either -- the same as the old argless pl.Datetime.
    unit: Literal["ms"] = "ms"

    # Polars 2.0.0 refuses a cast of text to a Datetime, so the source
    # is a Date.
    class FrameSchema(Columns):
        s: pl.Date

    Frame = TypedDataFrame[FrameSchema]

    df: Frame
    reveal_type(df.select(pl.col("s").cast(pl.Datetime(unit))))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'s': polars.datatypes.classes.Datetime}, closed=True), None]"

