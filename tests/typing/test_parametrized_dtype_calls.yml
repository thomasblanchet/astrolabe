- case: a_cast_to_a_struct_keeps_its_fields
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class Small(Columns):
        i: pl.Int8

    df: TypedDataFrame[Small]
    # The target keeps its fields, so a later field read knows its type.
    reveal_type(df.select(pl.col("i").cast(pl.Struct({"p": pl.String}))))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'i': astrolabe.frame.Struct[tuple[astrolabe.frame.Column[Literal['p'], polars.datatypes.classes.String]]]}, closed=True), None]"
    reveal_type(df.select(pl.col("i").cast(pl.Struct({"p": pl.Int8})).struct.field("p")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'p': polars.datatypes.classes.Int8}, closed=True), None]"
    # A value that is not a struct casts only to a struct of one field.
    df.select(pl.col("i").cast(pl.Struct({"p": pl.Int8, "q": pl.Int8})))  # E: This expression cannot cast from Int8 to Struct({'p': Int8, 'q': Int8})  [invalid-cast]

- case: an_array_of_a_shape_of_several_widths_nests_an_array_for_each
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class Small(Columns):
        x: pl.Int64

    df: TypedDataFrame[Small]
    reveal_type(pl.Array(pl.Int8, (2, 3)))  # N: Revealed type is "astrolabe.frame.Array[astrolabe.frame.Array[polars.datatypes.classes.Int8, Literal[3]], Literal[2]]"
    reveal_type(pl.Array(pl.Int8, shape=(2,)))  # N: Revealed type is "astrolabe.frame.Array[polars.datatypes.classes.Int8, Literal[2]]"
    df.select(pl.col("x").cast(pl.Array(pl.Int8, (2, 3))))  # E: This expression cannot cast from Int64 to Array(Int8, shape=(2, 3))  [invalid-cast]

    # A data type in a variable stands in the target, so the error names
    # what the samples of the variable share, and no one sample.
    def f(t: pl.DataType) -> None:
        df.select(pl.col("x").cast(pl.Array(t, 2)))  # E: This expression cannot cast from Int64 to Array  [invalid-cast]

- case: an_array_with_no_shape_is_an_error
  main: |
    import polars as pl

    # polars needs the width of an array, and raises TypeError for a call
    # with no shape, or with the shape None, whatever the element.
    pl.Array(pl.Int8)  # E: pl.Array() with no shape always raises TypeError: polars needs the width of the array. Pass the shape, for example pl.Array(pl.Int64, shape=2)  [invalid-call-shape]
    pl.Array(pl.Int8, shape=None)  # E: pl.Array() with no shape always raises TypeError: polars needs the width of the array. Pass the shape, for example pl.Array(pl.Int64, shape=2)  [invalid-call-shape]
    reveal_type(pl.Array(pl.Int8, 2))  # N: Revealed type is "astrolabe.frame.Array[polars.datatypes.classes.Int8, Literal[2]]"

