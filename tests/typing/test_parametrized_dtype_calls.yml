- case: read_csv_with_dict_literal_schema_value_whose_callee_has_no_fullname_still_resolves_the_old_plain_way
  main: |
    import polars as pl

    # dtypes[0]()'s own outer call has an IndexExpr callee, which
    # carries no fullname attribute at all (unlike a lambda call's own
    # callee, which does carry one, just an empty one) --
    # ParametrizedDtypeReaders.reader_for tolerates this and this still
    # resolves through the old, plain path. A schema={...} dict literal
    # value, not a .cast(...) argument, since pl.read_csv("data.csv")
    # never actually runs against a real file, unlike .cast(...) on a
    # real receiver, which the runtime cross-check does execute.
    dtypes: list[type[pl.DataType]] = [pl.Int64]
    reveal_type(pl.read_csv("data.csv", schema={"s": dtypes[0]()}))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'s': polars.datatypes.classes.DataType}, closed=True), None]"

