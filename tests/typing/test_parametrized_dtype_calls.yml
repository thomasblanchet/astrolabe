- case: select_cast_to_variable_bound_parametrized_datetime_narrows
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class FrameSchema(Columns):
        s: pl.Date

    # The actual bug this fix targets: a call to one of the four
    # parametrized dtype classes, assigned to a plain variable first,
    # used to silently drop its own arguments (DtypeExpr's own AST-only
    # recognition only ever saw the call written inline). The
    # constructor call itself now masks its own result via
