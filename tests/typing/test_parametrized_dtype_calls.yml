    reveal_type(pl.Series("a", [1], dtype=Tagged))  # E: Tagged subclasses a data type of polars, but polars does not read it as a data type here, and raises: pass a data type of polars  [invalid-call-shape] # N: Revealed type is "astrolabe.frame.TypedSeries[Literal['a'], astrolabe.frame.Unchecked]"
