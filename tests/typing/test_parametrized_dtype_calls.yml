- case: a_data_type_class_stands_for_its_default_instance
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class FrameSchema(Columns):
        i: pl.Int64
        s: pl.String

    df: TypedDataFrame[FrameSchema]

    reveal_type(df.select(pl.col("i").cast(pl.Datetime)))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'i': astrolabe.frame.Datetime[Literal['us'], None]}, closed=True), None]"
    reveal_type(df.select(pl.col("i").cast(pl.Duration)))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'i': astrolabe.frame.Duration[Literal['us']]}, closed=True), None]"
    reveal_type(df.select(pl.lit(None, dtype=pl.Enum)))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'literal': astrolabe.frame.Enum[tuple[()]]}, closed=True), None]"
    reveal_type(df.select(pl.lit(None).cast(pl.List)))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'literal': astrolabe.frame.List[polars.datatypes.classes.Null]}, closed=True), None]"
    reveal_type(df.select(pl.lit(None).cast(pl.Array)))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'literal': astrolabe.frame.Array[polars.datatypes.classes.Null, Literal[0]]}, closed=True), None]"
    reveal_type(df.select(pl.lit(None).cast(pl.Struct)))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'literal': astrolabe.frame.Struct[tuple[()]]}, closed=True), None]"
    # A struct with no field takes no column that is not a struct.
    df.select(pl.col("i").cast(pl.Struct))  # E: This expression cannot cast from Int64 to Struct({})  [invalid-cast]
    # A class inside a nested data type takes its default too.
    reveal_type(df.select(pl.lit(None, dtype=pl.List(pl.Datetime))))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'literal': astrolabe.frame.List[astrolabe.frame.Datetime[Literal['us'], None]]}, closed=True), None]"
    reveal_type(df.select(pl.lit(None, dtype=pl.Struct({"a": pl.Duration}))))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'literal': astrolabe.frame.Struct[tuple[astrolabe.frame.Column[Literal['a'], astrolabe.frame.Duration[Literal['us']]]]]}, closed=True), None]"
    reveal_type(df.select(pl.struct(pl.col("i"), schema={"i": pl.Datetime})))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'i': astrolabe.frame.Struct[tuple[astrolabe.frame.Column[Literal['i'], astrolabe.frame.Datetime[Literal['us'], None]]]]}, closed=True), None]"
    reveal_type(df.select(pl.col("i").map_batches(lambda s: s, return_dtype=pl.Datetime)))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'i': astrolabe.frame.Datetime[Literal['us'], None]}, closed=True), None]"
    reveal_type(df.get_column("s").cast(pl.Enum))  # N: Revealed type is "astrolabe.frame.TypedSeries[Literal['s'], astrolabe.frame.Enum[tuple[()]]]"
    reveal_type(pl.Series("a", [], dtype=pl.Datetime))  # N: Revealed type is "astrolabe.frame.TypedSeries[Literal['a'], astrolabe.frame.Datetime[Literal['us'], None]]"

