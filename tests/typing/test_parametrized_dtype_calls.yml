    reveal_type(pl.Series("a", [1], dtype=Plain()))  # E: Plain subclasses a data type of polars, but polars does not read it as a data type here, and raises: pass a data type of polars  [invalid-call-shape] # N: Revealed type is "astrolabe.frame.TypedSeries[Literal['a'], astrolabe.frame.Unchecked]"
    # It ignores a subclass of List, Array or Struct, so the values decide.
    reveal_type(pl.Series("a", [1], dtype=Rows))  # N: Revealed type is "astrolabe.frame.TypedSeries[Literal['a'], astrolabe.frame.Unchecked]"
    # A class that is no data type at all is mypy's own error.
    reveal_type(pl.Series("a", [1], dtype=Box))  # N: Revealed type is "astrolabe.frame.TypedSeries[Literal['a'], astrolabe.frame.Unchecked]" # E: Argument "dtype" to "Series" has incompatible type "type[Box[T]]"; expected "DataTypeClass | DataType | None"  [arg-type]

    # Elsewhere polars reads the class by its name, and raises for a name that no kind has.
    df.select(pl.col("i").cast(Plain))  # E: Plain subclasses a data type of polars, but polars does not read it as a data type here, and raises: pass a data type of polars  [invalid-call-shape]
    pl.lit(None, dtype=Tagged)  # E: Tagged subclasses a data type of polars, but polars does not read it as a data type here, and raises: pass a data type of polars  [invalid-call-shape]
    pl.col("i").map_batches(lambda s: s, return_dtype=Plain)  # E: Plain subclasses a data type of polars, but polars does not read it as a data type here, and raises: pass a data type of polars  [invalid-call-shape]
    pl.List(Plain)  # E: Plain subclasses a data type of polars, but polars does not read it as a data type here, and raises: pass a data type of polars  [invalid-call-shape]
    df.select(cs.by_dtype(Plain))  # E: Plain subclasses a data type of polars, but polars does not read it as a data type here, and raises: pass a data type of polars  [invalid-call-shape]
