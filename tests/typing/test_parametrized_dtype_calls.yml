# DtypeExpr's own new capability: a literal call to pl.Datetime/
# pl.Duration/pl.Decimal/pl.Enum carries its own arguments into
# astrolabe's own parametrized marker, instead of the plain,
# argument-less real dtype every other dtype value expression still
# resolves to. Exercised through two of DtypeExpr's own seven real call
# sites: `.cast(dtype)` on a TypedExpr receiver (typed_expr_alias_cast.py),
# and a `schema={...}` dict literal's own values (read_schema.py). A
# bare class reference (no call at all) stands for the instance that
# polars builds for it: pl.Datetime is Datetime("us", None). The class
# pl.Decimal has no such instance inside an expression, and polars
# raises there. See the "data_type_class" cases at the end.
#
# Every one of the four constructors also masks its own call's real
# return type directly (DtypeConstructorHook, typed_dtype_constructor.py),
# the same way SelectorConstructorHook masks a polars.selectors
# constructor call: this is what lets a constructor call's own result,
# once assigned to a plain variable first, still carry the parametrized
# marker into .cast(dtype)/schema={...} -- previously a silent
# corruption (the variable's own arguments were dropped, narrowing to
# the plain, argless dtype instead). See the "_bound" cases below.

- case: select_cast_to_parametrized_datetime_narrows
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class FrameSchema(Columns):
        s: pl.Date

    # Date -> Datetime always succeeds regardless of the target's own
    # time_unit/time_zone, confirmed empirically. Int64 -> Datetime is
    # deliberately not used here: it is a silent-corruption landmine
    # (an out-of-range source value produces a silently corrupted value,
    # crashing the process on later materialization), correctly blocked
    # by CastCompatibility -- see test_cast_validity.yml's own landmine
    # cases for that behavior.
    Frame = TypedDataFrame[FrameSchema]

    df: Frame
    reveal_type(df.select(pl.col("s").cast(pl.Datetime("ms"))))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'s': astrolabe.frame.Datetime[Literal['ms'], None]}, closed=True), None]"

