- case: select_cast_to_parametrized_duration_with_extra_positional_argument_still_narrows
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class FrameSchema(Columns):
        s: pl.Int64

    # An extra positional argument beyond Duration's own single real
    # parameter has nowhere to go once DtypeConstructorArgs's own
    # positional-name iterator is exhausted, so it is silently dropped
    # rather than misread as time_unit -- real polars' own stub reports
    # its own, unrelated error for the call shape itself.
