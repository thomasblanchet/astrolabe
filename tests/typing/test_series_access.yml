- case: to_series_is_left_unmodeled
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class FrameSchema(Columns):
        a: pl.Int64
        b: pl.String

    # A schema is an unordered set of columns, never a
    # positionally-addressable sequence: there is no operation that
    # resolves a column by its numeric position, so .to_series(index)
    # is left completely unmodeled, its real stub's Series return type
    # unchanged, regardless of the index, or how concrete the receiver
    # is.
    Frame = TypedDataFrame[FrameSchema]

    df: Frame
    reveal_type(df.to_series(0))  # N: Revealed type is "polars.series.series.Series"
    reveal_type(df.to_series(-1))  # N: Revealed type is "polars.series.series.Series"
    reveal_type(df.to_series())  # N: Revealed type is "polars.series.series.Series"

- case: series_access_on_generic_rest_receiver_narrows_known_column
  main: |
    from typing import Literal
    import polars as pl
    from astrolabe import Columns, other_columns, TypedDataFrame, TypedSeries

    Rest = other_columns()

    class DfSchema(Columns):
        foo: pl.Int64

    # A declared column's own presence and dtype cannot change based on
    # what the remainder turns out to hold, so both by-name accessors
    # narrow here exactly as they would for a fully concrete receiver.
    df: TypedDataFrame[DfSchema, Rest]
    by_getitem: TypedSeries[Literal["foo"], pl.Int64] = df["foo"]
    by_get_column: TypedSeries[Literal["foo"], pl.Int64] = df.get_column("foo")

- case: series_access_by_name_on_generic_rest_receiver_errors_for_an_undeclared_name
  main: |
    import polars as pl
    from astrolabe import Columns, other_columns, TypedDataFrame

    Rest = other_columns()

    class DfSchema(Columns):
        foo: pl.Int64

    # "baz" is not declared, and can legitimately be part of the
    # remainder at the real call site, the same ambiguity
    # select/drop/rename already treat as an error by default.
    df: TypedDataFrame[DfSchema, Rest]
    df["baz"]  # E: Column "baz" is not declared and cannot be proven to exist  [undeclared-column] # N: set allow_unproven = "possible" in [tool.astrolabe] to allow this, or set [tool.astrolabe.allow_unproven_overrides] get_column = "possible"
    df.get_column("baz")  # E: Column "baz" is not declared and cannot be proven to exist  [undeclared-column] # N: set allow_unproven = "possible" in [tool.astrolabe] to allow this, or set [tool.astrolabe.allow_unproven_overrides] get_column = "possible"

- case: series_access_by_name_on_open_receiver_errors_for_a_declared_excluded_name
  main: |
    import polars as pl
    from astrolabe import Columns, other_columns, TypedDataFrame

    Rest = other_columns(without=["baz"])

    class DfSchema(Columns):
        foo: pl.Int64

    # The declaration proves the remainder never contains "baz", so it
    # is provably absent, not merely ambiguous.
    df: TypedDataFrame[DfSchema, Rest]
    df["baz"]  # E: Unknown column "baz"  [unknown-column]

