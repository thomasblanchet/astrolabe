- case: getitem_int_key_narrows_to_receiver_type
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class FrameSchema(Columns):
        a: pl.Int64

    # df[0] is a pure row selection: verified empirically it resolves
    # real polars' own bare DataFrame-returning __getitem__ overload,
    # every column unchanged.
    Frame = TypedDataFrame[FrameSchema]

    df: Frame
    narrowed: Frame = df[0]

- case: getitem_slice_key_narrows_to_receiver_type
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class FrameSchema(Columns):
        a: pl.Int64

    # df[0:2] resolves the same bare DataFrame-returning overload as
    # df[0]: a row-count change, not a schema change.
    Frame = TypedDataFrame[FrameSchema]

    df: Frame
    narrowed: Frame = df[0:2]

