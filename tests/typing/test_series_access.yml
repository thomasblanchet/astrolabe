# The two methods that produce a `pl.Series` from a `pl.DataFrame` by
# name: `__getitem__` (`df["a"]`) and `.get_column(name)`.
#
# Confirmed against real polars 1.43.2, not assumed: `df["a"]`'s
# string-key overload always returns `Series` (never a scalar or a
# `DataFrame`); `get_column`'s `default=` overload only widens to `Any`
# when `default` itself is not a `Series`. `mypy` reports the fullname
# of the class a call is accessed *through*, not the class that
# actually defines the method, confirmed by a throwaway probe plugin,
# so `TypedDataFrame` needs no override of either method for the hooks
# below to fire only on a `TypedDataFrame` receiver and leave a plain
# `pl.DataFrame` receiver untouched.
#
# `TypedLazyFrame` has neither of these two methods (`LazyFrame` has no
# `get_column` at all, and its own `__getitem__` only accepts a
# `slice`), so none of these cases touch `TypedLazyFrame`.
#
# Like every other Tier 0-3 operation's initial implementation, this
# does not extend to a still-generic (`Rest`-containing) receiver.
#
# `.to_series(index)` is left unmodeled entirely: a schema is an
# unordered set of columns, never a positionally-addressable sequence,
# so there is no sound way to resolve a column by its numeric position.
# See `to_series_is_left_unmodeled`, below.

- case: getitem_literal_str_key_narrows_to_typed_series
  main: |
    from typing import Literal
    import polars as pl
    from astrolabe import Columns, TypedDataFrame, TypedSeries

    class FrameSchema(Columns):
        a: pl.Int64
        b: pl.String

    Frame = TypedDataFrame[FrameSchema]

    df: Frame
    narrowed: TypedSeries[Literal["a"], pl.Int64] = df["a"]
    other: TypedSeries[Literal["b"], pl.String] = df["b"]

- case: getitem_final_str_key_narrows_like_inline_literal
  main: |
    from typing import Final, Literal
    import polars as pl
    from astrolabe import Columns, TypedDataFrame, TypedSeries

    # A Final-declared string variable narrows the same way the
    # equivalent inline string literal key does (see
    # getitem_literal_str_key_narrows_to_typed_series, above).
    NAME: Final = "a"

    class FrameSchema(Columns):
        a: pl.Int64
        b: pl.String

    Frame = TypedDataFrame[FrameSchema]

    df: Frame
    narrowed: TypedSeries[Literal["a"], pl.Int64] = df[NAME]

