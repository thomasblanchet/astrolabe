- case: write_parquet_with_unknown_partition_by_column_errors
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class FrameSchema(Columns):
        a: pl.Int64

    Frame = TypedDataFrame[FrameSchema]

    df: Frame
    df.write_parquet("out.parquet", partition_by="missing")  # E: Unknown column "missing"  [unknown-column]

