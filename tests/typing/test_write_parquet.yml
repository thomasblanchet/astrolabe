# Tier 10 item 4: `DataFrame`/`LazyFrame` write/sink methods -- the
# *output* half of I/O, which Tier 7 ("I/O beyond read_csv/scan_csv")
# never actually covered despite its own title. `write_csv`/
# `write_parquet`/`write_json`/`write_ndjson`/`write_ipc`/
# `write_ipc_stream`/`write_avro`/`write_excel`/`write_delta`/
# `write_database`/`write_iceberg`/`write_clipboard`, and `LazyFrame`'s
# streaming `sink_parquet`/`sink_csv`/`sink_ipc`/`sink_ndjson`/
# `sink_delta`/`sink_iceberg`/`sink_batches`, each already return their
# own correct, unnarrowed type via real polars' own stubs (`str | None`,
# `None`, or `LazyFrame | None`) with nothing for this plugin to narrow:
# none of these methods produce a `DataFrame`/`LazyFrame` whose schema
# needs tracking. `write_parquet` alone has a column-referencing
# parameter of its own worth validating: `partition_by=`, confirmed via
# `inspect.signature` to be the only one of these methods with one.
# `WriteParquetPartitionByHook` (`_hooks/write_parquet.py`) reports
# `UnknownColumnError` for a `partition_by=` name that is not one of the
# receiver's own declared columns, the same validation `join`'s `on=`
# already gets -- it never narrows the call's own real return type
# (always `None`), only adds this one validation.

- case: write_parquet_with_known_partition_by_column_succeeds
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class FrameSchema(Columns):
        a: pl.Int64
        b: pl.String

    Frame = TypedDataFrame[FrameSchema]

    df: Frame
    reveal_type(df.write_parquet("out.parquet", partition_by="a"))  # N: Revealed type is "None"

