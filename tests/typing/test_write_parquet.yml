- case: write_parquet_with_non_literal_partition_by_is_unaffected
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class FrameSchema(Columns):
        a: pl.Int64

    # A non-literal partition_by is not checked: there is nothing
    # unsound about skipping a check this plugin cannot perform
    # statically.
    Frame = TypedDataFrame[FrameSchema]

    df: Frame
    columns = ["missing"]
    reveal_type(df.write_parquet("out.parquet", partition_by=columns))  # N: Revealed type is "None"

- case: write_parquet_on_generic_receiver_is_unaffected
  main: |
    import polars as pl
    from astrolabe import Columns, other_columns, TypedDataFrame

    Rest = other_columns()

    class DfSchema(Columns):
        a: pl.Int64

    def write(
        df: TypedDataFrame[DfSchema, Rest],
    ) -> None:
        reveal_type(df.write_parquet("out.parquet", partition_by="missing"))  # N: Revealed type is "None"

- case: write_parquet_on_plain_dataframe_is_unaffected
  main: |
    import polars as pl

    df: pl.DataFrame
    reveal_type(df.write_parquet("out.parquet", partition_by="missing"))  # N: Revealed type is "None"
