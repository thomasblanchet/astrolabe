- case: concat_diagonal_relaxed_generic_column_dtype_narrows_to_unchecked
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame, Unchecked

    class Xs[T: pl.DataType](Columns):
        x: T

    class NarrowedSchema(Columns):
        x: Unchecked

    # "x"'s dtype is a real, unconstrained-beyond-DataType TypeVar in
    # a's own schema, so it is not a resolved instance to promote
    # against b's concrete Int64 -- but the column's own name is still
    # known, so only "x" itself narrows to Unchecked, not the whole
    # result (FALLBACK_AUDIT.md B3's own relaxed half).
    def merge_generic[T: pl.DataType](
        a: TypedDataFrame[Xs[T]],
        b: TypedDataFrame[Xs[pl.Int64]],
    ) -> None:
        narrowed: TypedDataFrame[NarrowedSchema] = pl.concat([a, b], how="diagonal_relaxed")

