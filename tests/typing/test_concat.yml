    from typing import Literal
    import polars as pl
    from astrolabe import Column, Columns, Struct, TypedDataFrame, Unchecked

    class LeftSchema(Columns):
        a: Struct[Column[Literal["x"], Unchecked]]

    # UncheckedCompatibility now recurses structurally into a container's
    # own type arguments: a diagonal concat's schema merge reconciles a
    # shared Struct[...] column with one Unchecked field against the
