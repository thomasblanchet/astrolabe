- case: concat_diagonal_generic_column_dtype_falls_back_to_untyped
  main: |
    from typing import Literal
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class Xs[T: pl.DataType](Columns):
        x: T

    # "x"'s dtype is a real, unconstrained-beyond-DataType TypeVar in
    # a's own schema, so it is not a resolved instance to compare
    # against b's concrete Int64 -- unlike the resolved-but-mismatched
    # case above, this cannot be proven wrong, only unknown, so plain
    # (non-relaxed) "diagonal" stays silent instead of reporting an
    # error.
    def merge_generic[T: pl.DataType](
        a: TypedDataFrame[Xs[T]],
        b: TypedDataFrame[Xs[pl.Int64]],
    ) -> None:
        reveal_type(pl.concat([a, b], how="diagonal"))  # N: Revealed type is "polars.dataframe.frame.DataFrame"

- case: concat_diagonal_mixed_frame_kind_falls_back_to_untyped
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame, TypedLazyFrame

    class LeftSchema(Columns):
        a: pl.Int64

    # Mixing a TypedDataFrame and a TypedLazyFrame item already fails
    # mypy's own type-variable solving for pl.concat's own PolarsType
    # bound, before this hook's own mixed-kind fallback ever matters.
    # This hook still recognizes each item as a frame in its own right,
    # so it widens using the first one (Left, a TypedDataFrame) rather
    # than mypy's own generic-solving fallback (the unhelpful internal
    # _TypedFrameBase base class both kinds share).
    Left = TypedDataFrame[LeftSchema]

    class RightSchema(Columns):
        b: pl.Int64

    Right = TypedLazyFrame[RightSchema]

    left: Left
    right: Right
    reveal_type(pl.concat([left, right], how="diagonal"))  # E: Value of type variable "PolarsType" of "concat" cannot be "_TypedFrameBase"  [type-var] # N: Revealed type is "polars.dataframe.frame.DataFrame"

