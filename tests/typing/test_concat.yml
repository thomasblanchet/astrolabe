- case: concat_diagonal_relaxed_unchecked_shared_column_stays_unchecked
  main: |
    from typing import Literal
    import polars as pl
    from astrolabe import Column, Columns, Struct, TypedDataFrame, Unchecked

    class LeftSchema(Columns):
        x: Unchecked

    class RightSchema(Columns):
        x: pl.Int64

    class LeftPair(Columns):
        s: Struct[Column[Literal["a"], Unchecked], Column[Literal["b"], pl.Int64]]

    class RightPair(Columns):
        s: Struct[Column[Literal["a"], pl.Int64], Column[Literal["b"], Unchecked]]

    left: TypedDataFrame[LeftSchema]
    right: TypedDataFrame[RightSchema]
    left_pair: TypedDataFrame[LeftPair]
    right_pair: TypedDataFrame[RightPair]
    # The relaxed form widens to the supertype of the two sides, which the
    # Unchecked side decides, so the column stays Unchecked.
    reveal_type(pl.concat([left, right], how="diagonal_relaxed"))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict(main.LeftSchema, {'x': astrolabe.frame.Unchecked}, closed=True), None]"
    reveal_type(pl.concat([right, left], how="diagonal_relaxed"))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'x': astrolabe.frame.Unchecked}, closed=True), None]"
    # Field by field: the strict form keeps each known field, and the relaxed
    # form keeps each Unchecked field.
    reveal_type(pl.concat([left_pair, right_pair], how="diagonal"))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'s': astrolabe.frame.Struct[tuple[astrolabe.frame.Column[Literal['a'], polars.datatypes.classes.Int64], astrolabe.frame.Column[Literal['b'], polars.datatypes.classes.Int64]]]}, closed=True), None]"
    reveal_type(pl.concat([left_pair, right_pair], how="diagonal_relaxed"))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'s': astrolabe.frame.Struct[tuple[astrolabe.frame.Column[Literal['a'], astrolabe.frame.Unchecked], astrolabe.frame.Column[Literal['b'], astrolabe.frame.Unchecked]]]}, closed=True), None]"

- case: concat_diagonal_of_structs_of_other_numbers_of_fields
  main: |
    from typing import Literal
    import polars as pl
    from astrolabe import Column, Columns, Struct, TypedDataFrame, Unchecked

    class One(Columns):
        s: Struct[Column[Literal["x"], Unchecked]]

    class Two(Columns):
        s: Struct[Column[Literal["x"], pl.Int64], Column[Literal["y"], pl.Int64]]

    one: TypedDataFrame[One]
    two: TypedDataFrame[Two]
    pl.concat([one, two], how="diagonal")  # E: pl.concat(how="diagonal") column "s" does not reconcile: Struct vs. Struct  [schema-mismatch]
    # The relaxed form joins the fields: those of the longer struct, then
    # each field of the other that it lacks, each at the common data type.
    reveal_type(pl.concat([one, two], how="diagonal_relaxed"))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'s': astrolabe.frame.Struct[tuple[astrolabe.frame.Column[Literal['x'], astrolabe.frame.Unchecked], astrolabe.frame.Column[Literal['y'], polars.datatypes.classes.Int64]]]}, closed=True), None]"

    class Three(Columns):
        s: Struct[Column[Literal["y"], pl.String], Column[Literal["x"], pl.Int32]]

    three: TypedDataFrame[Three]
    reveal_type(pl.concat([two, three], how="diagonal_relaxed"))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'s': astrolabe.frame.Struct[tuple[astrolabe.frame.Column[Literal['x'], polars.datatypes.classes.Int64], astrolabe.frame.Column[Literal['y'], polars.datatypes.classes.String]]]}, closed=True), None]"

    class Four(Columns):
        s: Struct[Column[Literal["z"], pl.Int8]]

    # A field that the longer struct lacks comes after its fields.
    four: TypedDataFrame[Four]
    reveal_type(pl.concat([four, two], how="diagonal_relaxed"))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'s': astrolabe.frame.Struct[tuple[astrolabe.frame.Column[Literal['x'], polars.datatypes.classes.Int64], astrolabe.frame.Column[Literal['y'], polars.datatypes.classes.Int64], astrolabe.frame.Column[Literal['z'], polars.datatypes.classes.Int8]]]}, closed=True), None]"

