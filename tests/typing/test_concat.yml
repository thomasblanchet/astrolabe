# pl.concat().
#
# how="vertical" (the default) is never narrowed to a concrete type: the
# column order a materialized Rest binding claims in a declared
# signature is never verified against the function body that produced
# it. A Rest-generic function's body only has to type-check against its
# own signature as a bare passthrough. Nothing confirms a returned Rest
# binding lands in the order its signature claims. Polars' positional
# stacking there cannot be soundly checked. It still reports
# [schema-mismatch] for a necessary-but-not-sufficient, order-independent
# check: a different number of columns, names, or dtypes across the
# frames. Two frames with the *same* columns in a *different* order are,
# deliberately, no longer flagged. The plugin cannot trust either frame's
# declared order enough to say the swap is real.
# disallow_vertical_concat (default False, so unreachable from this
# sandboxed file, see test_disallow_vertical_concat_integration.py)
# additionally disallows using how="vertical" at all.
#
# items must be a literal [...]/(...) collection. Its whole inferred
# type otherwise widens to a common supertype, losing every frame's
# schema.
#
# how="vertical_relaxed" shares "vertical"'s own order-independent
# check and its same never-narrows soundness limit, extended to also
# accept a promotable dtype pair (not just an exact match) as
# compatible.
#
# how="diagonal"/"diagonal_relaxed" are name-based, not positional, so
# they have no order-soundness problem and genuinely narrow: the result
# is the union of every frame's columns, in first-seen order, with a
# column absent from a frame filled null there (confirmed against real
# polars 1.43.2). A name declared with the same dtype by every frame
# that has it keeps that dtype. "diagonal" requires an exact dtype
# match for a name declared by more than one frame; "diagonal_relaxed"
# accepts a promotable pair instead. Falls back to the plain, erased
# pl.DataFrame/pl.LazyFrame if a shared name's dtypes cannot be
# reconciled.
#
# Dtype promotion (`vertical_relaxed`/`diagonal_relaxed` both) only
# covers a bounded, well-defined subset of real polars 1.43.2's
# promotion rules, each confirmed empirically: same-signedness integer
# widening (Int8+Int16 -> Int16, Int64+Int128 -> Int128), float
# widening (Float32+Float64 -> Float64), `Boolean` promoting to any
# numeric type, and `String` absorbing any numeric, `Boolean`,
# `Decimal`, `Datetime`, or `Enum` type -- confirmed with real
# (non-empty) data, not just an inferred schema, since `Duration` looks
# the same as those three on an empty schema but genuinely raises
# InvalidOperationError casting to `String` with real data, so it stays
# unmodeled. Two numbers take the supertype that the rules of polars
# give the pair: a signed and an unsigned integer, or an integer and a
# float, can give a third data type that neither frame holds.
#
# how="align"/"align_full"/"align_inner"/"align_left"/"align_right"
# join every frame on every column name common to all of them, then
# union the remaining columns by name -- confirmed against real polars
# 1.43.2 that all five produce the identical result *schema* for the
# same inputs, sharing "diagonal"'s own strict (never relaxed) union-
# by-name logic exactly: only which rows survive differs, a row-level
# concern this static hook does not check. Each requires at least one
# column name common to every frame (not just pairwise): real polars
# raises "'align' strategy requires at least one common column"
# otherwise.
#
# how="horizontal_extend" (the non-deprecated, stable-behavior
# replacement for bare how="horizontal", which stays deferred and
# unnarrowed) concatenates every frame's own columns side by side, in
# frame order, requiring every column name across every frame to be
# globally unique -- real polars raises "column with name '...' has
# more than one occurrence" otherwise. Row-count mismatches across
# frames are tolerated at runtime (nulls fill the gap), so they place
# no constraint on the result schema either.

- case: concat_vertical_identical_schemas_is_untyped_by_default
