- case: unnest_unchecked_column_is_refused
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame, Unchecked

    class FrameSchema(Columns):
        bar: Unchecked

    # The field names of an Unchecked column are not known, and they
    # would name the result columns, so the call is refused, as
    # `.struct.unnest()` refuses it.
    Frame = TypedDataFrame[FrameSchema]

    df: Frame
    reveal_type(df.unnest("bar"))  # E: Column "bar" is not a Struct with declared fields, cannot unnest  [wrong-column-shape] # N: Revealed type is "polars.dataframe.frame.DataFrame"

