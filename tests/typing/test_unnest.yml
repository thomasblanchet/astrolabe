- case: unnest_none_columns_with_more_columns_uses_only_more_columns
  main: |
    from typing import Literal
    import polars as pl
    from astrolabe import Column, Columns, Struct, TypedDataFrame

    class FrameSchema(Columns):
        meta: Struct[Column[Literal["a"], pl.Int64]]
        other: Struct[Column[Literal["c"], pl.Int64]]

    # columns=None combined with a non-empty *more_columns does not
    # trigger auto-detect: only "meta" is unnested, "other" is left
    # alone, confirmed against real polars 1.43.2.
    Frame = TypedDataFrame[FrameSchema]

    df: Frame

    class NarrowedSchema(Columns):
        a: pl.Int64
        other: Struct[Column[Literal["c"], pl.Int64]]

    narrowed: TypedDataFrame[NarrowedSchema] = df.unnest(None, "meta")

