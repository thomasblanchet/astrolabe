# .unnest(): unwrapping a Struct column's fields into the frame. Written
# before the corresponding get_method_hook implementation exists. This
# test is expected to fail (red) until plugin.py implements it.
#
# Scope:
# - Explicit literal string column names: a bare string, or a literal
#   list/tuple for the first `columns` positional argument, plus
#   *more_columns (the same dual shape as explode).
# - columns omitted, or explicitly None, with no *more_columns either:
#   auto-detects every Struct-typed column in the receiver's schema, in
#   the receiver's own column order (confirmed against real polars
#   1.43.2: `columns=None` combined with a non-empty *more_columns does
#   NOT auto-detect, it uses *more_columns alone; only truly nothing
#   specified anywhere triggers auto-detect. `columns=[]`, an explicit
#   empty list, is different again: it unnests nothing, on purpose, and
#   does not trigger auto-detect either).
# - Each named or auto-detected column must be Struct-typed. It replaces
#   the column with its fields, in place, in declared field order.
# - separator=, when a literal string, renames each unnested field to
#   `f"{struct_column_name}{separator}{field_name}"`, confirmed against
#   real polars 1.43.2. Omitted, or explicitly None (its own documented
#   default), keeps the bare field name.

- case: unnest_struct_column_replaces_with_fields_in_place
  main: |
    from typing import Literal
    import polars as pl
    from astrolabe import Column, Columns, Struct, TypedDataFrame

    class FrameSchema(Columns):
        foo: pl.Int64
        bar: Struct[Column[Literal["baz"], pl.String], Column[Literal["qux"], pl.Int64]]
        quux: pl.Int64

    Frame = TypedDataFrame[FrameSchema]

    df: Frame

    class NarrowedSchema(Columns):
        foo: pl.Int64
        baz: pl.String
        qux: pl.Int64
        quux: pl.Int64

    narrowed: TypedDataFrame[NarrowedSchema] = df.unnest("bar")

