    reveal_type(df.select((pl.lit(1) + pl.col("i")).alias("b").name.keep()))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'i': polars.datatypes.classes.Int64}, closed=True), None]"
