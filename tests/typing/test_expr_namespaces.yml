- case: a_date_with_no_day_parses_only_by_the_fixed_width_parser_of_polars
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class Rows(Columns):
        s: pl.String

    # Polars reads a format of fixed-width directives with a parser that
    # gives a missing day the value 1. Any other format, as one with %%,
    # and any text of another width, goes to chrono, which needs the day.
    df: TypedDataFrame[Rows]
    df.select(pl.lit("2024%01").str.to_date("%Y%%%m"))  # E: This call has no result at any frame: conversion from `str` to `date` failed, and polars raises InvalidOperationError  [invalid-call-shape]
    df.select(pl.lit("2024-1").str.to_date("%Y-%m"))  # E: This call has no result at any frame: conversion from `str` to `date` failed, and polars raises InvalidOperationError  [invalid-call-shape]
    reveal_type(df.select(pl.lit("2024-01").str.to_date("%Y-%m"), b=pl.lit("2024-Jan").str.to_date("%Y-%b")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'literal': polars.datatypes.classes.Date, 'b': polars.datatypes.classes.Date}, closed=True), None]"
    # Over a column, a format that no text fits fails at every value, and
    # polars refuses an hour with no minute before it reads the text.
    df.select(pl.col("s").str.to_date("%Y%%%m"))  # E: "s" has no result type at this frame's column types: conversion from `str` to `date` failed, and polars raises InvalidOperationError  [unsupported-dtype-op]
    df.select(pl.col("s").str.to_time("%H"))  # E: "s" has no result type at this frame's column types: conversion from `str` to `time` failed, and polars raises InvalidOperationError  [unsupported-dtype-op]
    df.select(pl.col("s").str.to_datetime("%Y-%m-%d %H"))  # E: "s" has no result type at this frame's column types: Invalid format string: Please either specify both hour and minute, or neither, and polars raises ComputeError  [unsupported-dtype-op]
    reveal_type(df.select(pl.col("s").str.to_date("%Y-%m"), b=pl.col("s").str.to_date("%Y%%%m", strict=False)))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'s': polars.datatypes.classes.Date, 'b': polars.datatypes.classes.Date}, closed=True), None]"

- case: a_parse_of_a_literal_text_by_a_format_in_a_variable_is_unchecked
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class Rows(Columns):
        s: pl.String

    # The checker tries a format in a variable at two sample texts, and
    # neither fits the text. A format that the user passes can fit it, as
    # "%Y-%m-%d" does, so the answer is Unchecked and not an error. Over
    # a column, the data decides, and a parse keeps its type.
    def f(fmt: str, df: TypedDataFrame[Rows]) -> None:
        reveal_type(pl.select(pl.lit("2020-01-01").str.to_date(fmt)))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'literal': astrolabe.frame.Unchecked}, closed=True), None]"
        reveal_type(df.select(d=pl.lit("12:00").str.strptime(pl.Time, fmt)))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'d': astrolabe.frame.Unchecked}, closed=True), None]"
        reveal_type(df.select(pl.col("s").str.to_date(fmt)))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'s': polars.datatypes.classes.Date}, closed=True), None]"
