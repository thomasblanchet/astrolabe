    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class FrameSchema(Columns):
        a: pl.Int64
        b: pl.Boolean
        c: pl.Int64
        g: pl.Int64
        y: pl.Int64

    df: TypedDataFrame[FrameSchema]
    # A column that steers a literal is the first column that polars meets.
    reveal_type(df.select(pl.lit(1).over("g").name.keep()))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'g': polars.datatypes.classes.Int32}, closed=True), None]"
    reveal_type(df.select(pl.lit(1).filter(pl.col("b")).name.keep()))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'b': polars.datatypes.classes.Int32}, closed=True), None]"
    reveal_type(df.select((pl.lit(1).over("g") + pl.col("a")).name.keep()))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'g': polars.datatypes.classes.Int64}, closed=True), None]"
    reveal_type(df.select(pl.len().over("g").name.keep()))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'g': polars.datatypes.classes.UInt32}, closed=True), None]"
    reveal_type(df.select(pl.lit(1).replace(pl.col("c"), 2).name.keep()))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'c': polars.datatypes.classes.Int32}, closed=True), None]"
    # A field read, a builder, a range and a horizontal keep the first column of their operands.
    reveal_type(df.select(pl.struct(pl.col("a"), pl.col("c")).struct.field("c").name.keep()))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'a': polars.datatypes.classes.Int64}, closed=True), None]"
    reveal_type(df.select(pl.date(pl.col("y"), 1, 1).name.keep()))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'y': polars.datatypes.classes.Date}, closed=True), None]"
    reveal_type(df.select(pl.int_range(0, pl.col("c").max()).name.keep()))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'c': polars.datatypes.classes.Int64}, closed=True), None]"
    reveal_type(df.select(pl.sum_horizontal(pl.lit(1), pl.col("a")).name.keep()))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'a': polars.datatypes.classes.Int64}, closed=True), None]"
    # Two steering columns at once lose their order, so the kept name is unknown.
    reveal_type(pl.lit(1).over("g", "c"))  # N: Revealed type is "astrolabe.expr.TypedExpr[astrolabe.expr.Deferred[Literal["pl.lit(1).over('g', 'c')"]]]"
    reveal_type(df.select(pl.lit(1).over("g", "c").name.keep()))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'g': polars.datatypes.classes.Int32}, closed=True), None]"
    # A chain that a literal begins keeps the first column of a later value.
    reveal_type(df.select(pl.when(pl.col("b")).then(1).otherwise(pl.col("a")).name.keep()))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'a': polars.datatypes.classes.Int64}, closed=True), None]"

