- case: a_field_name_with_only_one_anchor_is_a_plain_name
  main: |
    from typing import Literal
    import polars as pl
    from astrolabe import Column, Columns, Struct, TypedDataFrame

    class Tagged(Columns):
        s: Struct[Column[Literal["price$"], pl.Float64], Column[Literal["^tag"], pl.String]]

    df: TypedDataFrame[Tagged]
    # polars reads a name as a pattern only if it starts with `^` and ends
    # with `$`. A name with one of the two is a plain field name.
    reveal_type(df.select(pl.col("s").struct.field("price$")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'price$': polars.datatypes.classes.Float64}, closed=True), None]"
