# The fit: calls to user functions whose frame parameters carry a
# declared remainder. A closed argument binds the declaration to its
# own leftover columns and every requirement is decided by
# inspection; an open argument binds its own remainder slot and the
# requirements are proven from that slot's record. The declared
# return is evaluated under the binding.

- case: fit_worked_example_closed_caller_gets_a_fully_known_frame
  main: |
    from typing import Literal
    import polars as pl
    from astrolabe import Columns, Minus, TypedDataFrame, other_columns

    class Trades(Columns):
        symbol: pl.String
        price: pl.Float64
        quantity: pl.Int64

    class TradesWithNotional(Columns):
        symbol: pl.String
        price: pl.Float64
        quantity: pl.Int64
        notional: pl.Float64

    Anything = other_columns()

    def add_notional(
        df: TypedDataFrame[Trades, Anything],
    ) -> TypedDataFrame[TradesWithNotional, Minus[Anything, Literal["notional"]]]:
        return df.with_columns(notional=pl.col("price") * pl.col("quantity"))

    class Blotter(Columns):
        symbol: pl.String
        price: pl.Float64
        quantity: pl.Int64
        venue: pl.String
        trader: pl.String

    # The caller's two extra columns survive the call, and the result
    # is a fully known frame: the remainder was bound to
    # {venue, trader}, minus "notional" leaves them untouched, and
    # the splice closes the frame.
    blotter: TypedDataFrame[Blotter]
    reveal_type(add_notional(blotter))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'symbol': polars.datatypes.classes.String, 'price': polars.datatypes.classes.Float64, 'quantity': polars.datatypes.classes.Int64, 'notional': polars.datatypes.classes.Float64, 'trader': polars.datatypes.classes.String, 'venue': polars.datatypes.classes.String}, closed=True), None]"

- case: fit_worked_example_composition_propagates_requirement_and_effect
  main: |
    from typing import Literal
    import polars as pl
    from astrolabe import Columns, Minus, TypedDataFrame, other_columns

    class Trades(Columns):
        symbol: pl.String
        price: pl.Float64

    class TradesWithNotional(Columns):
        symbol: pl.String
        price: pl.Float64
        notional: pl.Float64

    class SectorRef(Columns):
        symbol: pl.String
        sector: pl.String

    class Enriched(Columns):
        symbol: pl.String
        price: pl.Float64
        notional: pl.Float64
        sector: pl.String

    Anything = other_columns()
    NoSector = other_columns(without=["sector"])

    def add_notional(
        df: TypedDataFrame[Trades, Anything],
    ) -> TypedDataFrame[TradesWithNotional, Minus[Anything, Literal["notional"]]]:
        raise NotImplementedError

    def add_sector(
        df: TypedDataFrame[TradesWithNotional, NoSector],
        ref: TypedDataFrame[SectorRef],
    ) -> TypedDataFrame[Enriched, NoSector]:
        return df.join(ref, on="symbol")

    # The requirement propagates outward: enrich needs whatever
    # add_sector needs, and the effect propagates too. The body
    # type-checks against the declared return with no cast, because
    # the evaluated call's remainder is the same canonical type.
    def enrich(
        df: TypedDataFrame[Trades, NoSector],
        ref: TypedDataFrame[SectorRef],
    ) -> TypedDataFrame[Enriched, Minus[NoSector, Literal["notional"]]]:
        return add_sector(add_notional(df), ref)

