- case: a_column_of_an_abstract_data_type_fits_by_its_family
  main: |
    import polars as pl
    import polars.selectors as cs
    from polars.datatypes import FloatType
    from astrolabe import Columns, NumericType, TypedDataFrame, other_columns

    Anything = other_columns()
    Nums = other_columns(all_of=NumericType)
    Every = other_columns(all_of=pl.DataType)

    class Trades(Columns):
        price: pl.Float64

    class Wide(Columns):
        price: pl.Float64
        anyd: pl.DataType
        fl: FloatType

    def need(df: TypedDataFrame[Trades, Anything]) -> None: ...
    def need_nums(df: TypedDataFrame[Trades, Nums]) -> None: ...

    def f(wide: TypedDataFrame[Wide], every: TypedDataFrame[Trades, Every]) -> None:
        # A remainder that requires nothing holds a column of any data type.
        need(wide)
        # A numeric remainder holds a FloatType column, and not a DataType one.
        need_nums(wide)  # E: Remainder "Nums" must not contain a column of type "DataType"  [forbidden-column]
        # all_of=pl.DataType holds every column, so a selection can pick from it.
        reveal_type(every.select(cs.numeric()))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict(main.Trades, {'price': polars.datatypes.classes.Float64}, closed=True), astrolabe.remainder.Only[main.Every, astrolabe.remainder.OfType[polars.datatypes.classes.NumericType]]]"

- case: a_call_with_one_closed_and_one_open_frame_keeps_each_in_its_own_terms
  main: |
    from typing import Literal
    import polars as pl
    from astrolabe import Both, Columns, other_columns, Suffixed, TypedDataFrame

    R1 = other_columns()
    R2 = other_columns()
    Mine = other_columns()

    class A(Columns):
        a: pl.Int64

    class B(Columns):
        b: pl.Int64

    class Full(Columns):
        a: pl.Int64
        x: pl.String

    def left_only(
        left: TypedDataFrame[A, R1],
        right: TypedDataFrame[B, R2],
    ) -> TypedDataFrame[A, R1]:
        return left

    def joined(
        left: TypedDataFrame[A, R1],
        right: TypedDataFrame[B, R2],
    ) -> TypedDataFrame[A, Both[R1, R2]]:
        raise NotImplementedError

    def suffixed(
        left: TypedDataFrame[A, R1],
        right: TypedDataFrame[B, R2],
    ) -> TypedDataFrame[A, Suffixed[Both[R1, R2], Literal["_x"]]]:
        raise NotImplementedError

    closed: TypedDataFrame[Full]
    open_b: TypedDataFrame[B, Mine]
    # The closed frame's extra column "x" is known by name.
    reveal_type(left_only(closed, open_b))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'a': polars.datatypes.classes.Int64, 'x': polars.datatypes.classes.String}, closed=True), None]"
    # The open frame's remainder "Mine" stays a remainder, without the declared "x".
    reveal_type(joined(closed, open_b))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'a': polars.datatypes.classes.Int64, 'x': polars.datatypes.classes.String}, closed=True), astrolabe.remainder.Minus[main.Mine, Literal['x']]]"
    # An effect over the union applies to both halves.
    reveal_type(suffixed(closed, open_b))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'a': polars.datatypes.classes.Int64, 'x_x': polars.datatypes.classes.String}, closed=True), astrolabe.remainder.Suffixed[astrolabe.remainder.Minus[main.Mine, Literal['x']], Literal['_x']]]"
