- case: fit_disjointness_between_two_open_arguments
  main: |
    from typing import Literal
    import polars as pl
    from astrolabe import Both, Columns, TypedDataFrame, other_columns

    class Keys(Columns):
        k: pl.Int64

    L = other_columns()
    R = other_columns(disjoint_from=L)

    def merge(
        left: TypedDataFrame[Keys, L], right: TypedDataFrame[Keys, R]
    ) -> TypedDataFrame[Keys, Both[L, R]]:
        raise NotImplementedError

    # Two caller declarations whose records prove disjointness
    # satisfy R's promise; two that cannot leave it unproven.
    A = other_columns(only_prefix="a_")
    B = other_columns(only_prefix="b_")
    one: TypedDataFrame[Keys, A]
    two: TypedDataFrame[Keys, B]
    reveal_type(merge(one, two))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict(main.Keys, {'k': polars.datatypes.classes.Int64}, closed=True), astrolabe.remainder.Both[main.A, main.B]]"

    C = other_columns()
    D = other_columns()
    three: TypedDataFrame[Keys, C]
    four: TypedDataFrame[Keys, D]
    merge(three, four)  # E: The argument's own remainder does not prove the requirements of "R". Declare the missing requirement on the argument's own remainder  [forbidden-column] # N: set allow_unproven = "asserted" in [tool.astrolabe] to allow this, or set [tool.astrolabe.allow_unproven_overrides] fit = "asserted"

