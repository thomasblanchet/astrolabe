- case: fit_split_slot_proves_what_every_part_proves
  main: |
    import polars as pl
    from astrolabe import Columns, SplitColumns, TypedDataFrame, other_columns

    class Keys(Columns):
        k: pl.Int64

    NoSector = other_columns(without=["sector"])
    A = other_columns(all_of=pl.Int64, without=["sector"])
    B = other_columns(without=["sector"])
    Open = other_columns()

    def add_sector(
        df: TypedDataFrame[Keys, NoSector],
    ) -> TypedDataFrame[Keys, NoSector]:
        raise NotImplementedError

    # The parts hold the whole remainder, and each part proves "sector" absent.
    df: TypedDataFrame[Keys, SplitColumns[A, B]]
    add_sector(df)

    # One part can hold "sector", so the split does not prove it absent.
    loose: TypedDataFrame[Keys, SplitColumns[A, Open]]
