- case: fit_an_open_argument_that_permits_no_column_proves_every_relation
  main: |
    from typing import Literal
    import polars as pl
    from astrolabe import Columns, NumericType, TypedDataFrame, other_columns

    class Keys(Columns):
        k: pl.Int64

    L = other_columns(without_suffix="_prev")
    R = other_columns(within=L)
    D = other_columns(disjoint_from=L)

    def compare(
        current: TypedDataFrame[Keys, L], previous: TypedDataFrame[Keys, R]
    ) -> None:
        raise NotImplementedError

    def apart(current: TypedDataFrame[Keys, L], other: TypedDataFrame[Keys, D]) -> None:
        raise NotImplementedError

    class Wide(Columns):
        k: pl.Int64
        price: pl.Float64

    # A remainder whose names are all absent, or whose type set is
    # empty, holds no column for any caller, so it is within every
    # remainder and disjoint from every remainder (T-12).
    NoName = other_columns(only=[])
    NoType = other_columns(all_of=NumericType, none_of=NumericType)
    wide: TypedDataFrame[Wide]
    no_name: TypedDataFrame[Keys, NoName]
    no_type: TypedDataFrame[Keys, NoType]
    compare(wide, no_name)
    compare(wide, no_type)
    apart(wide, no_type)

