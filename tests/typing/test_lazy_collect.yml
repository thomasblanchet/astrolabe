- case: collect_with_non_literal_background_still_reports_real_polars_overload_error
  main: |
    import polars as pl
    from astrolabe import Columns, TypedLazyFrame

    class LzFrameSchema(Columns):
        foo: pl.Int64

    LzFrame = TypedLazyFrame[LzFrameSchema]

    lf: LzFrame
    flag: bool
    lf.collect(background=flag)  # E: No overload variant of "collect" of "LazyFrame" matches argument type "bool"  [call-overload] # N: Possible overload variants: # NR:     def collect\(self, \*, .*, background: Literal\[True\], .*\) -> InProcessQuery$ # NR:     def collect\(self, \*, .*, background: Literal\[False\] = \.\.\., .*\) -> DataFrame$

