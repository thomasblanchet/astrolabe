# `.lazy()` / `.collect()`: converting between TypedDataFrame and
# TypedLazyFrame. Written before the corresponding `LazyHook`/
# `CollectHook` exist. This test is expected to fail (red) until
# plugin.py registers them.
#
# Confirmed against the installed real polars 1.43.2 via
# inspect.signature, not assumed: `pl.DataFrame.lazy(self) -> LazyFrame`
# and `pl.LazyFrame.collect(...) -> DataFrame | InProcessQuery` both
# declare a concrete, erased return type, not `Self`. Before this file's
# hooks existed, `TypedDataFrame[Columns].lazy()` erased straight to
# plain `pl.LazyFrame`, and `.collect()` erased to plain `pl.DataFrame`,
# confirmed with a real mypy run.
#
# Neither gets a `frame.py` override: `Columns` alone cannot be written
# as `TypedLazyFrame[Columns]` inside `TypedDataFrame`'s own method
# bodies, confirmed empirically. `FrameTypeHook`
# (`_hooks/type_analysis.py`) requires every `TypedDataFrame[...]`/
# `TypedLazyFrame[...]` argument to be a `Column[...]` or one
# remainder item; a frame class's own bare `Columns` type parameter,
# standing for the whole already-resolved schema tuple, matches
# neither shape and is rejected with `[marker-arg]`.
# So, like `join`, both operations rely entirely on a
# real method hook, with no override in `frame.py`, confirmed
# empirically (a throwaway debug plugin) that `ctx.type` still resolves
# to the fully-parametrized receiver either way, matching this
# project's own documented finding that a pass-through override is
# never required for that. `Frame.other_kind(plugin)`
# (`_hooks/domain/frame.py`) does the actual conversion: it looks up
# the other frame kind's `TypeInfo` via `Plugin.lookup_fully_qualified`
# (the one call in this codebase confirmed reliable for a genuinely
# fresh lookup) and rebuilds an `Instance` of it, carrying the same
# schema arguments over unchanged, concrete or still Rest-generic alike.
#
# `.collect()` cannot simply always narrow, the way `.lazy()` does: real
# polars' own `LazyFrame.collect` is *already* overloaded on
# `background`'s literal value, `background=True` returning
# `InProcessQuery`, an unrelated class, not a `DataFrame` at all
# (confirmed empirically: `lf.collect(background=True)` returns a real
# `polars.lazyframe.in_process.InProcessQuery` instance). `CollectHook`
# recognizes which arm mypy's own overload resolution already picked by
# reading `ctx.default_return_type`'s class, narrowing only when it is
# exactly the plain `DataFrame` overload's result, and passing every
# other case (`InProcessQuery`, or a non-literal `background`'s own
# error-recovery type) through unchanged. A non-literal `background`
# value is not a new gap this plugin introduces: real, unmodified
# `pl.LazyFrame.collect(background=some_bool)` already reports its own
# `[call-overload]` error with no astrolabe plugin involved at all
# (confirmed empirically), since neither of polars' own two overloads
# accepts a plain, non-literal `bool`. `CollectHook` does not, and
# structurally cannot, suppress that pre-existing mypy error: the error
# is reported by mypy's own overload resolution, before and independent
# of what our method hook returns.

- case: lazy_narrows_to_typed_lazyframe
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame, TypedLazyFrame

    class FrameSchema(Columns):
        foo: pl.Int64

    Frame = TypedDataFrame[FrameSchema]

    df: Frame
    narrowed: TypedLazyFrame[FrameSchema] = df.lazy()

- case: lazy_narrows_to_typed_lazyframe_on_open_receiver
  main: |
    import polars as pl
    from astrolabe import Columns, other_columns, TypedDataFrame, TypedLazyFrame

    Rest = other_columns()

    class DfSchema(Columns):
        foo: pl.Int64

    def func(
        df: TypedDataFrame[DfSchema, Rest],
    ) -> TypedLazyFrame[DfSchema, Rest]:
        return df.lazy()

