- case: a_lazy_frame_plans_a_later_step_at_the_stored_type
  main: |
    from typing import Literal

    import polars as pl
    from astrolabe import Columns, Decimal, TypedDataFrame, TypedLazyFrame

    class Rows(Columns):
        i8: pl.Int8
        dec: Decimal[Literal[10], Literal[2]]

    df: TypedDataFrame[Rows]
    lf: TypedLazyFrame[Rows]
    planned = lf.with_columns(d=pl.col("i8") * pl.col("dec"))
    reveal_type(planned)  # N: Revealed type is "astrolabe.frame.TypedLazyFrame[TypedDict({'i8': polars.datatypes.classes.Int8, 'dec': astrolabe.frame.Decimal[Literal[10], Literal[2]], 'd': astrolabe.frame.Planned[astrolabe.frame.Decimal[Literal[38], Literal[2]], astrolabe.frame.Decimal[Literal[10], Literal[2]]]}, closed=True), None]"
    reveal_type(planned.collect())  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'i8': polars.datatypes.classes.Int8, 'dec': astrolabe.frame.Decimal[Literal[10], Literal[2]], 'd': astrolabe.frame.Decimal[Literal[38], Literal[2]]}, closed=True), None]"
    reveal_type(planned.with_columns(o=pl.col("i8").fill_null(pl.col("d"))).collect())  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'i8': polars.datatypes.classes.Int8, 'dec': astrolabe.frame.Decimal[Literal[10], Literal[2]], 'd': astrolabe.frame.Decimal[Literal[38], Literal[2]], 'o': astrolabe.frame.Decimal[Literal[10], Literal[2]]}, closed=True), None]"
    eager = df.with_columns(d=pl.col("i8") * pl.col("dec"))
    reveal_type(eager.with_columns(o=pl.col("i8").fill_null(pl.col("d"))))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'i8': polars.datatypes.classes.Int8, 'dec': astrolabe.frame.Decimal[Literal[10], Literal[2]], 'd': astrolabe.frame.Decimal[Literal[38], Literal[2]], 'o': astrolabe.frame.Decimal[Literal[38], Literal[2]]}, closed=True), None]"

- case: a_declared_selection_over_a_lazy_frame_keeps_the_stored_type
  main: |
    import polars as pl
    import polars.selectors as cs
    from astrolabe import Columns, Planned, TypedLazyFrame, same, typed_selection

    class Rows(Columns):
        d: Planned[pl.Float64, pl.Float32]

    Numbers = typed_selection(cs.numeric(), gives=same)

    # The lazy frame plans the selection at the stored type, Float32, as
    # it plans cs.numeric() written in place.
    def picked(lf: TypedLazyFrame[Rows], sel: Numbers) -> None:
        reveal_type(lf.select(sel.abs()))  # N: Revealed type is "astrolabe.frame.TypedLazyFrame[TypedDict(main.Rows, {'d': astrolabe.frame.Planned[polars.datatypes.classes.Float64, polars.datatypes.classes.Float32]}, closed=True), None]"
        reveal_type(lf.select(sel))  # N: Revealed type is "astrolabe.frame.TypedLazyFrame[TypedDict(main.Rows, {'d': astrolabe.frame.Planned[polars.datatypes.classes.Float64, polars.datatypes.classes.Float32]}, closed=True), None]"
        reveal_type(lf.select(cs.numeric().abs()))  # N: Revealed type is "astrolabe.frame.TypedLazyFrame[TypedDict(main.Rows, {'d': astrolabe.frame.Planned[polars.datatypes.classes.Float64, polars.datatypes.classes.Float32]}, closed=True), None]"

- case: a_declared_planned_column_plans_a_later_step_at_its_stored_type
  main: |
    from typing import Literal

    import polars as pl
    from astrolabe import Columns, Decimal, Planned, TypedLazyFrame, column

    Wide = Decimal[Literal[38], Literal[2]]
    Narrow = Decimal[Literal[10], Literal[2]]

    class Rows(Columns):
        i8: pl.Int8
        dec: Narrow

    class Stored(Columns):
        i8: pl.Int8
        dec: Narrow
        d: Planned[Wide, Narrow]

    lf: TypedLazyFrame[Rows]
    stored: TypedLazyFrame[Stored] = lf.with_columns(d=pl.col("i8") * pl.col("dec"))
    reveal_type(stored.select(o=pl.col("i8").fill_null(pl.col("d"))))  # N: Revealed type is "astrolabe.frame.TypedLazyFrame[TypedDict({'o': astrolabe.frame.Decimal[Literal[10], Literal[2]]}, closed=True), None]"

    # A declared column that reads such a column takes its stored type too.
    Total = column("d", Wide)

    def filled(frame: TypedLazyFrame[Stored], d: Total) -> None:
        reveal_type(frame.select(o=pl.col("i8").fill_null(d)))  # N: Revealed type is "astrolabe.frame.TypedLazyFrame[TypedDict({'o': astrolabe.frame.Decimal[Literal[10], Literal[2]]}, closed=True), None]"

    wide: TypedLazyFrame[Rows] = lf.with_columns(dec=pl.col("dec").cum_sum())  # E: Incompatible types in assignment (expression has type "TypedLazyFrame[TypedDict({'i8': Int8, 'dec': Planned[Decimal[Literal[38], Literal[2]], Decimal[Literal[10], Literal[2]]]}), None]", variable has type "TypedLazyFrame[Rows, None]")  [assignment]
