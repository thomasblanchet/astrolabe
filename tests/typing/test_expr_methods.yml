# The methods of pl.Expr over a column, read in the row context and in
# the aggregation context. An elementwise member implodes into a list
# per key inside `.agg()`, and an aggregating member gives one value
# per key. Every expected frame is confirmed against real polars.

- case: numeric_members_in_the_row_context
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class FrameSchema(Columns):
        i: pl.Int64
        f: pl.Float64

    Frame = TypedDataFrame[FrameSchema]

    df: Frame

    class NarrowedSchema(Columns):
        absolute: pl.Int64
        rounded: pl.Float64
        root: pl.Float64
        exponent: pl.Float64
        clipped: pl.Int64
        running: pl.Int64
        stepped: pl.Int64
        smoothed: pl.Float64

    narrowed: TypedDataFrame[NarrowedSchema] = df.select(
        absolute=pl.col("i").abs(),
        rounded=pl.col("f").round(1),
        root=pl.col("i").sqrt(),
        exponent=pl.col("i").exp(),
        clipped=pl.col("i").clip(0, 5),
        running=pl.col("i").cum_sum(),
        stepped=pl.col("i").diff(),
        smoothed=pl.col("i").interpolate(),
    )

