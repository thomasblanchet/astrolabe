- case: cast_refuses_a_pair_polars_refuses_for_every_value
  main: |
    import polars as pl
    import polars.selectors as cs
    from astrolabe import Columns, TypedDataFrame

    class FrameSchema(Columns):
        s: pl.String
        d: pl.Duration

    # Polars refuses String to Boolean and Duration to String for every
    # non-null value, and the report names both types. A selection
    # picks its own columns, so it says only that the picked column
    # has no result type. String to Int64 can fail on one value only,
    # so it is typed.
    Frame = TypedDataFrame[FrameSchema]
    df: Frame
    df.select(pl.col("s").cast(pl.Boolean))  # E: This expression cannot cast from String to Boolean  [invalid-cast]
    df.select(cs.string().cast(pl.Boolean))  # E: This expression cannot cast from String to Boolean  [invalid-cast]
    df.select(pl.col("d").cast(pl.String))  # E: This expression cannot cast from Duration(time_unit='us') to String  [invalid-cast]
    reveal_type(df.select(pl.col("s").cast(pl.Int64)))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'s': polars.datatypes.classes.Int64}, closed=True), None]"

- case: a_cast_of_an_object_column_to_another_type_is_refused
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class FrameSchema(Columns):
        o: pl.Object

    # Polars casts a column of Python objects only to Object, and raises
    # ComputeError for any other target where the column holds a value,
    # strict or not.
    df: TypedDataFrame[FrameSchema]
    df.select(pl.col("o").cast(pl.Int64))  # E: This expression cannot cast from Object to Int64  [invalid-cast]
    df.select(pl.col("o").cast(pl.String, strict=False))  # E: This expression cannot cast from Object to String  [invalid-cast]
    reveal_type(df.select(pl.col("o").cast(pl.Object)))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict(main.FrameSchema, {'o': polars.datatypes.classes.Object}, closed=True), None]"

