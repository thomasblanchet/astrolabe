- case: fill_nan_joins_its_receiver_and_value_as_a_chain
  main: |
    from typing import Literal
    import polars as pl
    import polars.selectors as cs
    from astrolabe import Column, Columns, Struct, TypedDataFrame

    class FrameSchema(Columns):
        i8: pl.Int8
        g: pl.Int64
        f: pl.Float32
        d: pl.Date
        s: pl.String
        st: Struct[Column[Literal["a"], pl.Int64]]

    df: TypedDataFrame[FrameSchema]

    # Polars runs `x.fill_nan(v)` as a chain of `x` and `v` over a number receiver.
    reveal_type(df.select(pl.col("i8").fill_nan(1.5)))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'i8': polars.datatypes.classes.Float64}, closed=True), None]"
    reveal_type(df.select(pl.col("i8").fill_nan(1000)))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'i8': polars.datatypes.classes.Int16}, closed=True), None]"
    reveal_type(df.select(pl.col("i8").fill_nan(pl.col("g").max())))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'i8': polars.datatypes.classes.Int64}, closed=True), None]"
    reveal_type(df.select(pl.col("f").fill_nan(1.5)))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'f': polars.datatypes.classes.Float32}, closed=True), None]"
    reveal_type(df.select(pl.col("f").fill_nan(None)))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'f': polars.datatypes.classes.Float32}, closed=True), None]"
    reveal_type(df.select(pl.lit(1).fill_nan(pl.col("d").first())))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'literal': polars.datatypes.classes.Int32}, closed=True), None]"
    reveal_type(df.select(pl.lit(1).fill_nan(pl.col("g").first())))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'literal': polars.datatypes.classes.Int64}, closed=True), None]"
    reveal_type(df.select(pl.col("i8") + pl.lit(1).fill_nan(None)))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'i8': polars.datatypes.classes.Int8}, closed=True), None]"
    reveal_type(df.select(cs.numeric().fill_nan(1.5)))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'i8': polars.datatypes.classes.Float64, 'g': polars.datatypes.classes.Float64, 'f': polars.datatypes.classes.Float32}, closed=True), None]"
    df.select(pl.col("i8").fill_nan(2**100))  # E: "i8" has no result type at this frame's column types: conversion from Int128 to Int8 failed, and polars raises InvalidOperationError  [unsupported-dtype-op]
    df.select(pl.col("s").fill_nan(pl.col("s").first()))  # E: "s" has no result type at this frame's column types: is_not_nan does not accept String, and polars raises InvalidOperationError  [unsupported-dtype-op]
    df.select(cs.by_name("d").fill_nan(1.5))  # E: "d" has no result type at this frame's column types: is_not_nan does not accept Date, and polars raises InvalidOperationError  [unsupported-dtype-op]
    reveal_type(df.select(pl.lit(1).fill_nan(2**40)))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'literal': polars.datatypes.classes.Int64}, closed=True), None]"
    reveal_type(df.select(pl.lit(1).fill_nan(pl.col("st").first())))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'literal': astrolabe.frame.Struct[tuple[astrolabe.frame.Column[Literal['a'], polars.datatypes.classes.Int64]]]}, closed=True), None]"
    df.select(pl.col("f").fill_nan())  # E: Missing positional argument "value" in call to "fill_nan" of "Expr"  [call-arg]

