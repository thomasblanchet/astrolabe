    df.select(pl.col("u").is_between(date(2020, 1, 1), pl.col("v").first()))  # E: "u" has no result type at this frame's column types: could not evaluate comparison of Datetime(time_unit='us', time_zone='UTC') and Datetime(time_unit='us', time_zone=None), and polars raises SchemaError  [unsupported-dtype-op]
    df.select(cs.by_name("u").is_between(pl.col("v").first(), pl.col("v").first()))  # E: "u" has no result type at this frame's column types: could not evaluate comparison of Datetime(time_unit='us', time_zone='UTC') and Datetime(time_unit='us', time_zone=None), and polars raises SchemaError  [unsupported-dtype-op]
    df.group_by("k").agg(pl.col("u").is_between(pl.col("v").first(), pl.col("v").first()))  # E: "u" has no result type at this frame's column types: could not evaluate comparison of Datetime(time_unit='us', time_zone='UTC') and Datetime(time_unit='us', time_zone=None), and polars raises SchemaError  [unsupported-dtype-op]
