- case: a_slice_of_no_row_casts_to_any_type
  main: |
    import polars as pl
    from astrolabe import Columns, List, TypedDataFrame

    class Rows(Columns):
        g: pl.Int64
        l: List[pl.Int64]
        t: pl.String

    df: TypedDataFrame[Rows]
    # A slice of no row holds no value, so polars casts it to any type.
    reveal_type(df.select(pl.col("l").head(0) == pl.col("t").first()))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'l': polars.datatypes.classes.Boolean}, closed=True), None]"
    df.select(pl.col("l").head(1) == pl.col("t").first())  # E: "l" has no result type at this frame's column types: cannot cast List type (inner: Int64, to: String), and polars raises InvalidOperationError  [unsupported-dtype-op]
    # In `agg`, a strict cast reads the values of each group, and another
    # cast reads the whole column, the rows that the slice drops included.
    reveal_type(df.group_by("g").agg(pl.col("t").head(0).any()))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'g': polars.datatypes.classes.Int64, 't': polars.datatypes.classes.Boolean}, closed=True), None]"
    df.group_by("g").agg(pl.col("l").head(0).ewm_mean(alpha=0.5))  # E: "l" has no result type at this frame's column types: cannot cast List type (inner: Int64, to: Float64), and polars raises InvalidOperationError  [unsupported-dtype-op]

- case: an_infinity_that_the_call_writes_is_a_value_of_the_code
  main: |
    import math

    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class Rows(Columns):
        x: pl.Float64
