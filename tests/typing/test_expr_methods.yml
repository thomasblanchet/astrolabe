    reveal_type(df.group_by("k").agg(pl.col("s").mean().over("k")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'k': polars.datatypes.classes.Int64, 's': astrolabe.frame.List[polars.datatypes.classes.String]}, closed=True), None]"
    df.select(pl.col("u").cum_sum().over("k"))  # E: "u" has no result type at this frame's column types: cannot build list with different dtypes, and polars panics  [unsupported-dtype-op]

- case: an_over_of_literal_keys_runs_over_one_group_of_the_frame
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame, TypedLazyFrame

    class FrameSchema(Columns):
        k: pl.Int64
        x: pl.Int64

    df: TypedDataFrame[FrameSchema]
    lf: TypedLazyFrame[FrameSchema]

    # Literal keys make one group of the whole frame, so the function must keep every row.
    df.select(pl.col("x").head(3).over(pl.lit(0)))  # E: "x" has no result type at this frame's column types: the length of the window expression did not match that of the group, and polars raises ShapeError  [unsupported-dtype-op]
    reveal_type(df.select(pl.col("x").head(9).over(pl.lit(0))))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'x': polars.datatypes.classes.Int64}, closed=True), None]"
    # The mapping `join` gives each row a list of its group, and checks no rows.
    reveal_type(df.select(pl.col("x").head(3).over(pl.lit(0), mapping_strategy="join")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'x': astrolabe.frame.List[polars.datatypes.classes.Int64]}, closed=True), None]"
    reveal_type(df.group_by("k").agg(pl.col("x").head(3).over(pl.lit(0), mapping_strategy="join")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'k': polars.datatypes.classes.Int64, 'x': astrolabe.frame.List[astrolabe.frame.List[polars.datatypes.classes.Int64]]}, closed=True), None]"
    # A lazy select of one expression moves its slices into the plan, so the window holds the rows of the slice.
    reveal_type(pl.col("x").head(2).over(pl.lit(0)))  # N: Revealed type is "astrolabe.expr.TypedExpr[astrolabe.expr.Deferred[Literal["pl.col('x').head(2).over(pl.lit(0))"]]]"
    reveal_type(lf.select(pl.col("x").head(2).over(pl.lit(0))))  # N: Revealed type is "astrolabe.frame.TypedLazyFrame[TypedDict({'x': polars.datatypes.classes.Int64}, closed=True), None]"
    reveal_type(lf.select(pl.col("x").slice(1, 3).over(pl.lit(0))))  # N: Revealed type is "astrolabe.frame.TypedLazyFrame[TypedDict({'x': polars.datatypes.classes.Int64}, closed=True), None]"
    lf.select(pl.col("x").head(2).over(pl.lit(0)), pl.col("k"))  # E: "x" has no result type at this frame's column types: the length of the window expression did not match that of the group, and polars raises ShapeError  [unsupported-dtype-op]
    # `first`, `last` and a slice inside a slice move too.
    reveal_type(lf.select(pl.col("x").head(2).over(pl.lit(0)).first()))  # N: Revealed type is "astrolabe.frame.TypedLazyFrame[TypedDict({'x': polars.datatypes.classes.Int64}, closed=True), None]"
    reveal_type(lf.select(pl.col("x").tail(2).over(pl.lit(0)).last()))  # N: Revealed type is "astrolabe.frame.TypedLazyFrame[TypedDict({'x': polars.datatypes.classes.Int64}, closed=True), None]"
    reveal_type(lf.select(pl.col("x").head(2).head(3).over(pl.lit(0))))  # N: Revealed type is "astrolabe.frame.TypedLazyFrame[TypedDict({'x': polars.datatypes.classes.Int64}, closed=True), None]"

