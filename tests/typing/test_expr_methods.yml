- case: a_container_fill_beside_a_scalar_kind
  main: |
    from typing import Literal

    import polars as pl
    from astrolabe import Array, Columns, Datetime, List, TypedDataFrame

    class FrameSchema(Columns):
        u: pl.UInt8
        i: pl.Int16
        s: pl.String
        b: pl.Boolean
        t: Datetime[Literal["ns"], Literal["UTC"]]
        l: List[pl.Int64]
        a: Array[pl.Int8, Literal[2]]

    df: TypedDataFrame[FrameSchema]

    # fill_null refuses a scalar kind beside a list or an array, on either side.
    df.select(pl.col("u").fill_null(pl.col("i").implode()))  # E: "u" has no result type at this frame's column types: failed to determine supertype of UInt8 and List(Int16), and polars raises SchemaError  [unsupported-dtype-op]
    df.select(pl.col("b").fill_null(pl.col("a").first()))  # E: "b" has no result type at this frame's column types: failed to determine supertype of Boolean and Array(Int8, shape=(2,)), and polars raises SchemaError  [unsupported-dtype-op]
    df.select(pl.col("l").fill_null(pl.col("i").max()))  # E: "l" has no result type at this frame's column types: failed to determine supertype of List(Int64) and Int16, and polars raises SchemaError  [unsupported-dtype-op]
    # shift keeps a number or temporal receiver beside a container fill, and refuses text.
    df.select(pl.col("s").shift(1, fill_value=pl.col("i").implode()))  # E: "s" has no result type at this frame's column types: cannot cast List type (inner: Int16, to: String), and polars raises InvalidOperationError  [unsupported-dtype-op]
    df.select(pl.col("b").shift(1, fill_value=pl.col("i").implode()))  # E: "b" has no result type at this frame's column types: fill value 'List(Int16)' is not supported, and polars raises ComputeError  [unsupported-dtype-op]
    # An array receiver refuses every fill.
    df.select(pl.col("a").shift(1, fill_value=pl.col("a").first()))  # E: "a" has no result type at this frame's column types: `shift_and_fill` operation not supported for dtype `Array(Int8, shape=(2,))`, and polars raises InvalidOperationError  [unsupported-dtype-op]
    # pl.lit(None) is a fill of the data type Null, where None is no fill.
    df.select(pl.col("a").shift(1, fill_value=pl.lit(None)))  # E: "a" has no result type at this frame's column types: `shift_and_fill` operation not supported for dtype `Array(Int8, shape=(2,))`, and polars raises InvalidOperationError  [unsupported-dtype-op]

    class NarrowedSchema(Columns):
        u: pl.UInt8
        t: Datetime[Literal["ns"], Literal["UTC"]]
        a: Array[pl.Int8, Literal[2]]
        s: pl.String

    narrowed: TypedDataFrame[NarrowedSchema] = df.select(
        pl.col("u").shift(1, fill_value=pl.col("i").implode()),
        pl.col("t").shift(1, fill_value=pl.col("i").implode()),
        pl.col("a").shift(1, fill_value=None),
        pl.col("s").shift(1, fill_value=pl.lit(None)),
    )

