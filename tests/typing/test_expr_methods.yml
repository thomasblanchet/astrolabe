- case: a_cast_from_a_container_casts_its_elements_and_its_fields
  main: |
    from typing import Literal
    import polars as pl
    import polars.selectors as cs
    from astrolabe import Array, Column, Columns, List, Struct, TypedDataFrame

    class FrameSchema(Columns):
        ls: List[pl.String]
        li: List[pl.Int64]
        ld: List[pl.Date]
        lls: List[List[pl.String]]
        a: Array[pl.Int64, Literal[2]]
        st: Struct[Column[Literal["a"], pl.String]]
        b: pl.Binary

    df: TypedDataFrame[FrameSchema]

    # Polars casts each element, so the cast needs the cast of the
    # element.
    reveal_type(df.select(pl.col("li").cast(pl.List(pl.Boolean))))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'li': astrolabe.frame.List[polars.datatypes.classes.Boolean]}, closed=True), None]"
    reveal_type(df.select(pl.col("ls").cast(pl.List(pl.Int64))))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'ls': astrolabe.frame.List[polars.datatypes.classes.Int64]}, closed=True), None]"
    df.select(pl.col("ls").cast(pl.List(pl.Boolean)))  # E: This expression cannot cast from List(String) to List(Boolean)  [invalid-cast]
    df.select(pl.col("lls").cast(pl.List(pl.List(pl.Boolean))))  # E: This expression cannot cast from List(List(String)) to List(List(Boolean))  [invalid-cast]
    df.select(pl.col("ls").cast(pl.Array(pl.Boolean, 2)))  # E: This expression cannot cast from List(String) to Array(Boolean, shape=(2,))  [invalid-cast]
    df.select(cs.by_name("ls").cast(pl.List(pl.Boolean)))  # E: This expression cannot cast from List(String) to List(Boolean)  [invalid-cast]
    # A cast inside a list refuses a number to an `Enum`, which a value
    # alone takes. Between a list and an array, polars casts the
    # physical elements, so a `Date` casts to a `Boolean`.
    df.select(pl.col("li").cast(pl.List(pl.Enum(["x"]))))  # E: This expression cannot cast from List(Int64) to List(Enum(categories=['x']))  [invalid-cast]
    reveal_type(df.select(pl.col("ld").cast(pl.Array(pl.Boolean, 1))))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'ld': astrolabe.frame.Array[polars.datatypes.classes.Boolean, Literal[1]]}, closed=True), None]"
    df.select(pl.col("a").cast(pl.Array(pl.Int64, 3)))  # E: This expression cannot cast from Array(Int64, shape=(2,)) to Array(Int64, shape=(3,))  [invalid-cast]
    # A struct casts each field to the field of the same name.
    reveal_type(df.select(pl.col("st").cast(pl.Struct({"a": pl.Int64}))))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'st': astrolabe.frame.Struct[tuple[astrolabe.frame.Column[Literal['a'], polars.datatypes.classes.Int64]]]}, closed=True), None]"
    df.select(pl.col("st").cast(pl.Struct({"a": pl.Boolean})))  # E: This expression cannot cast from Struct({'a': String}) to Struct({'a': Boolean})  [invalid-cast]
    # The answer of an addition to a list names its element only at the frame.
    reveal_type(df.select((pl.col("li") + 1).cast(pl.List(pl.Boolean))))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'li': astrolabe.frame.List[polars.datatypes.classes.Boolean]}, closed=True), None]"
    # A value read from a container casts as the element.
    reveal_type(df.select(pl.col("li").list.first().cast(pl.Boolean)))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'li': polars.datatypes.classes.Boolean}, closed=True), None]"
    df.select(pl.col("ls").list.first().cast(pl.Boolean))  # E: This expression cannot cast from String to Boolean  [invalid-cast]
    df.select(pl.col("ls").list.first().cast(pl.Boolean).is_null())  # E: "ls" has no result type at this frame's column types: casting from String to Boolean not supported, and polars raises InvalidOperationError  [unsupported-dtype-op]
    df.select(pl.col("st").struct.field("a").cast(pl.Boolean))  # E: This expression cannot cast from String to Boolean  [invalid-cast]
    # A binary value casts to a list of its bytes.
    reveal_type(df.select(pl.col("b").cast(pl.List(pl.UInt8))))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'b': astrolabe.frame.List[polars.datatypes.classes.UInt8]}, closed=True), None]"
    df.select(pl.col("b").cast(pl.List(pl.Int64)))  # E: This expression cannot cast from Binary to List(Int64)  [invalid-cast]

