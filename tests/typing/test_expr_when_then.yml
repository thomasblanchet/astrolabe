- case: a_string_in_a_chain_names_a_column
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class FrameSchema(Columns):
        a: pl.Int64
        b: pl.Boolean
        s: pl.String

    df: TypedDataFrame[FrameSchema]

    class BranchSchema(Columns):
        a: pl.Int64

    branch: TypedDataFrame[BranchSchema] = df.select(pl.when(pl.col("b")).then("a"))

    class ConditionSchema(Columns):
        literal: pl.Int32

    condition: TypedDataFrame[ConditionSchema] = df.select(pl.when("b").then(1).otherwise(0))

    class OtherwiseSchema(Columns):
        literal: pl.Int64

    otherwise: TypedDataFrame[OtherwiseSchema] = df.select(
        pl.when(pl.col("b")).then(1).otherwise("a")
    )

    class LiteralSchema(Columns):
        literal: pl.String

    literal: TypedDataFrame[LiteralSchema] = df.select(pl.when(pl.col("b")).then(pl.lit("a")))

