    # Array where both are Arrays of one width, else a List.
    reveal_type(df.select(pl.when(pl.col("b")).then(pl.col("l")).otherwise(pl.col("m"))))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'l': astrolabe.frame.List[polars.datatypes.classes.Float32]}, closed=True), None]"
    reveal_type(df.select(pl.when(pl.col("b")).then(pl.col("a")).otherwise(pl.col("l"))))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'a': astrolabe.frame.List[polars.datatypes.classes.Int16]}, closed=True), None]"
    reveal_type(df.select(pl.when(pl.col("b")).then(pl.col("a")).otherwise(pl.col("w"))))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'a': astrolabe.frame.List[polars.datatypes.classes.Int16]}, closed=True), None]"
    reveal_type(df.select(pl.when(pl.col("b")).then(pl.col("a")).otherwise(pl.col("a"))))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'a': astrolabe.frame.Array[polars.datatypes.classes.Int16, Literal[1]]}, closed=True), None]"
    reveal_type(df.select(pl.when(pl.col("b")).then(pl.col("n")).otherwise(pl.col("i").implode())))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'n': astrolabe.frame.List[polars.datatypes.classes.Int16]}, closed=True), None]"
    reveal_type(df.select(pl.when(pl.col("b")).then(pl.col("l")).when(pl.col("b")).then(pl.col("n")).otherwise(pl.col("m"))))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'l': astrolabe.frame.List[polars.datatypes.classes.Float32]}, closed=True), None]"
    reveal_type(df.select(pl.when(pl.col("b")).then(pl.col("a")).otherwise(pl.col("af"))))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'a': astrolabe.frame.Array[polars.datatypes.classes.Float32, Literal[1]]}, closed=True), None]"
    # The join points do not join nested elements alike.
