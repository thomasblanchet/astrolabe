- case: a_branch_of_unknown_type_joins_at_every_kind_that_answers
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class Raw(Columns):
        c: pl.Boolean
        s: pl.String
        bn: pl.Binary

    df: TypedDataFrame[Raw]
    # A function with no return type gives a branch of unknown type. The
    # join reads that branch at every kind and keeps the answers that
    # exist, and only Binary joins Binary.
    reveal_type(df.select(pl.when(pl.col("c")).then(pl.col("s").map_batches(lambda x: x.cast(pl.Binary))).otherwise(pl.col("bn")).alias("j")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'j': polars.datatypes.classes.Binary}, closed=True), None]"
    reveal_type(df.select(pl.coalesce(pl.col("s").map_batches(lambda x: x.cast(pl.Binary)), pl.col("bn")).alias("k")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'k': polars.datatypes.classes.Binary}, closed=True), None]"

