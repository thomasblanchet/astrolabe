    from astrolabe import Columns, TypedDataFrame

    class FrameSchema(Columns):
        a: pl.Int64
        b: pl.Float64
        s: pl.String

    # Polars closes a chain with null where no `otherwise` follows,
    # so the selection is the fold of its branches alone.
    Frame = TypedDataFrame[FrameSchema]
    df: Frame

    class PickedSchema(Columns):
