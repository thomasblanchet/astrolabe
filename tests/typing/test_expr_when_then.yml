    reveal_type(df.select(pl.when(pl.col("b")).then(pl.col("m").list.first()).when(pl.col("b")).then(pl.col("i")).otherwise(pl.col("m").list.last())))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'m': polars.datatypes.classes.Int64}, closed=True), None]"
