- case: an_unreadable_branch_leaves_the_chain_plain
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class FrameSchema(Columns):
        b: pl.Boolean
        i: pl.Int64

    Frame = TypedDataFrame[FrameSchema]

    def build(other: pl.Expr, df: Frame) -> None:
        reveal_type(pl.when(pl.col("b")).then(other))  # N: Revealed type is "astrolabe.expr.TypedThen[astrolabe.expr.Deferred[Literal["pl.when(pl.col('b')).then(hole('expr'))"]]]"
        reveal_type(pl.when(pl.col("b")).then(pl.col("i")).otherwise(other))  # N: Revealed type is "astrolabe.expr.TypedExpr[astrolabe.expr.Deferred[Literal["pl.when(pl.col('b')).then(pl.col('i')).otherwise(hole('expr'))"]]]"
        reveal_type(pl.when(other).then(pl.col("i")))  # N: Revealed type is "astrolabe.expr.TypedThen[astrolabe.expr.Deferred[Literal["pl.when(hole('expr')).then(pl.col('i'))"]]]"
        reveal_type(pl.when(pl.col("b")).then(pl.col("i")).when(other))  # N: Revealed type is "astrolabe.expr.TypedChainedWhen[astrolabe.expr.Deferred[Literal["pl.when(pl.col('b')).then(pl.col('i')).when(hole('expr'))"]]]"

- case: a_redefinition_loop_converges
  mypy_config: |
    allow_redefinition = true
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class FrameSchema(Columns):
        b: pl.Boolean
        i: pl.Int64

    # Each turn of the loop folds the same branch again; the fold
    # absorbs a repeated branch, so the type reaches a fixed point and
    # the loop's variable stays a precise expression.
    Frame = TypedDataFrame[FrameSchema]

    df: Frame
    expr = pl.col("i")
    for _ in range(3):
        expr = pl.when(pl.col("b")).then(expr).otherwise(pl.col("i"))

    class NarrowedSchema(Columns):
        i: pl.Int64

    narrowed: TypedDataFrame[NarrowedSchema] = df.select(expr)

- case: a_branch_of_an_unmeasured_kind_gives_the_marker
  main: |
    import polars as pl

    # A List branch beside a branch of an open type gives Unchecked:
    # polars accepts the join at some data types and not at others.
    frame = pl.DataFrame({"m": [True, False]})
    first = pl.lit(None, dtype=pl.List(pl.Int32))
    second = pl.lit(None, dtype=pl.List(pl.Int64))
    chain = pl.when(pl.col("m")).then(first).otherwise(second)
    reveal_type(frame.select(chain.alias("o")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'o': astrolabe.frame.List[polars.datatypes.classes.Int32]}, closed=True), None]"

- case: a_selection_can_be_a_then_branch
  main: |
    import polars as pl
    import polars.selectors as cs
    from astrolabe import Columns, TypedDataFrame

    class FrameSchema(Columns):
        a: pl.Int64
        b: pl.Float64
        s: pl.String

    # The first `then` may take a selection. The chain then picks the
    # selection's own columns, and folds every branch into each one.
    Frame = TypedDataFrame[FrameSchema]
    df: Frame

    class PickedSchema(Columns):
        a: pl.Float64
        b: pl.Float64

    picked: TypedDataFrame[PickedSchema] = df.select(
        pl.when(pl.col("a") > 0).then(cs.numeric()).otherwise(0.0)
    )

- case: a_selection_chain_closes_with_no_otherwise
  main: |
    import polars as pl
