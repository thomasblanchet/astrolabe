# The `when`/`then`/`otherwise` chain. An open chain carries its
# branches' fold and the entries the next branch folds into; the fold
# joins branches under the supertype from the last branch leftward.
# Every expected frame is confirmed against real polars.

- case: a_closed_chain_joins_its_branches_under_the_supertype
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class FrameSchema(Columns):
        b: pl.Boolean
        i: pl.Int64
        f: pl.Float64
        s: pl.String

    Frame = TypedDataFrame[FrameSchema]

    df: Frame

    class NarrowedSchema(Columns):
        i: pl.Float64
        text: pl.String
        literal: pl.Int32

    narrowed: TypedDataFrame[NarrowedSchema] = df.select(
        pl.when(pl.col("b")).then(pl.col("i")).otherwise(pl.col("f")),
        text=pl.when(pl.col("b")).then(pl.col("i")).otherwise(pl.col("s")),
        literal=pl.when(pl.col("b")).then(1).otherwise(0),
    )

- case: the_chain_reads_its_conditions_as_steering_columns
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class FrameSchema(Columns):
        b: pl.Boolean
        i: pl.Int64

    Frame = TypedDataFrame[FrameSchema]

    df: Frame
    reveal_type(pl.when(pl.col("b")))  # N: Revealed type is "astrolabe.expr.TypedWhen[astrolabe.expr.Deferred[Literal["pl.when(pl.col('b'))"]]]"
    reveal_type(pl.when(pl.col("b").any()))  # N: Revealed type is "astrolabe.expr.TypedWhen[astrolabe.expr.Deferred[Literal["pl.when(pl.col('b').any())"]]]"
    reveal_type(pl.when(True))  # N: Revealed type is "astrolabe.expr.TypedWhen[astrolabe.expr.Deferred[Literal['pl.when(True)']]]"
    reveal_type(df.select(pl.when(pl.col("missing")).then(pl.col("i")).otherwise(0)))  # E: Unknown column "missing"  [unknown-column] # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'i': astrolabe.frame.Unchecked}, closed=True), None]"

- case: a_chained_when_appends_a_branch
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class FrameSchema(Columns):
        b: pl.Boolean
        i: pl.Int64
        f: pl.Float64

    Frame = TypedDataFrame[FrameSchema]

    df: Frame
    chain = pl.when(pl.col("b")).then(pl.col("i")).when(pl.col("i") > 1).then(pl.col("f"))
    reveal_type(chain.when(pl.col("b")))  # N: Revealed type is "astrolabe.expr.TypedChainedWhen[astrolabe.expr.Deferred[Literal["pl.when(pl.col('b')).then(pl.col('i')).when(pl.col('i') > 1).then(pl.col('f')).when(pl.col('b'))"]]]"

    class NarrowedSchema(Columns):
        i: pl.Float64

    narrowed: TypedDataFrame[NarrowedSchema] = df.select(chain.otherwise(0))

