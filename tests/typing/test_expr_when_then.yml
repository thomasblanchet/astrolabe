- case: name_keep_on_a_chain_takes_the_first_column_of_the_walk
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class FrameSchema(Columns):
        a: pl.Int64
        b: pl.Boolean
        c: pl.Boolean
        x: pl.Float64

    df: TypedDataFrame[FrameSchema]

    # polars walks the true branch, then the false branch, then the
    # condition, and .name.keep() takes the first column that it meets.
    reveal_type(df.select(pl.when(pl.col("b")).then(pl.col("a").alias("x")).otherwise(pl.col("x")).name.keep()))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'a': polars.datatypes.classes.Float64}, closed=True), None]"
    reveal_type(df.select(pl.when(pl.col("b")).then(pl.col("x")).otherwise(pl.col("a")).name.keep()))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'x': polars.datatypes.classes.Float64}, closed=True), None]"
    reveal_type(df.select(pl.when(pl.col("b")).then(1).otherwise(pl.col("a")).name.keep()))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'a': polars.datatypes.classes.Int64}, closed=True), None]"
    reveal_type(df.select(pl.when(pl.col("b")).then(1).when(pl.col("c")).then(pl.col("a")).otherwise(pl.col("x")).name.keep()))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'a': polars.datatypes.classes.Float64}, closed=True), None]"
    # A chain of literals takes the name of a condition.
    reveal_type(df.select(pl.when(pl.col("b")).then(1).otherwise(2).name.keep()))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'b': polars.datatypes.classes.Int32}, closed=True), None]"
    reveal_type(df.select(pl.when(pl.col("b")).then(1).name.keep()))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'b': polars.datatypes.classes.Int32}, closed=True), None]"
    reveal_type(df.select(pl.when(pl.col("b")).then(pl.lit(1).alias("z")).otherwise(2).name.keep()))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'b': polars.datatypes.classes.Int32}, closed=True), None]"
    # The conditions arrive as one set of names, so two of them leave the
    # kept name unknown.
    df.select(pl.when(pl.col("b")).then(1).when(pl.col("c")).then(2).otherwise(3).name.keep())

