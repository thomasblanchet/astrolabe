    reveal_type(df.select(pl.when(pl.col("b")).then(pl.col("n").list.first()).otherwise(pl.col("m"))))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'n': astrolabe.frame.List[polars.datatypes.classes.Int64]}, closed=True), None]"
