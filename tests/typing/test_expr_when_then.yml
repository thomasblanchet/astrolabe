        s: pl.String

    df: TypedDataFrame[Words]
    grouped = df.group_by("k")
    c = pl.col("k").first() > 0
    mean = pl.col("s").mean()

    # Inside agg, the mean of a String is a String, so a chain that
    # holds it answers there, in any branch.
    reveal_type(grouped.agg(pl.when(c).then(mean).otherwise(pl.lit("x"))))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'k': polars.datatypes.classes.Int64, 's': polars.datatypes.classes.String}, closed=True), None]"
    reveal_type(grouped.agg(pl.when(c).then(pl.lit("x")).otherwise(mean)))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'k': polars.datatypes.classes.Int64, 'literal': polars.datatypes.classes.String}, closed=True), None]"
    reveal_type(grouped.agg(pl.when(c).then(pl.lit("x")).when(c).then(mean).otherwise(pl.lit("y"))))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'k': polars.datatypes.classes.Int64, 'literal': polars.datatypes.classes.String}, closed=True), None]"
    reveal_type(grouped.agg(pl.when(c).then(mean).when(c).then(pl.lit("y")).otherwise(pl.lit("z"))))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'k': polars.datatypes.classes.Int64, 's': polars.datatypes.classes.String}, closed=True), None]"
    reveal_type(grouped.agg(pl.when(c).then(mean)))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'k': polars.datatypes.classes.Int64, 's': polars.datatypes.classes.String}, closed=True), None]"
    reveal_type(grouped.agg(pl.when(c).then(mean).otherwise(pl.col("a").sum())))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'k': polars.datatypes.classes.Int64, 's': polars.datatypes.classes.String}, closed=True), None]"
    reveal_type(grouped.agg(pl.when(c).then(cs.string().mean()).otherwise(pl.lit("x"))))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'k': polars.datatypes.classes.Int64, 's': polars.datatypes.classes.String}, closed=True), None]"
    reveal_type(grouped.agg(pl.when(c).then(cs.string().mean())))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'k': polars.datatypes.classes.Int64, 's': polars.datatypes.classes.String}, closed=True), None]"

    # The row context refuses the mean of a String.
    reveal_type(df.select(pl.when(c).then(mean).otherwise(pl.lit("x"))))  # E: "s" has no result type at this frame's column types: mean does not accept String, and polars raises InvalidOperationError  [unsupported-dtype-op]  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'s': astrolabe.frame.Unchecked}, closed=True), None]"

- case: a_condition_gives_the_chain_its_character
  main: |
    import polars as pl
    import polars.selectors as cs
    from astrolabe import Columns, TypedDataFrame

    class Words(Columns):
        k: pl.Int64
        b: pl.Boolean
        f: pl.Float64
        s: pl.String

    df: TypedDataFrame[Words]
    grouped = df.group_by("k")

    # A condition that gives one value for each row makes the chain give
    # one value for each row, so the aggregation context wraps it.
    reveal_type(grouped.agg(pl.when(pl.col("k") > 0).then(pl.col("s").mean()).otherwise(pl.lit("x"))))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'k': polars.datatypes.classes.Int64, 's': astrolabe.frame.List[polars.datatypes.classes.String]}, closed=True), None]"
    reveal_type(grouped.agg(pl.when(pl.col("b")).then(1).otherwise(0)))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'k': polars.datatypes.classes.Int64, 'literal': astrolabe.frame.List[polars.datatypes.classes.Int32]}, closed=True), None]"
    reveal_type(grouped.agg(pl.when(pl.col("b")).then(pl.col("f").sum()).otherwise(pl.col("f").max())))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'k': polars.datatypes.classes.Int64, 'f': astrolabe.frame.List[polars.datatypes.classes.Float64]}, closed=True), None]"
    reveal_type(grouped.agg(pl.when("b").then(pl.col("f").sum())))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'k': polars.datatypes.classes.Int64, 'f': astrolabe.frame.List[polars.datatypes.classes.Float64]}, closed=True), None]"
    reveal_type(grouped.agg(pl.when([pl.col("b").first(), pl.col("b")]).then(pl.col("f").sum())))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'k': polars.datatypes.classes.Int64, 'f': astrolabe.frame.List[polars.datatypes.classes.Float64]}, closed=True), None]"
    reveal_type(grouped.agg(pl.when(pl.col("b").first()).then(pl.col("f").sum()).when(pl.col("b")).then(pl.col("f").max()).otherwise(0.0)))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'k': polars.datatypes.classes.Int64, 'f': astrolabe.frame.List[polars.datatypes.classes.Float64]}, closed=True), None]"
    reveal_type(grouped.agg(pl.when(pl.col("b")).then(cs.float().sum()).otherwise(0.0)))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'k': polars.datatypes.classes.Int64, 'f': astrolabe.frame.List[polars.datatypes.classes.Float64]}, closed=True), None]"

    # A condition that aggregates, or a Python value, keeps the character of the values.
    reveal_type(grouped.agg(pl.when(pl.col("b").first()).then(pl.col("f").sum()).otherwise(pl.col("f").max())))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'k': polars.datatypes.classes.Int64, 'f': polars.datatypes.classes.Float64}, closed=True), None]"
    reveal_type(grouped.agg(pl.when([pl.col("b").first(), pl.col("b").last()]).then(pl.col("f").sum())))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'k': polars.datatypes.classes.Int64, 'f': polars.datatypes.classes.Float64}, closed=True), None]"
    reveal_type(grouped.agg(pl.when(True).then(pl.col("f").sum())))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'k': polars.datatypes.classes.Int64, 'f': polars.datatypes.classes.Float64}, closed=True), None]"
    reveal_type(grouped.agg(pl.when(pl.col("b").first()).then(1).otherwise(0)))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'k': polars.datatypes.classes.Int64, 'literal': polars.datatypes.classes.Int32}, closed=True), None]"
