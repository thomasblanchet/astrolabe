- case: a_container_beside_a_scalar_branch_is_refused
  main: |
    import polars as pl
    from astrolabe import Columns, List, TypedDataFrame

    class FrameSchema(Columns):
        b: pl.Boolean
        u: pl.UInt8
        i: pl.Int16
        s: pl.String
        n: pl.Null
        l: List[pl.Int16]

    df: TypedDataFrame[FrameSchema]

    # A row of a list cannot become a scalar, and a scalar cannot become a
    # list, so polars refuses a container beside every scalar kind but Null,
    # on either side. Beside String it refuses once a row holds a list.
    df.select(pl.when(pl.col("b")).then(pl.col("u")).otherwise(pl.col("i").implode()))  # E: "u" has no result type at this frame's column types: failed to determine supertype of UInt8 and List(Int16), and polars raises SchemaError  [unsupported-dtype-op]
    df.select(pl.when(pl.col("b")).then(pl.col("l")).otherwise(pl.col("s")))  # E: "l" has no result type at this frame's column types: cannot cast List type (inner: Int16, to: String), and polars raises InvalidOperationError  [unsupported-dtype-op]
    df.select(a=pl.when(pl.col("b")).then(pl.col("l")).when(pl.col("b")).then(pl.col("u")).otherwise(pl.col("n")))  # E: "a" has no result type at this frame's column types: failed to determine supertype of List(Int16) and UInt8, and polars raises SchemaError  [unsupported-dtype-op]
    # Null beside a list gives the list, element included, so a later scalar
    # branch meets the list.
    reveal_type(df.select(pl.when(pl.col("b")).then(pl.col("n")).otherwise(pl.col("l"))))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'n': astrolabe.frame.List[polars.datatypes.classes.Int16]}, closed=True), None]"
    reveal_type(df.select(pl.when(pl.col("b")).then(pl.col("l")).otherwise(pl.col("n"))))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'l': astrolabe.frame.List[polars.datatypes.classes.Int16]}, closed=True), None]"
    reveal_type(df.select(pl.when(pl.col("b")).then(pl.col("n")).when(pl.col("b")).then(pl.col("n")).otherwise(pl.col("l"))))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'n': astrolabe.frame.List[polars.datatypes.classes.Int16]}, closed=True), None]"
    df.select(a=pl.when(pl.col("b")).then(pl.col("u")).when(pl.col("b")).then(pl.col("n")).otherwise(pl.col("l")))  # E: "a" has no result type at this frame's column types: failed to determine supertype of UInt8 and List(Int16), and polars raises SchemaError  [unsupported-dtype-op]
    df.select(a=pl.when(pl.col("b")).then(pl.col("n")).when(pl.col("b")).then(pl.col("l")).otherwise(pl.col("u")))  # E: "a" has no result type at this frame's column types: failed to determine supertype of List(Int16) and UInt8, and polars raises SchemaError  [unsupported-dtype-op]
    # Beside a second list, the answer joins the elements.
    reveal_type(df.select(pl.when(pl.col("b")).then(pl.col("l")).otherwise(pl.col("i").implode())))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'l': astrolabe.frame.List[polars.datatypes.classes.Int16]}, closed=True), None]"

