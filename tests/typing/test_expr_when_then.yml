    reveal_type(df.select(pl.when(pl.col("b")).then(pl.col("d")).otherwise(pl.col("ld").list.first())))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'d': astrolabe.frame.Datetime[Literal['ms'], None]}, closed=True), None]"
    # One value alone keeps the element.
