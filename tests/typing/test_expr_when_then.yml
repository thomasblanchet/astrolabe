- case: a_selection_in_a_later_branch_falls_back
  main: |
    import polars as pl
    import polars.selectors as cs
    from astrolabe import Columns, TypedDataFrame

    class FrameSchema(Columns):
        a: pl.Int64
        b: pl.Float64

    # Only the first `then` may take a selection. A later branch
    # picks columns the chain has already fixed, so the chain gives
    # the plain expression.
    Frame = TypedDataFrame[FrameSchema]
    df: Frame

    chained = pl.when(pl.col("a") > 0).then(0).when(pl.col("a") < 0).then(cs.numeric())
    reveal_type(chained)  # N: Revealed type is "astrolabe.expr.TypedThen[astrolabe.expr.Deferred[Literal["pl.when(pl.col('a') > 0).then(0).when(pl.col('a') < 0).then(cs.numeric())"]]]"

- case: an_open_with_no_condition_gives_the_plain_when
  main: |
    import polars as pl

    # `when` is variadic, so mypy accepts no condition at all. The
    # hook reads one condition or none, and gives the plain wrapper.
    reveal_type(pl.when())  # E: This call raises TypeError before any frame meets it: at least one predicate or constraint must be provided  [invalid-call-shape]  # N: Revealed type is "polars.expr.whenthen.When"

