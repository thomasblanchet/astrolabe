    from astrolabe import Columns, TypedDataFrame

    class FrameSchema(Columns):
        b: pl.Boolean
        u: pl.UInt8

    df: TypedDataFrame[FrameSchema]

    wide = pl.lit(1267650600228229401496703205376)
    df.select(a=pl.when(pl.col("b")).then(pl.col("u")).otherwise(wide))  # E: "a" has no result type at this frame's column types: conversion from Int128 to UInt8 failed, and polars raises InvalidOperationError  [unsupported-dtype-op]
    df.select(a=pl.when(pl.col("b")).then(pl.col("u")).otherwise(wide.alias("w")))  # E: "a" has no result type at this frame's column types: conversion from Int128 to UInt8 failed, and polars raises InvalidOperationError  [unsupported-dtype-op]
    df.select(a=pl.when(pl.col("b")).then(pl.col("u")).otherwise(wide.clip()))  # E: "a" has no result type at this frame's column types: conversion from Int128 to UInt8 failed, and polars raises InvalidOperationError  [unsupported-dtype-op]
    df.select(a=pl.when(pl.col("b")).then(pl.col("u")).when(pl.col("b")).then(wide))
    reveal_type(wide.abs())  # N: Revealed type is "astrolabe.expr.TypedExpr[astrolabe.expr.Deferred[Literal['pl.lit(1267650600228229401496703205376).abs()']]]"

- case: a_wide_literal_in_an_inner_chain_is_a_fact_of_the_data
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class FrameSchema(Columns):
        b: pl.Boolean
        d: pl.Date
        u: pl.UInt8

    df: TypedDataFrame[FrameSchema]

    class NarrowedSchema(Columns):
        two_branches: pl.Int64

    wide = pl.lit(9223372036854775808)
    narrowed: TypedDataFrame[NarrowedSchema] = df.select(
        two_branches=pl.when(pl.col("b")).then(pl.col("d")).otherwise(wide),
    )
    # A second `when` nests a chain in the first. The inner chain holds
    # 2**63 in a UInt64 column, and the outer chain casts it to Int64, which
    # raises where a row takes the literal: a fact of the data, as for a
    # UInt64 column that holds 2**63.
    then_d = pl.when(pl.col("b")).then(pl.col("d"))
    reveal_type(df.select(a=then_d.when(pl.col("b")).then(pl.col("u")).otherwise(wide)))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'a': polars.datatypes.classes.Int64}, closed=True), None]"
    reveal_type(df.select(a=then_d.when(pl.col("b")).then(wide).otherwise(pl.col("u"))))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'a': polars.datatypes.classes.Int64}, closed=True), None]"
    then_negative = pl.when(pl.col("b")).then(pl.lit(-1))
    reveal_type(df.select(a=then_negative.when(pl.col("b")).then(pl.col("u")).otherwise(wide)))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'a': polars.datatypes.classes.Int64}, closed=True), None]"

- case: a_number_variable_branch_answers_where_every_bucket_agrees
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class FrameSchema(Columns):
        b: pl.Boolean
        f: pl.Float32
        u: pl.UInt8
        n: pl.Null
        d: pl.Date

    df: TypedDataFrame[FrameSchema]

    # A float variable can hold any int or a float, and an int variable any
    # int. Polars reads the value, so the chain answers where every value
    # that the checker tries gives one data type.
    share: float = 1
