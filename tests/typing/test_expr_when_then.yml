    reveal_type(df.select(pl.when(pl.col("b")).then(pl.col("i")).when(pl.col("b")).then(pl.col("m").list.first()).otherwise(pl.col("i"))))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'i': polars.datatypes.classes.Int64}, closed=True), None]"
    # A later branch joins the element of an earlier one.
    reveal_type(df.select(pl.when(pl.col("b")).then(pl.col("s").list.first()).when(pl.col("b")).then(pl.col("i")).otherwise(pl.col("i"))))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'s': polars.datatypes.classes.String}, closed=True), None]"
