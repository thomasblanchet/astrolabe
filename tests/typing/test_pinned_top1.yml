- case: dtype_markers_accept_the_edge_values_that_polars_accepts
  main: |
    from typing import Literal
    import polars as pl
    from astrolabe import Array, Columns, Decimal, TypedDataFrame

    # A schema class can say closed=True. That is the default.
    class Ok(Columns, closed=True):
        a: pl.Int64

    # Polars accepts an Array of size 0, and a Decimal whose scale equals its precision.
    class Shapes(Columns):
        empty: Array[pl.Int64, Literal[0]]
        exact: Decimal[Literal[5], Literal[5]]

    ok: TypedDataFrame[Ok]
    shapes: TypedDataFrame[Shapes]
    reveal_type(ok)  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict(main.Ok, {'a': polars.datatypes.classes.Int64}, closed=True), None]"
    reveal_type(shapes)  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict(main.Shapes, {'empty': astrolabe.frame.Array[polars.datatypes.classes.Int64, Literal[0]], 'exact': astrolabe.frame.Decimal[Literal[5], Literal[5]]}, closed=True), None]"

- case: dtype_markers_become_any_after_an_error_in_their_arguments
  main: |
    from typing import Literal
    import polars as pl
    from astrolabe import Array, Columns, Decimal, Enum, TypedDataFrame

    # Polars refuses each of these data types. Each error leaves the column type Any.
    class Bad(Columns):
        neg: Array[pl.Int64, Literal[-1]]  # E: Array[...] size argument must be a non-negative integer literal  [marker-arg]
        wide: Decimal[Literal[2], Literal[5]]  # E: Decimal[...] scale must not exceed precision  [marker-arg]
        dup: Enum[Literal["a"], Literal["a"]]  # E: Enum[...] arguments must all be different, found duplicate 'a'  [marker-arg]
        # mypy already rejects a bare int. The Decimal keeps Any for that argument only.
        bare: Decimal[5, Literal[2]]  # E: Invalid type: try using Literal[5] instead?  [valid-type]

    def f(bad: TypedDataFrame[Bad]) -> None:
        reveal_type(bad)  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict(main.Bad, {'neg': Any, 'wide': Any, 'dup': Any, 'bare': astrolabe.frame.Decimal[Any, Literal[2]]}, closed=True), None]"

