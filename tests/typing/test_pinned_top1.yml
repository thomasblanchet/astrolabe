- case: other_columns_without_rules_out_each_listed_name
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame, other_columns

    L1 = other_columns(without=["x"])
    L2 = other_columns(without=["y", "x"])

    class A(Columns):
        a: pl.Int64

    d1: TypedDataFrame[A, L1]
    d2: TypedDataFrame[A, L2]
    # A remainder declared without one name cannot hold that name.
    d1.select("x")  # E: Unknown column "x"  [unknown-column]
    # A remainder declared without two names cannot hold either name.
    d2.select("x")  # E: Unknown column "x"  [unknown-column]
    d2.select("y")  # E: Unknown column "y"  [unknown-column]

- case: join_falls_back_to_the_plain_frame_after_a_call_shape_error
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class A(Columns):
        k: pl.Int64
        x: pl.Int64

    class B(Columns):
        k: pl.Int64
        b: pl.String

    a: TypedDataFrame[A]
    b: TypedDataFrame[B]
    # Polars refuses on= together with left_on=. The result falls back to the plain frame.
    reveal_type(a.join(b, on="k", left_on="k"))  # E: join() with on= and left_on=/right_on= raises ValueError: cannot use "on" in conjunction with "left_on" or "right_on"  [invalid-call-shape] # N: Revealed type is "polars.dataframe.frame.DataFrame"
    # Polars refuses a cross join with any key argument. The result falls back to the plain frame.
    reveal_type(a.join(b, how="cross", on="k"))  # E: join() with how="cross" and a join key argument raises ValueError: cross join should not pass join keys  [invalid-call-shape] # N: Revealed type is "polars.dataframe.frame.DataFrame"
    reveal_type(a.join(b, how="cross", left_on="k"))  # E: join() with how="cross" and a join key argument raises ValueError: cross join should not pass join keys  [invalid-call-shape] # N: Revealed type is "polars.dataframe.frame.DataFrame"
    reveal_type(a.join(b, how="cross", right_on="k"))  # E: join() with how="cross" and a join key argument raises ValueError: cross join should not pass join keys  [invalid-call-shape] # N: Revealed type is "polars.dataframe.frame.DataFrame"

- case: join_key_that_reads_a_steering_column_is_not_a_bare_column
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class A(Columns):
        k: pl.Int64
        x: pl.Int64

    class C(Columns):
        k: pl.Int64
        x: pl.Int64
        b: pl.String

    a: TypedDataFrame[A]
    c: TypedDataFrame[C]
    key = pl.col("k") + pl.col("x") * 0
    # The key also reads "x", so it is not a bare read of "k". The checker does not type the join.
    reveal_type(a.join(c, on=key))  # N: Revealed type is "polars.dataframe.frame.DataFrame"
    # A window is not elementwise, and polars refuses it as a join key at every frame.
    reveal_type(a.join(c, on=pl.col("k").over("x")))  # E: join() with a join key that changes the rows raises InvalidOperationError: all join key expressions must be elementwise  [invalid-call-shape]  # N: Revealed type is "polars.dataframe.frame.DataFrame"

