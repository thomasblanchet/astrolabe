- case: remainder_with_a_requirement_the_engine_cannot_read
  main: |
    import polars as pl
    import polars.selectors as cs
    from astrolabe import Columns, SplitColumns, TypedDataFrame, other_columns

    Anything = other_columns(all_of=pl.DataType)
