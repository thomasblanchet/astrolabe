- case: concat_by_name_builds_the_result_from_the_columns_of_the_first_frame
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class A(Columns):
        a: pl.Int64

    class AB(Columns):
        a: pl.Int64
        b: pl.String

    x: TypedDataFrame[A]
    z: TypedDataFrame[AB]
    # The result of a diagonal concat lists its columns. It does not take the class name of a later frame.
    reveal_type(pl.concat([x, z], how="diagonal"))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'a': polars.datatypes.classes.Int64, 'b': polars.datatypes.classes.String}, closed=True), None]"
    # A horizontal_extend concat of one frame keeps the class name of that frame.
    reveal_type(pl.concat([z], how="horizontal_extend"))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict(main.AB, {'a': polars.datatypes.classes.Int64, 'b': polars.datatypes.classes.String}, closed=True), None]"

- case: gate_never_reports_no_gap_for_a_proven_or_accounted_expression
  main: |
    import polars as pl
    import polars.selectors as cs
    from astrolabe import Columns, TypedDataFrame, Unchecked

    class K(Columns):
        k: pl.String
        s: pl.String
        n: pl.Int64
        u: Unchecked

    df: TypedDataFrame[K]
    # A typed expression over declared columns has a proof. The level "never" reports nothing.
    df.select(pl.col("n") + 1)
    # A column that the user declares Unchecked is the choice of the user. The checker reports no gap for it.
    df.select(pl.col("u") + 1)
    # An opaque function gets its report at the call that builds it. The select reports no gap after it.
    df.select(pl.col("n").map_elements(lambda x: x))  # E: Column "n" of "map_elements" is Unchecked: a Python function decides the type, and no return_dtype= names it  [implicitly-unchecked] # N: set allow_unproven = "omitted" in [tool.astrolabe] to allow this, or set [tool.astrolabe.allow_unproven_overrides] map_elements = "omitted"
    # A short form over a column with no result type gets one error. The checker reports no gap after it.
    df.group_by("k").sum()  # E: "s" has no result type at this frame's column types: `sum` operation not supported for dtype `String`, and polars raises InvalidOperationError  [unsupported-dtype-op]
    # A selection that reads an unknown column gets one error. The checker reports no gap after it.
    df.select(cs.numeric() * pl.col("zz"))  # E: Unknown column "zz"  [unknown-column]
    # An unnest of a column that is not a struct gets one error. The checker reports no gap after it.
    df.select(pl.col("n").struct.unnest())  # E: Column "n" is not a Struct with declared fields, cannot .struct.unnest()  [wrong-column-shape]
  files:
    - path: pyproject.toml
      content: |
        [tool.mypy]
        plugins = ["astrolabe.plugin"]
        strict = true
        allow_redefinition = true

        [tool.astrolabe]
        allow_unproven = "never"

- case: gate_none_names_the_reason_of_each_unread_argument
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class K(Columns):
        k: pl.String
        n: pl.Int64

    df: TypedDataFrame[K]
    kw: dict[str, pl.Expr] = {"m": pl.col("n")}
    name: str = "n"
    e: pl.Expr = pl.col("n") > 0
    ratio: float = 1.5
    # Keywords unpacked from a dict have no literal names.
    df.select(**kw)  # E: The result of "select" has no known schema: a column name is not a literal string  [implicitly-untyped] # N: set allow_unproven = "stated" in [tool.astrolabe] to allow this, or set [tool.astrolabe.allow_unproven_overrides] select = "stated"
    df.with_columns(**kw)  # E: The result of "with_columns" has no known schema: a column name is not a literal string  [implicitly-untyped] # N: set allow_unproven = "stated" in [tool.astrolabe] to allow this, or set [tool.astrolabe.allow_unproven_overrides] with_columns = "stated"
    # A string variable is a column name that is not a literal.
    df.select(name)  # E: The result of "select" has no known schema: a column name is not a literal string  [implicitly-untyped] # N: set allow_unproven = "stated" in [tool.astrolabe] to allow this, or set [tool.astrolabe.allow_unproven_overrides] select = "stated"
    # A plain expression variable is an expression that is not typed.
    df.select(e)  # E: The result of "select" has no known schema: an expression is not typed  [implicitly-untyped] # N: set allow_unproven = "stated" in [tool.astrolabe] to allow this, or set [tool.astrolabe.allow_unproven_overrides] select = "stated"
    # A float variable can hold an int, whose width polars reads from the value.
    df.select(ratio)  # E: Column "literal" of "select" is Unchecked: a number variable has no fixed width  [implicitly-unchecked] # N: set allow_unproven = "omitted" in [tool.astrolabe] to allow this, or set [tool.astrolabe.allow_unproven_overrides] select = "omitted"
  files:
    - path: pyproject.toml
      content: |
        [tool.mypy]
        plugins = ["astrolabe.plugin"]
        strict = true
        allow_redefinition = true

        [tool.astrolabe]
        allow_unproven = "none"

- case: struct_unnest_reads_the_fields_when_the_frame_holds_only_the_struct
  main: |
    from typing import Literal
    import polars as pl
    from astrolabe import Column, Columns, Struct, TypedDataFrame, Unchecked

    class St(Columns):
        st: Struct[Column[Literal["a"], pl.Int64], Column[Literal["b"], pl.Float64]]

    class K(Columns):
        n: pl.Int64
        u: Unchecked

    sdf: TypedDataFrame[St]
    df: TypedDataFrame[K]
    # The unnest reads the declared fields, also when the struct is the only column.
    reveal_type(sdf.select(pl.col("st").struct.unnest()))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'a': polars.datatypes.classes.Int64, 'b': polars.datatypes.classes.Float64}, closed=True), None]"
    # An Unchecked answer that is not a plain column read is a gap. The default setting lets it pass as the plain frame.
    reveal_type(df.select(pl.col("u").first().struct.unnest()))  # N: Revealed type is "polars.dataframe.frame.DataFrame"

- case: filter_checks_each_predicate_after_one_it_cannot_read
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class K(Columns):
        n: pl.Int64

    df: TypedDataFrame[K]
    e: pl.Expr = pl.col("n") > 0
