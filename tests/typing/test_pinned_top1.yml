- case: untyped_select_with_a_plain_selector_stays_plain
  main: |
    import polars as pl
    import polars.selectors as cs

    df: pl.DataFrame
    names: list[str] = ["a"]
    # A plain selector needs real columns to match. The select keeps the plain frame.
    reveal_type(df.select(cs.by_name(names), "b"))  # N: Revealed type is "polars.dataframe.frame.DataFrame"
    # A keyword does not help. Polars can still pick more than one column.
    reveal_type(df.select(x=cs.by_name(names)))  # N: Revealed type is "polars.dataframe.frame.DataFrame"
    # A bare name is not a selector. The select gives a typed frame.
    reveal_type(df.select("b"))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'b': astrolabe.frame.Unchecked}, closed=True), None]"

- case: gate_default_reports_a_possible_and_an_asserted_reason_with_their_levels
  main: |
    import polars as pl
    from astrolabe import Columns, other_columns, TypedDataFrame

    Rest = other_columns()
    NoSector = other_columns(without=["sector"])

    class DfSchema(Columns):
        a: pl.Int64

    def add_sector(df: TypedDataFrame[DfSchema, NoSector]) -> None:
        raise NotImplementedError

    df: TypedDataFrame[DfSchema, Rest]
    closed: TypedDataFrame[DfSchema]
    # The remainder can hold "nope", so the drop is unproven. The default level reports it and names the level "possible".
    reveal_type(df.drop("nope"))  # E: Column "nope" is not declared and cannot be proven to exist  [undeclared-column] # N: set allow_unproven = "possible" in [tool.astrolabe] to allow this, or set [tool.astrolabe.allow_unproven_overrides] drop = "possible" # N: Revealed type is "polars.dataframe.frame.DataFrame"
    # The remainder of the argument does not prove the requirement. The note names the level "asserted".
    add_sector(df)  # E: The argument's own remainder does not prove the requirements of "NoSector". Declare the missing requirement on the argument's own remainder  [forbidden-column] # N: set allow_unproven = "asserted" in [tool.astrolabe] to allow this, or set [tool.astrolabe.allow_unproven_overrides] fit = "asserted"
    # A drop of a name that a closed frame does not hold is an error. The result falls back to the plain frame.
    reveal_type(closed.drop("nope"))  # E: Unknown column "nope"  [unknown-column] # N: Revealed type is "polars.dataframe.frame.DataFrame"

- case: corr_falls_back_to_the_plain_frame_after_an_error_or_an_unread_label
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class N(Columns):
        a: pl.Int64
        b: pl.Float64

    class S(Columns):
        a: pl.Int64
        s: pl.String

    df: TypedDataFrame[N]
    sdf: TypedDataFrame[S]
    label: str = "x"
    # Polars cannot correlate a String column. The result falls back to the plain frame.
    reveal_type(sdf.corr())  # E: Column "s" is not numeric or Boolean, cannot corr  [wrong-column-shape] # N: Revealed type is "polars.dataframe.frame.DataFrame"
    # A label that repeats a column name is an error. The result falls back to the plain frame.
    reveal_type(df.corr(label="a"))  # E: corr would produce duplicate column "a"  [duplicate-column] # N: Revealed type is "polars.dataframe.frame.DataFrame"
    # A label that is not a literal gives no name. The result falls back to the plain frame.
    reveal_type(df.corr(label=label))  # N: Revealed type is "polars.dataframe.frame.DataFrame"

