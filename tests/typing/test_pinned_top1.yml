# Cases that pin rules which a mutation audit found loose. Some cases write
# their own pyproject.toml through `files:`, so that the case can set the
# [tool.astrolabe] settings. The file then replaces the one that
# pytest-mypy-plugins writes, and must register the plugin again.

- case: gate_never_reports_a_checker_gap_and_names_the_level_none
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class Vw[T: pl.DataType](Columns):
        v: T
        w: pl.Int64

    def f[T: pl.DataType](df: TypedDataFrame[Vw[T]]) -> None:
        # The level "never" reports a checker gap. The note names the level "none", which lets the gap pass.
        df.select(pl.cum_sum_horizontal("w", "w").alias("bad"))  # E: Column "bad" of "select" is Unchecked: the checker does not model this case  [implicitly-unchecked] # N: set allow_unproven = "none" in [tool.astrolabe] to allow this, or set [tool.astrolabe.allow_unproven_overrides] select = "none"
  files:
    - path: pyproject.toml
      content: |
        [tool.mypy]
        plugins = ["astrolabe.plugin"]
        strict = true
        allow_redefinition = true

        [tool.astrolabe]
        allow_unproven = "never"

- case: gate_none_reports_a_stated_and_an_omitted_reason_with_their_levels
