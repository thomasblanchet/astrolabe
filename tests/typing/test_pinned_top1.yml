    from astrolabe import Columns, TypedDataFrame, other_columns

    L = other_columns()

    class A(Columns):
        a: pl.Int64
        s: pl.String

    df: TypedDataFrame[A]
    o: TypedDataFrame[A, L]
    name: str = "a"
    # A selector over a closed frame maps only declared columns. The checker reports each one.
    df.map_columns(cs.string(), lambda s: s)  # E: Column "s" of "map_columns" is Unchecked: a Python function decides the type  [implicitly-unchecked] # N: set allow_unproven = "stated" in [tool.astrolabe] to allow this, or set [tool.astrolabe.allow_unproven_overrides] map_columns = "stated"
