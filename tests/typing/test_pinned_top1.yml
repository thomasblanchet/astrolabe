    from astrolabe import TypedDataFrame, columns

    A = columns("A", {"a": pl.Int64})
    df: TypedDataFrame[A]
    value: int = 1
    # The level "none" reports a bare integer. The note names the level "omitted".
    df.select(value)  # E: Column "literal" of "select" is Unchecked: a number variable has no fixed width  [implicitly-unchecked] # N: set allow_unproven = "omitted" in [tool.astrolabe] to allow this, or set [tool.astrolabe.allow_unproven_overrides] select = "omitted"
    # A literal of the variable has no fixed width either.
    df.select(pl.lit(value))  # E: Column "literal" of "select" is Unchecked: a number variable has no fixed width  [implicitly-unchecked] # N: set allow_unproven = "omitted" in [tool.astrolabe] to allow this, or set [tool.astrolabe.allow_unproven_overrides] select = "omitted"
    # The level "none" reports a read with no schema. The note names the level "stated".
    pl.read_csv("data.csv")  # E: The result of "read_csv" has no known schema: no schema gives the column types  [implicitly-untyped] # N: set allow_unproven = "stated" in [tool.astrolabe] to allow this, or set [tool.astrolabe.allow_unproven_overrides] read_csv = "stated"
  files:
    - path: pyproject.toml
      content: |
        [tool.mypy]
        plugins = ["astrolabe.plugin"]
        strict = true
        allow_redefinition = true

        [tool.astrolabe]
        allow_unproven = "none"

- case: gate_never_reports_each_concat_gap_once_and_no_gap_after_an_error
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame, other_columns

    class A(Columns):
        a: pl.Int64

    class B(Columns):
        a: pl.String

    L = other_columns()

    class G[T: pl.DataType](Columns):
        a: T

    x: TypedDataFrame[A]
    y: TypedDataFrame[B]
    o: TypedDataFrame[A, L]
    # The checker does not type a vertical concat. The level "never" reports this gap.
    pl.concat([x, x])  # E: The result of "concat" has no known schema: the checker does not model this case  [implicitly-untyped] # N: set allow_unproven = "none" in [tool.astrolabe] to allow this, or set [tool.astrolabe.allow_unproven_overrides] concat = "none"
    # A vertical concat with an open first frame is a gap too.
    pl.concat([o, o])  # E: The result of "concat" has no known schema: the checker does not model this case  [implicitly-untyped] # N: set allow_unproven = "none" in [tool.astrolabe] to allow this, or set [tool.astrolabe.allow_unproven_overrides] concat = "none"
    # An item that is not a typed frame is a gap too.
    pl.concat([x, pl.DataFrame({"a": [1]})])  # E: The result of "concat" has no known schema: the checker does not model this case  [implicitly-untyped] # N: set allow_unproven = "none" in [tool.astrolabe] to allow this, or set [tool.astrolabe.allow_unproven_overrides] concat = "none"
    # A vertical concat whose schemas differ gets one error. The checker reports no gap after it.
    pl.concat([x, y])  # E: pl.concat(how="vertical") requires identical schemas: frame 1 does not match frame 0  [schema-mismatch]
    # A concat of an empty list gets one error. The checker reports no gap after it.
    pl.concat([])  # E: concat([]) raises ValueError: cannot concat empty list  [invalid-call-shape]
    # A strict diagonal concat whose shared column types differ gets one error. The checker reports no gap after it.
    pl.concat([x, y], how="diagonal")  # E: pl.concat(how="diagonal") column "a" does not reconcile: Int64 vs. String  [schema-mismatch]

    def f[T: pl.DataType](g: TypedDataFrame[G[T]]) -> None:
        # A type variable in a strict diagonal concat is a gap, not an error.
        pl.concat([x, g], how="diagonal")  # E: The result of "concat" has no known schema: the checker does not model this case  [implicitly-untyped] # N: set allow_unproven = "none" in [tool.astrolabe] to allow this, or set [tool.astrolabe.allow_unproven_overrides] concat = "none"
  files:
    - path: pyproject.toml
      content: |
        [tool.mypy]
        plugins = ["astrolabe.plugin"]
        strict = true
        allow_redefinition = true

        [tool.astrolabe]
        allow_unproven = "never"

- case: gate_never_reports_no_gap_after_a_disallowed_vertical_concat
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class A(Columns):
        a: pl.Int64

    x: TypedDataFrame[A]
    # The setting disallow_vertical_concat reports a vertical concat. The checker reports no gap after it.
    pl.concat([x, x])  # E: pl.concat(how="vertical") is disallowed: column order cannot be verified for a schema derived through a Rest-generic function (set disallow_vertical_concat = false in [tool.astrolabe] to allow it as an untyped result instead)  [vertical-concat-disallowed]
  files:
    - path: pyproject.toml
      content: |
        [tool.mypy]
        plugins = ["astrolabe.plugin"]
        strict = true
        allow_redefinition = true

        [tool.astrolabe]
