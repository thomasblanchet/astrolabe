- case: merge_sorted_merges_a_column_of_lists_before_polars_1_41
  skip: not __import__("tests.releases").releases.polars_before("1.41.0")
  main: |
    import polars as pl
    from astrolabe import Columns, List, TypedDataFrame

    class FrameSchema(Columns):
        foo: pl.Int64
        tags: List[pl.String]

    Frame = TypedDataFrame[FrameSchema]

    # Before polars 1.41.0, merge_sorted panics over a column of lists, or ends
    # the process. The call sits in a function, so that no run reaches it.
    def merged(left: Frame, right: Frame) -> Frame:
        return left.merge_sorted(right, key="foo")  # E: "tags" has no result type at this frame's column types: merge_sorted does not merge a List or an Array before polars 1.41.0, and polars panics or ends the process  [unsupported-dtype-op]
