- case: vstack_with_no_arguments_is_a_call_error
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class FrameSchema(Columns):
        foo: pl.Int64

    # The override has the parameters of polars, so mypy reports the
    # missing frame, as it does for polars itself.
    Frame = TypedDataFrame[FrameSchema]

    df: Frame
    df.vstack()  # E: Missing positional argument "other" in call to "vstack" of "TypedDataFrame"  [call-arg]

- case: merge_sorted_merges_a_column_of_lists
