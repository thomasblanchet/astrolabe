# A returned code reads each parameter through its declaration. An
# argument that fits `Float32` can give any type at another data type,
# so a frame whose column the declaration does not allow is an error.
# An `Unchecked` column keeps the data types that the declaration allows.
- case: a_declared_leaf_refuses_a_frame_outside_its_declaration
  main: |
    import polars as pl
    from astrolabe import Columns, InferredExpr, TypedDataFrame, column, infer, typed_agg
    from astrolabe.frame import Unchecked

    Price = column("price", pl.Float32)
    Total = typed_agg(Price, gives=pl.Float32, named="price")

    def bumped(price: Price) -> InferredExpr:
        return infer(price + 1)

    def doubled(total: Total) -> InferredExpr:
        return infer(total * 2)

    class Wide(Columns):
        price: pl.Int64

    class Narrow(Columns):
        price: pl.Float32

    class Loose(Columns):
        price: Unchecked

    wide: TypedDataFrame[Wide]
    narrow: TypedDataFrame[Narrow]
    loose: TypedDataFrame[Loose]
    reveal_type(narrow.select(bumped(pl.col("price").cast(pl.Float32))))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict(main.Narrow, {'price': polars.datatypes.classes.Float32}, closed=True), None]"
    wide.select(bumped(pl.col("price").cast(pl.Float32)))  # E: "price" has no result type at this frame's column types: column "price" is Int64, which the declared type of an argument does not allow  [unsupported-dtype-op]
    wide.select(doubled(pl.col("price").sum().cast(pl.Float32)))  # E: "price" has no result type at this frame's column types: column "price" is Int64, which the declared type of an argument does not allow  [unsupported-dtype-op]
    reveal_type(loose.select(bumped(pl.col("price").cast(pl.Float32))))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'price': polars.datatypes.classes.Float32}, closed=True), None]"

