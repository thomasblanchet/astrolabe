- case: infer_unions_quadruples_and_carries_a_declared_parameter
  main: |
    import polars as pl
    from astrolabe import Columns, InferredExpr, TypedDataFrame, column, infer

    Price = column("price", pl.Float64)

    def price_expr(currency: str) -> InferredExpr:
        if currency == "USD":
            return infer(pl.col("price_usd"))
        return infer(pl.col("price_eur").cast(pl.Float64))

    def scaled(price: Price, double: bool) -> InferredExpr:
        if double:
            return infer(price * 2)
        return infer(price / 2)

    class Trades(Columns):
        price: pl.Float64
        price_usd: pl.Int32
        price_eur: pl.String

    trades: TypedDataFrame[Trades]
    reveal_type(price_expr("USD"))  # N: Revealed type is "astrolabe.expr.TypedExpr[astrolabe.expr.Deferred[Literal["pl.col('price_usd')"]]] | astrolabe.expr.TypedExpr[astrolabe.expr.Deferred[Literal["pl.col('price_eur').cast(pl.Float64)"]]]"
    reveal_type(scaled(pl.col("price"), True))  # N: Revealed type is "astrolabe.expr.TypedExpr[astrolabe.expr.Deferred[Literal['$0 * 2'], astrolabe.expr.TypedColumn[Literal['price'], polars.datatypes.classes.Float64]]] | astrolabe.expr.TypedExpr[astrolabe.expr.Deferred[Literal['$0 / 2'], astrolabe.expr.TypedColumn[Literal['price'], polars.datatypes.classes.Float64]]]"
    reveal_type(trades.select(scaled(pl.col("price"), False)))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'price': polars.datatypes.classes.Float64}, closed=True), None]"
    reveal_type(trades.select(price_expr("USD")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'price_usd': polars.datatypes.classes.Int32}, closed=True), None] | astrolabe.frame.TypedDataFrame[TypedDict({'price_eur': polars.datatypes.classes.Float64}, closed=True), None]"

- case: a_method_with_an_inferred_return_type_types_each_call
  main: |
    from typing import TypeVar
    import polars as pl
    from astrolabe import Columns, InferredExpr, TypedDataFrame, infer

    ExprT = TypeVar("ExprT", bound=pl.Expr)

    class Maker:
        def make(self) -> InferredExpr:
            return infer(pl.col("q").cast(pl.Int32))

        def same(self, e: ExprT) -> InferredExpr:
            return infer(e)

    class Quantities(Columns):
        q: pl.Int64
        a: pl.Int64

    df: TypedDataFrame[Quantities]
    maker = Maker()
    # A call on an instance does not list `self`, so the argument binds the
    # type variable of the next parameter.
    reveal_type(df.select(maker.make()))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'q': polars.datatypes.classes.Int32}, closed=True), None]"
    reveal_type(df.select(maker.same(pl.col("a").cast(pl.Int8))))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'a': polars.datatypes.classes.Int8}, closed=True), None]"
    # A call on the class lists `self` as its first argument.
    reveal_type(df.select(Maker.same(maker, pl.col("a").cast(pl.Int16))))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'a': polars.datatypes.classes.Int16}, closed=True), None]"

