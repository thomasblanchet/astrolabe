- case: infer_finds_variants_and_misuses_inside_loops_and_with_blocks
  main: |
    import contextlib
    import polars as pl
    from astrolabe import InferredExpr, infer

    def looped(names: list[str], flag: bool, count: int) -> InferredExpr:
        for name in names:
            if name == "a":
                return infer(pl.col("a").abs())
        else:
            if flag:
                return infer(pl.col("b").abs())
        while count > 0:
            return infer(pl.col("c").abs())
        with contextlib.suppress(ValueError):
            return infer(pl.col("d").abs())
        return infer(pl.col("e").abs())

    def misplaced(names: list[str]) -> InferredExpr:
        for name in names:
            with contextlib.suppress(ValueError):
                result = infer(pl.col(name))
        return infer(pl.col("e"))

    reveal_type(looped([], True, 1))  # N: Revealed type is "astrolabe.expr.TypedExpr[astrolabe.expr.Deferred[Literal["pl.col('a').abs()"]]] | astrolabe.expr.TypedExpr[astrolabe.expr.Deferred[Literal["pl.col('b').abs()"]]] | astrolabe.expr.TypedExpr[astrolabe.expr.Deferred[Literal["pl.col('c').abs()"]]] | astrolabe.expr.TypedExpr[astrolabe.expr.Deferred[Literal["pl.col('d').abs()"]]] | astrolabe.expr.TypedExpr[astrolabe.expr.Deferred[Literal["pl.col('e').abs()"]]]"
    misplaced([])  # E: infer(...) must be the return statement's own expression  [infer-misuse]

- case: infer_dataframe_branching_unions_schemas_with_downstream_chaining
  main: |
    import polars as pl
    from astrolabe import Columns, infer, InferredDataFrame, TypedDataFrame

    class FrameSchema(Columns):
        a: pl.Int64
        b: pl.Int64

    Frame = TypedDataFrame[FrameSchema]

    def load(df: Frame, with_totals: bool) -> InferredDataFrame:
        if with_totals:
            return infer(df.with_columns((pl.col("a") + pl.col("b")).alias("total")))
        return infer(df)

    df: Frame
    result = load(df, True)
    reveal_type(result)  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'a': polars.datatypes.classes.Int64, 'b': polars.datatypes.classes.Int64, 'total': polars.datatypes.classes.Int64}, closed=True), None] | astrolabe.frame.TypedDataFrame[TypedDict(main.FrameSchema, {'a': polars.datatypes.classes.Int64, 'b': polars.datatypes.classes.Int64}, closed=True), None]"
    good = result.select(pl.col("total"))  # E: Unknown column "total"  [unknown-column]
    reveal_type(good)  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'total': polars.datatypes.classes.Int64}, closed=True), None] | astrolabe.frame.TypedDataFrame[TypedDict({'total': astrolabe.frame.Unchecked}, closed=True), None]"

- case: infer_generic_composition_via_explicit_typevar
  main: |
    import polars as pl
    from astrolabe import InferredExpr, infer

    def normalize[ExprT: pl.Expr](e: ExprT, upper: bool) -> InferredExpr:
        if upper:
            return infer(e)
        return infer(e)

    reveal_type(normalize(pl.col("name"), True))  # N: Revealed type is "astrolabe.expr.TypedExpr[astrolabe.expr.Deferred[Literal["pl.col('name')"]]]"
    reveal_type(normalize(pl.col("age"), False))  # N: Revealed type is "astrolabe.expr.TypedExpr[astrolabe.expr.Deferred[Literal["pl.col('age')"]]]"

