# infer()/InferredExpr/InferredDataFrame/InferredLazyFrame: a function's
# return type inferred from the union of what its own body computes
# across branches, instead of the user writing the union by hand.
#
# Scope:
# - A single infer(...) variant narrows the return type directly.
# - Multiple infer(...) variants (if/elif/try/for/while/with/match)
#   narrow to their union.
# - Dead code costs nothing: mypy never fires a hook for unreachable
#   code, so a dead infer(...) call never contributes a variant.
# - A variant that doesn't match the declared placeholder's family is a
#   [wrong-inferred-variant] error -- reported at a call site of the
#   Inferred*-returning function, not inside its own body: resolution
#   is call-site-driven, so an entirely uncalled function's own
#   internal misuse goes unreported, the same way an unused ordinary
#   generic function's own body is never instantiated against a
#   concrete type.
# - One untyped/erased variant collapses the whole function's return
#   type to the plain, erased type -- an [implicitly-inferred-fallback]
#   error only when disallow_implicit_inferred_fallback is set.
# - infer() used outside an Inferred*-returning function is an
#   [infer-misuse] error, reported immediately, with no call site
#   needed (there is no enclosing function to call). infer() reachable
#   but not the return statement's own expression is also
#   [infer-misuse], but -- like the family check -- only reported at a
#   call site of the enclosing function.
# - InferredDataFrame composes with real method chaining: a union of
#   whole frame schemas is checked per-branch by mypy automatically.
# - Generic composition works via an explicit TypeVar bound to
#   pl.Expr/TypedDataFrame/TypedLazyFrame -- no InferredExpr-specific
#   plugin code needed for this.

- case: infer_single_variant_narrows_directly
  main: |
    import polars as pl
    from astrolabe import InferredExpr, infer

    def price_expr() -> InferredExpr:
        return infer(pl.col("price").cast(pl.Float64))

    reveal_type(price_expr())  # N: Revealed type is "astrolabe.expr.TypedExpr[astrolabe.expr.Deferred[Literal["pl.col('price').cast(pl.Float64)"]]]"

- case: infer_multi_variant_narrows_to_union
