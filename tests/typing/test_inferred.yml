- case: a_call_above_the_body_waits_for_its_variants
  main: |
    import polars as pl
    from astrolabe import Columns, InferredExpr, TypedDataFrame, infer

    class FrameSchema(Columns):
        q: pl.Int64

    # mypy checks these functions again after the body of later().
    def early(df: TypedDataFrame[FrameSchema]) -> None:
        reveal_type(later())  # N: Revealed type is "astrolabe.expr.TypedExpr[astrolabe.expr.Deferred[Literal["pl.col('q')"]]]"
        reveal_type(df.select(later()))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict(main.FrameSchema, {'q': polars.datatypes.classes.Int64}, closed=True), None]"

    class Holder:
        def method(self) -> None:
            reveal_type(later())  # N: Revealed type is "astrolabe.expr.TypedExpr[astrolabe.expr.Deferred[Literal["pl.col('q')"]]]"

    def outer() -> None:
        def inner() -> None:
            reveal_type(later())  # N: Revealed type is "astrolabe.expr.TypedExpr[astrolabe.expr.Deferred[Literal["pl.col('q')"]]]"
        inner()

    # A body that calls itself has no variant before its own return.
    def recursive() -> InferredExpr:
        reveal_type(recursive())  # N: Revealed type is "astrolabe.declare.InferredExpr"
        return infer(pl.col("q"))

    # A body that returns no infer(...) gives no variant to wait for.
    def empty() -> InferredExpr:  # E: Missing return statement  [empty-body]
        ...

    def uses_empty() -> None:
        reveal_type(empty())  # N: Revealed type is "astrolabe.declare.InferredExpr"

    # A call at the top of the module has no function that mypy can check again.
    reveal_type(later())  # N: Revealed type is "astrolabe.declare.InferredExpr" # E: Name "later" is used before definition  [used-before-def]

    def later() -> InferredExpr:
        return infer(pl.col("q"))

- case: a_call_above_the_body_reports_only_in_the_last_pass
  main: |
    import polars as pl
    from astrolabe import Columns, InferredExpr, TypedDataFrame, infer

    class FrameSchema(Columns):
        q: pl.Int64

    # The first pass of early() gives the call no type, and reports nothing for it.
    def early(df: TypedDataFrame[FrameSchema]) -> None:
        reveal_type(df.select(later()))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict(main.FrameSchema, {'q': polars.datatypes.classes.Int64}, closed=True), None]"
        df.select(pl.col("q").map_elements(lambda v: v))  # E: Column "q" of "map_elements" is Unchecked: a Python function decides the type, and no return_dtype= names it  [implicitly-unchecked] # N: set allow_unproven = "omitted" in [tool.astrolabe] to allow this, or set [tool.astrolabe.allow_unproven_overrides] map_elements = "omitted"

    def later() -> InferredExpr:
        return infer(pl.col("q"))
