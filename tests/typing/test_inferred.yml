- case: infer_open_receiver_is_written_in_the_callers_terms
  main: |
    import polars as pl
    from astrolabe import Columns, infer, InferredDataFrame, other_columns, TypedDataFrame

    Rest = other_columns()
    Mine = other_columns()

    class DfSchema(Columns):
        a: pl.Int64

    class Full(Columns):
        a: pl.Int64
        b: pl.String

    def maybe_flag(
        df: TypedDataFrame[DfSchema, Rest],
        flag: bool,
    ) -> InferredDataFrame:
        if flag:
            return infer(df.with_columns(pl.lit(True).alias("flag")))
        return infer(df)

    # A closed caller gets closed frames that name its own column "b".
    full: TypedDataFrame[Full]
    reveal_type(maybe_flag(full, True))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'a': polars.datatypes.classes.Int64, 'flag': polars.datatypes.classes.Boolean, 'b': polars.datatypes.classes.String}, closed=True), None] | astrolabe.frame.TypedDataFrame[TypedDict({'a': polars.datatypes.classes.Int64, 'b': polars.datatypes.classes.String}, closed=True), None]"
    # An open caller gets its own remainder, not the function's.
    mine: TypedDataFrame[DfSchema, Mine]
    reveal_type(maybe_flag(mine, True))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'a': polars.datatypes.classes.Int64, 'flag': polars.datatypes.classes.Boolean}, closed=True), astrolabe.remainder.Minus[main.Mine, Literal['flag']]] | astrolabe.frame.TypedDataFrame[TypedDict(main.DfSchema, {'a': polars.datatypes.classes.Int64}, closed=True), main.Mine]"

- case: infer_with_one_closed_and_one_open_frame_is_written_in_the_callers_terms
  main: |
    import polars as pl
    from astrolabe import Columns, infer, InferredDataFrame, other_columns, TypedDataFrame

    R1 = other_columns()
    R2 = other_columns()
    Mine = other_columns()

    class A(Columns):
        a: pl.Int64

    class B(Columns):
        b: pl.Int64

    class Full(Columns):
        a: pl.Int64
        x: pl.String

    def first(left: TypedDataFrame[A, R1], right: TypedDataFrame[B, R2]) -> InferredDataFrame:
