- case: update_keeps_the_receivers_schema_when_every_shared_dtype_matches
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class LeftSchema(Columns):
        foo: pl.Int64
        bar: pl.String

    # update() keeps the receiver's own column names, in order: a
    # column only "other" has is dropped, confirmed against real polars
    # 1.43.2 even under how="full".
    Left = TypedDataFrame[LeftSchema]

    class RightSchema(Columns):
        foo: pl.Int64
        baz: pl.Int64

    Right = TypedDataFrame[RightSchema]

    left: Left
    right: Right
    narrowed: Left = left.update(right, on="foo")

- case: update_promotes_a_shared_column_to_the_supertype_of_both_sides
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class LeftSchema(Columns):
        k: pl.Int64
        v: pl.Int16

    # Confirmed against real polars 1.43.2:
    # {k: Int64, v: Int16}.update({k: Int64, v: Int64}, on="k") really
    # returns {k: Int64, v: Int64}. Declaring the result as the
    # receiver's own schema was unsound.
    Left = TypedDataFrame[LeftSchema]

    class RightSchema(Columns):
        k: pl.Int64
        v: pl.Int64

    Right = TypedDataFrame[RightSchema]

    left: Left
    right: Right
    reveal_type(left.update(right, on="k"))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'k': polars.datatypes.classes.Int64, 'v': polars.datatypes.classes.Int64}, closed=True), None]"

