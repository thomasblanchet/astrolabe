# Polars converts a count of rows to an integer of a fixed width before it
# reads any data, so a count outside that width raises at the call.
- case: a_count_of_rows_outside_the_width_that_polars_reads_is_an_error
  main: |
    from typing import Final, Literal

    import polars as pl
    from astrolabe import Columns, TypedDataFrame, TypedLazyFrame

    BIG: Final = 2**64

    class Rows(Columns):
        k: pl.String
        x: pl.Int64

    def run(df: TypedDataFrame[Rows], lf: TypedLazyFrame[Rows]) -> None:
        df.head(BIG)  # E: head() with n=18446744073709551616 raises OverflowError: polars reads it as a whole number up to 18446744073709551615  [invalid-call-shape]
        df.head(-(2**70))
        lf.head(-1)  # E: head() with n=-1 raises ValueError: polars reads it as a whole number from 0 to 4294967295  [invalid-call-shape]
        df.slice(2**63)  # E: slice() with offset=9223372036854775808 raises OverflowError: polars reads it as a whole number from -9223372036854775808 to 9223372036854775807  [invalid-call-shape]
        lf.top_k(2**32, by="x")  # E: top_k() with k=4294967296 raises OverflowError: polars reads it as a whole number from 0 to 4294967295  [invalid-call-shape]
        df.gather_every(0)  # E: gather_every() with n=0 raises InvalidOperationError: polars reads it as a whole number from 1 to 18446744073709551615  [invalid-call-shape]
        df.with_row_index(offset=2**32)  # E: with_row_index() with offset=4294967296 raises ValueError: polars reads it as a whole number from 0 to 4294967295  [invalid-call-shape]
        df.group_by("k").head(-1)  # E: head() with n=-1 raises OverflowError: polars reads it as a whole number from 0 to 18446744073709551615  [invalid-call-shape]
        reveal_type(df.head(3))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict(main.Rows, {'k': polars.datatypes.classes.String, 'x': polars.datatypes.classes.Int64}, closed=True), None]"

    def typed(df: TypedDataFrame[Rows], lf: TypedLazyFrame[Rows], n: Literal[-1]) -> None:
        lf.head(n)  # E: head() with n=-1 raises ValueError: polars reads it as a whole number from 0 to 4294967295  [invalid-call-shape]
        lf.head((count := -1))  # E: head() with n=-1 raises ValueError: polars reads it as a whole number from 0 to 4294967295  [invalid-call-shape]
        df.group_by("k").head(3, count)  # E: Too many arguments for "head" of "GroupBy"  [call-arg]

# A key of `sort`, `top_k` or `bottom_k` adds no column, and polars still
# evaluates it over the frame: a key that reads a missing column, or that
# polars refuses at the data types of the frame, raises.
- case: a_key_that_orders_the_rows_is_evaluated_over_the_frame
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame, TypedLazyFrame

    class Rows(Columns):
        s: pl.Int64
        a: pl.String

    df: TypedDataFrame[Rows]
    lf: TypedLazyFrame[Rows]
    df.sort(pl.col("s").str.len_chars())  # E: "s" has no result type at this frame's column types: str.len_chars does not accept Int64, and polars raises SchemaError  [unsupported-dtype-op]
    df.sort("zz")  # E: Unknown column "zz"  [unknown-column]
    df.sort(["s", pl.col("a").abs()])  # E: "a" has no result type at this frame's column types: abs does not accept String, and polars raises InvalidOperationError  [unsupported-dtype-op]
    lf.sort(by=pl.col("s").str.len_chars())  # E: "s" has no result type at this frame's column types: str.len_chars does not accept Int64, and polars raises SchemaError  [unsupported-dtype-op]
    df.top_k(2, by=pl.col("a").abs())  # E: "a" has no result type at this frame's column types: abs does not accept String, and polars raises InvalidOperationError  [unsupported-dtype-op]
    reveal_type(df.sort(pl.col("s") * -1, "a", descending=True))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict(main.Rows, {'s': polars.datatypes.classes.Int64, 'a': polars.datatypes.classes.String}, closed=True), None]"

