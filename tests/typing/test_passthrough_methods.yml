- case: update_leaves_a_join_key_at_the_receivers_own_dtype
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class LeftSchema(Columns):
        k: pl.Int16
        v: pl.Int64

    # A join key matches rows and never contributes a value, confirmed
    # against real polars 1.43.2:
    # {k: Int64}.update({k: Int32}, on="k") returns {k: Int64}, while
    # the same pair in a non-key column would widen to Int64 anyway, so
    # this case uses a narrower receiver key to tell the two apart.
    Left = TypedDataFrame[LeftSchema]

    class RightSchema(Columns):
        k: pl.Int64
        v: pl.Int64

    Right = TypedDataFrame[RightSchema]

    left: Left
    right: Right
    reveal_type(left.update(right, on="k"))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict(main.LeftSchema, {'k': polars.datatypes.classes.Int16, 'v': polars.datatypes.classes.Int64}, closed=True), None]"

