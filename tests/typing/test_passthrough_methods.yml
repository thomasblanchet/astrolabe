- case: a_method_that_keeps_the_type_takes_the_parameters_of_polars
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame, TypedLazyFrame

    class Rows(Columns):
        x: pl.Int64

    class MyFrame(TypedDataFrame[Rows]):
        pass

    def run(df: TypedDataFrame[Rows], lf: TypedLazyFrame[Rows], mine: MyFrame) -> None:
        lf.head(1, 2)  # E: Too many arguments for "head" of "TypedLazyFrame"  [call-arg]
