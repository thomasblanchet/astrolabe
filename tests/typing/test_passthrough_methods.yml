# Frame methods that select, reorder, deduplicate or slice rows, and so
# never change the column list or a data type. Their polars stubs return
# a plain `DataFrame` or `LazyFrame`, so `frame.py` gives each a `Self`
# override. `select_seq` and `with_columns_seq` reuse the hooks of
# `select` and `with_columns`, and `merge_sorted` reuses the schema check
# of `vstack`. `rechunk` and `sample` exist only on `DataFrame`.
#
# `fill_null`, `fill_nan` and `interpolate` can change a data type, and
# their cases are at the end of this file. `fill_null` and `fill_nan`
# record the expression that polars runs for them, and the hook of
# `with_columns` or `select` types it.

- case: filter_narrows_precisely
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class FrameSchema(Columns):
        foo: pl.Int64

    Frame = TypedDataFrame[FrameSchema]

    df: Frame
    narrowed: Frame = df.filter(pl.col("foo") > 0)

