- case: a_class_derived_from_a_typed_frame_is_read_through_its_base
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class A(Columns):
        a: pl.Int64

    class MyFrame(TypedDataFrame[A]):
        def custom(self) -> int:
            return 1

    class Own(TypedDataFrame[A]):
        def select(self, *args: object, **kwargs: object) -> "Own":
            return self

    def need(df: TypedDataFrame[A]) -> None: ...

    def f(m: MyFrame, o: Own) -> None:
        out = m.select(pl.lit("x").alias("z"))
        reveal_type(out)  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'z': polars.datatypes.classes.String}, closed=True), None]"
        t: TypedDataFrame[A] = out  # E: Incompatible types in assignment (expression has type "TypedDataFrame[TypedDict({'z': String}), None]", variable has type "TypedDataFrame[A, None]")  [assignment]
        reveal_type(m["a"])  # N: Revealed type is "astrolabe.frame.TypedSeries[Literal['a'], polars.datatypes.classes.Int64]"
        reveal_type(m.get_column("a"))  # N: Revealed type is "astrolabe.frame.TypedSeries[Literal['a'], polars.datatypes.classes.Int64]"
        reveal_type(m.schema)  # N: Revealed type is "polars.schema.Schema"
        reveal_type(m.with_columns(b=pl.col("a") + 1))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'a': polars.datatypes.classes.Int64, 'b': polars.datatypes.classes.Int64}, closed=True), None]"
        m.select("zzz")  # E: Unknown column "zzz"  [unknown-column]
        need(m)
        # A method that the derived class defines keeps its own type.
        reveal_type(o.select("a"))  # N: Revealed type is "main.Own"
        reveal_type(m.custom())  # N: Revealed type is "int"

