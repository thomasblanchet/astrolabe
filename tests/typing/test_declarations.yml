- case: rule_four_same_names_one_read
  main: |
    import polars as pl
    from astrolabe import column, same, typed_expr

    A = column("a", pl.Int64)
    B = column("b", pl.Int64)
    Good = typed_expr(A, B, gives=same("a"), named="out")
    BadBare = typed_expr(A, B, gives=same, named="out")  # E: Malformed declaration: same with no argument needs one read. Write same(name)  [malformed-declaration]
    BadName = typed_expr(A, B, gives=same("zz"), named="out")  # E: Malformed declaration: same(name) names a column the declaration does not read  [malformed-declaration]

    def f(g: Good) -> None:
        reveal_type(g)  # N: Revealed type is "astrolabe.expr.TypedExpr[astrolabe.expr.Reads[astrolabe.frame.Column[Literal['a'], polars.datatypes.classes.Int64], astrolabe.frame.Column[Literal['b'], polars.datatypes.classes.Int64]], astrolabe.frame.Column[Literal['out'], astrolabe.expr.Same[Literal['a']]]]"

- case: rule_five_and_eight_one_blank_standing_alone
