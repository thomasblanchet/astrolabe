# The declaration surface: `column`, `typed_expr`, `typed_agg`,
# `typed_lit`, `row`, `some_column`, `same`, `wrap`, `column_of` and
# `subset_of`. A declaration is a named value; the plugin reads the
# call during semantic analysis and gives the name the expression
# type the declaration describes, spelled by the one codec. Each
# well-formedness rule is checked at the declaration itself.

- case: column_declares_the_identity_at_one_type
  main: |
    import polars as pl
    from astrolabe import column

    Price = column("price", pl.Float64)
    When = column("when", pl.Datetime("us"))

    def f(price: Price, when: When) -> None:
        reveal_type(price)  # N: Revealed type is "astrolabe.expr.TypedColumn[Literal['price'], polars.datatypes.classes.Float64]"
        reveal_type(when)  # N: Revealed type is "astrolabe.expr.TypedColumn[Literal['when'], astrolabe.frame.Datetime[Literal['us'], None]]"

- case: column_declares_a_region
  main: |
    import polars as pl
    from astrolabe import EveryDType, Unchecked, column
    from polars.datatypes.classes import FloatType

    Any = column("x", EveryDType)
    Floats = column("x", FloatType)
    Some = column("x", {pl.Int8, pl.Int16})
    Trusted = column("x", Unchecked)

    def f(a: Any, b: Floats, c: Some, d: Trusted) -> None:
        reveal_type(a)  # N: Revealed type is "astrolabe.expr.TypedColumn[Literal['x'], astrolabe.expr.EveryDType]"
        reveal_type(b)  # N: Revealed type is "astrolabe.expr.TypedColumn[Literal['x'], polars.datatypes.classes.FloatType]"
        reveal_type(c)  # N: Revealed type is "astrolabe.expr.TypedColumn[Literal['x'], polars.datatypes.classes.Int16 | polars.datatypes.classes.Int8]"
        reveal_type(d)  # N: Revealed type is "astrolabe.expr.TypedColumn[Literal['x'], astrolabe.frame.Unchecked]"

- case: typed_expr_declares_reads_gives_and_name
  main: |
    import polars as pl
    from astrolabe import column, typed_expr

    Quantity = column("quantity", pl.Int64)
    BuyFlag = typed_expr(Quantity, gives=pl.Boolean, named="is_buy")
    Inline = typed_expr(column("q", pl.Int64), gives=pl.Boolean, named="f")
    Stamped = typed_expr(Quantity, gives=pl.Datetime("ms"), named="t")

    def f(a: BuyFlag, b: Inline, c: Stamped) -> None:
        reveal_type(a)  # N: Revealed type is "astrolabe.expr.TypedExpr[astrolabe.expr.Reads[astrolabe.frame.Column[Literal['quantity'], polars.datatypes.classes.Int64]], astrolabe.frame.Column[Literal['is_buy'], polars.datatypes.classes.Boolean]]"
        reveal_type(b)  # N: Revealed type is "astrolabe.expr.TypedExpr[astrolabe.expr.Reads[astrolabe.frame.Column[Literal['q'], polars.datatypes.classes.Int64]], astrolabe.frame.Column[Literal['f'], polars.datatypes.classes.Boolean]]"
        reveal_type(c)  # N: Revealed type is "astrolabe.expr.TypedExpr[astrolabe.expr.Reads[astrolabe.frame.Column[Literal['quantity'], polars.datatypes.classes.Int64]], astrolabe.frame.Column[Literal['t'], astrolabe.frame.Datetime[Literal['ms'], None]]]"

- case: typed_agg_and_typed_lit_carry_their_character
  main: |
    import polars as pl
    from astrolabe import column, same, typed_agg, typed_lit, wrap

    Quantity = column("quantity", pl.Int64)
    Total = typed_agg(Quantity, gives=pl.Int64)
    Imploded = typed_agg(Quantity, gives=wrap(pl.List, same))
    RowCount = typed_agg(gives=pl.UInt32, named="len")
    Flag = typed_lit(gives=pl.Boolean)
    Named = typed_lit(gives=pl.Int64, named="one")

    def f(a: Total, b: Imploded, c: RowCount, d: Flag, e: Named) -> None:
        reveal_type(a)  # N: Revealed type is "astrolabe.expr.TypedAgg[astrolabe.expr.Reads[astrolabe.frame.Column[Literal['quantity'], polars.datatypes.classes.Int64]], astrolabe.frame.Column[Literal['quantity'], astrolabe.expr.Same[Literal['quantity']]]]"
        reveal_type(b)  # N: Revealed type is "astrolabe.expr.TypedAgg[astrolabe.expr.Reads[astrolabe.frame.Column[Literal['quantity'], polars.datatypes.classes.Int64]], astrolabe.frame.Column[Literal['quantity'], astrolabe.expr.Wrap[polars.datatypes.classes.List, astrolabe.expr.Same[Literal['quantity']]]]]"
        reveal_type(c)  # N: Revealed type is "astrolabe.expr.TypedAgg[astrolabe.expr.Reads[()], astrolabe.frame.Column[Literal['len'], polars.datatypes.classes.UInt32]]"
        reveal_type(d)  # N: Revealed type is "astrolabe.expr.TypedLit[astrolabe.expr.Reads[()], astrolabe.frame.Column[Literal['literal'], polars.datatypes.classes.Boolean]]"
        reveal_type(e)  # N: Revealed type is "astrolabe.expr.TypedLit[astrolabe.expr.Reads[()], astrolabe.frame.Column[Literal['one'], polars.datatypes.classes.Int64]]"

- case: rows_declare_several_areas_of_one_map
  main: |
    import polars as pl
    from astrolabe import column, row, same, typed_agg

    Total = typed_agg(
        row(column("quantity", {pl.Int32, pl.Float32}), gives=pl.Int64),
        row(column("quantity", {pl.Int64, pl.Float64}), gives=same),
    )

    def f(a: Total) -> None:
        reveal_type(a)  # N: Revealed type is "astrolabe.expr.TypedAgg[astrolabe.expr.Reads[astrolabe.frame.Column[Literal['quantity'], polars.datatypes.classes.Float32 | polars.datatypes.classes.Float64 | polars.datatypes.classes.Int32 | polars.datatypes.classes.Int64]], astrolabe.frame.Column[Literal['quantity'], astrolabe.expr.Rows[astrolabe.expr.Row[polars.datatypes.classes.Float64 | polars.datatypes.classes.Int64, astrolabe.expr.Same[Literal['quantity']]], astrolabe.expr.Row[polars.datatypes.classes.Float32 | polars.datatypes.classes.Int32, polars.datatypes.classes.Int64]]]]"

- case: rows_of_one_outcome_that_form_no_product_take_overlapping_rectangles
  main: |
    import polars as pl
    from astrolabe import column, row, typed_expr

    # The three cells that give Float64 form an L, not a product of kinds.
    # The type writes them as two rectangles that share the cell (String, String).
    Cross = typed_expr(
        row(column("a", pl.Int64), column("b", pl.String), gives=pl.Float64),
        row(column("a", pl.String), column("b", pl.String), gives=pl.Float64),
        row(column("a", pl.String), column("b", pl.Int64), gives=pl.Float64),
        row(column("a", pl.Int64), column("b", pl.Int64), gives=pl.Boolean),
        named="z",
    )

    def f(e: Cross) -> None:
        reveal_type(e)  # N: Revealed type is "astrolabe.expr.TypedExpr[astrolabe.expr.Reads[astrolabe.frame.Column[Literal['a'], polars.datatypes.classes.Int64 | polars.datatypes.classes.String], astrolabe.frame.Column[Literal['b'], polars.datatypes.classes.Int64 | polars.datatypes.classes.String]], astrolabe.frame.Column[Literal['z'], astrolabe.expr.Rows[astrolabe.expr.Row[polars.datatypes.classes.Int64, polars.datatypes.classes.Int64, polars.datatypes.classes.Boolean], astrolabe.expr.Row[polars.datatypes.classes.Int64 | polars.datatypes.classes.String, polars.datatypes.classes.String, polars.datatypes.classes.Float64], astrolabe.expr.Row[polars.datatypes.classes.String, polars.datatypes.classes.Int64 | polars.datatypes.classes.String, polars.datatypes.classes.Float64]]]]"

- case: some_column_declares_a_blank_read
  main: |
    import polars as pl
    from astrolabe import same, some_column, typed_agg, typed_expr
    from polars.datatypes.classes import FloatType

    Standardised = typed_expr(some_column(FloatType), gives=same)
    Counted = typed_agg(some_column(pl.String), gives=pl.UInt32)

    def f(a: Standardised, b: Counted) -> None:
        reveal_type(a)  # N: Revealed type is "astrolabe.expr.TypedColumn[astrolabe.expr.Blank, polars.datatypes.classes.FloatType]"
        reveal_type(b)  # N: Revealed type is "astrolabe.expr.TypedAgg[astrolabe.expr.Reads[astrolabe.frame.Column[astrolabe.expr.Blank, polars.datatypes.classes.String]], astrolabe.frame.Column[astrolabe.expr.Blank, polars.datatypes.classes.UInt32]]"

- case: schema_references_read_at_the_declared_types
  main: |
    import polars as pl
    from astrolabe import Columns, Unchecked, column_of, subset_of, typed_expr

    class Trades(Columns):
        symbol: pl.String
        price: pl.Float64
        quantity: pl.Int64
        note: Unchecked

    FlagRule = typed_expr(Trades, gives=pl.Boolean, named="flag")
    Legs = typed_expr(subset_of(Trades, "price", "quantity"), gives=pl.Float64, named="notional")
    One = typed_expr(column_of(Trades, "price"), gives=pl.Float64)

    def f(a: FlagRule, b: Legs, c: One) -> None:
        reveal_type(a)  # N: Revealed type is "astrolabe.expr.TypedExpr[astrolabe.expr.Reads[astrolabe.frame.Column[Literal['note'], astrolabe.frame.Unchecked], astrolabe.frame.Column[Literal['price'], polars.datatypes.classes.Float64], astrolabe.frame.Column[Literal['symbol'], polars.datatypes.classes.String], astrolabe.frame.Column[Literal['quantity'], polars.datatypes.classes.Int64]], astrolabe.frame.Column[Literal['flag'], polars.datatypes.classes.Boolean]]"
        reveal_type(b)  # N: Revealed type is "astrolabe.expr.TypedExpr[astrolabe.expr.Reads[astrolabe.frame.Column[Literal['price'], polars.datatypes.classes.Float64], astrolabe.frame.Column[Literal['quantity'], polars.datatypes.classes.Int64]], astrolabe.frame.Column[Literal['notional'], astrolabe.expr.Same[Literal['price']]]]"
        reveal_type(c)  # N: Revealed type is "astrolabe.expr.TypedColumn[Literal['price'], polars.datatypes.classes.Float64]"

