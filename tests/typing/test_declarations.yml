- case: a_forward_reference_waits_for_the_name
  main: |
    import polars as pl
    from astrolabe import Columns, column, typed_expr

    # A class whose own field is a forward reference is incomplete on
    # the first pass, so a declaration naming it registers nothing
    # and reports nothing until mypy analyzes the statement again.
    Sized = column("size", Deferred)  # E: Name "Deferred" is used before definition  [used-before-def]
    Rule = typed_expr(Deferred, gives=pl.Boolean, named="flag")  # E: Name "Deferred" is used before definition  [used-before-def]

    class Deferred(Columns):
        n: Later

    Later = pl.Int64

    def f(size: Sized, rule: Rule) -> None:  # E: Variable "main.Sized" is not valid as a type  [valid-type] # N: See https://mypy.readthedocs.io/en/stable/common_issues.html#variables-vs-type-aliases
        reveal_type(rule)  # N: Revealed type is "astrolabe.expr.TypedExpr[astrolabe.expr.Reads[astrolabe.frame.Column[Literal['n'], polars.datatypes.classes.Int64]], astrolabe.frame.Column[Literal['flag'], polars.datatypes.classes.Boolean]]"

- case: a_malformed_call_registers_nothing
  main: |
    import polars as pl
    from astrolabe import column, column_of, other_columns, row, typed_expr

    Rest = other_columns()
    three = 3
    NotARead = typed_expr(Rest, gives=pl.Boolean, named="z")  # E: Malformed declaration: a read is column(name, region), some_column(region), a declared column, a Columns class, column_of(...) or subset_of(...)  [malformed-declaration]
    NotAReadEither = typed_expr(three, gives=pl.Boolean, named="z")  # E: Malformed declaration: a read is column(name, region), some_column(region), a declared column, a Columns class, column_of(...) or subset_of(...)  [malformed-declaration]
    NotASchema = typed_expr(column_of(three, "p"), gives=pl.Boolean, named="z")  # E: Malformed declaration: a read is column(name, region), some_column(region), a declared column, a Columns class, column_of(...) or subset_of(...)  [malformed-declaration]
    NoGives = typed_expr(column("a", pl.Int64))  # E: Malformed declaration: gives= is required  [malformed-declaration]
    BadGives = typed_expr(column("a", pl.Int64), gives=1)  # E: Malformed declaration: gives= must be a data type, same, same(name) or wrap(...)  [malformed-declaration]
    Mixed = typed_expr(row(column("a", pl.Int64), gives=pl.Boolean), column("b", pl.Int64), named="z")  # E: Malformed declaration: rows and bare reads cannot mix  [malformed-declaration]
    BadName = typed_expr(column("a", pl.Int64), gives=pl.Boolean, named=3)  # E: Malformed declaration: named= must be a string literal  [malformed-declaration] # E: Argument "named" to "typed_expr" has incompatible type "int"; expected "str | None"  [arg-type]
    Extra = typed_expr(column("a", pl.Int64), gives=pl.Boolean, wat=1)  # E: Malformed declaration: unexpected keyword wat=  [malformed-declaration] # E: Unexpected keyword argument "wat" for "typed_expr"  [call-arg] # N: "typed_expr" defined in "astrolabe.declare"
    NoName = column(3, pl.Int64)  # E: Argument 1 to "column" has incompatible type "int"; expected "str"  [arg-type]
    BadRegion = column("a", 3)
    BadSet = column("a", {pl.Int64, 3})

    def f(a: NotARead) -> None: ...  # E: Variable "main.NotARead" is not valid as a type  [valid-type] # N: See https://mypy.readthedocs.io/en/stable/common_issues.html#variables-vs-type-aliases

- case: a_marker_written_by_hand_is_checked
  main: |
    from typing import Literal
    import polars as pl
    from astrolabe import Columns, Struct, TypedDataFrame, other_columns
    from astrolabe.frame import Column, TypedGroupBy
    from astrolabe.remainder import DeclaredRemainder, DisjointFrom, Matching, Only

    Rest = other_columns()

    class FrameSchema(Columns):
        a: pl.Int64
        s: Struct[Column[Literal["x"], pl.Int64]]

    # A Matching[...] holds a signature that the checker writes, not a pattern.
    def matching(df: TypedDataFrame[FrameSchema, Only[Rest, Matching[Literal["^p$"]]]]) -> None: ...  # E: TypedDataFrame[...]/TypedLazyFrame[...]'s second argument must be a remainder: a class declared with other_columns(...), a remainder marker over one, or SplitColumns[...]  [marker-arg]

    class Loose(DeclaredRemainder, DisjointFrom[None]):
        pass

    def need(df: TypedDataFrame[FrameSchema, Loose]) -> None: ...

    def fit(df: TypedDataFrame[FrameSchema, Rest]) -> None:
        need(df)  # E: "Loose" states a relation that names no remainder: DisjointFrom[...] and Within[...] take classes declared with other_columns(...)  [marker-arg]

    def grouped(gb: TypedGroupBy[int, int, None]) -> None: ...  # E: TypedGroupBy[...] takes a tuple of Column[...] for the keys, a tuple of Column[...] for the declared columns, and the remainder  [marker-arg]

