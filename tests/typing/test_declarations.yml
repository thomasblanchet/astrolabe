- case: rule_two_every_row_reads_the_same_names
  main: |
    import polars as pl
    from astrolabe import column, row, same, typed_agg

    Bad = typed_agg(  # E: Malformed declaration: the rows read different columns. Give every row the same reads  [malformed-declaration]
        row(column("a", pl.Int64), gives=pl.Int64),
        row(column("b", pl.Int64), gives=same),
    )

- case: rule_three_rows_are_disjoint
  main: |
    import polars as pl
    from astrolabe import column, row, same, typed_agg

    Bad = typed_agg(  # E: Malformed declaration: two rows cover the same cell. Make the rows disjoint  [malformed-declaration]
        row(column("a", {pl.Int32, pl.Int64}), gives=pl.Int64),
        row(column("a", {pl.Int64, pl.Float64}), gives=same),
