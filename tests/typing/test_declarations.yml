- case: a_declared_column_names_a_struct_field
  main: |
    import polars as pl
    from astrolabe import column, Columns, Struct, TypedDataFrame, Unchecked
    from polars.datatypes.classes import FloatType

    Price = column("price", pl.Float64)
    When = column("when", pl.Datetime("us"))
    Note = column("note", Unchecked)
    Floats = column("x", FloatType)

    class NestedSchema(Columns):
        s: Struct[Price, When, Note]

    Nested = TypedDataFrame[NestedSchema]
    nested: Nested
    reveal_type(nested)  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict(main.NestedSchema, {'s': astrolabe.frame.Struct[tuple[astrolabe.frame.Column[Literal['price'], polars.datatypes.classes.Float64], astrolabe.frame.Column[Literal['when'], astrolabe.frame.Datetime[Literal['us'], None]], astrolabe.frame.Column[Literal['note'], astrolabe.frame.Unchecked]]]}, closed=True), None]"

    class BadSchema(Columns):
        s: Struct[Floats]  # E: Struct[...] arguments must be Column[...]  [marker-arg]

- case: rule_one_typed_expr_reads_at_least_one_column
  main: |
    import polars as pl
    from astrolabe import typed_agg, typed_expr

