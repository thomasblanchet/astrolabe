    from astrolabe import column, same, some_column, typed_expr

    Two = typed_expr(some_column(pl.Int64), some_column(pl.Int64), gives=pl.Boolean, named="z")  # E: Malformed declaration: the declaration has more than one some_column read. Keep one  [malformed-declaration] # E: Malformed declaration: a some_column read stands beside another read. Declare it alone  [malformed-declaration]
    Beside = typed_expr(column("a", pl.Int64), some_column(pl.Int64), gives=pl.Boolean, named="z")  # E: Malformed declaration: a some_column read stands beside another read. Declare it alone  [malformed-declaration]
    Renamed = typed_expr(some_column(pl.Int64), gives=same, named="z")  # E: Malformed declaration: named= renames a some_column read. Delete named=  [malformed-declaration]

