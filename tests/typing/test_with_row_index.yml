- case: with_row_index_on_plain_dataframe_is_unaffected
  main: |
    import polars as pl

    df: pl.DataFrame
    reveal_type(df.with_row_index())  # N: Revealed type is "polars.dataframe.frame.DataFrame"

- case: with_row_index_on_plain_lazyframe_is_unaffected
  main: |
    import polars as pl

    lf: pl.LazyFrame
    reveal_type(lf.with_row_index())  # N: Revealed type is "polars.lazyframe.frame.LazyFrame"
