        df.group_by("x")  # E: The result of "group_by" has no known schema: the undeclared columns of the frame can hold the name, or not  [implicitly-untyped] # N: set allow_unproven = "possible" in [tool.astrolabe] to allow this, or set [tool.astrolabe.allow_unproven_overrides] group_by = "possible"

