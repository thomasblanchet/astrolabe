        k: pl.String
        v: pl.Int64

    class NumSchema(Columns):
        k: pl.String

    def f(
        df: TypedDataFrame[DfSchema, R],
        num: TypedDataFrame[NumSchema, Num],
    ) -> None:
        # A named aggregation keeps no remainder column.
        reveal_type(df.group_by("k").agg(pl.col("v").sum()))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'k': polars.datatypes.classes.String, 'v': polars.datatypes.classes.Int64}, closed=True), None]"
        # Every remainder column becomes a List of its own type, a list of several types.
        reveal_type(df.group_by("k").agg(pl.all()))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'k': polars.datatypes.classes.String, 'v': astrolabe.frame.List[polars.datatypes.classes.Int64]}, closed=True), astrolabe.remainder.Retyped[main.R, astrolabe.frame.List[astrolabe.frame.Unchecked]]]"
        # The count of distinct values is a UInt32 at every numeric kind.
        reveal_type(num.group_by("k").agg(cs.numeric().n_unique()))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'k': polars.datatypes.classes.String}, closed=True), astrolabe.remainder.Retyped[astrolabe.remainder.Only[main.Num, astrolabe.remainder.OfType[polars.datatypes.classes.NumericType]], polars.datatypes.classes.UInt32]]"
        # A String remainder column has no sum, so the selection fails for some callers.
        df.group_by("k").agg(pl.all().sum())  # E: The selection has no result type at a type the remainder can hold  [unsupported-dtype-op]
