- case: agg_variable_holding_bare_column_narrows_to_list_of_source_dtype
  main: |
    import polars as pl
    from astrolabe import Columns, List, TypedDataFrame

    class FrameSchema(Columns):
        k: pl.String
        v: pl.Int64

    # Tier 4 Milestone 4: `.agg()` now recognizes a `TypedExpr` argument
    # by its own mypy-inferred type (via ctx.api.get_expression_type),
    # not just by AST shape -- so a variable holding a bare column, not
    # visible as `pl.col(...)` in the call's own raw AST, now narrows
    # too, the same "cannot see through a variable" motivating bug
    # Tier 4 as a whole exists to fix. Falls back to List[D] the same
    # as a bare `pl.col(name)` argument would.
    Frame = TypedDataFrame[FrameSchema]

    df: Frame
    some_expr = pl.col("v")

    class NarrowedSchema(Columns):
        k: pl.String
        v: List[pl.Int64]

    narrowed: TypedDataFrame[NarrowedSchema] = df.group_by("k").agg(some_expr)

