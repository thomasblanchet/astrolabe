# A rolling group-by gives its keys, its index column, then the aggregations. Over windows
# that overlap, polars builds the list of each window at the type of its data.
- case: a_rolling_group_by_gives_the_keys_the_index_then_the_aggregations
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame, TypedLazyFrame

    class Rows(Columns):
        i: pl.Int64
        k: pl.String
        x: pl.Float64
        t: pl.String

    df: TypedDataFrame[Rows]
    lf: TypedLazyFrame[Rows]
    reveal_type(df.rolling("i", period="2i").agg(pl.col("x").sum()))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'i': polars.datatypes.classes.Int64, 'x': polars.datatypes.classes.Float64}, closed=True), None]"
    reveal_type(df.rolling("i", period="2i", group_by="k").agg(pl.col("x").sum()))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'k': polars.datatypes.classes.String, 'i': polars.datatypes.classes.Int64, 'x': polars.datatypes.classes.Float64}, closed=True), None]"
    reveal_type(df.rolling("i", period="2i").agg(pl.all()))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'i': polars.datatypes.classes.Int64, 'k': astrolabe.frame.List[polars.datatypes.classes.String], 'x': astrolabe.frame.List[polars.datatypes.classes.Float64], 't': astrolabe.frame.List[polars.datatypes.classes.String]}, closed=True), None]"
    reveal_type(df.rolling("i", period="2i").agg(pl.col("t").rolling_mean(2)))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'i': polars.datatypes.classes.Int64, 't': astrolabe.frame.List[polars.datatypes.classes.Float64]}, closed=True), None]"
    reveal_type(lf.rolling("i", period="2i").agg(pl.col("t").rolling_mean(2)))  # N: Revealed type is "astrolabe.frame.TypedLazyFrame[TypedDict({'i': polars.datatypes.classes.Int64, 't': astrolabe.frame.Planned[astrolabe.frame.List[polars.datatypes.classes.Float64], astrolabe.frame.List[polars.datatypes.classes.String]]}, closed=True), None]"
    df.group_by("k").agg(pl.col("t").rolling_mean(2))  # E: "t" has no result type at this frame's column types: cannot build list with different dtypes, and polars panics  [unsupported-dtype-op]
    df.rolling("i", period="2i").agg(pl.col("x").sum().alias("i"))  # E: agg would produce duplicate column "i"  [duplicate-column]

# A dynamic group-by gives its keys, the bounds of each window where the call asks for them,
# its index column, then the aggregations. Over a `Date` index, the bounds are `Datetime`.
- case: a_dynamic_group_by_gives_the_bounds_then_the_index
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame, TypedLazyFrame

    class Rows(Columns):
        d: pl.Date
        i: pl.Int32
        x: pl.Float64

    df: TypedDataFrame[Rows]
    lf: TypedLazyFrame[Rows]
    reveal_type(df.group_by_dynamic("d", every="2d", include_boundaries=True).agg(pl.col("x").sum()))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'_lower_boundary': astrolabe.frame.Datetime[Literal['us'], None], '_upper_boundary': astrolabe.frame.Datetime[Literal['us'], None], 'd': polars.datatypes.classes.Date, 'x': polars.datatypes.classes.Float64}, closed=True), None]"
    reveal_type(lf.group_by_dynamic("d", every="2d", include_boundaries=True).agg(pl.col("x").sum()))  # N: Revealed type is "astrolabe.frame.TypedLazyFrame[TypedDict({'_lower_boundary': astrolabe.frame.Planned[astrolabe.frame.Datetime[Literal['us'], None], polars.datatypes.classes.Date], '_upper_boundary': astrolabe.frame.Planned[astrolabe.frame.Datetime[Literal['us'], None], polars.datatypes.classes.Date], 'd': polars.datatypes.classes.Date, 'x': polars.datatypes.classes.Float64}, closed=True), None]"
    reveal_type(df.group_by_dynamic("i", every="2i", period="3i").agg(pl.col("x").rolling_mean(2)))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'i': polars.datatypes.classes.Int32, 'x': astrolabe.frame.List[polars.datatypes.classes.Float64]}, closed=True), None]"
    reveal_type(df.group_by_dynamic("i", every="2i", include_boundaries=True).agg(pl.col("x").sum()))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'_lower_boundary': polars.datatypes.classes.Int32, '_upper_boundary': polars.datatypes.classes.Int32, 'i': polars.datatypes.classes.Int32, 'x': polars.datatypes.classes.Float64}, closed=True), None]"
    reveal_type(lf.rolling("i", period="2i").sum())  # N: Revealed type is "astrolabe.frame.TypedLazyFrame[TypedDict({'i': polars.datatypes.classes.Int32, 'd': polars.datatypes.classes.Date, 'x': polars.datatypes.classes.Float64}, closed=True), None]"

# Polars refuses an index of another type than the call reads, and a duration whose unit
# does not fit the index.
- case: the_index_and_the_durations_of_a_window_group_by_are_checked
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame, TypedLazyFrame

    class Rows(Columns):
        i: pl.Int64
        u: pl.UInt32
        s: pl.Int8
        d: pl.Date
        x: pl.Float64

    df: TypedDataFrame[Rows]
    lf: TypedLazyFrame[Rows]
    df.rolling("s", period="2i")  # E: Column "s" is not Int32, Int64, UInt32, UInt64, Date or Datetime, cannot .rolling()  [wrong-column-shape]
    df.group_by_dynamic("u", every="2i")  # E: Column "u" is not Int32, Int64, Date or Datetime, cannot .group_by_dynamic()  [wrong-column-shape]
    df.rolling("i", period="2d")  # E: rolling() with period='2d' raises InvalidOperationError: polars reads a count of rows, as '2i', over an integer index  [invalid-call-shape]
    df.group_by_dynamic("d", every="2i")  # E: group_by_dynamic() with every='2i' raises InvalidOperationError: polars reads a span of time, as '2d', over a temporal index  [invalid-call-shape]
    df.rolling("i", period="2x")  # E: rolling() with period='2x' raises InvalidOperationError: polars reads a number and a unit, as '2i' or '1d'  [invalid-call-shape]
    df.rolling("zz", period="2i")  # E: Unknown column "zz"  [unknown-column]
    lf.rolling("i", period="2i").head(2)  # E: head() raises InvalidOperationError: polars explodes the index, which holds one value for each window  [invalid-call-shape]

# The checks of the index and of the durations read the data type of the index, so an
# Unchecked index skips them. An index that only the undeclared columns can hold gives no
# known schema.
- case: a_window_group_by_reads_an_index_of_no_known_type
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame, Unchecked, other_columns

    R = other_columns()

    class Rows(Columns):
        w: Unchecked
        x: pl.Float64

    def f(df: TypedDataFrame[Rows], wide: TypedDataFrame[Rows, R]) -> None:
        reveal_type(df.rolling("w", period="2i").agg(pl.col("x").sum()))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'w': astrolabe.frame.Unchecked, 'x': polars.datatypes.classes.Float64}, closed=True), None]"
        wide.rolling("z", period="2i")  # E: The result of "rolling" has no known schema: the undeclared columns of the frame can hold the name, or not  [implicitly-untyped] # N: set allow_unproven = "possible" in [tool.astrolabe] to allow this, or set [tool.astrolabe.allow_unproven_overrides] rolling = "possible"
