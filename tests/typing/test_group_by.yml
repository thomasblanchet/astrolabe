# .group_by()/.agg(): grouping a frame and aggregating each group.
#
# The keys come first in the result, under their names, or under the
# keyword that names a key. agg evaluates each argument in the
# aggregation context: an expression that gives one value per row gives
# a list for each group, and an expression that gives one value gives
# that value for each group. A keyword of agg names its output. A
# group_by() with no key aggregates the whole frame.

- case: group_by_agg_narrows_precisely
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class FrameSchema(Columns):
        k: pl.String
        v: pl.Int64

    Frame = TypedDataFrame[FrameSchema]

    df: Frame

    class ResultSchema(Columns):
        k: pl.String
        bar: pl.Int64
        baz: pl.Float64
        qux: pl.UInt32

    result: TypedDataFrame[ResultSchema] = df.group_by("k").agg(
        pl.col("v").sum().alias("bar"), pl.col("v").mean().alias("baz"), pl.len().alias("qux")
    )

- case: group_by_with_list_literal_key_narrows
