- case: a_data_type_held_in_a_name_reads_as_that_data_type
  main: |
    from typing import Literal
    import polars as pl
    from astrolabe import Columns, Datetime, List, TypedDataFrame, column, other_columns

    # A name bound to a data type is an implicit type alias, and each
    # declaration reads the alias's own target. A parametrized marker
    # keeps its parameters, and a name bound to a name resolves too.
    Cost = pl.Float64
    Same = Cost
    Stamped = Datetime[Literal["us"], None]
    Prices = List[pl.Float64]

    One = column("a", Same)
    reveal_type(One)  # N: Revealed type is "def () -> astrolabe.expr.TypedColumn[Literal['a'], polars.datatypes.classes.Float64]"
    Nested = column("b", Prices)
    reveal_type(Nested)  # N: Revealed type is "def () -> astrolabe.expr.TypedColumn[Literal['b'], astrolabe.frame.List[polars.datatypes.classes.Float64]]"

    Costs = other_columns(all_of=Cost)
    Either = other_columns(all_of={Cost, Stamped})

    class FrameSchema(Columns):
        a: Stamped
        b: Prices

    df: TypedDataFrame[FrameSchema, Costs]
    reveal_type(df)  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict(main.FrameSchema, {'a': astrolabe.frame.Datetime[Literal['us'], None], 'b': astrolabe.frame.List[polars.datatypes.classes.Float64]}, closed=True), main.Costs]"

- case: a_name_that_stands_for_no_data_type_declares_nothing
  main: |
    import polars as pl
    from astrolabe import column, other_columns

    # A name is an alias for anything, so only a target that is
    # itself a data type reads.
    Pair = tuple[int, str]
    Text = str

    reveal_type(column("p", Pair))  # N: Revealed type is "Any"
    reveal_type(column("q", Text))  # N: Revealed type is "Any"
    Rest = other_columns(all_of=Pair)  # E: other_columns() all_of= must be a polars data type class, a data type such as pl.Datetime("us"), or a set of them  [marker-arg]
    More = other_columns(all_of=Text)  # E: other_columns() all_of= must be a polars data type class, a data type such as pl.Datetime("us"), or a set of them  [marker-arg]
