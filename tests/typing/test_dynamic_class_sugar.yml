# column(...)/other_columns(...): functional sugar through
# get_dynamic_class_hook. column(name, dtype) builds a TypedColumn[...]
# declaration without writing Literal[...] by hand; other_columns(...)
# declares a remainder class whose requirement markers ride on its own
# bases. A bare string in type-argument position is always misparsed
# by mypy as a forward reference. A plain call argument is read
# directly off the AST, sidestepping that entirely.

- case: column_with_bare_class_dtype_matches_literal_form
  main: |
    from typing import Literal
    import polars as pl
    from astrolabe import column

    BarCol = column("bar", pl.Int64)
    def f(df: BarCol) -> None:
        reveal_type(df)  # N: Revealed type is "astrolabe.expr.TypedColumn[Literal['bar'], polars.datatypes.classes.Int64]"

