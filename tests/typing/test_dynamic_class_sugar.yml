- case: column_with_parametrized_dtype_and_non_literal_argument_narrows_to_the_bare_dtype
  main: |
    from typing import Literal
    import polars as pl
    from astrolabe import column

    # A call to one of the four parametrized dtype classes whose own
    # argument cannot be read as a literal falls back to the plain,
    # argless real dtype instead of losing the whole result: not a
    # partially-unknown Datetime[<unknown>, ...], but not unrecognized
    # entirely either -- the same as a bare pl.Datetime class reference
    # with no call at all.
    unit: Literal["ms"] = "ms"
    WhenCol = column("when", pl.Datetime(unit))
    def f(df: WhenCol) -> None:
        reveal_type(df)  # N: Revealed type is "astrolabe.expr.TypedColumn[Literal['when'], polars.datatypes.classes.Datetime]"

- case: column_with_a_variable_that_holds_no_dtype_is_not_valid_as_a_type
  main: |
    from astrolabe import column

    dt = 3
    BarCol = column("bar", dt)
    def f(df: BarCol) -> None:  # E: Variable "main.BarCol" is not valid as a type  [valid-type] # N: See https://mypy.readthedocs.io/en/stable/common_issues.html#variables-vs-type-aliases
        reveal_type(df)  # N: Revealed type is "BarCol?"

- case: column_with_a_variable_bound_dtype_call_resolves
  main: |
    from typing import Literal
    import polars as pl
    from astrolabe import column

    # column() resolves its data type during semantic analysis, before
    # any expression has an inferred type. DtypeAliasHook runs at the
    # assignment itself and records the data type beside the variable,
    # so a constructor call bound to a name reaches the declaration
    # with its parameters.
    plain = pl.Int64()
    stamp = pl.Datetime("ms")
    BarCol = column("bar", plain)
    reveal_type(BarCol)  # N: Revealed type is "def () -> astrolabe.expr.TypedColumn[Literal['bar'], polars.datatypes.classes.Int64]"
    WhenCol = column("when", stamp)
    reveal_type(WhenCol)  # N: Revealed type is "def () -> astrolabe.expr.TypedColumn[Literal['when'], astrolabe.frame.Datetime[Literal['ms'], None]]"
    def f(bar: BarCol, when: WhenCol) -> None:
        reveal_type(bar)  # N: Revealed type is "astrolabe.expr.TypedColumn[Literal['bar'], polars.datatypes.classes.Int64]"

- case: column_with_dtype_call_whose_callee_has_no_fullname_is_not_valid_as_a_type
  main: |
    import polars as pl
    from astrolabe import column

    # dtypes[0]()'s own outer call has an IndexExpr callee, which
    # carries no fullname attribute at all: ParametrizedDtypeReaders.reader_for
    # tolerates this the same way it does for DtypeExpr's own identical
    # rule (see test_parametrized_dtype_calls.yml's own
    # read_csv_with_dict_literal_schema_value_whose_callee_has_no_fullname_still_resolves_the_old_plain_way),
    # but column()'s own dtype argument here is a call, not a bare class
    # reference, so there is no fullname to fall back to reading either
    # -- the whole call fails to resolve, the same as any other
    # unrecognized dtype argument shape.
    dtypes: list[type[pl.DataType]] = [pl.Int64]
    BarCol = column("bar", dtypes[0]())
    def f(df: BarCol) -> None:  # E: Variable "main.BarCol" is not valid as a type  [valid-type] # N: See https://mypy.readthedocs.io/en/stable/common_issues.html#variables-vs-type-aliases
        reveal_type(df)  # N: Revealed type is "BarCol?"

- case: column_with_keyword_arguments_matches_literal_form
  main: |
    from typing import Literal
    import polars as pl
    from astrolabe import column

    # column("bar", pl.Int64)'s two parameters are ordinary name=/dtype=
    # parameters, not positional-only -- real Python accepts both
    # keyword forms below, including the reversed order, so this sugar
    # must recognize them too.
    BarCol = column(name="bar", dtype=pl.Int64)
    def f(df: BarCol) -> None:
        reveal_type(df)  # N: Revealed type is "astrolabe.expr.TypedColumn[Literal['bar'], polars.datatypes.classes.Int64]"

    ReversedCol = column(dtype=pl.Int64, name="bar")
    def g(reversed_df: ReversedCol) -> None:
        reveal_type(reversed_df)  # N: Revealed type is "astrolabe.expr.TypedColumn[Literal['bar'], polars.datatypes.classes.Int64]"

