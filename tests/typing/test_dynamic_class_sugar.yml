- case: column_with_missing_dtype_argument_is_not_valid_as_a_type
  main: |
    from astrolabe import column

    # A malformed call missing dtype= entirely, neither positional nor
    # keyword -- the hook's own argument lookup must fail cleanly
    # rather than crash, distinct from every other case above where
    # dtype is at least present in some form. Real mypy separately
    # reports its own missing-argument error for the call itself.
    BarCol = column("bar")  # E: Missing positional argument "dtype" in call to "column"  [call-arg]
    def f(c: BarCol) -> None: ...  # E: Variable "main.BarCol" is not valid as a type  [valid-type] # N: See https://mypy.readthedocs.io/en/stable/common_issues.html#variables-vs-type-aliases

