- case: other_columns_sugar_declares_a_remainder_class
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame, other_columns

    class Bars(Columns):
        bar: pl.Int64

    Rest = other_columns()

    # The declaration registers a real class, so the frame type names
    # it directly, alone or after a schema class, and an alias holding
    # it is an ordinary, non-generic alias.
    df: TypedDataFrame[Rest]
    reveal_type(df)  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({}, closed=True), main.Rest]"
    df2: TypedDataFrame[Bars, Rest]
    reveal_type(df2)  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict(main.Bars, {'bar': polars.datatypes.classes.Int64}, closed=True), main.Rest]"
    FrameAlias = TypedDataFrame[Bars, Rest]
    df3: FrameAlias
    reveal_type(df3)  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict(main.Bars, {'bar': polars.datatypes.classes.Int64}, closed=True), main.Rest]"

- case: other_columns_sugar_with_one_without_name_proves_the_name_absent
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame, other_columns

    class Bars(Columns):
        bar: pl.Int64

    Rest = other_columns(without=["baz"])

    # The without= requirement rides on the declared class itself, so
    # any hook that needs "baz is provably absent" can read it back:
    # with_row_index("baz") narrows instead of fearing a hidden
    # remainder column of that name.
    df: TypedDataFrame[Bars, Rest]
    reveal_type(df.with_row_index("baz"))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'baz': polars.datatypes.classes.UInt32, 'bar': polars.datatypes.classes.Int64}, closed=True), main.Rest]"

- case: other_columns_sugar_with_multiple_without_names_excludes_both
  main: |
    import polars as pl
    from astrolabe import Columns, other_columns, TypedDataFrame

    Rest = other_columns(without=["bar", "baz"])

    class DfSchema(Columns):
        foo: pl.String

    # Both names are provably absent, so both narrow, including on the
    # first call's own result, whose remainder is the same class.
    df: TypedDataFrame[DfSchema, Rest]
    reveal_type(df.with_row_index("bar").with_row_index("baz"))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'baz': polars.datatypes.classes.UInt32, 'bar': polars.datatypes.classes.UInt32, 'foo': polars.datatypes.classes.String}, closed=True), main.Rest]"

- case: other_columns_sugar_with_non_literal_without_item_reports_and_still_declares
  main: |
    from astrolabe import TypedDataFrame, other_columns

    # The malformed keyword reports at the declaration site and drops
    # that one requirement; the class itself still registers, so the
    # frame type below works and later use sites do not cascade.
    name = "qux"
    Rest = other_columns(without=["baz", name])  # E: other_columns() without= must be a list of column names, e.g. without=["ticker"]  [marker-arg]
    Frame = TypedDataFrame[Rest]
    df: Frame
    reveal_type(df)  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({}, closed=True), main.Rest]"

- case: other_columns_sugar_with_unrecognized_keyword_before_without_still_finds_it
  main: |
    import polars as pl
    from astrolabe import Columns, other_columns, TypedDataFrame

    # other_columns() takes no bogus=, so mypy reports the call's own
    # [call-arg] error, and the hook adds its declaration-site error.
    # The well-formed without= keyword still registers, so "baz" stays
    # provably absent below.
    Rest = other_columns(bogus=1, without=["baz"])  # E: other_columns() got an unexpected keyword "bogus"  [marker-arg] # E: Unexpected keyword argument "bogus" for "other_columns"  [call-arg] # N: "other_columns" defined in "astrolabe.remainder"

    class DfSchema(Columns):
        foo: pl.String

    df: TypedDataFrame[DfSchema, Rest]
    reveal_type(df.with_row_index("baz"))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'baz': polars.datatypes.classes.UInt32, 'foo': polars.datatypes.classes.String}, closed=True), main.Rest]"

- case: other_columns_sugar_skips_a_positional_argument_and_still_reads_the_keywords
  main: |
    import polars as pl
    from astrolabe import Columns, other_columns, TypedDataFrame

    # other_columns() takes keywords only, so mypy reports the
    # positional argument. The hook skips it, and the well-formed
    # without= keyword still registers, so "baz" stays provably absent.
    Rest = other_columns(["qux"], without=["baz"])  # E: "other_columns" gets multiple values for keyword argument "without"  [misc]

    class DfSchema(Columns):
        foo: pl.String

    df: TypedDataFrame[DfSchema, Rest]
    reveal_type(df.with_row_index("baz"))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'baz': polars.datatypes.classes.UInt32, 'foo': polars.datatypes.classes.String}, closed=True), main.Rest]"

