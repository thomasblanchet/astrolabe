- case: select_named_expr_ignores_inner_alias
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class FrameSchema(Columns):
        foo: pl.String
        bar: pl.Int64

    Frame = TypedDataFrame[FrameSchema]

    df: Frame

    class NarrowedSchema(Columns):
        baz: pl.Int64

    # The keyword always wins over any .alias(...) inside the value,
    # confirmed against real polars: df.select(baz=pl.col("bar").alias("ignored"))
    # produces a column named "baz", not "ignored".
    narrowed: TypedDataFrame[NarrowedSchema] = df.select(baz=pl.col("bar").alias("ignored"))

