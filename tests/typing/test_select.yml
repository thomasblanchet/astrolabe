- case: select_two_separate_col_arguments_naming_the_same_column_still_errors
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class FrameSchema(Columns):
        foo: pl.String
        bar: pl.Int64

    # Two separate pl.col(...) arguments, as opposed to one pl.col(...)
    # call with a repeated name, is a genuine duplicate real polars
    # itself rejects -- confirms the new tolerance is scoped to a
    # single multi-name call, not select(...) as a whole.
    Frame = TypedDataFrame[FrameSchema]

    df: Frame
    df.select(pl.col("foo"), pl.col("foo"))  # E: select would produce duplicate column "foo"  [duplicate-column]

