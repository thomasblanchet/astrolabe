# .select(): projecting columns out of a frame. Written before the
# corresponding get_method_hook implementation exists. This test is
# expected to fail (red) until plugin.py implements it.
#
# Uses Column[Literal["foo"], dtype] (not the bare-string shorthand). See
# the comment at the top of test_column_parsing.yml for why this is the
# reliable spelling for alias assignments like `Frame =
# TypedDataFrame[...]`.

- case: select_single_column_narrows_precisely
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class FrameSchema(Columns):
        foo: pl.String
        bar: pl.Int64

    Frame = TypedDataFrame[FrameSchema]

    df: Frame

    class NarrowedSchema(Columns):
        bar: pl.Int64

    narrowed: TypedDataFrame[NarrowedSchema] = df.select("bar")

- case: select_full_reselect_narrows_precisely
  main: |
