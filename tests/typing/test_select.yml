# select() also accepts pl.col(name)[.alias(m)][.cast(dt)] expressions
# (real polars: *exprs: IntoExpr, same as with_columns). It recognizes
# these through the same expr_ast.parse_col_expr shared with
# with_columns/with_columns.py. Before this, any non-bare-string
# argument fell back to "schema unchanged". That was actively wrong, not
# just imprecise, for a call like `select(pl.col("foo").alias("baz"))`.
# That call produces a single differently-named column, not the
# original schema.

- case: select_col_alias_renames_and_narrows
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class FrameSchema(Columns):
        foo: pl.String
        bar: pl.Int64

    Frame = TypedDataFrame[FrameSchema]

    df: Frame

    class NarrowedSchema(Columns):
        baz: pl.Int64

    narrowed: TypedDataFrame[NarrowedSchema] = df.select(pl.col("bar").alias("baz"))

- case: select_col_final_str_name_and_alias_narrow_like_inline_literals
  main: |
    from typing import Final, Literal
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    # Final-declared string variables for both pl.col(name) and
    # .alias(m) narrow the same way the equivalent inline string
    # literals do (see select_col_alias_renames_and_narrows, above).
    SOURCE: Final = "bar"
    ALIAS: Final = "baz"

    class FrameSchema(Columns):
        foo: pl.String
        bar: pl.Int64

    Frame = TypedDataFrame[FrameSchema]

    df: Frame

    class NarrowedSchema(Columns):
        baz: pl.Int64

    narrowed: TypedDataFrame[NarrowedSchema] = df.select(pl.col(SOURCE).alias(ALIAS))

