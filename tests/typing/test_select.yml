- case: select_of_an_opaque_member_keeps_the_name_under_unchecked
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class FrameSchema(Columns):
        foo: pl.String
        bar: pl.Int64

    Frame = TypedDataFrame[FrameSchema]

    df: Frame
    # rolling_map's output is decided by the function it takes, so the
    # column comes back under its own name as Unchecked, and select
    # keeps that one column.
    reveal_type(df.select(pl.col("bar").rolling_map(lambda s: s.sum(), 2)))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'bar': astrolabe.frame.Unchecked}, closed=True), None]"

- case: select_sort_identity_narrows
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class FrameSchema(Columns):
        bar: pl.Int64

    # .sort() is a pure identity for every dtype, confirmed empirically:
    # it never changes a column's own dtype, regardless of the
    # descending/nulls_last/multithreaded kwargs.
    Frame = TypedDataFrame[FrameSchema]

    df: Frame
    narrowed: TypedDataFrame[FrameSchema] = df.select(pl.col("bar").sort(descending=True))

- case: select_bare_generic_non_literal_name_operand_falls_back_to_untyped
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame
    from astrolabe.expr import TypedExpr

    class FrameSchema(Columns):
        a: pl.Int64

    Frame = TypedDataFrame[FrameSchema]

    # e's own Name is a still-unbound TypeVar, not a literal string: a
    # bare positional argument has no forced_name to rescue it, so
    # there is no output name at all to build a result column with.
    def f[N: str](df: Frame, e: TypedExpr[N, pl.Int64]) -> None:
        reveal_type(df.select(e))  # N: Revealed type is "polars.dataframe.frame.DataFrame"

