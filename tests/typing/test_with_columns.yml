- case: with_columns_of_an_opaque_member_overwrites_the_name_under_unchecked
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class FrameSchema(Columns):
        foo: pl.String
        bar: pl.Int64

    Frame = TypedDataFrame[FrameSchema]

    df: Frame
    # rolling_map's output is decided by the function it takes, so the
    # column comes back under its own name as Unchecked, overwriting
    # the receiver's "bar" in place.
    reveal_type(df.with_columns(pl.col("bar").rolling_map(lambda s: s.sum(), 2)))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'foo': polars.datatypes.classes.String, 'bar': astrolabe.frame.Unchecked}, closed=True), None]"

- case: with_columns_of_an_aliased_opaque_member_adds_the_alias_under_unchecked
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame, Unchecked

    class FrameSchema(Columns):
        foo: pl.String
        bar: pl.Int64

    # rolling_map's output is Unchecked, and .alias("x") names it: the
    # frame gains one Unchecked column beside the receiver's own.
    Frame = TypedDataFrame[FrameSchema]

    df: Frame

    class NarrowedSchema(Columns):
        foo: pl.String
        bar: pl.Int64
        x: Unchecked

    narrowed: TypedDataFrame[NarrowedSchema] = df.with_columns(pl.col("bar").rolling_map(lambda s: s.sum(), 2).alias("x"))

