- case: with_columns_bare_generic_non_literal_name_operand_falls_back_to_untyped
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame
    from astrolabe.expr import TypedExpr

    class FrameSchema(Columns):
        a: pl.Int64

    Frame = TypedDataFrame[FrameSchema]

    # e's own Name is a still-unbound TypeVar, not a literal string: a
    # bare positional argument has no forced_name to rescue it, so
    # there is no output name at all to build a result column with.
    def f[N: str](df: Frame, e: TypedExpr[N, pl.Int64]) -> None:
        reveal_type(df.with_columns(e))  # N: Revealed type is "polars.dataframe.frame.DataFrame"

- case: with_columns_cast_with_strict_kwarg_narrows
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class FrameSchema(Columns):
        foo: pl.String
        bar: pl.Int64

    # Tier 4 Milestone 1: CastOnTypedExprHook reads .cast(dtype)'s own
    # positional dtype argument directly, so a keyword-only strict=
    # alongside it no longer breaks recognition -- confirmed narrowing
    # correctly in place, where the old AST-walking ColumnExpr/DtypeExpr
    # parsing used to fall back to untyped for this exact shape.
    Frame = TypedDataFrame[FrameSchema]

    df: Frame

    class NarrowedSchema(Columns):
        foo: pl.String
        bar: pl.Float64

    narrowed: TypedDataFrame[NarrowedSchema] = df.with_columns(pl.col("bar").cast(pl.Float64, strict=False))

- case: with_columns_variable_expression_narrows
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class FrameSchema(Columns):
        foo: pl.String
        bar: pl.Int64

    # Tier 4 Milestone 1: the motivating case behind the whole redesign.
    # TypedExpr carries its real type through an ordinary variable
    # assignment via mypy's own inference, no tracing needed -- this
    # used to fall back to untyped under the AST-walking resolver
    # chain, since `expr` is a bare NameExpr at the .with_columns()
    # call site with no visible pl.col(...) shape to re-parse.
    Frame = TypedDataFrame[FrameSchema]

    df: Frame
    expr = pl.col("bar").alias("baz")

    class NarrowedSchema(Columns):
        foo: pl.String
        bar: pl.Int64
        baz: pl.Int64

    narrowed: TypedDataFrame[NarrowedSchema] = df.with_columns(expr)

