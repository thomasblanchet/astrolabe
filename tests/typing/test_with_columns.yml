- case: with_columns_named_expr_yoda_comparison_narrows
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class FrameSchema(Columns):
        foo: pl.String
        bar: pl.Int64

    # A literal-on-the-left ("Yoda condition") equality comparison now
    # narrows too: `YodaComparisonOpHook` (`_hooks/typed_expr_yoda.py`)
    # hooks int's own __eq__ directly, making `5 == pl.col("bar")`
    # itself a real TypedExpr. The `renamed=` keyword still overrides
    # the comparison's own output name ("bar"), the same as it would
    # for any other TypedExpr value.
    Frame = TypedDataFrame[FrameSchema]

    df: Frame

    class NarrowedSchema(Columns):
        foo: pl.String
        bar: pl.Int64
        renamed: pl.Boolean

    narrowed: TypedDataFrame[NarrowedSchema] = df.with_columns(renamed=5 == pl.col("bar"))

