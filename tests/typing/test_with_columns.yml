- case: with_columns_on_a_remainder_only_receiver_builds_the_first_column_fresh
  main: |
    import polars as pl
    from astrolabe import TypedDataFrame, other_columns

    Rest = other_columns()

    # The receiver declares no columns at all, so the new column's
    # Column[...] TypeInfo resolves fresh, and the output name still
    # leaves the remainder.
    df: TypedDataFrame[Rest]
    reveal_type(df.with_columns(pl.lit(True).alias("flag")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'flag': polars.datatypes.classes.Boolean}, closed=True), astrolabe.remainder.Minus[main.Rest, Literal['flag']]]"
