- case: with_columns_double_cast_on_non_literal_name_falls_back_to_untyped
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class FrameSchema(Columns):
        foo: pl.String
        bar: pl.Int64

    # pl.col(name) with a non-literal name never narrows to TypedExpr
    # (ColHook only recognizes a literal string), so the whole chain,
    # including both .cast(...) steps, is parsed by ColumnExpr's own
    # AST walk instead. That walk still requires a literal source name
    # to build a column, so it gives up and the whole call falls back.
    Frame = TypedDataFrame[FrameSchema]

    df: Frame
    name: str = "bar"
    reveal_type(df.with_columns(pl.col(name).cast(pl.Float64).cast(pl.String)))  # N: Revealed type is "polars.dataframe.frame.DataFrame"

