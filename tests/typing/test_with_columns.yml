# .with_columns(): adding or replacing columns in a frame. Written
# before the corresponding get_method_hook implementation exists. This
# test is expected to fail (red) until plugin.py implements it.
#
# Only these shapes are recognized: pl.col(name), optionally wrapped in
# .alias(new_name) and/or .cast(dtype)
# (either order), plus the bare-string shorthand (`with_columns("foo")` is
# valid polars for `with_columns(pl.col("foo"))`), and a binary arithmetic
# expression between two such operands (see test_arithmetic_expr.yml).
# Anything else falls back to the plain, erased pl.DataFrame/pl.LazyFrame
# (no error), the same "cannot check what we cannot see" discipline as
# select/drop/rename
# -- never to "schema unchanged", since with_columns can genuinely add or
# overwrite a column on success, so "unchanged" could claim a column
# exists, or has a dtype, that it will not.
#
# **named_exprs is also recognized: the keyword is always the final
# output name, overriding any .alias(...) inside the value, confirmed
# against real polars (df.with_columns(bar=pl.col("foo").alias("ignored"))
# produces "bar", not "ignored"). A named and positional argument are
# resolved together, in call order (positional first, then named, matching
# real polars' own column ordering), so a name collision between the two
# is caught by the same duplicate check either way.

- case: with_columns_cast_overwrites_in_place
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class FrameSchema(Columns):
        foo: pl.String
        bar: pl.Int64

    Frame = TypedDataFrame[FrameSchema]

    df: Frame

    class NarrowedSchema(Columns):
        foo: pl.String
        bar: pl.Float64

    narrowed: TypedDataFrame[NarrowedSchema] = df.with_columns(pl.col("bar").cast(pl.Float64))

