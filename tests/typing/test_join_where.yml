# .join_where(): an inner join matched by an arbitrary predicate, not a
# key. `JoinWhereHook` (`_hooks/join.py`) reuses `_JoinResultMerger`'s
# own `how="cross"` merge directly: confirmed empirically against real
# polars 1.43.2 that `.join_where()`'s own result is always every column
# from both sides, suffixed on collision, completely independent of the
# predicates themselves -- they only ever affect row selection, never
# the schema. The predicates are never read or validated by this hook at
# all; real polars' own stub already checks their own shape
# (`Expr | Iterable[Expr]`) normally.
#
# suffix= is a literal string, default "_right", the same as .join().

- case: join_where_merges_all_columns_and_suffixes_collision
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class EastSchema(Columns):
        id: pl.Int64
        dur: pl.Int64
        cores: pl.Int64

    East = TypedDataFrame[EastSchema]

    class WestSchema(Columns):
        t_id: pl.Int64
        time: pl.Int64
        cores: pl.Int64

    West = TypedDataFrame[WestSchema]

    east: East
    west: West

    class ResultSchema(Columns):
        id: pl.Int64
        dur: pl.Int64
        cores: pl.Int64
        t_id: pl.Int64
        time: pl.Int64
        cores_right: pl.Int64

    result: TypedDataFrame[ResultSchema] = east.join_where(west, pl.col("dur") < pl.col("time"))

- case: join_where_multiple_predicates_do_not_affect_schema
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class EastSchema(Columns):
        dur: pl.Int64
        rev: pl.Int64

    East = TypedDataFrame[EastSchema]

    class WestSchema(Columns):
        time: pl.Int64
        cost: pl.Int64

    West = TypedDataFrame[WestSchema]

    east: East
    west: West

    class ResultSchema(Columns):
        dur: pl.Int64
        rev: pl.Int64
        time: pl.Int64
        cost: pl.Int64

    # Two AND-ed predicates narrow exactly the same as one: the schema
    # never depends on how many predicates are given, or what they are.
    result: TypedDataFrame[ResultSchema] = east.join_where(west, pl.col("dur") < pl.col("time"), pl.col("rev") < pl.col("cost"))

