    reveal_type(df.select(pl.col("t") + pl.col("u")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'t': astrolabe.frame.Struct[tuple[astrolabe.frame.Column[Literal['a'], polars.datatypes.classes.Int16]]]}, closed=True), None]"
    # A right struct of one field meets every left field.
    reveal_type(df.select(pl.col("w") * pl.col("f")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'w': astrolabe.frame.Struct[tuple[astrolabe.frame.Column[Literal['a'], polars.datatypes.classes.Float32], astrolabe.frame.Column[Literal['b'], polars.datatypes.classes.Float32]]]}, closed=True), None]"
    # A left struct of one field beside a longer one raises.
    df.select(pl.col("t") + pl.col("w"))  # E: "t" has no result type at this frame's column types: two fields have the same name, and polars raises DuplicateError  [unsupported-dtype-op]
    # floordiv over two different kinds raises.
    df.select(pl.col("t") // pl.col("u"))  # E: "t" has no result type at this frame's column types: cannot read Int16 as Int8, and polars panics  [unsupported-dtype-op]

- case: a_struct_meets_another_kind_or_another_struct_before_polars_2_0
  skip: not __import__("tests.releases").releases.polars_before("2.0.0")
  main: |
    from typing import Literal
    import polars as pl
    from astrolabe import Columns, Struct, TypedDataFrame
    from astrolabe.frame import Column

    class FrameSchema(Columns):
        i: pl.Int32
        i8: pl.Int8
        sd: Struct[Column[Literal["x"], pl.Date]]
        t: Struct[Column[Literal["a"], pl.Int8]]
        u: Struct[Column[Literal["z"], pl.Int16]]
        w: Struct[Column[Literal["a"], pl.Int8], Column[Literal["b"], pl.UInt8]]
        f: Struct[Column[Literal["z"], pl.Float32]]

    df: TypedDataFrame[FrameSchema]

    # A Date field minus another Date is a Duration in microseconds, on either side.
    reveal_type(df.select(pl.col("sd") - pl.col("i8")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'sd': astrolabe.frame.Struct[tuple[astrolabe.frame.Column[Literal['x'], astrolabe.frame.Duration[Literal['us']]]]]}, closed=True), None]"
    reveal_type(df.select(pl.col("i") - pl.col("sd")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'i': astrolabe.frame.Struct[tuple[astrolabe.frame.Column[Literal['x'], astrolabe.frame.Duration[Literal['us']]]]]}, closed=True), None]"
    # With the struct on the right, a small integer refuses the Date field.
    df.select(pl.col("i8") - pl.col("sd"))  # E: "i8" has no result type at this frame's column types: failed to determine supertype of Int8 and Struct({'x': Date}), and polars raises SchemaError  [unsupported-dtype-op]

    # Two structs pair their fields by position and keep the left names.
    reveal_type(df.select(pl.col("t") + pl.col("u")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'t': astrolabe.frame.Struct[tuple[astrolabe.frame.Column[Literal['a'], polars.datatypes.classes.Int16]]]}, closed=True), None]"
    # A right struct of one field meets every left field.
    reveal_type(df.select(pl.col("w") * pl.col("f")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'w': astrolabe.frame.Struct[tuple[astrolabe.frame.Column[Literal['a'], polars.datatypes.classes.Float32], astrolabe.frame.Column[Literal['b'], polars.datatypes.classes.Float32]]]}, closed=True), None]"
    # A left struct of one field beside a longer one raises.
    df.select(pl.col("t") + pl.col("w"))  # E: "t" has no result type at this frame's column types: two fields have the same name, and polars raises DuplicateError  [unsupported-dtype-op]
    # floordiv over two different kinds raises.
    df.select(pl.col("t") // pl.col("u"))  # E: "t" has no result type at this frame's column types: cannot read Int16 as Int8, and polars panics  [unsupported-dtype-op]

- case: a_carrier_meets_a_null_element_or_a_null_column
  main: |
    import polars as pl
    from astrolabe import Columns, List, TypedDataFrame

    class FrameSchema(Columns):
        ln: List[pl.Null]
        i: pl.Int8
        l: List[pl.Int32]
        n: pl.Null
        lb: List[pl.Boolean]

    df: TypedDataFrame[FrameSchema]

    reveal_type(df.select(pl.col("ln") + pl.col("i")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'ln': astrolabe.frame.List[polars.datatypes.classes.Int8]}, closed=True), None]"
    reveal_type(df.select(pl.col("ln") / pl.col("ln")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'ln': astrolabe.frame.List[polars.datatypes.classes.Float64]}, closed=True), None]"
    reveal_type(df.select(pl.col("l") == pl.col("n")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'l': polars.datatypes.classes.Boolean}, closed=True), None]"
    reveal_type(df.select(pl.col("n") != pl.col("l")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'n': polars.datatypes.classes.Boolean}, closed=True), None]"
    reveal_type(df.select(pl.col("l").append(pl.col("n"))))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'l': astrolabe.frame.List[polars.datatypes.classes.Int32]}, closed=True), None]"
    reveal_type(df.select(pl.col("n").append(pl.col("l"))))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'n': astrolabe.frame.List[polars.datatypes.classes.Int32]}, closed=True), None]"

    # A list does not order beside Null, and these pairs raise inside a carrier.
    df.select(pl.col("l") < pl.col("n"))  # E: "l" has no result type at this frame's column types: cannot order List(Int32), and polars raises InvalidOperationError  [unsupported-dtype-op]
    df.select(pl.col("lb") + pl.col("n"))  # E: "lb" has no result type at this frame's column types: no numeric kernel for Boolean, and polars panics  [unsupported-dtype-op]
    df.select(pl.col("ln") + pl.col("ln"))  # E: "ln" has no result type at this frame's column types: no numeric kernel for Null, and polars panics  [unsupported-dtype-op]

- case: none_on_the_left_of_an_equality_is_a_literal
  main: |
    import polars as pl
    from astrolabe import Columns, List, TypedDataFrame

    class FrameSchema(Columns):
        u: pl.UInt8
        l: List[pl.Int8]

    df: TypedDataFrame[FrameSchema]

    # Python calls the reflected __eq__ of the expression, which keeps its name.
    reveal_type(df.select(None == pl.col("u")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'u': polars.datatypes.classes.Boolean}, closed=True), None]"
    reveal_type(df.select(None != pl.col("l")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'l': polars.datatypes.classes.Boolean}, closed=True), None]"
    reveal_type(None == 1)  # N: Revealed type is "bool"

- case: a_literal_on_the_left_is_the_plain_value
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class FrameSchema(Columns):
        u: pl.UInt8
        i8: pl.Int8
        f: pl.Float32
        s: pl.String

    df: TypedDataFrame[FrameSchema]

    # pl.lit with no data type is the plain value on the left too.
    reveal_type(df.select(pl.lit(1) + pl.col("u")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'literal': polars.datatypes.classes.UInt8}, closed=True), None]"
    reveal_type(df.select(pl.lit(200) + pl.col("i8")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'literal': polars.datatypes.classes.Int16}, closed=True), None]"
    reveal_type(df.select(pl.lit(1).add(pl.col("u"))))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'literal': polars.datatypes.classes.UInt8}, closed=True), None]"
    reveal_type(df.select(pl.lit(1.5) * pl.col("f")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'literal': polars.datatypes.classes.Float32}, closed=True), None]"
    reveal_type(df.select(pl.lit(None) + pl.col("u")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'literal': polars.datatypes.classes.UInt8}, closed=True), None]"
    # A comparison swaps its operands.
    reveal_type(df.select(pl.lit(1) < pl.col("u")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'literal': polars.datatypes.classes.Boolean}, closed=True), None]"
    # A string stays a String expression.
    reveal_type(df.select(pl.lit("x") + pl.col("s")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'literal': polars.datatypes.classes.String}, closed=True), None]"

- case: an_integer_beside_a_decimal_follows_the_member
  main: |
    from typing import Literal
    import polars as pl
    from astrolabe import Columns, Decimal, TypedDataFrame

    class FrameSchema(Columns):
        i: pl.Int32
        big: pl.Int64
        d: Decimal[Literal[20], Literal[4]]
        n: Decimal[Literal[5], Literal[1]]

    df: TypedDataFrame[FrameSchema]

    # Arithmetic widens the decimal to the whole precision.
    reveal_type(df.select(pl.col("i") + pl.col("d")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'i': astrolabe.frame.Decimal[Literal[38], Literal[4]]}, closed=True), None]"
    reveal_type(df.select(pl.col("d") + 1))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'d': astrolabe.frame.Decimal[Literal[38], Literal[4]]}, closed=True), None]"
    # append keeps the decimal where the digits of the integer fit before its point.
    reveal_type(df.select(pl.col("i").append(pl.col("d"))))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'i': astrolabe.frame.Decimal[Literal[20], Literal[4]]}, closed=True), None]"
    reveal_type(df.select(pl.col("big").append(pl.col("n"))))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'big': astrolabe.frame.Decimal[Literal[38], Literal[1]]}, closed=True), None]"
    reveal_type(df.select(pl.col("d").append(None)))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'d': astrolabe.frame.Decimal[Literal[20], Literal[4]]}, closed=True), None]"

- case: a_literal_in_a_variable_adapts_to_the_column_on_either_side
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class FrameSchema(Columns):
        u: pl.UInt8
        i8: pl.Int8

    df: TypedDataFrame[FrameSchema]

    class NarrowedSchema(Columns):
        left: pl.UInt8
        right: pl.UInt8
        signed: pl.Int8

    # A literal with no data type adapts to the column, also from a variable.
    e = pl.lit(1)
    narrowed: TypedDataFrame[NarrowedSchema] = df.select(
        left=e + pl.col("u"),
        right=pl.col("u") + e,
        signed=pl.col("i8") + e,
    )

