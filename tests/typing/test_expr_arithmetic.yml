- case: a_member_that_keeps_an_array_meets_a_literal_as_the_array
  skip: __import__("tests.releases").releases.polars_before("1.43.0")
  main: |
    from typing import Literal
    import polars as pl
    from astrolabe import Array, Columns, TypedDataFrame

    class FrameSchema(Columns):
        a: Array[pl.Int16, Literal[1]]
        aa: Array[Array[pl.Int8, Literal[2]], Literal[3]]
        n: pl.Int16

    df: TypedDataFrame[FrameSchema]

