  skip: __import__("tests.releases").releases.polars_before("2.0.0")
  main: |
    from typing import Literal
    import polars as pl
    from astrolabe import Array, Columns, List, TypedDataFrame

    class FrameSchema(Columns):
        l: List[pl.Int16]
        a: Array[pl.Int16, Literal[2]]
        b: pl.Boolean
