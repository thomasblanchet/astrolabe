    # A plain number is a dynamic literal too. The run folds the sum of two literals.
    narrowed: TypedDataFrame[NarrowedSchema] = df.select(
        summed=pl.col("u") + (pl.lit(1) + 1),
        reflected=pl.col("u") + (1 + pl.lit(1)),
        power=pl.col("u") + pl.lit(1).pow(2),
        compared=pl.lit(1) < 2,
    )
