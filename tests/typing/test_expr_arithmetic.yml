- case: unary_dunders_serve_their_catalog_members
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame, Unchecked

    class FrameSchema(Columns):
        i: pl.Int64
        f: pl.Float64
        b: pl.Boolean

    Frame = TypedDataFrame[FrameSchema]

    df: Frame
    narrowed: TypedDataFrame[FrameSchema] = df.select(-pl.col("i"), abs(pl.col("f")), ~pl.col("b"))

    class NegatedSchema(Columns):
        b: Unchecked

    negated: TypedDataFrame[NegatedSchema] = df.select(-pl.col("b"))  # E: "b" has no result type at this frame's column types: neg does not accept Boolean, and polars raises InvalidOperationError  [unsupported-dtype-op]

- case: an_unmeasured_kind_reads_as_unchecked
  main: |
    from typing import Literal
    import polars as pl
    from astrolabe import Columns, TypedDataFrame, Unchecked

    class FrameSchema(Columns):
        n: pl.Object

    # The rules give no data type for an operation on an `Object` column,
