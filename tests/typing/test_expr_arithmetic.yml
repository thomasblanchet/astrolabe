    df: TypedDataFrame[FrameSchema]

    # The optimizer of polars folds a Boolean constant, so the run decides
    # the answer of `|` and `&` beside a carrier on the left, and of `|`
    # beside a carrier on the right.
    reveal_type(df.select(pl.col("l") | False))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'l': astrolabe.frame.List[polars.datatypes.classes.Int16]}, closed=True), None]"
    reveal_type(df.select(pl.col("a") & True))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'a': astrolabe.frame.Array[polars.datatypes.classes.Int16, Literal[2]]}, closed=True), None]"
    reveal_type(df.select(pl.col("l").first() | True))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'l': polars.datatypes.classes.Boolean}, closed=True), None]"
    reveal_type(df.select(pl.col("a").first() & False))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'a': polars.datatypes.classes.Boolean}, closed=True), None]"
    reveal_type(df.select(True | pl.col("l").first()))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'literal': polars.datatypes.classes.Boolean}, closed=True), None]"
    reveal_type(df.select(pl.col("l") | pl.lit(False)))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'l': astrolabe.frame.List[polars.datatypes.classes.Int16]}, closed=True), None]"
    reveal_type(df.select(pl.col("a") & (pl.col("b").first() | True)))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'a': astrolabe.frame.Array[polars.datatypes.classes.Int16, Literal[2]]}, closed=True), None]"
    reveal_type(df.select(pl.lit(True) | pl.col("a").first()))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'literal': polars.datatypes.classes.Boolean}, closed=True), None]"
    reveal_type(df.select(pl.col("i") | False))  # E: "i" has no result type at this frame's column types: Or on Int16 and Boolean is not supported, and polars raises ComputeError  [unsupported-dtype-op] # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'i': astrolabe.frame.Unchecked}, closed=True), None]"

    # polars folds no constant here, so these raise in every run.
    df.select(pl.col("l") ^ False)  # E: "l" has no result type at this frame's column types: bitxor is not defined for List(Int16), and polars raises InvalidOperationError  [unsupported-dtype-op]
    df.select(False & pl.col("l").first())  # E: "literal" has no result type at this frame's column types: cannot unpack List(Int16) into Boolean, and polars raises SchemaError  [unsupported-dtype-op]
    df.select(pl.col("b") & pl.col("a"))  # E: "b" has no result type at this frame's column types: cannot unpack Array(Int16, shape=(2,)) into Boolean, and polars raises SchemaError  [unsupported-dtype-op]
    df.select(pl.col("l") | 0)  # E: "l" has no result type at this frame's column types: bitor is not defined for List(Int16), and polars raises InvalidOperationError  [unsupported-dtype-op]

