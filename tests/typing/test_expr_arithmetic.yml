- case: a_literal_partner_reads_the_value_indexed_grid
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class FrameSchema(Columns):
        i: pl.Int64
        j: pl.Int32
        b: pl.Boolean
        s: pl.String

    # polars reads a literal partner by its value: a small integer keeps
    # Int32, a Boolean plus an integer widens to Int32, a float partner
    # gives Float64, a string partner concatenates.
    Frame = TypedDataFrame[FrameSchema]

    df: Frame

    class NarrowedSchema(Columns):
        i: pl.Int64
        j: pl.Int32
        b: pl.Int32
        s: pl.String
        ratio: pl.Float64

    narrowed: TypedDataFrame[NarrowedSchema] = df.select(
        pl.col("i") + 1,
        pl.col("j") + 40000,
        pl.col("b") + 1,
        pl.col("s") + "!",
        ratio=pl.col("i") * 1.5,
    )

- case: a_literal_on_the_left_names_the_output_literal
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class FrameSchema(Columns):
        i: pl.Int64
        s: pl.String

    # polars names a reflected result "literal": the left operand is
    # the literal, and the output takes its name.
    Frame = TypedDataFrame[FrameSchema]

    df: Frame

    class NarrowedSchema(Columns):
        literal: pl.Float64

    narrowed: TypedDataFrame[NarrowedSchema] = df.select(1 / pl.col("i"))
    scaled: TypedDataFrame[NarrowedSchema] = df.select(2.0 * pl.col("i"))

    class PrefixedSchema(Columns):
        literal: pl.String

    prefixed: TypedDataFrame[PrefixedSchema] = df.select("s" + pl.col("s"))

