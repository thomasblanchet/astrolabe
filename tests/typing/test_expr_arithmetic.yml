- case: a_constant_expression_takes_the_bucket_of_its_value
  main: |
    from typing import Final, Literal
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class FrameSchema(Columns):
        u: pl.UInt8

    df: TypedDataFrame[FrameSchema]

    # Python computes the value first, so polars reads the value 1024.
    reveal_type(df.select(pl.col("u") + 2**10))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'u': polars.datatypes.classes.UInt16}, closed=True), None]"
    reveal_type(df.select(2**10 + pl.col("u")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'literal': polars.datatypes.classes.UInt16}, closed=True), None]"
    reveal_type(df.select(pl.col("u").__radd__(2**10)))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'literal': polars.datatypes.classes.UInt16}, closed=True), None]"
    reveal_type(df.select(2**10 == pl.col("u")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'u': polars.datatypes.classes.Boolean}, closed=True), None]"
    reveal_type(df.select(pl.col("u") * (1 << 9)))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'u': polars.datatypes.classes.UInt16}, closed=True), None]"
    reveal_type(df.select(pl.col("u") + 1.5 * 2))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'u': polars.datatypes.classes.Float64}, closed=True), None]"
    reveal_type(df.select(pl.col("u") - (True + 1)))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict(main.FrameSchema, {'u': polars.datatypes.classes.UInt8}, closed=True), None]"
    reveal_type(df.select(pl.col("u") - 7 // 2))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict(main.FrameSchema, {'u': polars.datatypes.classes.UInt8}, closed=True), None]"
    pl.col("u") + 2**127  # E: an integer that no polars data type holds raises InvalidOperationError: integer too large for Polars  [invalid-call-shape]

    # The type stub of a power gives Any for an exponent that is not a
    # literal. A power of literals takes the type of its value back, so the
    # operation beside it has a hook.
    SHIFT: Final = 9
    HALF: Final = 0.5
    reveal_type(2**(SHIFT + 1))  # N: Revealed type is "int"
    reveal_type(df.select(pl.col("u") + 2**(SHIFT + 1)))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'u': polars.datatypes.classes.UInt16}, closed=True), None]"
    reveal_type(df.select(2**(SHIFT + 1) - pl.col("u")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'literal': polars.datatypes.classes.UInt16}, closed=True), None]"
    reveal_type(df.select(pl.col("u") + 4.0**HALF))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'u': polars.datatypes.classes.Float64}, closed=True), None]"
    # A power that gives a complex number keeps the type Any.
    reveal_type((-8.0) ** HALF)  # N: Revealed type is "Any"

    # A Final name inside a function keeps its value on its type.
    def local(frame: TypedDataFrame[FrameSchema]) -> None:
        bits: Final = 9
        reveal_type(frame.select(pl.col("u") + 2**bits))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'u': polars.datatypes.classes.UInt16}, closed=True), None]"

    # A parameter of a Literal type holds its value too. A Final name of a
    # declared type keeps no value, so its bucket is not known.
    def typed(frame: TypedDataFrame[FrameSchema], wide: Literal[300]) -> None:
        reveal_type(frame.select(pl.col("u") + wide))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'u': polars.datatypes.classes.UInt16}, closed=True), None]"
        reveal_type(frame.with_columns(w=wide))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'u': polars.datatypes.classes.UInt8, 'w': polars.datatypes.classes.Int32}, closed=True), None]"
        declared: Final[int] = 300
        reveal_type(frame.select(pl.col("u") + declared))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'u': astrolabe.frame.Unchecked}, closed=True), None]"

