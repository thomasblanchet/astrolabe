# The binary operators over two columns, over a column and a bare
# literal, and reflected with the literal on the left, plus the unary
# dunders. Every expected frame is confirmed against real polars.

- case: addition_over_two_columns_follows_the_measured_grid
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class FrameSchema(Columns):
        i: pl.Int64
        j: pl.Int32
        f: pl.Float64
        b: pl.Boolean
        s: pl.String

    Frame = TypedDataFrame[FrameSchema]

    df: Frame

    class NarrowedSchema(Columns):
        ii: pl.Int64
        ij: pl.Int64
        i_f: pl.Float64
        bb: pl.UInt32
        ss: pl.String

    narrowed: TypedDataFrame[NarrowedSchema] = df.select(
        ii=pl.col("i") + pl.col("i"),
        ij=pl.col("i") + pl.col("j"),
        i_f=pl.col("i") + pl.col("f"),
        bb=pl.col("b") + pl.col("b"),
        ss=pl.col("s") + pl.col("s"),
    )

