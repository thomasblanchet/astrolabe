- case: a_carrier_composed_from_two_operands_compares_and_appends
  main: |
    from typing import Literal
    import polars as pl
    from astrolabe import Array, Columns, List, TypedDataFrame

    class FrameSchema(Columns):
        l: List[pl.Int8]
        m: List[pl.Int16]
        n: pl.Int16
        a: Array[pl.Float64, Literal[3]]
        b: Array[pl.Float64, Literal[3]]

    df: TypedDataFrame[FrameSchema]

    # The sum of a list and a number is a list, so it compares with
    # another list, also after a second operation.
    reveal_type(df.select((pl.col("l") + pl.col("n")) == pl.col("m")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'l': polars.datatypes.classes.Boolean}, closed=True), None]"
    reveal_type(df.select(((pl.col("l") + pl.col("n")) * pl.col("n")) != pl.col("m")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'l': polars.datatypes.classes.Boolean}, closed=True), None]"
    reveal_type(df.select(pl.col("b").append(pl.col("a") / pl.col("n"))))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'b': astrolabe.frame.Array[polars.datatypes.classes.Float64, Literal[3]]}, closed=True), None]"

    # polars refuses to order two lists, composed or not.
    df.select((pl.col("l") + pl.col("n")) < pl.col("m"))  # E: "l" has no result type at this frame's column types: cannot order List(Int16), and polars raises InvalidOperationError  [unsupported-dtype-op]

