- case: a_python_number_beside_a_literal_follows_the_rule_for_two_literals
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class FrameSchema(Columns):
        u: pl.UInt8

    df: TypedDataFrame[FrameSchema]

    class NarrowedSchema(Columns):
        summed: pl.UInt8
        reflected: pl.UInt8
        power: pl.UInt8
