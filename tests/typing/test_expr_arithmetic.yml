- case: a_struct_field_that_is_a_carrier_joins_a_column_beside_it
  skip: __import__("tests.releases").releases.polars_before("2.0.0")
  main: |
    from typing import Literal
    import polars as pl
    from astrolabe import Array, Columns, List, Struct, TypedDataFrame
    from astrolabe.frame import Column

    class FrameSchema(Columns):
        sl: Struct[Column[Literal["f"], List[pl.Int8]]]
        sa: Struct[Column[Literal["f"], Array[pl.Int8, Literal[2]]]]
        n: pl.Int16

    df: TypedDataFrame[FrameSchema]

    # A `List` field joins the data type of a column beside it, and
    # keeps its own data type beside a literal.
    class Joined(Columns):
        sl: Struct[Column[Literal["f"], List[pl.Int16]]]

    class Kept(Columns):
        sl: Struct[Column[Literal["f"], List[pl.Int8]]]

    joined: TypedDataFrame[Joined] = df.select(pl.col("sl") + pl.col("n"))
    listed: TypedDataFrame[Kept] = df.select(pl.col("sl") + 1)

    # An `Array` field runs on either path.
    df.select(pl.col("sa") + pl.col("n"))
    df.select(pl.col("sa") + 1)

