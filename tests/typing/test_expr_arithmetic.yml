- case: an_integer_variable_partner_answers_where_every_int_agrees
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class FrameSchema(Columns):
        i: pl.Int64
        f: pl.Float32

    df: TypedDataFrame[FrameSchema]

    # polars picks an integer literal's width from its value, and a variable
    # has no known value. The checker tries a few values of the type, and the
    # operation answers where every value gives one data type, on either
    # side, and is Unchecked where they differ.
    n: int = 2**40
    reveal_type(df.select(pl.col("f") + n))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'f': polars.datatypes.classes.Float32}, closed=True), None]"
    reveal_type(df.select(n * pl.col("f")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'literal': polars.datatypes.classes.Float32}, closed=True), None]"
    reveal_type(df.select(pl.col("i") > n))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'i': polars.datatypes.classes.Boolean}, closed=True), None]"
    reveal_type(df.select(pl.col("i") + n))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'i': astrolabe.frame.Unchecked}, closed=True), None]"
    reveal_type(df.select(pl.col("i").fill_null(n)))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'i': astrolabe.frame.Unchecked}, closed=True), None]"

- case: a_subclass_of_int_or_float_reads_as_its_value
  main: |
    from enum import IntEnum
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class FrameSchema(Columns):
        u: pl.UInt8
        f: pl.Float32

    df: TypedDataFrame[FrameSchema]

    class Ratio(float):
        pass

    class Flag(IntEnum):
        A = 1

    # A subclass of float holds no int, so it is tried at floats alone. A
    # subclass of int, such as an IntEnum, can hold any int.
    ratio = Ratio(1.5)
    flag: Flag = Flag.A
    reveal_type(df.select(pl.col("u") + ratio))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'u': polars.datatypes.classes.Float64}, closed=True), None]"
    reveal_type(df.select(pl.col("f") * flag))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'f': polars.datatypes.classes.Float32}, closed=True), None]"
    reveal_type(df.select(pl.col("u") * flag))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'u': astrolabe.frame.Unchecked}, closed=True), None]"

- case: an_operand_of_a_wide_or_narrow_kind_is_measured
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class FrameSchema(Columns):
        i: pl.Int64
        s: pl.String

    # The rules cover every integer width, so an operand or an answer
    # such as Int8 or UInt32 has a data type.
    Frame = TypedDataFrame[FrameSchema]

    df: Frame
    reveal_type(df.select(pl.lit(1, dtype=pl.Int8) + pl.col("i")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'literal': polars.datatypes.classes.Int64}, closed=True), None]"
    reveal_type(df.select(pl.col("s").str.len_chars() + pl.col("i")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'s': polars.datatypes.classes.Int64}, closed=True), None]"
    reveal_type(df.select(pl.col("s").str.len_chars() > pl.col("i")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'s': polars.datatypes.classes.Boolean}, closed=True), None]"
    reveal_type(df.select(pl.col("i").cast(pl.UInt8) * pl.col("i")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'i': polars.datatypes.classes.Int64}, closed=True), None]"
    reveal_type(df.select(pl.col("s").str.len_chars() + 1))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'s': polars.datatypes.classes.UInt32}, closed=True), None]"
    reveal_type(df.select(pl.col("s").str.len_chars().abs()))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'s': polars.datatypes.classes.UInt32}, closed=True), None]"
    reveal_type(df.select(pl.col("i").cast(pl.UInt8).abs()))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'i': polars.datatypes.classes.UInt8}, closed=True), None]"
    reveal_type(df.select(pl.lit(1, dtype=pl.Int8) + pl.lit(1, dtype=pl.Int64)))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'literal': polars.datatypes.classes.Int64}, closed=True), None]"
    df.select(pl.col("s") - pl.col("s"))  # E: "s" has no result type at this frame's column types: sub is not defined for String, and polars raises InvalidOperationError  [unsupported-dtype-op]

- case: an_operand_of_an_unmeasured_kind_gives_the_marker
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class FrameSchema(Columns):
        i: pl.Int64
        o: pl.Object

    # An `Object` operand has no supertype beside an Int64, so polars
    # refuses the sum, and the output keeps its name under Unchecked.
    Frame = TypedDataFrame[FrameSchema]

    df: Frame
    reveal_type(df.select(pl.col("o") + pl.col("i")))  # E: "o" has no result type at this frame's column types: failed to determine supertype of Object and Int64, and polars raises SchemaError  [unsupported-dtype-op]  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'o': astrolabe.frame.Unchecked}, closed=True), None]"
    reveal_type(df.select(pl.col("o").abs()))  # E: "o" has no result type at this frame's column types: abs does not accept Object, and polars raises InvalidOperationError  [unsupported-dtype-op]  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'o': astrolabe.frame.Unchecked}, closed=True), None]"

- case: a_struct_operand_compares_where_its_fields_admit_the_other_kind
  main: |
    import polars as pl
    from astrolabe import Columns, List, Struct, TypedDataFrame, column

    Count = column("count", pl.Int64)
    Blob = column("blob", pl.Binary)

    class FrameSchema(Columns):
        s: Struct[Count]
        t: Struct[Count]
        u: Struct[Blob]
        bare: pl.Struct
        txt: pl.String
        n: pl.Int64
        d: pl.Date
        l: List[pl.Int64]

    df: TypedDataFrame[FrameSchema]

    # The answer is a bare Boolean, and the rule is symmetric.
    reveal_type(df.select(pl.col("s") == pl.col("t")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'s': polars.datatypes.classes.Boolean}, closed=True), None]"
    reveal_type(df.select(pl.col("s") == pl.col("txt")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'s': polars.datatypes.classes.Boolean}, closed=True), None]"
    reveal_type(df.select(pl.col("s") == pl.col("n")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'s': polars.datatypes.classes.Boolean}, closed=True), None]"

    # The four ordered members read the struct as text, so they
    # answer beside a String alone.
    reveal_type(df.select(pl.col("s") < pl.col("txt")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'s': polars.datatypes.classes.Boolean}, closed=True), None]"
    df.select(pl.col("s") < pl.col("n"))  # E: "s" has no result type at this frame's column types: cannot order Struct({'count': Int64}), and polars raises InvalidOperationError  [unsupported-dtype-op]

    # A Binary field admits no numeric, and a Date operand admits no struct.
    df.select(pl.col("u") == pl.col("n"))  # E: "u" has no result type at this frame's column types: could not evaluate comparison of Struct({'blob': Binary}) and Int64, and polars raises SchemaError  [unsupported-dtype-op]
    df.select(pl.col("s") == pl.col("d"))  # E: "s" has no result type at this frame's column types: could not evaluate comparison of Struct({'count': Int64}) and Date, and polars raises SchemaError  [unsupported-dtype-op]

    # A List operand beside a struct raises.
    df.select(pl.col("s") == pl.col("l"))  # E: "s" has no result type at this frame's column types: could not evaluate comparison of Struct({'count': Int64}) and List(Int64), and polars raises SchemaError  [unsupported-dtype-op]

    # A struct whose fields are unnamed leaves the rule nothing to
    # read, so the answer is the marker rather than a refusal.
    reveal_type(df.select(pl.col("bare") == pl.col("n")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'bare': polars.datatypes.classes.Boolean}, closed=True), None]"

- case: a_struct_operand_compares_with_a_literal_by_its_own_text
  main: |
    import polars as pl
    from astrolabe import Columns, Struct, TypedDataFrame, column

    Count = column("count", pl.Int64)
    Blob = column("blob", pl.Binary)

    class FrameSchema(Columns):
        s: Struct[Count]
        u: Struct[Blob]

    df: TypedDataFrame[FrameSchema]

    # Beside a literal the rule is the one beside an expression of the
    # literal's data type: an ordered member answers beside text alone.
    reveal_type(df.select(pl.col("s") == 5))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'s': polars.datatypes.classes.Boolean}, closed=True), None]"
    reveal_type(df.select(pl.col("s") < "a"))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'s': polars.datatypes.classes.Boolean}, closed=True), None]"
    df.select(pl.col("s") < 5)  # E: "s" has no result type at this frame's column types: cannot order Struct({'count': Int64}), and polars raises InvalidOperationError  [unsupported-dtype-op]
    reveal_type(df.select(pl.col("s") == "a"))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'s': polars.datatypes.classes.Boolean}, closed=True), None]"
    reveal_type(df.select(pl.col("u") == "a"))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'u': polars.datatypes.classes.Boolean}, closed=True), None]"

    # A boolean literal and a Binary field beside a number both raise.
    df.select(pl.col("s") == True)  # E: "s" has no result type at this frame's column types: could not evaluate comparison of Struct({'count': Int64}) and Boolean, and polars raises SchemaError  [unsupported-dtype-op]
    df.select(pl.col("u") == 5)  # E: "u" has no result type at this frame's column types: could not evaluate comparison of Struct({'blob': Binary}) and Int32, and polars raises SchemaError  [unsupported-dtype-op]

- case: a_carrier_reaches_through_a_nest_beside_a_literal
  skip: __import__("tests.releases").releases.polars_before("1.43.0")
  main: |
    from typing import Literal
    import polars as pl
    from astrolabe import Array, Columns, List, TypedDataFrame

    class FrameSchema(Columns):
        l: List[pl.Int8]
        ll: List[List[pl.Int8]]
        lll: List[List[List[pl.Int8]]]
        a: Array[pl.Int8, Literal[3]]
        aa: Array[Array[pl.Int8, Literal[2]], Literal[3]]

    df: TypedDataFrame[FrameSchema]

    # A literal fits itself to the innermost element, and the whole
    # nest comes back around the answer.
    class Kept(Columns):
        l: List[pl.Int8]
        ll: List[List[pl.Int8]]
        lll: List[List[List[pl.Int8]]]
        a: Array[pl.Int8, Literal[3]]
        aa: Array[Array[pl.Int8, Literal[2]], Literal[3]]

    kept: TypedDataFrame[Kept] = df.select(
        pl.col("l") + 1,
        pl.col("ll") + 1,
        pl.col("lll") + 1,
        pl.col("a") + 1,
        pl.col("aa") + 1,
    )

    class Widened(Columns):
        ll: List[List[pl.Float64]]
        aa: Array[Array[pl.Float64, Literal[2]], Literal[3]]

    widened: TypedDataFrame[Widened] = df.select(
        pl.col("ll") + 1.5,
        pl.col("aa") + 1.5,
    )

    # A comparison member beside a literal raises on a column with a
    # row, whatever the literal is.
    df.select(pl.col("l") == "a")  # E: "l" has no result type at this frame's column types: cannot cast List type (inner: Int8, to: String), and polars raises InvalidOperationError  [unsupported-dtype-op]
    df.select(pl.col("a") != "a")  # E: "a" has no result type at this frame's column types: cannot cast Array type (inner: Int8, to: String), and polars raises InvalidOperationError  [unsupported-dtype-op]
    df.select(pl.col("l") == 5)  # E: "l" has no result type at this frame's column types: could not evaluate comparison of List(Int8) and Int32, and polars raises SchemaError  [unsupported-dtype-op]
    df.select(pl.col("l") < 5)  # E: "l" has no result type at this frame's column types: could not evaluate comparison of List(Int8) and Int32, and polars raises SchemaError  [unsupported-dtype-op]

