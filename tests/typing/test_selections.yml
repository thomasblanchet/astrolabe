- case: an_alias_over_a_selection_of_several_columns_is_refused
  main: |
    import polars as pl
    import polars.selectors as cs
    from astrolabe import Columns, TypedDataFrame

    class FrameSchema(Columns):
        A: pl.Int64
        B: pl.Float64

    df: TypedDataFrame[FrameSchema]
    # A rename of each name keeps the names apart.
    reveal_type(df.select(cs.numeric().name.to_lowercase()))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'a': polars.datatypes.classes.Int64, 'b': polars.datatypes.classes.Float64}, closed=True), None]"
    # An alias gives each picked column the same name, which polars refuses.
    df.select(cs.numeric().alias("z"))  # E: A selection has several outputs, which .alias() cannot rename: use .name.suffix() or .name.prefix()  [selection-rename]
    df.select(cs.numeric().round(2).alias("z"))  # E: A selection has several outputs, which .alias() cannot rename: use .name.suffix() or .name.prefix()  [selection-rename]
    # A keyword names the output as an alias does.
    reveal_type(df.select(z=cs.numeric()))  # E: A selection has several outputs, which .alias() cannot rename: use .name.suffix() or .name.prefix()  [selection-rename] # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'z': astrolabe.frame.Unchecked}, closed=True), None]"
    # A keyword or an alias over a selection that picks nothing gives no column.
    reveal_type(df.select(z=cs.string()))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({}, closed=True), None]"
    reveal_type(df.select(cs.string().alias("z")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({}, closed=True), None]"

- case: one_name_for_every_output_depends_on_the_remainder
  main: |
    import polars as pl
    import polars.selectors as cs
    from astrolabe import Columns, TypedDataFrame, other_columns

    class Quotes(Columns):
        symbol: pl.String
        bid: pl.Float64

    Rest = other_columns()
    Numbers = other_columns(none_of={pl.String})

    def run(opened: TypedDataFrame[Quotes, Rest], fenced: TypedDataFrame[Quotes, Numbers]) -> None:
        # The remainder can hold a String column, which takes the same name.
        reveal_type(opened.select(cs.string().alias("o")))  # E: The result of "select" has no known schema: the result depends on the undeclared columns the caller passes  [implicitly-untyped]  # N: set allow_unproven = "possible" in [tool.astrolabe] to allow this, or set [tool.astrolabe.allow_unproven_overrides] select = "possible"  # N: Revealed type is "polars.dataframe.frame.DataFrame"
        reveal_type(opened.select(o=cs.string()))  # E: The result of "select" has no known schema: the result depends on the undeclared columns the caller passes  [implicitly-untyped]  # N: set allow_unproven = "possible" in [tool.astrolabe] to allow this, or set [tool.astrolabe.allow_unproven_overrides] select = "possible"  # N: Revealed type is "polars.dataframe.frame.DataFrame"
        reveal_type(opened.select(pl.col("symbol") + cs.string()))  # E: The result of "select" has no known schema: the result depends on the undeclared columns the caller passes  [implicitly-untyped]  # N: set allow_unproven = "possible" in [tool.astrolabe] to allow this, or set [tool.astrolabe.allow_unproven_overrides] select = "possible"  # N: Revealed type is "polars.dataframe.frame.DataFrame"
        # The remainder holds no String column, so the declared column is the one output.
        reveal_type(fenced.select(cs.string().alias("o")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'o': polars.datatypes.classes.String}, closed=True), None]"
        reveal_type(fenced.select(o=cs.string()))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'o': polars.datatypes.classes.String}, closed=True), None]"
        reveal_type(fenced.select(pl.col("symbol") + cs.string()))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'symbol': polars.datatypes.classes.String}, closed=True), None]"

# Polars refuses a zoned value beside a naive `Datetime` column and runs
# beside a zoned one. A remainder that can hold either makes the result
# depend on the caller. A remainder of zoned columns only proves the call.
- case: a_kind_that_runs_at_some_of_its_data_types_depends_on_the_remainder
  main: |
    from datetime import UTC, datetime

    import polars as pl
    import polars.selectors as cs
    from astrolabe import Columns, TypedDataFrame, other_columns

    Rest = other_columns()
    Zoned = other_columns(all_of=pl.Datetime("us", "UTC"))

    class Keys(Columns):
        k: pl.Int64

    def run(opened: TypedDataFrame[Keys, Rest], zoned: TypedDataFrame[Keys, Zoned]) -> None:
        reveal_type(opened.select(cs.datetime() > datetime(2020, 1, 1, tzinfo=UTC)))  # E: The result of "select" has no known schema: the result depends on the undeclared columns the caller passes  [implicitly-untyped]  # N: set allow_unproven = "possible" in [tool.astrolabe] to allow this, or set [tool.astrolabe.allow_unproven_overrides] select = "possible"  # N: Revealed type is "polars.dataframe.frame.DataFrame"
        reveal_type(opened.with_columns(cs.datetime().fill_null(datetime(2020, 1, 1, tzinfo=UTC))))  # E: The result of "with_columns" has no known schema: the result depends on the undeclared columns the caller passes  [implicitly-untyped]  # N: set allow_unproven = "possible" in [tool.astrolabe] to allow this, or set [tool.astrolabe.allow_unproven_overrides] with_columns = "possible"  # N: Revealed type is "polars.dataframe.frame.DataFrame"
        reveal_type(zoned.select(cs.datetime() > datetime(2020, 1, 1, tzinfo=UTC)))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({}, closed=True), astrolabe.remainder.Retyped[astrolabe.remainder.Only[main.Zoned, astrolabe.remainder.OfType[astrolabe.frame.Datetime[Literal['ms'], astrolabe.frame.AnyZone] | astrolabe.frame.Datetime[Literal['ns'], astrolabe.frame.AnyZone] | astrolabe.frame.Datetime[Literal['us'], astrolabe.frame.AnyZone]]], polars.datatypes.classes.Boolean]]"

