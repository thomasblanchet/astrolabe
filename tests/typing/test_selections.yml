    import polars as pl
    import polars.selectors as cs
    from astrolabe import Columns, TypedDataFrame

    class FrameSchema(Columns):
        u: pl.UInt8
        f: pl.Float32
        s: pl.String

    df: TypedDataFrame[FrameSchema]

    class SmallSchema(Columns):
        u: pl.UInt8
        f: pl.Float32

    class WideSchema(Columns):
        u: pl.UInt16
        f: pl.Float32

    # A literal with no data type adapts to each picked column, also from a variable.
    e = pl.lit(300)
    small: TypedDataFrame[SmallSchema] = df.select(cs.numeric() + pl.lit(1))
    wide: TypedDataFrame[WideSchema] = df.select(cs.numeric() + e)

- case: a_fill_value_joins_each_matched_column
  main: |
    import polars as pl
    import polars.selectors as cs
    from astrolabe import Columns, TypedDataFrame

    class FrameSchema(Columns):
        u: pl.UInt8
        i: pl.Int16
        f: pl.Float32
        s: pl.String

    df: TypedDataFrame[FrameSchema]

    class ShiftedSchema(Columns):
        u: pl.UInt16
        i: pl.Int16
        f: pl.Float32

    class FilledSchema(Columns):
        u: pl.Float64
        i: pl.Float64
        f: pl.Float32

    class FromColumnSchema(Columns):
        u: pl.Int16
        i: pl.Int16
        f: pl.Float32

    class KeptSchema(Columns):
        u: pl.UInt8
        i: pl.Int16
        f: pl.Float32

    # The fill joins each picked column on its own, as it joins one column.
    shifted: TypedDataFrame[ShiftedSchema] = df.select(cs.numeric().shift(1, fill_value=300))
    filled: TypedDataFrame[FilledSchema] = df.select(cs.numeric().fill_null(1.5))
    from_column: TypedDataFrame[FromColumnSchema] = df.select(cs.numeric().fill_null(pl.col("i")))
    from_reducer: TypedDataFrame[FromColumnSchema] = df.select(
        cs.numeric().shift(1, fill_value=pl.col("i").max()),
    )
    forward: TypedDataFrame[KeptSchema] = df.select(cs.numeric().fill_null(strategy="forward"))
    kept: TypedDataFrame[KeptSchema] = df.select(cs.numeric().shift(1))
    # A fill that gives a value for each row is refused at a shift.
    df.select(cs.numeric().shift(1, fill_value=pl.col("i")))  # E: "u" has no result type at this frame's column types: 'fill_value' must be a scalar value, and polars raises ShapeError  [unsupported-dtype-op]

- case: a_selection_beside_a_python_timedelta_or_decimal_reads_a_literal
  main: |
    from datetime import date, timedelta
    from decimal import Decimal

    import polars as pl
    import polars.selectors as cs
    from astrolabe import Columns, TypedDataFrame

    class FrameSchema(Columns):
        u: pl.UInt8
        d: pl.Date

    df: TypedDataFrame[FrameSchema]
    day: date

    # Polars reads the value as a literal of Duration('us') or Decimal(38, 1).
    reveal_type(df.select(cs.date() + timedelta(days=1)))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'d': polars.datatypes.classes.Date}, closed=True), None]"
    reveal_type(df.select(cs.numeric() + Decimal("1.5")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'u': astrolabe.frame.Decimal[Literal[38], Literal[1]]}, closed=True), None]"
    # A variable of the type date can hold a datetime, so the call stays plain.
    reveal_type(df.select(cs.date() < day))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'d': polars.datatypes.classes.Boolean}, closed=True), None]"

- case: a_selection_over_the_remainder_reads_each_form_of_selector
  main: |
    import polars as pl
    import polars.selectors as cs
    from astrolabe import Columns, TypedDataFrame, other_columns

    Rest = other_columns()

    class Keys(Columns):
        k: pl.Int64

    def f(op: TypedDataFrame[Keys, Rest]) -> None:
        # Every zone of a unit, and not the naive data type of that unit.
        reveal_type(op.with_columns(cs.datetime("us", "*").dt.year()))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict(main.Keys, {'k': polars.datatypes.classes.Int64}, closed=True), astrolabe.remainder.Both[astrolabe.remainder.Retyped[astrolabe.remainder.Only[main.Rest, astrolabe.remainder.SelAnd[astrolabe.remainder.OfType[astrolabe.frame.Datetime[Literal['us'], astrolabe.frame.AnyZone]], astrolabe.remainder.SelNot[astrolabe.remainder.OfType[astrolabe.frame.Datetime[Literal['us'], None]]]]], polars.datatypes.classes.Int32], astrolabe.remainder.Except[main.Rest, astrolabe.remainder.SelAnd[astrolabe.remainder.OfType[astrolabe.frame.Datetime[Literal['us'], astrolabe.frame.AnyZone]], astrolabe.remainder.SelNot[astrolabe.remainder.OfType[astrolabe.frame.Datetime[Literal['us'], None]]]]]]]"
        # A selector by position picks a column that the type cannot name.
        reveal_type(op.with_columns(cs.first().abs()))  # N: Revealed type is "polars.dataframe.frame.DataFrame"
        # abs keeps the data type of each numeric column, so the remainder stays.
        reveal_type(op.with_columns((cs.numeric() - cs.by_name("k")).abs()))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict(main.Keys, {'k': polars.datatypes.classes.Int64}, closed=True), main.Rest]"

- case: a_selector_of_places_over_a_column_with_holes_keeps_the_plain_frame
  main: |
    import polars as pl
    import polars.selectors as cs
    from astrolabe import Columns, TypedDataFrame, Unchecked

    class FrameSchema(Columns):
        a: pl.Int64
        u: Unchecked

    df: TypedDataFrame[FrameSchema]
    # A selector of places reads every data type of the frame, and a column
    # of the data type Unchecked holds no one data type.
    reveal_type(df.select(cs.by_index(0) + 1))  # N: Revealed type is "polars.dataframe.frame.DataFrame"
