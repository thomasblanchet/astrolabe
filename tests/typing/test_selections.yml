- case: a_selection_keeps_the_departures_of_the_aggregation_context
  main: |
    import polars as pl
    import polars.selectors as cs
    from astrolabe import Columns, TypedDataFrame, other_columns

    class Notes(Columns):
        k: pl.Int64
        s: pl.String
        b: pl.Boolean

    notes: TypedDataFrame[Notes]
    # The mean of text answers in an agg and under a window, and not in a select.
    reveal_type(notes.group_by("k").agg(cs.string().mean()))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'k': polars.datatypes.classes.Int64, 's': polars.datatypes.classes.String}, closed=True), None]"
    reveal_type(notes.select(cs.string().mean().over("k")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'s': polars.datatypes.classes.String}, closed=True), None]"
    reveal_type(notes.with_columns(cs.string().median().over("k")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict(main.Notes, {'k': polars.datatypes.classes.Int64, 's': polars.datatypes.classes.String, 'b': polars.datatypes.classes.Boolean}, closed=True), None]"
    reveal_type(notes.select(cs.string().mean()))  # E: "s" has no result type at this frame's column types: mean does not accept String, and polars raises InvalidOperationError  [unsupported-dtype-op]  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'s': astrolabe.frame.Unchecked}, closed=True), None]"
    # Later members read the answer of each context.
    reveal_type(notes.group_by("k").agg(cs.string().mean().str.len_chars()))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'k': polars.datatypes.classes.Int64, 's': polars.datatypes.classes.UInt32}, closed=True), None]"
    reveal_type(notes.group_by("k").agg(cs.string().mean() + pl.lit("x")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'k': polars.datatypes.classes.Int64, 's': polars.datatypes.classes.String}, closed=True), None]"
    reveal_type(notes.group_by("k").agg(cs.string().mean().name.suffix("_m")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'k': polars.datatypes.classes.Int64, 's_m': polars.datatypes.classes.String}, closed=True), None]"
    # A window inside an agg runs its operand in the aggregation context.
    reveal_type(notes.group_by("k").agg(cs.string().mean().over("k")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'k': polars.datatypes.classes.Int64, 's': astrolabe.frame.List[polars.datatypes.classes.String]}, closed=True), None]"
    # The spelling reads back.
    mean = cs.string().mean()
    reveal_type(notes.group_by("k").agg(mean))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'k': polars.datatypes.classes.Int64, 's': polars.datatypes.classes.String}, closed=True), None]"
    # Interpolation of a Boolean column answers in a select, and not in an agg.
    reveal_type(notes.select(cs.boolean().interpolate()))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'b': polars.datatypes.classes.Boolean}, closed=True), None]"
    reveal_type(notes.group_by("k").agg(cs.boolean().interpolate()))  # E: "b" has no result type at this frame's column types: cannot build list with different dtypes, and polars panics  [unsupported-dtype-op]  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'k': polars.datatypes.classes.Int64, 'b': astrolabe.frame.Unchecked}, closed=True), None]"

    Rest = other_columns()

    def any_rest(df: TypedDataFrame[Notes, Rest]) -> None:
        reveal_type(df.group_by("k").agg(cs.string().mean()))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'k': polars.datatypes.classes.Int64, 's': polars.datatypes.classes.String}, closed=True), astrolabe.remainder.Only[main.Rest, astrolabe.remainder.OfType[polars.datatypes.classes.String]]]"

- case: rank_gives_each_matched_column_the_type_of_its_method
  main: |
    from typing import Literal

    import polars as pl
    import polars.selectors as cs
    from astrolabe import Columns, TypedDataFrame

    class Prices(Columns):
        k: pl.Int64
        a: pl.Int64
        u: pl.UInt8
        s: pl.String

    prices: TypedDataFrame[Prices]
    method: Literal["average", "dense"] = "dense"

    # The method average gives Float64, and every other method gives UInt32.
    reveal_type(prices.select(cs.by_name("a").rank()))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'a': polars.datatypes.classes.Float64}, closed=True), None]"
    reveal_type(prices.select(cs.by_name("a", "u").rank("dense")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'a': polars.datatypes.classes.UInt32, 'u': polars.datatypes.classes.UInt32}, closed=True), None]"
    reveal_type(prices.select(cs.by_name("a").rank(method)))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'a': astrolabe.frame.Unchecked}, closed=True), None]"
    # The rank reads the answer of the member before it, in each context.
    reveal_type(prices.group_by("k").agg(cs.string().mean().rank("dense")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'k': polars.datatypes.classes.Int64, 's': polars.datatypes.classes.UInt32}, closed=True), None]"
    prices.select(cs.string().mean().rank("dense"))  # E: "s" has no result type at this frame's column types: mean does not accept String, and polars raises InvalidOperationError  [unsupported-dtype-op]

