# Selections: an expression rooted in a selector. Its type is its code,
# as for any expression. A site materializes a selection as the frame
# effects: on the schema, the picked columns evaluated at their own
# types and renamed by the affix, and on the remainder, `Only`, then
# `Retyped` kind by kind, then the affix. Every expected frame is
# confirmed against real polars.

- case: selector_roots_and_their_algebra
  main: |
    import polars as pl
    import polars.selectors as cs

    reveal_type(cs.numeric())  # N: Revealed type is "astrolabe.expr.TypedSelector[astrolabe.expr.Deferred[Literal['cs.numeric()']]]"
    reveal_type(cs.string())  # N: Revealed type is "astrolabe.expr.TypedSelector[astrolabe.expr.Deferred[Literal['cs.string()']]]"
    reveal_type(cs.by_name("a", "b"))  # N: Revealed type is "astrolabe.expr.TypedSelector[astrolabe.expr.Deferred[Literal["cs.by_name('a', 'b')"]]]"
    reveal_type(pl.col("a", "b"))  # N: Revealed type is "astrolabe.expr.TypedExpr[astrolabe.expr.Deferred[Literal["pl.col('a', 'b')"]]]"
    reveal_type(pl.col(["a", "b"]))  # N: Revealed type is "astrolabe.expr.TypedExpr[astrolabe.expr.Deferred[Literal["pl.col(['a', 'b'])"]]]"
    reveal_type(pl.all())  # N: Revealed type is "astrolabe.expr.TypedExpr[astrolabe.expr.Deferred[Literal['pl.all()']]]"
    reveal_type(~cs.numeric())  # N: Revealed type is "astrolabe.expr.TypedSelector[astrolabe.expr.Deferred[Literal['~cs.numeric()']]]"
    reveal_type(cs.numeric() | cs.string())  # N: Revealed type is "astrolabe.expr.TypedSelector[astrolabe.expr.Deferred[Literal['cs.numeric() | cs.string()']]]"
    reveal_type(cs.numeric() & ~cs.by_name("n"))  # N: Revealed type is "astrolabe.expr.TypedSelector[astrolabe.expr.Deferred[Literal["cs.numeric() & ~cs.by_name('n')"]]]"
    reveal_type(cs.numeric() - cs.by_name("n"))  # N: Revealed type is "astrolabe.expr.TypedSelector[astrolabe.expr.Deferred[Literal["cs.numeric() - cs.by_name('n')"]]]"
    reveal_type(cs.starts_with("a", "b"))  # N: Revealed type is "astrolabe.expr.TypedSelector[astrolabe.expr.Deferred[Literal["cs.starts_with('a', 'b')"]]]"
    reveal_type(cs.first())  # N: Revealed type is "astrolabe.expr.TypedSelector[astrolabe.expr.Deferred[Literal['cs.first()']]]"
    reveal_type(cs.datetime("ms"))  # N: Revealed type is "astrolabe.expr.TypedSelector[astrolabe.expr.Deferred[Literal["cs.datetime('ms')"]]]"
    some_name: str
    reveal_type(cs.by_name(some_name))  # N: Revealed type is "astrolabe.expr.TypedSelector[astrolabe.expr.Deferred[Literal["cs.by_name(hole('str'))"]]]"
    reveal_type(pl.col("a", some_name))  # N: Revealed type is "astrolabe.expr.TypedExpr[astrolabe.expr.Deferred[Literal["pl.col('a', hole('str'))"]]]"

