- case: the_data_decides_whether_a_type_selector_picks_an_unchecked_column
  main: |
    import polars as pl
    import polars.selectors as cs
    from astrolabe import Columns, TypedDataFrame, Unchecked

    class Mixed(Columns):
        a: Unchecked
        s: pl.String
        n: pl.Int64

    mixed: TypedDataFrame[Mixed]
    # cs.numeric() picks "a" only where its data are numbers, so the
    # columns of the result depend on the data.
    reveal_type(mixed.select(cs.numeric()))  # N: Revealed type is "polars.dataframe.frame.DataFrame"
    reveal_type(mixed.select(cs.numeric().cast(pl.String)))  # N: Revealed type is "polars.dataframe.frame.DataFrame"
    reveal_type(mixed.group_by("s").agg(cs.numeric().sum()))  # N: Revealed type is "polars.dataframe.frame.DataFrame"
    # with_columns keeps "a" either way: the cast gives Int8 where it picks
    # the column, and the data keep their own type elsewhere.
    reveal_type(mixed.with_columns(cs.numeric().cast(pl.Int8)))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'a': astrolabe.frame.Unchecked, 's': polars.datatypes.classes.String, 'n': polars.datatypes.classes.Int8}, closed=True), None]"
    # A new name exists only where the selector picks the column.
    reveal_type(mixed.with_columns(cs.numeric().cast(pl.Int8).name.suffix("_x")))  # N: Revealed type is "polars.dataframe.frame.DataFrame"
    # A selector that picks the column at every data type, or at none, is exact.
    reveal_type(mixed.select(cs.all().exclude("s")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'a': astrolabe.frame.Unchecked, 'n': polars.datatypes.classes.Int64}, closed=True), None]"
    reveal_type(mixed.select(cs.temporal() & cs.string()))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({}, closed=True), None]"
    # A sort key leaves the columns of the result as they are.
    reveal_type(mixed.sort(cs.numeric()))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict(main.Mixed, {'a': astrolabe.frame.Unchecked, 's': polars.datatypes.classes.String, 'n': polars.datatypes.classes.Int64}, closed=True), None]"

