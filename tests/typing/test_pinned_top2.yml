- case: pinned_unnest_splices_the_fields_in_place
  main: |
    from typing import Literal
    import polars as pl
    from astrolabe import Column, Columns, Struct, TypedDataFrame

    class Nested(Columns):
        foo: pl.Int64
        bar: Struct[Column[Literal["baz"], pl.String], Column[Literal["qux"], pl.Int64]]
        tail: pl.Int64

    df: TypedDataFrame[Nested]
    # The fields of the struct take the place of the struct column.
    reveal_type(df.unnest("bar"))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'foo': polars.datatypes.classes.Int64, 'baz': polars.datatypes.classes.String, 'qux': polars.datatypes.classes.Int64, 'tail': polars.datatypes.classes.Int64}, closed=True), None]"
    # A separator puts the struct name before each field name.
    reveal_type(df.unnest("bar", separator="_"))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'foo': polars.datatypes.classes.Int64, 'bar_baz': polars.datatypes.classes.String, 'bar_qux': polars.datatypes.classes.Int64, 'tail': polars.datatypes.classes.Int64}, closed=True), None]"

- case: pinned_unnest_of_a_missing_column_is_an_error
  main: |
    from typing import Literal
    import polars as pl
    from astrolabe import Column, Columns, Struct, TypedDataFrame

    class Nested(Columns):
        foo: pl.Int64
        bar: Struct[Column[Literal["baz"], pl.String]]

    df: TypedDataFrame[Nested]
    # A name that the frame does not hold is an error, and the result is the plain frame.
    reveal_type(df.unnest("missing"))  # E: Unknown column "missing"  [unknown-column] # N: Revealed type is "polars.dataframe.frame.DataFrame"

- case: pinned_unnest_of_a_dynamic_name_gives_the_plain_frame
  main: |
