- case: a_reducer_over_a_remainder_retypes_every_undeclared_column
  main: |
    from astrolabe import TypedDataFrame, other_columns

    Rest = other_columns()

    # Every reducer keeps each remainder column's name. `sum` answers
    # by the column's own type, which the remainder does not name, so
    # every undeclared column becomes Unchecked. `max` gives each
    # column back, so the remainder is unchanged, and `count` gives
    # every column UInt32.
    df: TypedDataFrame[Rest]
    reveal_type(df.sum())  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({}, closed=True), astrolabe.remainder.Retyped[main.Rest, astrolabe.frame.Unchecked]]"
    reveal_type(df.max())  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({}, closed=True), main.Rest]"
    reveal_type(df.count())  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({}, closed=True), astrolabe.remainder.Retyped[main.Rest, polars.datatypes.classes.UInt32]]"

