- case: a_sum_keeps_a_decimal_of_open_parameters
  main: |
    import polars as pl
    from astrolabe import Columns, List, TypedDataFrame

    class Schema(Columns):
        l: List[pl.Decimal]

    df: TypedDataFrame[Schema]
    # pl.Decimal inside a list is the kind, whose precision and scale are open,
    # so the sum keeps the kind.
    first = df.select(pl.col("l").list.first())
    reveal_type(first)  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'l': polars.datatypes.classes.Decimal}, closed=True), None]"
    reveal_type(first.sum())  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'l': polars.datatypes.classes.Decimal}, closed=True), None]"
