- case: whole_frame_reducers_follow_the_measured_departures
  main: |
    from typing import Literal
    import polars as pl
    from astrolabe import Columns, Decimal, TypedDataFrame

    class FrameSchema(Columns):
        b: pl.Boolean
        d: pl.Date
        x: Decimal[Literal[10], Literal[2]]

    # quantile() keeps a Boolean; mean(), median() and quantile() turn a
    # Date into a microsecond Datetime; a whole-frame median() keeps a
    # Decimal. std() keeps the Date.
    Frame = TypedDataFrame[FrameSchema]

    df: Frame
    reveal_type(df.quantile(0.5))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'b': polars.datatypes.classes.Boolean, 'd': astrolabe.frame.Datetime[Literal['us'], None], 'x': polars.datatypes.classes.Float64}, closed=True), None]"
    reveal_type(df.mean())  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'b': polars.datatypes.classes.Float64, 'd': astrolabe.frame.Datetime[Literal['us'], None], 'x': polars.datatypes.classes.Float64}, closed=True), None]"
    reveal_type(df.median())  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'b': polars.datatypes.classes.Float64, 'd': astrolabe.frame.Datetime[Literal['us'], None], 'x': astrolabe.frame.Decimal[Literal[10], Literal[2]]}, closed=True), None]"
    reveal_type(df.std())  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'b': polars.datatypes.classes.Float64, 'd': polars.datatypes.classes.Date, 'x': polars.datatypes.classes.Float64}, closed=True), None]"
    reveal_type(df.lazy().quantile(0.5))  # N: Revealed type is "astrolabe.frame.TypedLazyFrame[TypedDict({'b': polars.datatypes.classes.Boolean, 'd': astrolabe.frame.Datetime[Literal['us'], None], 'x': polars.datatypes.classes.Float64}, closed=True), None]"

- case: count_and_corr_type_every_column
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class FrameSchema(Columns):
        a: pl.Int64
        b: pl.Boolean

    # count() counts every column as UInt32. corr() keeps every name as
    # Float64, puts a String label column first where one is named, and
    # refuses a column that is not numeric or Boolean.
    Frame = TypedDataFrame[FrameSchema]

    class TextSchema(Columns):
        a: pl.Int64
        s: pl.String

    Text = TypedDataFrame[TextSchema]
    df: Frame
    text: Text
    reveal_type(df.count())  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'a': polars.datatypes.classes.UInt32, 'b': polars.datatypes.classes.UInt32}, closed=True), None]"
    reveal_type(df.lazy().count())  # N: Revealed type is "astrolabe.frame.TypedLazyFrame[TypedDict({'a': polars.datatypes.classes.UInt32, 'b': polars.datatypes.classes.UInt32}, closed=True), None]"
    reveal_type(df.corr())  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'a': polars.datatypes.classes.Float64, 'b': polars.datatypes.classes.Float64}, closed=True), None]"
    reveal_type(df.corr(label="name"))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'name': polars.datatypes.classes.String, 'a': polars.datatypes.classes.Float64, 'b': polars.datatypes.classes.Float64}, closed=True), None]"
    text.corr()  # E: Column "s" is not numeric or Boolean, cannot corr  [wrong-column-shape]
    df.corr(label="a")  # E: corr would produce duplicate column "a"  [duplicate-column]
    name = "x"
    reveal_type(df.corr(label=name))  # N: Revealed type is "polars.dataframe.frame.DataFrame"

- case: corr_reads_a_remainder_it_can_prove_numeric
  main: |
    import polars as pl
    from astrolabe import Columns, NumericType, other_columns, TypedDataFrame

    Rest = other_columns()
    Numbers = other_columns(all_of=NumericType)

    class Schema1(Columns):
        a: pl.Int64

    # Polars correlates numeric and Boolean columns alone, so an
    # unconstrained remainder leaves the result to the caller.
    def f(df: TypedDataFrame[Schema1, Rest]) -> None:
        reveal_type(df.corr())  # E: The result of "corr" has no known schema: the result depends on the undeclared columns the caller passes  [implicitly-untyped] # N: set allow_unproven = "possible" in [tool.astrolabe] to allow this, or set [tool.astrolabe.allow_unproven_overrides] corr = "possible" # N: Revealed type is "polars.dataframe.frame.DataFrame"

    def g(df: TypedDataFrame[Schema1, Numbers]) -> None:
        reveal_type(df.corr())  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'a': polars.datatypes.classes.Float64}, closed=True), astrolabe.remainder.Retyped[main.Numbers, polars.datatypes.classes.Float64]]"

- case: a_whole_frame_reducer_keeps_a_generic_column_as_unchecked
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class Generic[T: pl.DataType](Columns):
        v: T
        w: pl.Int64

    # The type of `v` depends on the caller, so the reducer keeps its name
    # and gives it the data type Unchecked.
    def total[T: pl.DataType](df: TypedDataFrame[Generic[T]]) -> None:
        reveal_type(df.sum())  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'v': astrolabe.frame.Unchecked, 'w': polars.datatypes.classes.Int64}, closed=True), None]"

