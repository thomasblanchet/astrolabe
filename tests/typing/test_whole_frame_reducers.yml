# pl.DataFrame/pl.LazyFrame's own whole-frame reducer methods: sum/max/
# min/mean/median/std/var/null_count/product. Each reduces every column
# to a single row, one value per column, using each column's own current
# dtype -- distinct from .agg()'s own same-named reducer, which needs a
# group_by() key first and hard-rejects some source families .agg()
# itself gates.
#
# Confirmed against real polars 1.43.2, not assumed: sum/max/min/mean/
# median/std/var pass a non-numeric (String) source through unchanged,
# unlike .agg()'s own sum(), which raises for a String source instead.
# null_count is always UInt32 regardless of the source dtype. product
# degrades a non-numeric source to Null specifically, distinct from every
# other reducer, and widens every integer narrower than a 64-bit width to
# Int64 (unlike sum(), which only widens Int8/Int16/UInt8/UInt16, leaving
# Int32/UInt32 unchanged).
#
# product exists only on pl.DataFrame, confirmed empirically
# (hasattr(pl.LazyFrame, "product") is False), so it is not tested, and
# not implemented, for TypedLazyFrame.

- case: sum_narrows_precisely
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class FrameSchema(Columns):
        i: pl.Int8
        b: pl.Boolean
        s: pl.String

    Frame = TypedDataFrame[FrameSchema]

    df: Frame

    class NarrowedSchema(Columns):
        i: pl.Int64
        b: pl.UInt32
        s: pl.String

    narrowed: TypedDataFrame[NarrowedSchema] = df.sum()

