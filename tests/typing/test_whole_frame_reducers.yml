- case: product_leaves_int32_and_int64_and_uint64_unchanged
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class FrameSchema(Columns):
        a: pl.Int32
        b: pl.Int64
        c: pl.UInt64

    # Unlike sum(), which only widens Int8/Int16/UInt8/UInt16 to Int64
    # and leaves Int32/UInt32 unchanged, product() widens every integer
    # narrower than a 64-bit width to Int64 -- Int32 widens here, unlike
    # under sum(). Int64/UInt64 stay unchanged either way.
    Frame = TypedDataFrame[FrameSchema]

    df: Frame

    class NarrowedSchema(Columns):
        a: pl.Int64
        b: pl.Int64
        c: pl.UInt64

    narrowed: TypedDataFrame[NarrowedSchema] = df.product()

