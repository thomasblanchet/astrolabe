# `.join_asof()`: merge on the nearest key match, not an exact one. A
# real API gap found by adapting real-world polars code
# (`API_GAPS_AUDIT.md`), closed by `JoinAsofHook` (`_hooks/join_asof.py`).
#
# `on=`/`left_on=`/`right_on=` each take exactly one column name. The
# coalesced key keeps the left side's own name and position, the same
# layout `.join()`'s own non-`how="full"` layouts use, and follows the
# same family-compatible dtype rule as `.join()`'s own keys (never
# widening -- `.join_asof()` has no supertype-promotion concept at all).
# `coalesce=` (default `True`) governs only this key.
#
# `by=`/`by_left=`/`by_right=` each take one name or a list, and always
# coalesce regardless of `coalesce=`'s value. `by=`'s own dtype rule is
# stricter than `on=`'s: exact equality (or `Unchecked`), confirmed
# empirically -- a family-compatible but non-identical pair (`Int32`/
# `Int64`) is rejected for `by=` even though it succeeds for `on=`.
# `by_left=`/`by_right=` under different names drop the right name
# entirely from the result, with no suffix-collision check against it.
#
# `suffix=` is a literal string, default `"_right"`, the same as
# `.join()`/`.join_where()`.

- case: join_asof_on_coalesces_left_style_no_widening
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class LeftSchema(Columns):
        id: pl.Int64
        k: pl.Int32

    Left = TypedDataFrame[LeftSchema]

    class RightSchema(Columns):
        id: pl.Int64
        k: pl.Int64
        v: pl.String

    Right = TypedDataFrame[RightSchema]

    left: Left
    right: Right

    class ResultSchema(Columns):
        id: pl.Int64
        k: pl.Int32
        id_right: pl.Int64
        v: pl.String

    # k is family-compatible (Int32 x Int64) and coalesces to the left
    # side's own Int32, never widening to Int64 -- .join_asof() has no
    # how="full" supertype-promotion concept at all.
    result: TypedDataFrame[ResultSchema] = left.join_asof(right, on="k")

- case: join_asof_left_on_right_on_keeps_the_right_key
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class LeftSchema(Columns):
        k1: pl.Int64

    Left = TypedDataFrame[LeftSchema]

    class RightSchema(Columns):
        k2: pl.Int64

    Right = TypedDataFrame[RightSchema]

    left: Left
    right: Right
    # Two keys with different names do not merge, so the right key stays,
    # with `coalesce=True` too.
    reveal_type(left.join_asof(right, left_on="k1", right_on="k2"))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'k1': polars.datatypes.classes.Int64, 'k2': polars.datatypes.classes.Int64}, closed=True), None]"
    reveal_type(left.join_asof(right, left_on="k1", right_on="k2", coalesce=True))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'k1': polars.datatypes.classes.Int64, 'k2': polars.datatypes.classes.Int64}, closed=True), None]"

