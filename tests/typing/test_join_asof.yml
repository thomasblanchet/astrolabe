- case: join_asof_by_unresolved_dtype_pair_fails_silently
  main: |
    from typing import Literal
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class Grouped[D: pl.DataType](Columns):
        gid: D
        k: pl.Int64

    # A still-unbound TypeVar dtype cannot be compared at all -- by=
    # fails to reconcile the pair, but nothing concrete is known to
    # report [join-key-dtype] against, so this silently falls back
    # instead of reporting, the same "cannot check what we cannot see"
    # discipline used elsewhere.
    def f[D: pl.DataType](
        left: TypedDataFrame[Grouped[D]],
        right: TypedDataFrame[Grouped[pl.Int64]],
    ) -> None:
        reveal_type(left.join_asof(right, on="k", by="gid"))  # N: Revealed type is "polars.dataframe.frame.DataFrame"

