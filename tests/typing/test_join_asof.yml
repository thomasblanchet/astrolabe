    reveal_type(df.join_asof(df, on=pl.col("k").alias("q")))  # E: join_asof() with an alias in a join key raises InvalidOperationError: 'alias' is not allowed in a join key, use 'with_columns' first  [invalid-call-shape]  # N: Revealed type is "polars.dataframe.frame.DataFrame"
