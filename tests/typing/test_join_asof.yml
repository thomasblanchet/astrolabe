- case: join_asof_by_always_coalesces_even_with_coalesce_false
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class LeftSchema(Columns):
        gid: pl.Int64
        k: pl.Int64

    Left = TypedDataFrame[LeftSchema]
    Right = TypedDataFrame[LeftSchema]

    left: Left
    right: Right

    class ResultSchema(Columns):
        gid: pl.Int64
        k: pl.Int64
