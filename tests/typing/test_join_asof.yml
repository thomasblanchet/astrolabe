- case: join_asof_duplicate_result_name_falls_back_to_untyped
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class LeftSchema(Columns):
        id: pl.Int64
        id_right: pl.Int64
        k: pl.Int64

    # left's own "id_right" already exists, so right's suffixed "id"
    # collides with it -- the same duplicate-name check every other
    # join-family hook already applies to its own merged result.
    Left = TypedDataFrame[LeftSchema]

    class RightSchema(Columns):
        id: pl.Int64
        k: pl.Int64

    Right = TypedDataFrame[RightSchema]

    left: Left
    right: Right
    reveal_type(left.join_asof(right, on="k", coalesce=False))  # E: join_asof would produce duplicate column "id_right"  [duplicate-column] # N: Revealed type is "polars.dataframe.frame.DataFrame"

- case: join_asof_on_unchecked_key_retypes_to_concrete
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame, Unchecked

    class LeftSchema(Columns):
        k: Unchecked

    Left = TypedDataFrame[LeftSchema]

    class RightSchema(Columns):
        k: pl.Int64

    Right = TypedDataFrame[RightSchema]

    left: Left
