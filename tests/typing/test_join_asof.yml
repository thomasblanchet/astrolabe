- case: join_asof_non_literal_suffix_without_collision_still_narrows
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class LeftSchema(Columns):
        k: pl.Int64

    Left = TypedDataFrame[LeftSchema]
    Right = TypedDataFrame[LeftSchema]

    left: Left
    right: Right
    suffix_var: str = "_w"
    # suffix='s own text is never read unless a collision actually
    # happens -- k coalesces and there is nothing else to collide, so
    # this narrows even though suffix_var is not a literal.
    result: TypedDataFrame[LeftSchema] = left.join_asof(right, on="k", suffix=suffix_var)

