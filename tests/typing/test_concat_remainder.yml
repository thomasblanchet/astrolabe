- case: concat_a_promise_says_nothing_about_a_suffixed_remainder
  main: |
    from typing import Literal
    import polars as pl
    from astrolabe import Columns, other_columns, Suffixed, TypedDataFrame

    # R is promised disjoint from L, not from L's names with a suffix:
    # L = {y} and R = {y_x} share the name y_x after the suffix.
    L = other_columns(without=["bar"])
    R = other_columns(without=["foo"], disjoint_from=L)

    class LeftSchema(Columns):
        foo: pl.Int64

    left: TypedDataFrame[LeftSchema, Suffixed[L, Literal["_x"]]]

    class RightSchema(Columns):
        bar: pl.String

    right: TypedDataFrame[RightSchema, R]
    pl.concat([left, right], how="horizontal_extend")  # E: This concat combines columns differently for some callers: two remainders can share a name. Declare disjoint_from= on one of them  [concat-collision] # N: set allow_unproven = "possible" in [tool.astrolabe] to allow this, or set [tool.astrolabe.allow_unproven_overrides] concat = "possible"

- case: concat_align_over_prefix_disjoint_remainders_narrows
  main: |
    import polars as pl
    from astrolabe import Columns, other_columns, TypedDataFrame

    # No disjoint_from= at all: the two only_prefix= records already
    # prove the remainders share no name.
    A = other_columns(only_prefix="a_")
    B = other_columns(only_prefix="b_")

    class OneSchema(Columns):
        k: pl.Int64

    one: TypedDataFrame[OneSchema, A]
    two: TypedDataFrame[OneSchema, B]
    reveal_type(pl.concat([one, two], how="align"))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict(main.OneSchema, {'k': polars.datatypes.classes.Int64}, closed=True), astrolabe.remainder.Both[main.A, main.B]]"

