# Union-by-name concat strategies over remainders: allowed when every
# member pairing is certain, since every strategy constrains a shared
# name. Each member's declared names must be provably absent from
# every other member's remainder, no two remainders can share a name,
# and the result's remainder is the union of the members' slots.

- case: concat_horizontal_extend_over_disjoint_remainders_narrows_to_the_union
  main: |
    import polars as pl
    from astrolabe import Columns, other_columns, TypedDataFrame

    L = other_columns(without=["bar"])
    R = other_columns(without=["foo"], disjoint_from=L)

    class LeftSchema(Columns):
        foo: pl.Int64

    left: TypedDataFrame[LeftSchema, L]

    class RightSchema(Columns):
        bar: pl.String

    right: TypedDataFrame[RightSchema, R]
    reveal_type(pl.concat([left, right], how="horizontal_extend"))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'foo': polars.datatypes.classes.Int64, 'bar': polars.datatypes.classes.String}, closed=True), astrolabe.remainder.Both[main.L, main.R]]"

