- case: concat_beside_a_remainder_that_permits_no_column_narrows
  main: |
    import polars as pl
    from astrolabe import Columns, NumericType, other_columns, TypedDataFrame

    # A remainder whose type set is empty holds no column for any
    # caller, so it shares no name with any other remainder.
    L = other_columns(without=["bar"])
    Empty = other_columns(without=["foo"], all_of=NumericType, none_of=NumericType)

    class LeftSchema(Columns):
        foo: pl.Int64

    left: TypedDataFrame[LeftSchema, L]

    class RightSchema(Columns):
        bar: pl.String

    right: TypedDataFrame[RightSchema, Empty]
    reveal_type(pl.concat([left, right], how="horizontal_extend"))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'foo': polars.datatypes.classes.Int64, 'bar': polars.datatypes.classes.String}, closed=True), astrolabe.remainder.Both[main.Empty, main.L]]"
