# Joins over remainders: a join is allowed when the same columns are
# renamed for every caller. The declared halves are compared exactly;
# the remainder half is proven from the slots' records and the
# declarations' promises, and a join that cannot rule a rename out is
# an error at the join, never a silent erasure.

- case: join_open_left_to_known_right_with_the_promise_narrows
  main: |
    import polars as pl
    from astrolabe import Columns, other_columns, TypedDataFrame

    class SectorsSchema(Columns):
        symbol: pl.String
        sector: pl.String

    Sectors = TypedDataFrame[SectorsSchema]
    NoSector = other_columns(without=["sector"])

    class DfSchema(Columns):
        symbol: pl.String

    # The right frame is fully known, so only one pairing needs a
    # promise: the left remainder must not hold a right name. The
    # caller's own extra columns come back untouched.
    df: TypedDataFrame[DfSchema, NoSector]
    ref: Sectors
    reveal_type(df.join(ref, on="symbol"))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'symbol': polars.datatypes.classes.String, 'sector': polars.datatypes.classes.String}, closed=True), main.NoSector]"

- case: join_open_left_without_the_promise_is_an_error
  main: |
    import polars as pl
    from astrolabe import Columns, other_columns, TypedDataFrame

    class SectorsSchema(Columns):
        symbol: pl.String
        sector: pl.String

    Sectors = TypedDataFrame[SectorsSchema]
    Rest = other_columns()

    class DfSchema(Columns):
        symbol: pl.String

    # A caller whose frame holds "sector" gets a renamed column; one
    # whose frame lacks it does not. No single type covers both, so
    # the join reports which name is at risk.
    df: TypedDataFrame[DfSchema, Rest]
    ref: Sectors
    df.join(ref, on="symbol")  # E: This join renames columns for some callers but not others: the remainder can hold "sector". Exclude the names with without=/without_prefix=, or make the overlap total with within=  [join-rename] # N: set allow_unproven = "possible" in [tool.astrolabe] to allow this, or set [tool.astrolabe.allow_unproven_overrides] join = "possible"

- case: join_open_left_with_a_prefix_promise_narrows
  main: |
    import polars as pl
    from astrolabe import Columns, other_columns, TypedDataFrame

    class RefSchema(Columns):
