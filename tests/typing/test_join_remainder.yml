- case: join_two_open_frames_with_the_promise_on_the_left_narrows
  main: |
    import polars as pl
    from astrolabe import Columns, other_columns, TypedDataFrame

    # The disjointness promise can sit on either side's declaration:
    # here the receiver's own remainder declares it.
    R = other_columns(without=["price"])
    L = other_columns(without=["sector"], disjoint_from=R)

    class LeftSchema(Columns):
        symbol: pl.String
        price: pl.Float64

    left: TypedDataFrame[LeftSchema, L]

    class RightSchema(Columns):
        symbol: pl.String
        sector: pl.String

    right: TypedDataFrame[RightSchema, R]
    reveal_type(left.join(right, on="symbol"))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'symbol': polars.datatypes.classes.String, 'price': polars.datatypes.classes.Float64, 'sector': polars.datatypes.classes.String}, closed=True), astrolabe.remainder.Both[main.L, main.R]]"

- case: containment_join_suffixes_the_whole_right_side
  main: |
    import polars as pl
    from astrolabe import Columns, other_columns, TypedDataFrame

    # The everything-collides shape: within= makes every right column
    # certain to be renamed, and without_suffix= makes every renamed
    # name land on free ground.
    L = other_columns(without_suffix="_prev")
    R = other_columns(within=L)

    class SnapshotSchema(Columns):
        symbol: pl.String
        price: pl.Float64

    Snapshot = TypedDataFrame[SnapshotSchema, L]
    Previous = TypedDataFrame[SnapshotSchema, R]

    current: Snapshot
    previous: Previous
    reveal_type(current.join(previous, on="symbol", suffix="_prev"))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'symbol': polars.datatypes.classes.String, 'price': polars.datatypes.classes.Float64, 'price_prev': polars.datatypes.classes.Float64}, closed=True), astrolabe.remainder.Both[main.L, astrolabe.remainder.Suffixed[main.R, Literal['_prev']]]]"

- case: containment_join_without_the_suffix_promise_is_an_error
  main: |
    import polars as pl
    from astrolabe import Columns, other_columns, TypedDataFrame

    # Without without_suffix=, a left frame holding both "price" and
    # "price_prev" makes real polars raise, because the renamed right
    # "price" lands on a taken name.
    L = other_columns()
    R = other_columns(within=L)

    class CurrentSchema(Columns):
        symbol: pl.String

    current: TypedDataFrame[CurrentSchema, L]
    previous: TypedDataFrame[CurrentSchema, R]
    current.join(previous, on="symbol", suffix="_prev")  # E: This join renames every right column with "_prev", but the left frame can already hold a name ending in it, and real polars raises rather than suffixing twice. Declare without_suffix="_prev" on the left remainder  [join-rename] # N: set allow_unproven = "possible" in [tool.astrolabe] to allow this, or set [tool.astrolabe.allow_unproven_overrides] join = "possible"

- case: containment_proven_by_the_right_record_alone
  main: |
    import polars as pl
    from astrolabe import Columns, other_columns, TypedDataFrame

    # R's only= requirement proves every possible right remainder
    # name is a left declared name, so the containment holds with no
    # within= promise at all: a promise replaced by a fact.
    L = other_columns(without_suffix="_x")
    R = other_columns(only=["price"])

    class CurrentSchema(Columns):
        symbol: pl.String
        price: pl.Float64

    current: TypedDataFrame[CurrentSchema, L]

    class PreviousSchema(Columns):
        symbol: pl.String

    previous: TypedDataFrame[PreviousSchema, R]
    reveal_type(current.join(previous, on="symbol", suffix="_x"))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict(main.CurrentSchema, {'symbol': polars.datatypes.classes.String, 'price': polars.datatypes.classes.Float64}, closed=True), astrolabe.remainder.Both[main.L, astrolabe.remainder.Suffixed[main.R, Literal['_x']]]]"

- case: join_asof_shares_the_join_remainder_rule
  main: |
    import polars as pl
    from astrolabe import Columns, other_columns, TypedDataFrame

    class QuotesSchema(Columns):
        time: pl.Int64
        bid: pl.Float64

    Quotes = TypedDataFrame[QuotesSchema]
    NoBid = other_columns(without=["bid"])
    Rest = other_columns()

    class TradesSchema(Columns):
        time: pl.Int64

    # The same rule as .join(): with the promise the remainder passes
    # through; without it the join reports the name at risk.
    trades: TypedDataFrame[TradesSchema, NoBid]
    quotes: Quotes
    reveal_type(trades.join_asof(quotes, on="time"))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'time': polars.datatypes.classes.Int64, 'bid': polars.datatypes.classes.Float64}, closed=True), main.NoBid]"

    open_trades: TypedDataFrame[TradesSchema, Rest]
    open_trades.join_asof(quotes, on="time")  # E: This join renames columns for some callers but not others: the remainder can hold "bid". Exclude the names with without=/without_prefix=, or make the overlap total with within=  [join-rename] # N: set allow_unproven = "possible" in [tool.astrolabe] to allow this, or set [tool.astrolabe.allow_unproven_overrides] join_asof = "possible"

- case: join_where_shares_the_join_remainder_rule
  main: |
    import polars as pl
    from astrolabe import Columns, other_columns, TypedDataFrame

    # join_where keeps every column from both sides, so the promise
    # must cover every right name.
    NoRight = other_columns(without=["bid", "x2"])

    class EastSchema(Columns):
        x: pl.Int64

    east: TypedDataFrame[EastSchema, NoRight]

    class WestSchema(Columns):
        bid: pl.Float64
        x2: pl.Int64

    west: TypedDataFrame[WestSchema]
    reveal_type(east.join_where(west, pl.col("x") < pl.col("x2")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'x': polars.datatypes.classes.Int64, 'bid': polars.datatypes.classes.Float64, 'x2': polars.datatypes.classes.Int64}, closed=True), main.NoRight]"
