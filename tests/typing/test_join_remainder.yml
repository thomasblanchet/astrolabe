- case: semi_and_anti_joins_pass_the_remainder_through
  main: |
    import polars as pl
    from astrolabe import Columns, other_columns, TypedDataFrame

    class SectorsSchema(Columns):
        symbol: pl.String
        sector: pl.String

    Sectors = TypedDataFrame[SectorsSchema]
    Rest = other_columns()

    class DfSchema(Columns):
        symbol: pl.String

    # Semi and anti joins take no columns from the right frame, so
    # nothing can collide and no promise applies.
    df: TypedDataFrame[DfSchema, Rest]
    ref: Sectors
    reveal_type(df.join(ref, on="symbol", how="semi"))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict(main.DfSchema, {'symbol': polars.datatypes.classes.String}, closed=True), main.Rest]"
    reveal_type(df.join(ref, on="symbol", how="anti"))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict(main.DfSchema, {'symbol': polars.datatypes.classes.String}, closed=True), main.Rest]"

- case: join_two_open_frames_with_the_three_promises_narrows_to_the_union
  main: |
    import polars as pl
    from astrolabe import Columns, other_columns, TypedDataFrame

    # Each without= names the other side's declared columns, and
    # disjoint_from= closes the remainder-remainder pairing. The
    # result's remainder is the union of the two.
    L = other_columns(without=["sector"])
    R = other_columns(without=["price"], disjoint_from=L)

    class LeftSchema(Columns):
        symbol: pl.String
        price: pl.Float64

    left: TypedDataFrame[LeftSchema, L]

    class RightSchema(Columns):
        symbol: pl.String
        sector: pl.String

    right: TypedDataFrame[RightSchema, R]
    reveal_type(left.join(right, on="symbol"))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'symbol': polars.datatypes.classes.String, 'price': polars.datatypes.classes.Float64, 'sector': polars.datatypes.classes.String}, closed=True), astrolabe.remainder.Both[main.L, main.R]]"

- case: join_two_open_frames_without_disjointness_is_an_error
  main: |
    import polars as pl
    from astrolabe import Columns, other_columns, TypedDataFrame

    L = other_columns(without=["sector"])
    R = other_columns(without=["price"])

    class LeftSchema(Columns):
        symbol: pl.String
        price: pl.Float64

    # Both name promises hold, but the two remainders can still share
    # a name, and a shared hidden pair collides at run time.
    left: TypedDataFrame[LeftSchema, L]

    class RightSchema(Columns):
        symbol: pl.String
        sector: pl.String

    right: TypedDataFrame[RightSchema, R]
    left.join(right, on="symbol")  # E: This join renames columns for some callers but not others: the two remainders can share a name. Declare disjoint_from= on one of them  [join-rename] # N: set allow_unproven = "possible" in [tool.astrolabe] to allow this, or set [tool.astrolabe.allow_unproven_overrides] join = "possible"

- case: join_two_open_frames_with_disjoint_prefix_promises_narrows
  main: |
    import polars as pl
    from astrolabe import Columns, other_columns, TypedDataFrame

    # No disjoint_from= at all: the two only_prefix= declarations
    # already prove the remainders share no name, from the records
    # alone.
    L = other_columns(only_prefix="a_")
    R = other_columns(only_prefix="b_")

    class LeftSchema(Columns):
        k: pl.Int64

    left: TypedDataFrame[LeftSchema, L]
    right: TypedDataFrame[LeftSchema, R]
    reveal_type(left.join(right, on="k"))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict(main.LeftSchema, {'k': polars.datatypes.classes.Int64}, closed=True), astrolabe.remainder.Both[main.L, main.R]]"

