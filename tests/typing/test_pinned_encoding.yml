    reveal_type(df.select(peak))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'q': polars.datatypes.classes.Int64}, closed=True), None]"
    reveal_type(df.select(packed))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'q': astrolabe.frame.Struct[tuple[astrolabe.frame.Column[Literal['q'], polars.datatypes.classes.Int64]]]}, closed=True), None]"

