- case: a_disjoint_promise_survives_a_filter_on_the_left_remainder
  main: |
    from typing import Literal
    import polars as pl
    from astrolabe import Columns, Minus, TypedDataFrame, other_columns

    L = other_columns()
    R = other_columns(disjoint_from=L)

    class SnapshotSchema(Columns):
        symbol: pl.String

    left: TypedDataFrame[SnapshotSchema, Minus[L, Literal["x"]]]
    right: TypedDataFrame[SnapshotSchema, R]
    # R promises that it shares no name with L.
    # Minus only takes a name out of L and renames nothing, so the promise still holds and the join is allowed.
