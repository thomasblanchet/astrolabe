- case: the_family_class_of_a_one_kind_family_is_not_a_region
  main: |
    from typing import Literal
    import polars as pl
    from polars.datatypes.classes import ObjectType
    from astrolabe import Columns, TypedDataFrame
    from astrolabe.expr import TypedColumn

    class FrameSchema(Columns):
        o: pl.Object

    def picked(df: TypedDataFrame[FrameSchema], e: TypedColumn[Literal["o"], ObjectType], g: TypedColumn[Literal["o"], pl.Object]) -> None:
        # ObjectType is the family class of one kind, so a region never names it.
        # The Object class names that kind, so only the second type reads as an expression.
        reveal_type(df.select(e))  # N: Revealed type is "polars.dataframe.frame.DataFrame"
        reveal_type(df.select(g))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict(main.FrameSchema, {'o': polars.datatypes.classes.Object}, closed=True), None]"

