        reveal_type(a.with_columns(pz=pl.lit(1)))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'k': polars.datatypes.classes.Int64, 'pz': polars.datatypes.classes.Int32}, closed=True), astrolabe.remainder.Only[main.Rest, astrolabe.remainder.Matching[Literal['p(([^z]|z.).*)?']]]]"

- case: a_matching_marker_reads_a_signature_and_refuses_another_text
  main: |
    from typing import Literal
    import polars as pl
    from astrolabe import Columns, TypedDataFrame, other_columns
    from astrolabe.remainder import Matching, Only

    Rest = other_columns()

    class Keys(Columns):
        k: pl.Int64

    # A Matching marker reads the signature of its set too. A text that is no
    # spelling, or a pattern that does not read back as itself, is no remainder.
