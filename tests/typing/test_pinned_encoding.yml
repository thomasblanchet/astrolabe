- case: remainder_filter_selectors_read_back_from_their_markers
  main: |
    # Each selector marker in an Only filter reads back as its test on names or data types.
    # A new column whose name the test accepts must be taken out of the filtered remainder.
    from typing import Literal
    import polars as pl
    from astrolabe import Columns, TypedDataFrame, other_columns
    from astrolabe.remainder import Contains, EndsWith, OfType, OneOf, Only, SelAnd, SelNot, SelOr, StartsWith

    Rest = other_columns()

    class Keys(Columns):
        k: pl.Int64

    def f(
        a: TypedDataFrame[Keys, Only[Rest, StartsWith[Literal["p"]]]],
        b: TypedDataFrame[Keys, Only[Rest, EndsWith[Literal["p"]]]],
        c: TypedDataFrame[Keys, Only[Rest, Contains[Literal["p"]]]],
        d: TypedDataFrame[Keys, Only[Rest, OneOf[Literal["p"]]]],
        g: TypedDataFrame[Keys, Only[Rest, OfType[pl.String]]],
        h: TypedDataFrame[Keys, Only[Rest, SelNot[StartsWith[Literal["q"]]]]],
        i: TypedDataFrame[Keys, Only[Rest, SelAnd[StartsWith[Literal["p"]], EndsWith[Literal["q"]]]]],
    ) -> None:
        reveal_type(a.with_columns(pz=pl.lit(1)))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'k': polars.datatypes.classes.Int64, 'pz': polars.datatypes.classes.Int32}, closed=True), astrolabe.remainder.Only[main.Rest, astrolabe.remainder.Matching[Literal['p(([^z]|z.).*)?']]]]"
        reveal_type(b.with_columns(zp=pl.lit(1)))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'k': polars.datatypes.classes.Int64, 'zp': polars.datatypes.classes.Int32}, closed=True), astrolabe.remainder.Only[main.Rest, astrolabe.remainder.Matching[Literal['0[[^pz]>1;p>2;z>3]|1[[^pz]>1;p>2;z>1]|2F[[^pz]>1;p>2;z>1]|3[[^pz]>1;p>1;z>1]']]]]"
        reveal_type(c.with_columns(zpz=pl.lit(1)))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'k': polars.datatypes.classes.Int64, 'zpz': polars.datatypes.classes.Int32}, closed=True), astrolabe.remainder.Only[main.Rest, astrolabe.remainder.Matching[Literal['0[[^pz]>1;p>2;z>3]|1[[^pz]>1;p>2;z>1]|2F[[^pz]>2;p>2;z>2]|3[[^pz]>1;p>4;z>1]|4F[[^pz]>2;p>2;z>5]|5[[^pz]>2;p>2;z>2]']]]]"
        reveal_type(d.with_columns(p=pl.lit(1)))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'k': polars.datatypes.classes.Int64, 'p': polars.datatypes.classes.Int32}, closed=True), None]"
        reveal_type(g.with_columns(s=pl.lit(1)))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'k': polars.datatypes.classes.Int64, 's': polars.datatypes.classes.Int32}, closed=True), astrolabe.remainder.Only[main.Rest, astrolabe.remainder.SelAnd[astrolabe.remainder.OfType[polars.datatypes.classes.String], astrolabe.remainder.SelNot[astrolabe.remainder.OneOf[Literal['s']]]]]]"
        reveal_type(h.with_columns(z=pl.lit(1)))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'k': polars.datatypes.classes.Int64, 'z': polars.datatypes.classes.Int32}, closed=True), astrolabe.remainder.Only[main.Rest, astrolabe.remainder.Matching[Literal['(([^qz]|z.).*)?']]]]"
        reveal_type(i.with_columns(pq=pl.lit(1)))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'k': polars.datatypes.classes.Int64, 'pq': polars.datatypes.classes.Int32}, closed=True), astrolabe.remainder.Only[main.Rest, astrolabe.remainder.Matching[Literal['0[[^pq]>1;p>2;q>1]|1[[^pq]>1;p>1;q>1]|2[[^pq]>3;p>3;q>3]|3[[^pq]>3;p>3;q>4]|4F[[^pq]>3;p>3;q>4]']]]]"
    def g2(j: TypedDataFrame[Keys, Only[Rest, SelOr[StartsWith[Literal["p"]], EndsWith[Literal["q"]]]]]) -> None:
        reveal_type(j.with_columns(pz=pl.lit(1)))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'k': polars.datatypes.classes.Int64, 'pz': polars.datatypes.classes.Int32}, closed=True), astrolabe.remainder.Only[main.Rest, astrolabe.remainder.Matching[Literal['0[[^pqz]>1;p>2;q>3;z>1]|1[[^pqz]>1;p>1;q>3;z>1]|2F[[^pqz]>4;p>4;q>4;z>5]|3F[[^pqz]>1;p>1;q>3;z>1]|4F[[^pqz]>4;p>4;q>4;z>4]|5[[^pqz]>4;p>4;q>4;z>4]']]]]"

- case: a_matching_marker_reads_back_as_its_machine
  main: |
    from typing import Literal
    import polars as pl
    from astrolabe import Columns, TypedDataFrame, other_columns
    from astrolabe.remainder import Matching, Only

    Rest = other_columns()

    class Keys(Columns):
        k: pl.Int64

    def f(a: TypedDataFrame[Keys, Only[Rest, Matching[Literal['p.*']]]]) -> None:
        # The Matching marker holds the machine of the names that start with "p".
