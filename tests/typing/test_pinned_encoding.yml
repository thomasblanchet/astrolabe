# Cases that pin the codecs, which write the types of expressions,
# selectors and remainders, and read them back.

- case: a_region_of_one_object_kind_is_written_as_its_own_class
  main: |
    import polars as pl
    from astrolabe import column, row, same, typed_expr

    Counted = typed_expr(
        row(column("a", {pl.Object}), gives=pl.Int64),
        row(column("a", {pl.Int64, pl.Float64}), gives=same),
        named="a",
    )

    def kept(x: Counted) -> Counted:
        return x

    # A row whose region holds only Object names the Object class.
    # The family class ObjectType must not replace it.
    reveal_type(kept)  # N: Revealed type is "def (x: astrolabe.expr.TypedExpr[astrolabe.expr.Reads[astrolabe.frame.Column[Literal['a'], polars.datatypes.classes.Float64 | polars.datatypes.classes.Int64 | polars.datatypes.classes.Object]], astrolabe.frame.Column[Literal['a'], astrolabe.expr.Rows[astrolabe.expr.Row[polars.datatypes.classes.Float64 | polars.datatypes.classes.Int64, astrolabe.expr.Same[Literal['a']]], astrolabe.expr.Row[polars.datatypes.classes.Object, polars.datatypes.classes.Int64]]]]) -> astrolabe.expr.TypedExpr[astrolabe.expr.Reads[astrolabe.frame.Column[Literal['a'], polars.datatypes.classes.Float64 | polars.datatypes.classes.Int64 | polars.datatypes.classes.Object]], astrolabe.frame.Column[Literal['a'], astrolabe.expr.Rows[astrolabe.expr.Row[polars.datatypes.classes.Float64 | polars.datatypes.classes.Int64, astrolabe.expr.Same[Literal['a']]], astrolabe.expr.Row[polars.datatypes.classes.Object, polars.datatypes.classes.Int64]]]]"

- case: a_declared_family_region_reads_back_as_its_members
  main: |
    import polars as pl
    from polars.datatypes.classes import FloatType
    from astrolabe import Columns, TypedDataFrame, column, same, typed_expr

    Rounded = typed_expr(column("a", FloatType), gives=same, named="a")

    def rounded(x: Rounded) -> Rounded:
        return x.round(1)

    class FrameSchema(Columns):
        a: pl.Float32

    df: TypedDataFrame[FrameSchema]

    # A region named by a family class reads back as every member of the family.
    # A Float32 column is a member of FloatType, so the call fits.
    reveal_type(df.select(rounded(pl.col("a"))))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict(main.FrameSchema, {'a': polars.datatypes.classes.Float32}, closed=True), None]"

