- case: a_malformed_relation_base_leaves_the_other_relations_readable
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame, other_columns
    from astrolabe.remainder import DeclaredRemainder, DisjointFrom

    class Loose(DeclaredRemainder, DisjointFrom[None]): ...

    Other = other_columns(disjoint_from=Loose)

    class FrameSchema(Columns):
        a: pl.Int64

    def joined(df: TypedDataFrame[FrameSchema, Loose], other: TypedDataFrame[FrameSchema, Other]) -> None:
        # Other promises that it shares no name with Loose, so the join renames nothing.
        # The base of Loose that names no class states no relation, and the join must still use the promise of Other.
        reveal_type(df.join(other, on="a"))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict(main.FrameSchema, {'a': polars.datatypes.classes.Int64}, closed=True), astrolabe.remainder.Both[main.Loose, main.Other]]"
        reveal_type(other.join(df, on="a"))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict(main.FrameSchema, {'a': polars.datatypes.classes.Int64}, closed=True), astrolabe.remainder.Both[main.Loose, main.Other]]"

- case: a_declaration_with_a_malformed_relation_base_promises_no_relation
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame, other_columns
    from astrolabe.remainder import DeclaredRemainder, DisjointFrom, Within

    Other = other_columns()

    class Loose(DeclaredRemainder, DisjointFrom[Other], Within[None]): ...

    class FrameSchema(Columns):
        a: pl.Int64

    def joined(df: TypedDataFrame[FrameSchema, Loose], other: TypedDataFrame[FrameSchema, Other]) -> None:
        # The Within base of Loose names no class, so the checker cannot read the relations of Loose.
        # Loose then promises no relation, and its DisjointFrom base must not count.
        reveal_type(df.join(other, on="a"))  # E: This join renames columns for some callers but not others: the two remainders can share a name. Declare disjoint_from= on one of them  [join-rename] # N: set allow_unproven = "possible" in [tool.astrolabe] to allow this, or set [tool.astrolabe.allow_unproven_overrides] join = "possible" # N: Revealed type is "polars.dataframe.frame.DataFrame"

- case: a_declaration_with_a_malformed_requirement_base_proves_nothing
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame, other_columns
    from astrolabe.remainder import AllOf, DeclaredRemainder, Without

    class NoNames(DeclaredRemainder, Without[int]): ...
    class NoFamily(DeclaredRemainder, AllOf[int]): ...

    Open = other_columns()

    class FrameSchema(Columns):
        a: pl.Int64

    def takes_names(df: TypedDataFrame[FrameSchema, NoNames]) -> None: ...
    def takes_family(df: TypedDataFrame[FrameSchema, NoFamily]) -> None: ...

    def caller(df: TypedDataFrame[FrameSchema, Open]) -> None:
        # A requirement base whose argument is not a name or a family cannot be read.
        # The call must then report that the argument does not prove the requirements.
        takes_names(df)  # E: The argument's own remainder does not prove the requirements of "NoNames". Declare the missing requirement on the argument's own remainder  [forbidden-column] # N: set allow_unproven = "asserted" in [tool.astrolabe] to allow this, or set [tool.astrolabe.allow_unproven_overrides] fit = "asserted"
        takes_family(df)  # E: The argument's own remainder does not prove the requirements of "NoFamily". Declare the missing requirement on the argument's own remainder  [forbidden-column] # N: set allow_unproven = "asserted" in [tool.astrolabe] to allow this, or set [tool.astrolabe.allow_unproven_overrides] fit = "asserted"

    def inside(names: TypedDataFrame[FrameSchema, NoNames], family: TypedDataFrame[FrameSchema, NoFamily]) -> None:
        # Inside the function, a new column still takes its name out of the remainder.
        reveal_type(names.with_columns(b=pl.lit(1)))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'a': polars.datatypes.classes.Int64, 'b': polars.datatypes.classes.Int32}, closed=True), astrolabe.remainder.Minus[main.NoNames, Literal['b']]]"
        reveal_type(family.with_columns(b=pl.lit(1)))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'a': polars.datatypes.classes.Int64, 'b': polars.datatypes.classes.Int32}, closed=True), astrolabe.remainder.Minus[main.NoFamily, Literal['b']]]"

- case: an_open_chain_type_whose_output_is_not_a_hole_is_not_read
  main: |
    from typing import Any, Literal
    import polars as pl
    from astrolabe import Column, Columns, TypedDataFrame
    from astrolabe.expr import Reads, TypedThen

    class FrameSchema(Columns):
        a: pl.Int64

    def picked(df: TypedDataFrame[FrameSchema], e: TypedThen[Reads[Column[Literal["a"], pl.Int64]], Column[Literal["a"], Any]]) -> None:
        # A chain type that holds no code does not read as an expression, so the select gives the plain frame.
        reveal_type(df.select(e))  # N: Revealed type is "polars.dataframe.frame.DataFrame"

- case: a_column_type_with_a_malformed_part_is_not_read
  main: |
    from typing import Any, Literal
    import polars as pl
    from astrolabe import Columns, TypedDataFrame, column
    from astrolabe.expr import TypedColumn

    class FrameSchema(Columns):
        a: pl.Int64

    Price = column("a", pl.Int64)

    def kept(x: Price) -> Price:
        return x

    def picked(df: TypedDataFrame[FrameSchema], e: TypedColumn[Literal["a"], Any], g: TypedColumn[str, pl.Int64]) -> None:
        # A TypedColumn type needs a literal name and a region of data types.
        # A type with another part does not read as an expression, so the select gives the plain frame.
        reveal_type(df.select(e))  # N: Revealed type is "polars.dataframe.frame.DataFrame"
        reveal_type(df.select(g))  # N: Revealed type is "polars.dataframe.frame.DataFrame"
        # A declared parameter cannot accept a value that does not read as an expression.
        kept(e)  # E: Argument "x" does not match its declared type: this value is not a typed expression, so its columns and types are unknown  [expression-fit] # N: set allow_unproven = "asserted" in [tool.astrolabe] to allow this, or set [tool.astrolabe.allow_unproven_overrides] fit = "asserted"

- case: a_right_join_drops_the_left_key_from_the_names_at_risk
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame, other_columns

    Rest = other_columns()

    class Left(Columns):
        a: pl.Int64
        v: pl.Int64

    class Right(Columns):
        b: pl.Int64

    def joined(left: TypedDataFrame[Left], right: TypedDataFrame[Right, Rest]) -> None:
        # A right join drops the left key column "a", so a hidden right column "a" cannot collide with it.
        # A hidden right column "v" still collides with the left column "v".
        reveal_type(left.join(right, left_on="a", right_on="b", how="right"))  # E: This join renames columns for some callers but not others: the remainder can hold "v". Exclude the names with without=/without_prefix=, or make the overlap total with within=  [join-rename] # N: set allow_unproven = "possible" in [tool.astrolabe] to allow this, or set [tool.astrolabe.allow_unproven_overrides] join = "possible" # N: Revealed type is "polars.dataframe.frame.DataFrame"

- case: a_containment_join_refuses_a_declared_left_name_with_the_suffix
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame, other_columns

    L = other_columns(without_suffix="_x")
    R = other_columns(only=["price"])

    class CurrentSchema(Columns):
        symbol: pl.String
        price: pl.Float64
        price_x: pl.Float64

    class PreviousSchema(Columns):
        symbol: pl.String

    current: TypedDataFrame[CurrentSchema, L]
    previous: TypedDataFrame[PreviousSchema, R]
    # A hidden right column "price" gets the suffix and becomes "price_x".
    # The left frame declares "price_x", so polars raises, and the join is an error.
    current.join(previous, on="symbol", suffix="_x")  # E: This join renames every right column with "_x", but the left frame can already hold a name ending in it, and real polars raises rather than suffixing twice. Declare without_suffix="_x" on the left remainder  [join-rename] # N: set allow_unproven = "possible" in [tool.astrolabe] to allow this, or set [tool.astrolabe.allow_unproven_overrides] join = "possible"

