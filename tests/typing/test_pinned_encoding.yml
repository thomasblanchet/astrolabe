- case: a_deferred_read_of_an_operand_table_reads_back
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class FrameSchema(Columns):
        q: pl.Int64
        r: pl.Int64

    df: TypedDataFrame[FrameSchema]
    peak = pl.max_horizontal(pl.col("q") + 1, pl.col("r"))
    packed = pl.struct(pl.col("q").abs())
    # The type of each expression holds its code, which a frame operation evaluates at the declared data types.
