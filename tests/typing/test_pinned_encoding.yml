    def unread(a: TypedDataFrame[Keys, Only[Rest, Matching[Literal["a(b)?.*"]]]]) -> None: ...  # E: TypedDataFrame[...]/TypedLazyFrame[...]'s second argument must be a remainder: a class declared with other_columns(...), a remainder marker over one, or SplitColumns[...]  [marker-arg]

    def broken(a: TypedDataFrame[Keys, Only[Rest, Matching[Literal["0F.>0]"]]]]) -> None: ...  # E: TypedDataFrame[...]/TypedLazyFrame[...]'s second argument must be a remainder: a class declared with other_columns(...), a remainder marker over one, or SplitColumns[...]  [marker-arg]

    def looped(a: TypedDataFrame[Keys, Only[Rest, Matching[Literal["(ab)*"]]]]) -> None: ...  # E: TypedDataFrame[...]/TypedLazyFrame[...]'s second argument must be a remainder: a class declared with other_columns(...), a remainder marker over one, or SplitColumns[...]  [marker-arg]

- case: a_selection_type_reads_only_its_own_markers
  main: |
    from typing import Literal
    import polars as pl
    from astrolabe import Column, Columns, TypedDataFrame
    from astrolabe.expr import Affix, Blank, Row, Rows, Same, TypedSelection
    from astrolabe.remainder import OfType

    class FrameSchema(Columns):
        a: pl.Int64
        fee: pl.Int64

    def picked(
        df: TypedDataFrame[FrameSchema],
        affix: TypedSelection[OfType[pl.Int64], Rows[Row[pl.Int64, Same[Blank]]], Affix[Literal["p_"], Literal[""], None]],
        restamp: TypedSelection[OfType[pl.Int64], Rows[Row[pl.Int64, Same[Blank]]], Row[Literal["p_"], Literal[""], None]],
    ) -> None:
        # The rename part is an Affix marker, and it adds its prefix to each picked column.
        reveal_type(df.select(affix))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'p_a': polars.datatypes.classes.Int64, 'p_fee': polars.datatypes.classes.Int64}, closed=True), None]"
        # Another marker with three parts is not a rename, so the type does not read as a selection.
        reveal_type(df.select(restamp))  # N: Revealed type is "polars.dataframe.frame.DataFrame"

- case: expression_types_with_malformed_outcome_markers_are_not_read
  main: |
    from typing import Any, Literal
    import polars as pl
    from astrolabe import Column, Columns, TypedDataFrame
    from astrolabe.expr import Reads, Row, Rows, Same, TypedExpr, Wrap

    class FrameSchema(Columns):
        a: pl.Int64
        b: pl.String

    A = Literal["a"]
    In = Reads[Column[A, pl.Int64]]

    def picked(
        df: TypedDataFrame[FrameSchema],
        e1: TypedExpr[In, Column[A, Wrap[pl.List, Any]]],  # E: Type argument "Wrap[polars.datatypes.classes.List, Any]" of "Column" must be a subtype of "DataType"  [type-var]
        e3: TypedExpr[In, Column[A, Same[int]]],  # E: Type argument "Same[int]" of "Column" must be a subtype of "DataType"  [type-var]
        e12: TypedExpr[Reads[Column[A, Any]], Column[A, pl.Int64]],
        e13: TypedExpr[In, Column[A, Rows[Row[pl.Int64]]]],  # E: Type argument "Rows[Row[Int64]]" of "Column" must be a subtype of "DataType"  [type-var]
        e14: TypedExpr[In, Column[A, Rows[int]]],  # E: Type argument "Rows[int]" of "Column" must be a subtype of "DataType"  [type-var]
        e18: TypedExpr[In, Column[A, Wrap[int, Same[A]]]],  # E: Type argument "Wrap[int, Same[Literal['a']]]" of "Column" must be a subtype of "DataType"  [type-var]
        e19: TypedExpr[Reads[Column[A, pl.Int64 | int]], Column[A, pl.Int64]],  # E: Type argument "Int64 | int" of "Column" must be a subtype of "DataType"  [type-var]
    ) -> None:
        # An expression type whose output part is not a well-formed outcome does not read as an expression.
        # The select then gives the plain frame, or keeps the column under Unchecked.
        reveal_type(df.select(e1))  # N: Revealed type is "polars.dataframe.frame.DataFrame"
        reveal_type(df.select(e3))  # N: Revealed type is "polars.dataframe.frame.DataFrame"
        reveal_type(df.select(e12))  # N: Revealed type is "polars.dataframe.frame.DataFrame"
        reveal_type(df.select(e13))  # N: Revealed type is "polars.dataframe.frame.DataFrame"
        reveal_type(df.select(e14))  # N: Revealed type is "polars.dataframe.frame.DataFrame"
        reveal_type(df.select(e18))  # E: "a" has no result type at this frame's column types: the declared result 'int(Int64)' is not a data type  [unsupported-dtype-op] # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'a': astrolabe.frame.Unchecked}, closed=True), None]"
        # A region of a read that holds a type that is no data type does not read either.
        reveal_type(df.select(e19))  # N: Revealed type is "polars.dataframe.frame.DataFrame"

