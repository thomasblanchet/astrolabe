- case: rename_with_no_arguments_errors
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class FrameSchema(Columns):
        foo: pl.String
        bar: pl.Int64

    # Polars requires the mapping, and the call takes the parameters of polars.
    Frame = TypedDataFrame[FrameSchema]

    df: Frame
    df.rename()  # E: Missing positional argument "mapping" in call to "rename" of "TypedDataFrame"  [call-arg]

