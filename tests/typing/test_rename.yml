# .rename(): renaming columns in a frame. Written before the corresponding
# get_method_hook implementation exists. This test is expected to fail
# (red) until plugin.py implements it.
#
# Only the dict-literal mapping form of rename() is statically checked.
# The callable form (`rename(lambda name: ...)`) cannot be introspected,
# so it falls back to the plain, erased pl.DataFrame/pl.LazyFrame, the
# same "cannot see it statically, so do not narrow and do not error"
# discipline as
# select/drop's non-literal arguments -- never to "schema unchanged",
# since a real rename() call would actually replace the renamed
# column's old name.

- case: rename_single_column_narrows_precisely
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class FrameSchema(Columns):
        foo: pl.String
        bar: pl.Int64

    Frame = TypedDataFrame[FrameSchema]

    df: Frame

    class RenamedSchema(Columns):
        foo: pl.String
        baz: pl.Int64

    renamed: TypedDataFrame[RenamedSchema] = df.rename({"bar": "baz"})

- case: rename_final_str_key_and_value_narrow_like_inline_literals
  main: |
    from typing import Final, Literal
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    # Final-declared string variables for both the mapping key and
    # value narrow the same way the equivalent inline string literals
    # do (see rename_single_column_narrows_precisely, above).
    OLD: Final = "bar"
    NEW: Final = "baz"

    class FrameSchema(Columns):
        foo: pl.String
        bar: pl.Int64

    Frame = TypedDataFrame[FrameSchema]

    df: Frame

    class RenamedSchema(Columns):
        foo: pl.String
        baz: pl.Int64

    renamed: TypedDataFrame[RenamedSchema] = df.rename({OLD: NEW})

