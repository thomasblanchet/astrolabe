- case: rename_frees_the_old_name_for_with_row_index
  main: |
    import polars as pl
    from astrolabe import Columns, other_columns, TypedDataFrame

    Rest = other_columns(without=["kk"])

    class DfSchema(Columns):
        k: pl.Int64

    # Real polars accepts this and gives
    # Schema({'k': UInt32, 'kk': Int64, ...}), measured against polars
    # 1.43.2. Renaming "k" away frees the name exactly as dropping it
    # does, so the result records that the remainder still lacks it and
    # a new column can take the name back.
    df: TypedDataFrame[DfSchema, Rest]
    reveal_type(df.rename({"k": "kk"}).with_row_index("k"))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'k': polars.datatypes.classes.UInt32, 'kk': polars.datatypes.classes.Int64}, closed=True), astrolabe.remainder.Minus[main.Rest, Literal['k']]]"

- case: rename_of_a_swap_frees_nothing_and_keeps_a_bare_rest
  main: |
    import polars as pl
    from astrolabe import Columns, other_columns, TypedDataFrame

    Rest = other_columns()

    class DfSchema(Columns):
        a: pl.Int64
        b: pl.String

    # Both names stay declared, only on different columns, so no name
    # is freed and no `Minus` node is minted.
    df: TypedDataFrame[DfSchema, Rest]

    class RenamedSchema(Columns):
        b: pl.Int64
        a: pl.String

    renamed: TypedDataFrame[RenamedSchema, Rest] = df.rename({"a": "b", "b": "a"})

- case: rename_reports_each_error_of_a_mapping
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class Values(Columns):
        v: pl.Int64
        k: pl.Int64

    a: TypedDataFrame[Values]
    a.rename({"v": "k"})  # E: Rename would produce duplicate column "k"  [duplicate-column]
    a.rename({"zz": "q"})  # E: Unknown column "zz"  [unknown-column]
    a.rename()  # E: Missing positional argument "mapping" in call to "rename" of "TypedDataFrame"  [call-arg]
