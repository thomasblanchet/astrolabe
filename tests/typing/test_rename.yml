- case: rename_of_a_column_that_the_undeclared_columns_can_hold_is_unproven
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame, other_columns

    Rest = other_columns()

    class FrameSchema(Columns):
        foo: pl.String

    # The undeclared columns can hold "missing", so polars raises only where
    # they do not.
    def f(df: TypedDataFrame[FrameSchema, Rest]) -> None:
        reveal_type(df.rename({"missing": "baz"}))  # E: Column "missing" is not declared and cannot be proven to exist  [undeclared-column]  # N: set allow_unproven = "possible" in [tool.astrolabe] to allow this, or set [tool.astrolabe.allow_unproven_overrides] rename = "possible"  # N: Revealed type is "polars.dataframe.frame.DataFrame"

