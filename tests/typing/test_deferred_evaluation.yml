- case: a_declared_map_is_a_leaf_with_the_type_and_the_rows_that_it_declares
  main: |
    import polars as pl
    from polars.datatypes.classes import FloatType
    from astrolabe import Columns, TypedDataFrame, column, some_column, typed_agg, typed_expr, typed_lit

    Total = typed_agg(column("price", pl.Float64), gives=pl.Float64)
    Ratio = typed_expr(some_column(FloatType), gives=pl.Float64)
    One = typed_lit(gives=pl.Int32)

    class Trades(Columns):
        price: pl.Float64
        qty: pl.Int64

    trades: TypedDataFrame[Trades]

    def share(total: Total, one: One) -> None:
        # An aggregation gives one value, which spreads over the rows of a column.
        reveal_type(trades.select(pl.col("qty") * total))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'qty': polars.datatypes.classes.Float64}, closed=True), None]"
        reveal_type(trades.select(total + 1))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'price': polars.datatypes.classes.Float64}, closed=True), None]"
        reveal_type(trades.select(pl.col("qty") + one))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'qty': polars.datatypes.classes.Int64}, closed=True), None]"

    def scaled(r: Ratio) -> None:
        # The blank read of the declaration has no name until a call binds it.
        trades.select(r * 2)  # E: A blank read (some_column) has no name until a call binds it  [unknown-column]


- case: a_declared_column_whose_name_the_checker_does_not_read_names_no_column
  main: |
    from typing import Any
    import polars as pl
    from astrolabe import Columns, TypedDataFrame
    from astrolabe.expr import TypedColumn, TypedExpr

    class Schema(Columns):
        a: pl.Int64

    # The name of the column comes from the argument of the caller, so the
    # output of the expression has no name that the checker knows.
    def named(df: TypedDataFrame[Schema], c: TypedColumn[str, pl.Int64], e: TypedExpr[Any]) -> None:
        reveal_type(df.select(c + 1))  # N: Revealed type is "polars.dataframe.frame.DataFrame"
        reveal_type(df.select(e + 1))  # N: Revealed type is "polars.dataframe.frame.DataFrame"
        # The leaf keeps its declared data type, and only its name is unknown.
        reveal_type(df.select(pl.col("a") + c))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict(main.Schema, {'a': polars.datatypes.classes.Int64}, closed=True), None]"
        reveal_type(df.select(x=c.cast(pl.String)))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'x': polars.datatypes.classes.String}, closed=True), None]"

- case: a_declared_column_whose_name_is_a_str_reads_a_column_that_is_not_proven
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame
    from astrolabe.expr import TypedColumn

    class Schema(Columns):
        a: pl.Int64
        b: pl.String

    # The frame need not hold the column that c reads, as for any name that
    # is not a literal. The data type of c still meets the other columns.
    def named(df: TypedDataFrame[Schema], c: TypedColumn[str, pl.Int64]) -> None:
        reveal_type(df.select(pl.col("a") + c))  # E: A declared column whose name is not one literal reads a column that cannot be proven to exist  [undeclared-column]  # N: set allow_unproven = "stated" in [tool.astrolabe] to allow this, or set [tool.astrolabe.allow_unproven_overrides] select = "stated"  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'a': polars.datatypes.classes.Int64}, closed=True), None]"
        df.select(pl.col("b") + c)  # E: A declared column whose name is not one literal reads a column that cannot be proven to exist  [undeclared-column]  # N: set allow_unproven = "stated" in [tool.astrolabe] to allow this, or set [tool.astrolabe.allow_unproven_overrides] select = "stated"  # E: "b" has no result type at this frame's column types: arithmetic on dtypes String and Int64 is not allowed, and polars raises InvalidOperationError  [unsupported-dtype-op]
  files:
    - path: pyproject.toml
      content: |
        [tool.mypy]
        plugins = ["astrolabe.plugin"]
        strict = true
        allow_redefinition = true

        [tool.astrolabe]
        allow_unproven = "none"

- case: a_declared_column_whose_name_is_a_union_of_literals_reads_one_of_them
  main: |
    from typing import Any, Literal
    import polars as pl
    from astrolabe import Columns, TypedDataFrame
    from astrolabe.expr import TypedColumn

    class Schema(Columns):
        a: pl.Int64
        b: pl.Int64

    def named(
        df: TypedDataFrame[Schema],
        c: TypedColumn[Literal["a", "b"], pl.Int64],
        d: TypedColumn[Literal["a", "z"], pl.Int64],
        e: TypedColumn[Any, pl.Int64],
    ) -> None:
        # The frame declares each name of the union, so the read is proven.
        reveal_type(df.select(pl.col("a") + c))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'a': polars.datatypes.classes.Int64}, closed=True), None]"
        # The frame does not declare "z".
        reveal_type(df.select(pl.col("a") + d))  # E: A declared column whose name is not one literal reads a column that cannot be proven to exist  [undeclared-column]  # N: set allow_unproven = "stated" in [tool.astrolabe] to allow this, or set [tool.astrolabe.allow_unproven_overrides] select = "stated"  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'a': polars.datatypes.classes.Int64}, closed=True), None]"
        # A name of the type Any gives no leaf, so the expression is not typed.
        reveal_type(df.select(pl.col("a") + e))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'a': astrolabe.frame.Unchecked}, closed=True), None]"
  files:
    - path: pyproject.toml
      content: |
        [tool.mypy]
        plugins = ["astrolabe.plugin"]
        strict = true
        allow_redefinition = true

        [tool.astrolabe]
        allow_unproven = "none"
