- case: a_name_that_a_selector_requires_is_a_column_of_a_closed_frame_or_of_the_remainder
  main: |
    import polars as pl
    import polars.selectors as cs
    from astrolabe import Columns, TypedDataFrame, other_columns

    class Schema(Columns):
        a: pl.Int8
        t: pl.String

    Rest = other_columns()
    df: TypedDataFrame[Schema]
    # Polars raises ColumnNotFoundError for a required name that the frame does not hold.
    df.select(cs.by_name("a", "zz"))  # E: Unknown column "zz"  [unknown-column]
    df.select(cs.numeric() - cs.by_name("zz"))  # E: Unknown column "zz"  [unknown-column]
    reveal_type(df.select(cs.by_name("a", "zz", require_all=False)))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'a': polars.datatypes.classes.Int8}, closed=True), None]"

    def open_frame(wide: TypedDataFrame[Schema, Rest]) -> None:
        # The remainder can hold the name.
        reveal_type(wide.select(cs.by_name("a", "zz")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'a': polars.datatypes.classes.Int8}, closed=True), astrolabe.remainder.Only[main.Rest, astrolabe.remainder.OneOf[Literal['a'] | Literal['zz']]]]"

