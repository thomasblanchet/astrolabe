# The evaluation of an expression: a frame operation evaluates the code of
# each expression at the data types of its receiver, with the rules of polars.
# These cases reveal the frames.

- case: an_expression_gives_the_run_type_at_the_columns_of_the_frame
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class Schema(Columns):
        a: pl.Int8
        d: pl.Date

    df: TypedDataFrame[Schema]
    reveal_type(df.select(pl.col("a") + 1, (pl.col("a") * 300).alias("big"), pl.col("d").dt.year()))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'a': polars.datatypes.classes.Int8, 'big': polars.datatypes.classes.Int16, 'd': polars.datatypes.classes.Int32}, closed=True), None]"
    reveal_type(df.with_columns(pl.col("a").cast(pl.Float32).alias("f")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'a': polars.datatypes.classes.Int8, 'd': polars.datatypes.classes.Date, 'f': polars.datatypes.classes.Float32}, closed=True), None]"

