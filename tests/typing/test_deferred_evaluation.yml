- case: a_value_that_the_checker_cannot_know_keeps_an_answer_that_every_value_gives
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class Schema(Columns):
        a: pl.Int8

    def shifted(df: TypedDataFrame[Schema], n: int) -> None:
        reveal_type(df.select(pl.col("a").shift(n)))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict(main.Schema, {'a': polars.datatypes.classes.Int8}, closed=True), None]"
