- case: a_function_whose_tree_polars_cannot_write_keeps_its_name_and_its_reads
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class Schema(Columns):
        a: pl.Int64
        b: pl.Float64

    df: TypedDataFrame[Schema]
    reveal_type(df.select(pl.fold(pl.lit(0), lambda acc, x: acc + x, [pl.col("a"), pl.col("b")])))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'literal': astrolabe.frame.Unchecked}, closed=True), None]"
    reveal_type(df.select(pl.reduce(function=lambda acc, x: acc + x, exprs=[pl.col("b"), pl.col("a")])))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'b': astrolabe.frame.Unchecked}, closed=True), None]"
    reveal_type(df.select(pl.cum_sum_horizontal("a", "b")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'cum_sum': astrolabe.frame.Unchecked}, closed=True), None]"
    df.select(pl.cum_reduce(lambda acc, x: acc + x, [pl.col("a"), pl.col("zz")]))  # E: Unknown column "zz"  [unknown-column]

