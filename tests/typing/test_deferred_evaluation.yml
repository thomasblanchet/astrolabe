- case: a_struct_of_too_many_open_fields_gives_unchecked
  main: |
    from typing import Literal
    import polars as pl
    from astrolabe import Column, Columns, Struct, TypedDataFrame, Unchecked

    class FrameSchema(Columns):
        st: Struct[Column[Literal["a"], Unchecked], Column[Literal["b"], Unchecked]]

    df: TypedDataFrame[FrameSchema]
    # Each open field takes every data type of the sample, and two of them give
    # too many structs to try, so the answer is not known.
    reveal_type(df.select(pl.col("st").is_null()))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'st': astrolabe.frame.Unchecked}, closed=True), None]"

