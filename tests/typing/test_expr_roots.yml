- case: col_root_with_an_unreadable_name_stays_plain
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class FrameSchema(Columns):
        a: pl.Int64

    # A name no literal supplies cannot be tracked: the reference stays
    # a plain expression, and the consumer keeps the whole call plain.
    Frame = TypedDataFrame[FrameSchema]

    def pick(name: str, df: Frame) -> None:
        reveal_type(pl.col(name))  # N: Revealed type is "astrolabe.expr.TypedExpr[astrolabe.expr.Deferred[Literal["pl.col(hole('str'))"]]]"
        reveal_type(df.select(pl.col(name)))  # N: Revealed type is "polars.dataframe.frame.DataFrame"

- case: col_root_with_an_unreadable_name_keeps_a_keyword_output_name
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class FrameSchema(Columns):
        a: pl.Int64

    # The keyword names the output, so the column survives as
    # Unchecked instead of the whole call going plain.
    Frame = TypedDataFrame[FrameSchema]

    def pick(name: str, df: Frame) -> None:
        reveal_type(df.select(out=pl.col(name)))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'out': astrolabe.frame.Unchecked}, closed=True), None]"

