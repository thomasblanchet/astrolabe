# The expression roots and the arguments a consumer reads directly:
# `pl.col`, `pl.lit`, `pl.len`, bare strings and bare scalars, keyword
# output names and `.alias`. Every expected frame is confirmed against
# real polars.

- case: col_root_reads_the_declared_column_back
  main: |
    import polars as pl
    from astrolabe import Columns, List, TypedDataFrame

    class FrameSchema(Columns):
        a: pl.Int64
        s: pl.String
        l: List[pl.Float64]

    Frame = TypedDataFrame[FrameSchema]

    df: Frame
    reveal_type(pl.col("a"))  # N: Revealed type is "astrolabe.expr.TypedExpr[astrolabe.expr.Deferred[Literal["pl.col('a')"]]]"

    class NarrowedSchema(Columns):
        l: List[pl.Float64]
        s: pl.String
        a: pl.Int64

    narrowed: TypedDataFrame[NarrowedSchema] = df.select(pl.col("l"), pl.col("s"), pl.col("a"))

