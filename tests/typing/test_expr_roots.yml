- case: bare_scalar_arguments_are_fresh_values
  main: |
    from typing import Final, Literal
    import polars as pl
    from astrolabe import Columns, TypedDataFrame, Unchecked

    class FrameSchema(Columns):
        a: pl.Int64

    # A literal integer picks its width from the value; a Final integer
    # is tracked the same way; an integer variable has no value, so
    # its width is unknown and the column is Unchecked. A float or a
    # Boolean has one data type whatever the value.
    Frame = TypedDataFrame[FrameSchema]

    WIDTH: Final = 1099511627776
    df: Frame
    count: int

    class NarrowedSchema(Columns):
        five: pl.Int32
        wide: pl.Int64
        ratio: pl.Float64
        flag: pl.Boolean
        count: Unchecked

    narrowed: TypedDataFrame[NarrowedSchema] = df.select(five=5, wide=WIDTH, ratio=1.5, flag=True, count=count)

- case: bare_float_variable_can_hold_an_int
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class FrameSchema(Columns):
        a: pl.Int64

    Frame = TypedDataFrame[FrameSchema]

    # mypy accepts an int where the code declares a float, and polars gives
    # an int its own width. A Boolean has one data type whatever the value.
    def scale(factor: float, flag: bool, df: Frame) -> None:
        reveal_type(df.select(ratio=factor, flag=flag))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'ratio': astrolabe.frame.Unchecked, 'flag': polars.datatypes.classes.Boolean}, closed=True), None]"
        reveal_type(df.select(pl.lit(factor)))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'literal': astrolabe.frame.Unchecked}, closed=True), None]"

- case: lit_root_reads_the_value_of_a_constant_expression
  main: |
    from typing import Final
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class FrameSchema(Columns):
        a: pl.Int64

    Frame = TypedDataFrame[FrameSchema]

    df: Frame
    SHIFT: Final = 10

    class NarrowedSchema(Columns):
        wide: pl.Int128
        low: pl.Int64
        lower: pl.Int128
        named: pl.Int32
        bare: pl.Int32
        ratio: pl.Float64
        flag: pl.Boolean

    # Python computes a constant expression before polars sees it, so the
    # literal takes the width of the computed value.
    narrowed: TypedDataFrame[NarrowedSchema] = df.select(
        wide=pl.lit(2**100),
        low=pl.lit(-(2**63)),
        lower=pl.lit(-(2**63) - 1),
        named=pl.lit(2**SHIFT),
        bare=2**SHIFT,
        ratio=pl.lit(1.5 * 2),
        flag=pl.lit(True & False),
    )

    # A value with too many bits to compute has no known width.
    def huge(frame: Frame) -> None:
        reveal_type(frame.select(pl.lit(2**10**10)))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'literal': astrolabe.frame.Unchecked}, closed=True), None]"
        reveal_type(frame.select(pl.lit(1 // 0)))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'literal': astrolabe.frame.Unchecked}, closed=True), None]"

- case: a_bytes_literal_is_binary
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class FrameSchema(Columns):
        s: pl.String

    # Python gives polars the bytes, also with an escape or a quote in them.
    df: TypedDataFrame[FrameSchema]
    reveal_type(df.select(pl.lit(b"x"), q=pl.lit(b"it's\x00")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'literal': polars.datatypes.classes.Binary, 'q': polars.datatypes.classes.Binary}, closed=True), None]"
    reveal_type(df.select(pl.col("s").fill_null(b"x")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'s': polars.datatypes.classes.Binary}, closed=True), None]"

