# .unpivot(): folding named columns into variable/value pairs. Written
# before the corresponding get_method_hook implementation exists. This
# test is expected to fail (red) until plugin.py implements it.
#
# Scope, confirmed against real polars 1.43.2 before writing these cases:
# - index=/on= must both be literal names (a bare string, a literal
#   list, or a Final-declared variable holding either) for this hook to
#   narrow. A polars.selectors argument, or one that cannot be read
#   statically, falls back to the plain, erased pl.DataFrame/pl.LazyFrame.
# - index columns pass through unchanged, in call-site order, not the
#   frame's own declared order.
# - index omitted defaults to [] (nothing passes through). on omitted
#   defaults to "every declared column not in index" -- an asymmetric
#   pair of defaults.
# - variable (always pl.String) and value (the promoted common
#   supertype of every folded column's own dtype, never erroring at
#   runtime: for example Int64+String promotes to String) are always
#   appended. Two numbers take the supertype that polars measures for
#   the pair (Int32 beside UInt32 gives Int64), as the "diagonal_relaxed"
#   concat does.
# - variable_name=None/value_name=None passed explicitly behaves
#   identically to omitting them.
# - on=[] (a real empty list, whether explicit or defaulted from an
#   index= covering every declared column) narrows: this shape has zero
#   dependency on any other column, always giving variable: String,
#   value: Null, confirmed against real polars 1.43.2.
# - A receiver with an unresolved Rest still narrows when on=/index=
#   are both explicit and every named column is in the receiver's own
#   declared portion. Only "on omitted" needs a fully declared receiver.

- case: unpivot_narrows_with_on_defaulted_to_everything_else
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class FrameSchema(Columns):
        id: pl.Int64
        x: pl.Int64
        y: pl.String

    Frame = TypedDataFrame[FrameSchema]

    df: Frame

    class NarrowedSchema(Columns):
        id: pl.Int64
        variable: pl.String
        value: pl.String

    narrowed: TypedDataFrame[NarrowedSchema] = df.unpivot(index="id")

