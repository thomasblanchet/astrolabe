- case: unpivot_generic_dtype_columns_narrow_to_unchecked
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame, Unchecked

    class Pair[D: pl.DataType](Columns):
        x: D
        y: D

    class NarrowedSchema(Columns):
        variable: pl.String
        value: Unchecked

    def func[D: pl.DataType](df: TypedDataFrame[Pair[D]]) -> None:
        # A column's own dtype can be a bare, still-unresolved type
        # variable inside a dtype-generic function, not yet a concrete
        # Instance DTypePromotion can fold -- the folded value column's
        # own dtype substitutes Unchecked, keeping "variable" typed.
        narrowed: TypedDataFrame[NarrowedSchema] = df.unpivot(on=["x", "y"], index=[])

- case: unpivot_mixed_signedness_int32_uint32_value_narrows_to_int64
