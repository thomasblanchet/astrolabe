- case: unpivot_unreconcilable_dtypes_value_narrows_to_unchecked
  main: |
    import polars as pl
    from astrolabe import Columns, List, TypedDataFrame, Unchecked

    class FrameSchema(Columns):
        a: pl.Date
        b: List[pl.Int64]

    # Date and List(Int64) have no common data type, and polars raises
    # for the pair. "value" becomes Unchecked, and the rest of the
    # result keeps its types.
    Frame = TypedDataFrame[FrameSchema]

    df: Frame

    class NarrowedSchema(Columns):
        variable: pl.String
        value: Unchecked

    narrowed: TypedDataFrame[NarrowedSchema] = df.unpivot(on=["a", "b"])

- case: unpivot_of_an_unchecked_column_gives_an_unchecked_value
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame, Unchecked

    class FrameSchema(Columns):
        i: pl.Int64
        b: pl.Boolean
        u: Unchecked

    df: TypedDataFrame[FrameSchema]
    # The value column takes the supertype of the columns, which an
    # Unchecked column decides: a String beside an Int64 gives String.
    reveal_type(df.unpivot(on=["u", "i"]))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'variable': polars.datatypes.classes.String, 'value': astrolabe.frame.Unchecked}, closed=True), None]"
    reveal_type(df.unpivot(on=["i", "u"]))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'variable': polars.datatypes.classes.String, 'value': astrolabe.frame.Unchecked}, closed=True), None]"
    # A Boolean beside a number takes the number, in either order.
    reveal_type(df.unpivot(on=["b", "i"]))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'variable': polars.datatypes.classes.String, 'value': polars.datatypes.classes.Int64}, closed=True), None]"
    reveal_type(df.unpivot(on=["i", "b"]))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'variable': polars.datatypes.classes.String, 'value': polars.datatypes.classes.Int64}, closed=True), None]"

