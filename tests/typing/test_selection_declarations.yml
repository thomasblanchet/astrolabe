# A frame reads a declared selection at each column that its selector
# picks. A keyword cannot rename its several outputs, a picked column
# outside its rows has no result, and so does a kind of the remainder
# outside its rows.
- case: a_declared_selection_meets_the_columns_and_the_remainder_of_a_frame
  main: |
    from typing import Literal

    import polars as pl
    import polars.selectors as cs
    from astrolabe import Columns, TypedDataFrame, other_columns, row, same, typed_selection
    from astrolabe.frame import Decimal

    Rounded = typed_selection(cs.numeric(), gives=same)
    Texts = typed_selection(cs.numeric(), row(pl.Int64, gives=pl.String))

    class Trades(Columns):
        price: Decimal[Literal[10], Literal[2]]
        k: pl.Int64

    class Counts(Columns):
        k: pl.Int64

    Rest = other_columns()

    def picked(
        df: TypedDataFrame[Trades],
        counts: TypedDataFrame[Counts, Rest],
        cols: Rounded,
        texts: Texts,
    ) -> None:
        reveal_type(df.select(x=cols))  # E: A selection has several outputs, which .alias() cannot rename: use .name.suffix() or .name.prefix()  [selection-rename] # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'x': astrolabe.frame.Unchecked}, closed=True), None]"
        df.select(texts)  # E: "price" has no result type at this frame's column types  [unsupported-dtype-op]
        counts.select(texts)  # E: The selection has no result type at a type the remainder can hold  [unsupported-dtype-op]

- case: a_declared_selection_over_the_undeclared_columns_reads_each_kind
  main: |
    import polars as pl
    import polars.selectors as cs
    from astrolabe import Columns, TypedDataFrame, Unchecked, other_columns, row, same, typed_selection

    Rounded = typed_selection(cs.numeric(), gives=same)
    Strings = typed_selection(cs.numeric(), gives=pl.String)
    Texts = typed_selection(cs.all(), row(pl.Int64, gives=pl.String))
    Rest = other_columns()
    Lists = other_columns(all_of={pl.Int64, pl.List})

    class Counts(Columns):
        k: pl.String
        a: pl.Int64

    class Loose(Columns):
        k: pl.String
        u: Unchecked

    class Ints(Columns):
        n: pl.Int64

    def run(
        counts: TypedDataFrame[Counts, Rest],
        loose: TypedDataFrame[Loose],
        lists: TypedDataFrame[Ints, Lists],
        cols: Rounded,
        strings: Strings,
        texts: Texts,
    ) -> None:
        # In agg, a selection that works row by row gives a list of the
        # values of each column it picks.
        reveal_type(counts.group_by("k").agg(cols))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'k': polars.datatypes.classes.String, 'a': astrolabe.frame.List[polars.datatypes.classes.Int64]}, closed=True), astrolabe.remainder.Retyped[astrolabe.remainder.Only[main.Rest, astrolabe.remainder.OfType[polars.datatypes.classes.NumericType]], astrolabe.frame.List[astrolabe.frame.Unchecked]]]"
        # The selector picks the column declared Unchecked only where its data
        # are numbers, so the data decide the columns of the result.
        reveal_type(loose.select(cols))  # N: Revealed type is "polars.dataframe.frame.DataFrame"
        # with_columns keeps the column either way, with the type that the
        # answer and its own type share, and a sort key changes no column.
        reveal_type(loose.with_columns(strings))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict(main.Loose, {'k': polars.datatypes.classes.String, 'u': astrolabe.frame.Unchecked}, closed=True), None]"
        reveal_type(loose.sort(cols))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict(main.Loose, {'k': polars.datatypes.classes.String, 'u': astrolabe.frame.Unchecked}, closed=True), None]"
        # The checker has no sample for a List that the undeclared columns
        # can hold, so the declaration reads as Unchecked there.
        reveal_type(lists.select(texts))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'n': polars.datatypes.classes.String}, closed=True), astrolabe.remainder.Retyped[main.Lists, astrolabe.frame.Unchecked]]"

# A code that reads a declared selection is a selection: the frame expands
# the declared selector, and at each picked column the parameter has its
# declared type and its renamed name.
- case: a_code_that_reads_a_declared_selection_expands_at_the_frame
  main: |
    import polars as pl
    import polars.selectors as cs
    from astrolabe import Columns, InferredExpr, TypedDataFrame, TypedLazyFrame, infer, other_columns, same, typed_selection

    Texts = typed_selection(cs.numeric(), gives=pl.String, suffix="_s")
    Rounded = typed_selection(cs.numeric(), gives=same)
    Rest = other_columns()

    class Prices(Columns):
        k: pl.String
        a: pl.Int64
        b: pl.Float32

    def lengths(texts: Texts) -> InferredExpr:
        return infer(texts.str.len_chars())

    def run(df: TypedDataFrame[Prices], wide: TypedDataFrame[Prices, Rest], texts: Texts, rounded: Rounded) -> None:
        reveal_type(df.select(texts.str.len_chars()))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'a_s': polars.datatypes.classes.UInt32, 'b_s': polars.datatypes.classes.UInt32}, closed=True), None]"
        reveal_type(df.select(lengths(cs.numeric().cast(pl.String).name.suffix("_s"))))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'a_s': polars.datatypes.classes.UInt32, 'b_s': polars.datatypes.classes.UInt32}, closed=True), None]"
        reveal_type(wide.select(rounded.abs()))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'a': polars.datatypes.classes.Int64, 'b': polars.datatypes.classes.Float32}, closed=True), astrolabe.remainder.Only[main.Rest, astrolabe.remainder.OfType[polars.datatypes.classes.NumericType]]]"
        reveal_type(df.group_by("k").agg(rounded.sum()))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'k': polars.datatypes.classes.String, 'a': polars.datatypes.classes.Int64, 'b': polars.datatypes.classes.Float32}, closed=True), None]"
        # A declared selection beside another selector picks columns that the
        # argument of the caller decides, so the call gives the plain frame.
        reveal_type(df.select(rounded + cs.numeric()))  # N: Revealed type is "polars.dataframe.frame.DataFrame"

    def lazily(lf: TypedLazyFrame[Prices], rounded: Rounded) -> None:
        reveal_type(lf.select(rounded.abs()))  # N: Revealed type is "astrolabe.frame.TypedLazyFrame[TypedDict({'a': polars.datatypes.classes.Int64, 'b': polars.datatypes.classes.Float32}, closed=True), None]"
