- case: columns_class_inherited_bad_field_reports_at_the_composing_classes_own_line
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    # A documented, accepted precision limitation of the deferred
    # validation this project uses (see SCHEMA_MIGRATION.md): a field
    # inherited from an ancestor reports at the *composing* class's own
    # declaration line, not the original ancestor's, since that is the
    # real, confirmed limit of mypy's own TypedDictFieldSource
    # bookkeeping for an inherited field.
    class BadBase(Columns):
        bad: int

    class BadDerived(BadBase):  # E: Column "bad" must be a polars dtype or an astrolabe dtype marker  [columns-field-type]
        good: pl.Int64

    bad_derived: TypedDataFrame[BadDerived]

- case: columns_class_declared_but_never_used_gets_no_enforcement_at_all
  main: |
    import polars as pl
    from astrolabe import Columns

    # A documented, accepted limitation: no hook fires for a plain class
    # definition on its own, only for actual TypedDataFrame[...]/
    # TypedLazyFrame[...] usage, so a Columns subclass that is declared
    # but never used this way gets zero restriction enforcement -- this
    # total=False violation is never reported at all.
    class NeverUsed(Columns, total=False):
        a: pl.Int64

- case: a_generic_columns_class_binds_its_data_type_at_each_use
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class Keyed[T: pl.DataType](Columns):
        k: pl.String
        v: T

    def keep[T: pl.DataType](df: TypedDataFrame[Keyed[T]]) -> TypedDataFrame[Keyed[T]]:
        reveal_type(df.select("v"))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'v': T}, closed=True), None]"
        return df

    ints: TypedDataFrame[Keyed[pl.Int64]]
    reveal_type(keep(ints))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict(main.Keyed, {'k': polars.datatypes.classes.String, 'v': polars.datatypes.classes.Int64}, closed=True), None]"
    reveal_type(ints.select("v"))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'v': polars.datatypes.classes.Int64}, closed=True), None]"

