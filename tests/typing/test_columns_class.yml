- case: columns_declares_names_that_are_not_identifiers
  main: |
    import polars as pl
    from astrolabe import TypedDataFrame, Unchecked, columns, other_columns

    Pivoted = columns("Pivoted", {"id": pl.Int64, "1": pl.Int64, "v1|a": pl.Datetime("us"), "u": Unchecked})
    Rest = other_columns()

    pivoted: TypedDataFrame[Pivoted]
    reveal_type(pivoted)  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict(main.Pivoted, {'id': polars.datatypes.classes.Int64, '1': polars.datatypes.classes.Int64, 'v1|a': astrolabe.frame.Datetime[Literal['us'], None], 'u': astrolabe.frame.Unchecked}, closed=True), None]"
    reveal_type(pivoted.select("v1|a", "1"))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'v1|a': astrolabe.frame.Datetime[Literal['us'], None], '1': polars.datatypes.classes.Int64}, closed=True), None]"

    def open_frame(df: TypedDataFrame[Pivoted, Rest]) -> None:
        reveal_type(df.select("1"))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'1': polars.datatypes.classes.Int64}, closed=True), None]"

- case: columns_refuses_a_malformed_call
  main: |
    import polars as pl
    from astrolabe import NumericType, columns

    Wrong = columns("Other", {"a": pl.Int64})  # E: columns() takes the class name and a dict of column names to data types, for example columns("Pivoted", {"1": pl.Int64})  [marker-arg]
    Family = columns("Family", {"a": NumericType})  # E: columns() takes the class name and a dict of column names to data types, for example columns("Pivoted", {"1": pl.Int64})  [marker-arg]
    Keys = columns("Keys", {1: pl.Int64})  # E: columns() takes the class name and a dict of column names to data types, for example columns("Pivoted", {"1": pl.Int64})  [marker-arg] # E: Dict entry 0 has incompatible type "int": "type[Int64]"; expected "str": "Any"  [dict-item]
    Listed = columns("Listed", [("a", pl.Int64)])  # E: columns() takes the class name and a dict of column names to data types, for example columns("Pivoted", {"1": pl.Int64})  [marker-arg] # E: Argument 2 to "columns" has incompatible type "list[tuple[str, type[Int64]]]"; expected "Mapping[str, Any]"  [arg-type]
    Plain = columns("Plain", {"a": int})  # E: columns() takes the class name and a dict of column names to data types, for example columns("Pivoted", {"1": pl.Int64})  [marker-arg]
    Computed = columns("Computed", {"a": 1 + 1})  # E: columns() takes the class name and a dict of column names to data types, for example columns("Pivoted", {"1": pl.Int64})  [marker-arg]
    Dotted = columns("Dotted", {"a": pl.NUMERIC_DTYPES})  # E: Module has no attribute "NUMERIC_DTYPES"  [attr-defined]

- case: columns_waits_for_an_incomplete_class
  main: |
    import polars as pl
    from astrolabe import Columns, columns

    # A class whose own field is a forward reference is incomplete on
    # the first pass, so the hook waits. On the next pass it reports
    # that a schema class is not a data type.
    Waiting = columns("Waiting", {"n": Deferred})  # E: columns() takes the class name and a dict of column names to data types, for example columns("Pivoted", {"1": pl.Int64})  [marker-arg]  # E: Name "Deferred" is used before definition  [used-before-def]

    class Deferred(Columns):
        n: Later

    Later = pl.Int64
