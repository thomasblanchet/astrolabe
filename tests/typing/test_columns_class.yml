# Schema classes: a `Columns` subclass (`class Legislators(Columns): ...`),
# any other closed `TypedDict` class, a generic class, and a class that
# `columns(...)` builds for names that are not identifiers. Covers
# `ColumnsRestrictionCheck` and `SchemaDeclarationHook`.

- case: columns_class_schema_interconverts_regardless_of_declared_field_order
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class Legislators(Columns):
        first_name: pl.String
        last_name: pl.String

    class LegislatorsReordered(Columns):
        last_name: pl.String
        first_name: pl.String

    x: TypedDataFrame[Legislators]
    reveal_type(x)  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict(main.Legislators, {'first_name': polars.datatypes.classes.String, 'last_name': polars.datatypes.classes.String}, closed=True), None]"
    # Two schemas with the same columns, declared in a different order,
    # freely interconvert -- this is the actual bug this migration fixes.
    y: TypedDataFrame[LegislatorsReordered] = x
    reveal_type(y)  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict(main.LegislatorsReordered, {'last_name': polars.datatypes.classes.String, 'first_name': polars.datatypes.classes.String}, closed=True), None]"
    z: TypedDataFrame[Legislators] = y

- case: columns_class_total_false_is_rejected
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class BadTotal(Columns, total=False):  # E: Columns subclass "BadTotal" must not use total=False, Required[...], or NotRequired[...]: every column is required  [columns-not-total]
        a: pl.Int64

    bad_total: TypedDataFrame[BadTotal]
    reveal_type(bad_total)  # N: Revealed type is "Any"

- case: columns_class_per_field_notrequired_with_no_total_keyword_is_rejected_at_the_classs_own_line
  main: |
    from typing import NotRequired
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    # A per-field NotRequired[...] override makes a field non-required
    # without the class itself ever declaring total=..., so the
    # violation has no keyword to report against and falls back to the
    # class's own declaration line instead.
    class BadTotal(Columns):  # E: Columns subclass "BadTotal" must not use total=False, Required[...], or NotRequired[...]: every column is required  [columns-not-total]
        a: NotRequired[pl.Int64]

    bad_total: TypedDataFrame[BadTotal]
    reveal_type(bad_total)  # N: Revealed type is "Any"

