- case: columns_class_open_function_round_trips_through_the_two_argument_shape
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame, other_columns

    class Legislators(Columns):
        first_name: pl.String
        last_name: pl.String

    Rest = other_columns()

    def add_flag(
        df: TypedDataFrame[Legislators, Rest],
    ) -> TypedDataFrame[Legislators, Rest]:
        return df

    conforming: TypedDataFrame[Legislators, Rest]
    reveal_type(add_flag(conforming))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict(main.Legislators, {'first_name': polars.datatypes.classes.String, 'last_name': polars.datatypes.classes.String}, closed=True), main.Rest]"

