- case: pivot_with_an_expression_in_on_columns_is_an_error
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class FrameSchema(Columns):
        a: pl.Int64
        s: pl.String

    df: TypedDataFrame[FrameSchema]
    # Polars builds a series of the values. An expression makes an
    # Object series, which polars cannot cast, at every frame.
    reveal_type(df.pivot(on="s", index="a", values="a", on_columns=[pl.lit("x")]))  # E: pivot() with an expression in on_columns= always raises: polars cannot turn an expression into a column name. Pass the values, for example on_columns=["x"]  [invalid-call-shape]  # N: Revealed type is "polars.dataframe.frame.DataFrame"
    df.lazy().pivot(on="s", index="a", values="a", on_columns=("x", pl.col("s")))  # E: pivot() with an expression in on_columns= always raises: polars cannot turn an expression into a column name. Pass the values, for example on_columns=["x"]  [invalid-call-shape]
    label = pl.lit("x")
    df.pivot(on="s", index="a", values="a", on_columns=[label])  # E: pivot() with an expression in on_columns= always raises: polars cannot turn an expression into a column name. Pass the values, for example on_columns=["x"]  [invalid-call-shape]

