- case: pivot_generic_dtype_values_column_narrows_to_unchecked
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame, Unchecked

    class Sales[D: pl.DataType](Columns):
        id: pl.Int64
        cat: pl.String
        v: D

    class NarrowedSchema(Columns):
        id: pl.Int64
        a: Unchecked

    def func[D: pl.DataType](df: TypedDataFrame[Sales[D]]) -> None:
        # A `values` column's own dtype can be a bare, still-unresolved
        # type variable inside a dtype-generic function, not yet a
        # concrete Instance ReducerDtype can resolve -- this pivoted
        # column's own dtype substitutes Unchecked, keeping "id" typed.
        narrowed: TypedDataFrame[NarrowedSchema] = df.pivot(
            on="cat", on_columns=["a"], index="id", values="v", aggregate_function="sum"
        )

- case: pivot_aggregate_function_sum_on_string_values_errors
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame, Unchecked

    class FrameSchema(Columns):
        id: pl.Int64
        cat: pl.String
        v: pl.String

    # sum() requires a numeric-or-Boolean (or extended-family) source,
    # confirmed empirically that real polars raises InvalidOperationError
    # for a String source -- pivot() had no gate at all here before,
    # giving a confidently wrong String result instead of reporting this.
    Frame = TypedDataFrame[FrameSchema]

    df: Frame

    class NarrowedSchema(Columns):
        id: pl.Int64
        a: Unchecked

    narrowed: TypedDataFrame[NarrowedSchema] = df.pivot(on="cat", on_columns=["a"], index="id", values="v", aggregate_function="sum")  # E: Column "v" is not numeric or Boolean, cannot pivot(aggregate_function='sum')  [wrong-column-shape]

