# .pivot(): spreading one column's distinct values into new columns.
# Written before the corresponding get_method_hook implementation
# exists. This test is expected to fail (red) until plugin.py
# implements it.
#
# Scope, confirmed against real polars 1.43.2 before writing these cases:
# - Narrows when `on` is a single literal column name, a single-element
#   literal list of one (identical to a bare string, confirmed
#   empirically), or a polars.selectors argument matching exactly one
#   column -- and `on_columns` is a literal list of scalar values.
#   `on_columns` fully and exclusively determines the pivoted column
#   names, independent of the receiver's actual data. A non-string
#   element stringifies the same way real polars does: Python's own
#   str() for an int or a float, but lowercase "true"/"false" for a
#   bool. A genuinely multi-column `on` (2+ literal names, or a selector
#   matching 2+ columns) stays unrecognized.
# - `DataFrame.pivot()` with `on_columns` omitted stays a genuine
#   non-goal (falls back): only that shape still needs real data to
#   compute `on_columns`.
# - index columns pass through unchanged, in call-site order.
# - values omitted defaults to "every declared column not in on/index".
#   values omitted with zero remaining columns always raises in real
#   polars, confirmed empirically, reported as InvalidCallShapeError.
# - Column naming: bare `on_columns` value for exactly one values column
#   under the default column_naming="auto"; `f"{values}{separator}{on}"`
#   otherwise (column_naming="combine", or more than one values column).
# - Each pivoted column's own dtype matches ReducerDtype's own already-
#   tested reducer rules (shared with .agg()). aggregate_function
#   omitted, explicitly None, or "item", all behave as identity (source
#   dtype unchanged), confirmed empirically. A values column whose own
#   dtype cannot be resolved (a still-generic function's own unbound
#   TypeVar) substitutes Unchecked for just that pivoted column.
# - A receiver with an unresolved Rest still narrows when on/index/values
#   are all explicit and every named column is in the receiver's own
#   declared portion.

- case: pivot_narrows_with_single_values_column_auto_naming
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class FrameSchema(Columns):
        id: pl.Int64
        cat: pl.String
        v1: pl.Int64

    Frame = TypedDataFrame[FrameSchema]

    df: Frame

    class NarrowedSchema(Columns):
        id: pl.Int64
        a: pl.Int64
        b: pl.Int64

    narrowed: TypedDataFrame[NarrowedSchema] = df.pivot(on="cat", on_columns=["a", "b"], index="id", values="v1")

