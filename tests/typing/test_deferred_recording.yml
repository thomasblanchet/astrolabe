- case: starred_arguments_tuples_and_sets_are_written_as_the_user_wrote_them
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class Pair(Columns):
        a: pl.Int64
        b: pl.Int64

    parts = [pl.col("a"), pl.col("b")]
    nothing = None
    reveal_type(pl.struct(*parts))  # N: Revealed type is "astrolabe.expr.TypedExpr[astrolabe.expr.Deferred[Literal["pl.struct(*hole('value'))"]]]"
    reveal_type(pl.when(**{"a": 1}))  # N: Revealed type is "astrolabe.expr.TypedWhen[astrolabe.expr.Deferred[Literal["pl.when(**{'a': 1})"]]]"
    reveal_type(pl.col("a").is_in((1, 2)))  # N: Revealed type is "astrolabe.expr.TypedExpr[astrolabe.expr.Deferred[Literal["pl.col('a').is_in((1, 2))"]]]"
    reveal_type(pl.col("a").is_in({1, 2}))  # N: Revealed type is "astrolabe.expr.TypedExpr[astrolabe.expr.Deferred[Literal["pl.col('a').is_in({1, 2})"]]]"
    reveal_type(pl.col("a").shift(1, fill_value=nothing))  # N: Revealed type is "astrolabe.expr.TypedExpr[astrolabe.expr.Deferred[Literal["pl.col('a').shift(1, fill_value=None)"]]]"
    reveal_type(pl.lit(str(1)))  # N: Revealed type is "astrolabe.expr.TypedExpr[astrolabe.expr.Deferred[Literal["pl.lit(hole('str'))"]]]"
    # A list written after `*` stays a list, which the evaluation spreads.
    reveal_type(pl.max_horizontal(*["a", "b"]))  # N: Revealed type is "astrolabe.expr.TypedExpr[astrolabe.expr.Deferred[Literal["pl.max_horizontal(*['a', 'b'])"]]]"
    df: TypedDataFrame[Pair]
    reveal_type(df.select(pl.max_horizontal(*["a", "b"])))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'a': polars.datatypes.classes.Int64}, closed=True), None]"

