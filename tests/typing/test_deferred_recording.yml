- case: containers_dates_and_named_values_are_written_as_values
  main: |
    import datetime
    from typing import Final
    import polars as pl

    LIMIT: Final = 3
    reveal_type(pl.col("a").is_in([1, 2, LIMIT]))  # N: Revealed type is "astrolabe.expr.TypedExpr[astrolabe.expr.Deferred[Literal["pl.col('a').is_in([1, 2, 3])"]]]"
    reveal_type(pl.col("a").replace({1: -2.5}))  # N: Revealed type is "astrolabe.expr.TypedExpr[astrolabe.expr.Deferred[Literal["pl.col('a').replace({1: -2.5})"]]]"
    reveal_type(pl.col("d") > datetime.date(2020, 1, 2))  # N: Revealed type is "astrolabe.expr.TypedExpr[astrolabe.expr.Deferred[Literal["pl.col('d') > date(2020, 1, 2)"]]]"
    reveal_type(pl.struct(x=pl.col("a"), y=None))  # N: Revealed type is "astrolabe.expr.TypedExpr[astrolabe.expr.Deferred[Literal["pl.struct(x=pl.col('a'), y=None)"]]]"

- case: a_value_the_checker_cannot_know_is_a_hole_of_its_kind
  main: |
    from typing import Any
    import polars as pl

    def calls(n: int, flag: bool, plain: pl.Expr, f: Any, pattern: str, ratio: float, other: object) -> None:
        reveal_type(pl.col("a").shift(n))  # N: Revealed type is "astrolabe.expr.TypedExpr[astrolabe.expr.Deferred[Literal["pl.col('a').shift(hole('int'))"]]]"
        reveal_type(pl.col("a").sort(descending=flag))  # N: Revealed type is "astrolabe.expr.TypedExpr[astrolabe.expr.Deferred[Literal["pl.col('a').sort(descending=hole('bool'))"]]]"
        reveal_type(pl.col("a") + plain)  # N: Revealed type is "astrolabe.expr.TypedExpr[astrolabe.expr.Deferred[Literal["pl.col('a') + hole('expr')"]]]"
        reveal_type(pl.col("a").map_batches(lambda s: s))  # N: Revealed type is "astrolabe.expr.TypedExpr[astrolabe.expr.Deferred[Literal["pl.col('a').map_batches(hole('function'))"]]]"
        reveal_type(pl.col("s").str.contains(pattern))  # N: Revealed type is "astrolabe.expr.TypedExpr[astrolabe.expr.Deferred[Literal["pl.col('s').str.contains(hole('str'))"]]]"
        # mypy accepts an int where the type is float, so the hole is a number.
        reveal_type(pl.col("a") * ratio)  # N: Revealed type is "astrolabe.expr.TypedExpr[astrolabe.expr.Deferred[Literal["pl.col('a') * hole('number')"]]]"
        reveal_type(pl.col("a").fill_null(other))  # N: Revealed type is "astrolabe.expr.TypedExpr[astrolabe.expr.Deferred[Literal["pl.col('a').fill_null(hole('value'))"]]]"

- case: a_declared_parameter_is_a_leaf_of_the_code
  main: |
    import polars as pl
    from astrolabe import column

    Price = column("price", pl.Float64)
    Qty = column("qty", pl.Int64)

    def notional(price: Price, qty: Qty) -> None:
        reveal_type(price * 0.9 + qty * price)  # N: Revealed type is "astrolabe.expr.TypedExpr[astrolabe.expr.Deferred[Literal['$0 * 0.9 + $1 * $0'], astrolabe.expr.TypedColumn[Literal['price'], polars.datatypes.classes.Float64], astrolabe.expr.TypedColumn[Literal['qty'], polars.datatypes.classes.Int64]]]"
        reveal_type(price.str)  # N: Revealed type is "astrolabe.expr.TypedExprStrNamespace[astrolabe.expr.TypedColumn[Literal['price'], polars.datatypes.classes.Float64]]"

- case: a_union_of_expressions_records_each_member
  main: |
    import polars as pl

    def pick(flag: bool) -> None:
        x = pl.col("a") if flag else pl.col("b")
        reveal_type(x.abs())  # N: Revealed type is "astrolabe.expr.TypedExpr[astrolabe.expr.Deferred[Literal["pl.col('a').abs()"]]] | astrolabe.expr.TypedExpr[astrolabe.expr.Deferred[Literal["pl.col('b').abs()"]]]"
        reveal_type(pl.col("c") + x)  # N: Revealed type is "astrolabe.expr.TypedExpr[astrolabe.expr.Deferred[Literal["pl.col('c') + pl.col('a')"]]] | astrolabe.expr.TypedExpr[astrolabe.expr.Deferred[Literal["pl.col('c') + pl.col('b')"]]]"

- case: a_call_that_gives_no_expression_keeps_its_type
  main: |
    import polars as pl

    def compare(x: int) -> None:
        reveal_type(x == 2)  # N: Revealed type is "bool"

    reveal_type(pl.col("a").meta.output_name())  # N: Revealed type is "str"
    reveal_type(abs(-1))  # N: Revealed type is "int"
    reveal_type(pl.col("a", "b"))  # N: Revealed type is "astrolabe.expr.TypedExpr[astrolabe.expr.Deferred[Literal["pl.col('a', 'b')"]]]"

