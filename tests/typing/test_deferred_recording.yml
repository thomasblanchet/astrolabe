- case: an_expression_that_polars_refuses_at_every_frame_is_an_error_at_the_call
  main: |
    import polars as pl
    import polars.selectors as cs
    from astrolabe import Columns, TypedDataFrame

    class Schema(Columns):
        i: pl.Int64
        u: pl.UInt8

    df: TypedDataFrame[Schema]
    pl.lit(1).name.keep()  # E: This call has no result at any frame: `name.keep_name` expected at least one column name, and polars raises InvalidOperationError  [invalid-call-shape]
    pl.col("i").cumulative_eval(pl.element() * 2)  # E: This call has no result at any frame: `cumulative_eval` is not allowed with non-scalar output, and polars raises InvalidOperationError  [invalid-call-shape]
    cs.numeric().cumulative_eval(pl.element() * 2)  # E: This call has no result at any frame: `cumulative_eval` is not allowed with non-scalar output, and polars raises InvalidOperationError  [invalid-call-shape]
    # Polars builds a series of objects from a list of expressions, and replace refuses it.
    pl.col("i").replace([1], [pl.col("i").first()])  # E: This call has no result at any frame: `replace` does not support `old`/`new` values of object dtype, and polars raises InvalidOperationError  [invalid-call-shape]
    # The call keeps its stub type, so the frame that meets it reports no second error.
    reveal_type(df.select(pl.lit(1).sum().name.keep()))  # N: Revealed type is "polars.dataframe.frame.DataFrame"  # E: This call has no result at any frame: `name.keep_name` expected at least one column name, and polars raises InvalidOperationError  [invalid-call-shape]
    # A body of an evaluation runs inside the evaluation, so it is no error alone.
    reveal_type(pl.element() * 2)  # N: Revealed type is "astrolabe.expr.TypedExpr[astrolabe.expr.Deferred[Literal['pl.element() * 2']]]"
    reveal_type(pl.field("a") + 1)  # N: Revealed type is "astrolabe.expr.TypedExpr[astrolabe.expr.Deferred[Literal["pl.field('a') + 1"]]]"
    reveal_type(pl.col("i").cumulative_eval(pl.element().sum()))  # N: Revealed type is "astrolabe.expr.TypedExpr[astrolabe.expr.Deferred[Literal["pl.col('i').cumulative_eval(pl.element().sum())"]]]"
    # A refusal that depends on the frame waits for the frame.
    reveal_type(cs.numeric().alias("z"))  # N: Revealed type is "astrolabe.expr.TypedExpr[astrolabe.expr.Deferred[Literal["cs.numeric().alias('z')"]]]"
    # The data types of two columns give too many choices, so the frame reports the refusal.
    shifted = pl.col("i").shift(1, fill_value=pl.col("u"))
    df.select(shifted)  # E: "i" has no result type at this frame's column types: 'fill_value' must be a scalar value, and polars raises ShapeError  [unsupported-dtype-op]

- case: a_value_of_a_subclass_or_of_a_temporal_type_is_a_hole_of_its_kind
  main: |
    from datetime import UTC, date, datetime
    from decimal import Decimal
    from enum import IntEnum
    import polars as pl

    class Ratio(float):
        pass

    class Flag(IntEnum):
        A = 1

    def values(ratio: Ratio, flag: Flag, day: date, moment: datetime, amount: Decimal) -> None:
        reveal_type(pl.col("u") + ratio)  # N: Revealed type is "astrolabe.expr.TypedExpr[astrolabe.expr.Deferred[Literal["pl.col('u') + hole('float')"]]]"
        reveal_type(pl.col("u") * flag)  # N: Revealed type is "astrolabe.expr.TypedExpr[astrolabe.expr.Deferred[Literal["pl.col('u') * hole('int')"]]]"
        reveal_type(pl.col("d") - day)  # N: Revealed type is "astrolabe.expr.TypedExpr[astrolabe.expr.Deferred[Literal["pl.col('d') - hole('date')"]]]"
        reveal_type(pl.col("d") < moment)  # N: Revealed type is "astrolabe.expr.TypedExpr[astrolabe.expr.Deferred[Literal["pl.col('d') < hole('datetime')"]]]"
        reveal_type(pl.col("u") + amount)  # N: Revealed type is "astrolabe.expr.TypedExpr[astrolabe.expr.Deferred[Literal["pl.col('u') + hole('decimal')"]]]"
    # The constant UTC is written by its name, and a value on the left of an operator by its value.
    reveal_type(pl.col("d") < datetime(2020, 1, 1, tzinfo=UTC))  # N: Revealed type is "astrolabe.expr.TypedExpr[astrolabe.expr.Deferred[Literal["pl.col('d') < datetime(2020, 1, 1, tzinfo=UTC)"]]]"
    reveal_type(Decimal("1.5") * pl.col("u"))  # N: Revealed type is "astrolabe.expr.TypedExpr[astrolabe.expr.Deferred[Literal["Decimal('1.5') * pl.col('u')"]]]"

- case: a_value_from_a_union_of_literal_values_is_a_hole_that_lists_them
  main: |
    from enum import Enum
    from typing import Literal
    import polars as pl

    class Color(Enum):
        RED = "red"
        BLUE = "blue"

    def values(method: Literal["average", "dense"], step: Literal[1, 2], color: Literal[Color.RED, Color.BLUE], maybe: Literal["a"] | None) -> None:
        reveal_type(pl.col("a").rank(method))  # N: Revealed type is "astrolabe.expr.TypedExpr[astrolabe.expr.Deferred[Literal["pl.col('a').rank(hole('one of', 'average', 'dense'))"]]]"
        reveal_type(pl.col("a").shift(step))  # N: Revealed type is "astrolabe.expr.TypedExpr[astrolabe.expr.Deferred[Literal["pl.col('a').shift(hole('one of', 1, 2))"]]]"
        # The literal of an enum member holds its name, which is not the value that polars reads.
        reveal_type(pl.col("a").fill_null(color))  # N: Revealed type is "astrolabe.expr.TypedExpr[astrolabe.expr.Deferred[Literal["pl.col('a').fill_null(hole('value'))"]]]"
        reveal_type(pl.col("a").fill_null(maybe))  # N: Revealed type is "astrolabe.expr.TypedExpr[astrolabe.expr.Deferred[Literal["pl.col('a').fill_null(hole('value'))"]]]"
