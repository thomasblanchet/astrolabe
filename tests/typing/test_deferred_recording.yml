# The recorder: each call on an expression becomes code in the type, as the
# user wrote it. These cases reveal the code that each form of call writes.

- case: a_method_and_an_operator_write_their_call
  main: |
    import polars as pl

    reveal_type(pl.col("price") * 0.9)  # N: Revealed type is "astrolabe.expr.TypedExpr[astrolabe.expr.Deferred[Literal["pl.col('price') * 0.9"]]]"
    reveal_type(pl.col("a").abs().alias("b"))  # N: Revealed type is "astrolabe.expr.TypedExpr[astrolabe.expr.Deferred[Literal["pl.col('a').abs().alias('b')"]]]"

- case: a_reused_variable_is_written_once
  main: |
    import polars as pl

    e = pl.col("a") + pl.col("b")
    reveal_type(e * e)  # N: Revealed type is "astrolabe.expr.TypedExpr[astrolabe.expr.Deferred[Literal["($0 := (pl.col('a') + pl.col('b'))) * $0"]]]"

- case: a_member_of_a_namespace_reads_the_code_of_its_expression
  main: |
    import polars as pl

    reveal_type(pl.col("s").str)  # N: Revealed type is "astrolabe.expr.TypedExprStrNamespace[astrolabe.expr.TypedExpr[astrolabe.expr.Deferred[Literal["pl.col('s')"]]]]"
    reveal_type(pl.col("s").str.contains("x", literal=True))  # N: Revealed type is "astrolabe.expr.TypedExpr[astrolabe.expr.Deferred[Literal["pl.col('s').str.contains('x', literal=True)"]]]"

- case: a_hand_written_code_that_does_not_parse_is_a_hole
  main: |
    from typing import Literal
    import polars as pl
    from astrolabe import Columns, Struct, Column, TypedDataFrame, column, typed_lit
    from astrolabe.expr import Deferred, TypedExpr

    Price = column("price", pl.Float64)

    def discounted(price: Price) -> Price:
        return price * 0.9

    class FrameSchema(Columns):
        price: pl.Float64
        s: Struct[Column[Literal["a"], pl.Int8]]

    df: TypedDataFrame[FrameSchema]
    # The checker writes code that parses. A type written by hand can hold any
    # text, and a call on it reads that text as a value it cannot know.
    by_hand: TypedExpr[Deferred[Literal["pl.col("]]]
    reveal_type(by_hand.alias("z"))  # N: Revealed type is "astrolabe.expr.TypedExpr[astrolabe.expr.Deferred[Literal["hole('expr').alias('z')"]]]"
    reveal_type(df.select(by_hand.alias("z")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'z': astrolabe.frame.Unchecked}, closed=True), None]"
    reveal_type(df.select(pl.col("s").struct.with_fields(by_hand)))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'s': astrolabe.frame.Unchecked}, closed=True), None]"
    discounted(by_hand)  # E: Argument "price" does not match its declared type: the checker cannot read the name of its column, but the declared name is "price"  [expression-fit]
    reveal_type(df.join(df, on=by_hand))  # N: Revealed type is "polars.dataframe.frame.DataFrame"
    # A code that does not read, or that reads no expression, gives the plain
    # frame. An alias still names the column.
    one: TypedExpr[Deferred[Literal["1"]]]
    reveal_type(df.select(by_hand))  # N: Revealed type is "polars.dataframe.frame.DataFrame"
    reveal_type(df.select(one))  # N: Revealed type is "polars.dataframe.frame.DataFrame"
    reveal_type(df.select(one.alias("b")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'b': astrolabe.frame.Unchecked}, closed=True), None]"
    # The reader refuses an item of an expression, and values listed in a hole
    # that is not of the kind `one of`.
    item: TypedExpr[Deferred[Literal["pl.col('price')[0]"]]]
    listed: TypedExpr[Deferred[Literal["pl.col('price') + hole('int', 1)"]]]
    reveal_type(df.select(item))  # N: Revealed type is "polars.dataframe.frame.DataFrame"
    reveal_type(df.select(listed))  # N: Revealed type is "polars.dataframe.frame.DataFrame"
    none: TypedExpr[Deferred[Literal["pl.col('price') + hole('one of', None)"]]]
    reveal_type(df.select(none))  # N: Revealed type is "polars.dataframe.frame.DataFrame"
    # A hole of a data type that does not parse, that polars does not write,
    # or that names a class of no data type, has no sample.
    unparsed: TypedExpr[Deferred[Literal["pl.col('price').cast(hole('dtype:List('))"]]]
    shaped: TypedExpr[Deferred[Literal["pl.col('price').cast(hole('dtype:Array(Unchecked, 2)'))"]]]
    foreign: TypedExpr[Deferred[Literal["pl.col('price').cast(hole('dtype:List(Tagged)'))"]]]
    reveal_type(df.select(unparsed))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'price': astrolabe.frame.Unchecked}, closed=True), None]"
    reveal_type(df.select(shaped))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'price': astrolabe.frame.Unchecked}, closed=True), None]"
    reveal_type(df.select(foreign))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'price': astrolabe.frame.Unchecked}, closed=True), None]"

    Flag = typed_lit(gives=pl.Int32)

    def flagged(a: Flag) -> None: ...

    flagged(by_hand)  # E: Argument "a" does not match its declared type: the checker cannot read the name of its column, but the declared name is "literal"  [expression-fit]

- case: a_callable_of_the_user_is_a_hole_that_polars_can_read_as_a_value
  main: |
    import polars as pl
    import polars.selectors as cs
    from astrolabe import Columns, TypedDataFrame

    class FrameSchema(Columns):
        x: pl.Int64

    df: TypedDataFrame[FrameSchema]
    # The recorder writes the class int as a hole of a function. Polars reads
    # int as a data type here, so a refusal of the placeholder is no error.
    reveal_type(cs.by_dtype([int]))  # N: Revealed type is "astrolabe.expr.TypedSelector[astrolabe.expr.Deferred[Literal["cs.by_dtype([hole('function')])"]]]"
    reveal_type(df.select(cs.by_dtype([int])))  # N: Revealed type is "polars.dataframe.frame.DataFrame"

- case: a_when_chain_keeps_the_head_of_each_step
  main: |
    import polars as pl

    reveal_type(pl.when(pl.col("f")))  # N: Revealed type is "astrolabe.expr.TypedWhen[astrolabe.expr.Deferred[Literal["pl.when(pl.col('f'))"]]]"
    reveal_type(pl.when(pl.col("f")).then(1))  # N: Revealed type is "astrolabe.expr.TypedThen[astrolabe.expr.Deferred[Literal["pl.when(pl.col('f')).then(1)"]]]"
    reveal_type(pl.when(pl.col("f")).then(1).when(pl.col("g")))  # N: Revealed type is "astrolabe.expr.TypedChainedWhen[astrolabe.expr.Deferred[Literal["pl.when(pl.col('f')).then(1).when(pl.col('g'))"]]]"
    reveal_type(pl.when(pl.col("f")).then(1).otherwise(pl.lit(2, dtype=pl.Int8)))  # N: Revealed type is "astrolabe.expr.TypedExpr[astrolabe.expr.Deferred[Literal["pl.when(pl.col('f')).then(1).otherwise(pl.lit(2, dtype=pl.Int8))"]]]"

