- case: a_call_that_polars_refuses_while_it_builds_the_expression_is_an_error
  main: |
    import polars as pl

    pl.lit(170141183460469231731687303715884105728)  # E: an integer that no polars data type holds raises InvalidOperationError: integer too large for Polars  [invalid-call-shape]
    # Polars refuses some arguments with a TypeError or a ValueError.
    pl.col("a").fill_null(None)  # E: This call raises ValueError before any frame meets it: must specify either a fill `value` or `strategy`  [invalid-call-shape]
    pl.lit(pl.col("a"))  # E: This call raises TypeError before any frame meets it: cannot create expression literal for value of type Expr.  [invalid-call-shape]
    # mypy hides an error of the reflected side of an operator, so the frame reports it.
    reveal_type(170141183460469231731687303715884105728 + pl.col("a"))  # N: Revealed type is "astrolabe.expr.TypedExpr[astrolabe.expr.Deferred[Literal["170141183460469231731687303715884105728 + pl.col('a')"]]]"
