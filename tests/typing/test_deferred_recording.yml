- case: a_literal_on_the_left_and_a_unary_operator_write_their_form
  main: |
    import polars as pl

    reveal_type(1 == pl.col("a"))  # N: Revealed type is "astrolabe.expr.TypedExpr[astrolabe.expr.Deferred[Literal["1 == pl.col('a')"]]]"
    reveal_type(1 + pl.col("a"))  # N: Revealed type is "astrolabe.expr.TypedExpr[astrolabe.expr.Deferred[Literal["1 + pl.col('a')"]]]"
    reveal_type(-pl.col("a"))  # N: Revealed type is "astrolabe.expr.TypedExpr[astrolabe.expr.Deferred[Literal["-pl.col('a')"]]]"
    reveal_type(abs(pl.col("a")))  # N: Revealed type is "astrolabe.expr.TypedExpr[astrolabe.expr.Deferred[Literal["abs(pl.col('a'))"]]]"
    reveal_type(pl.col("a") > 1)  # N: Revealed type is "astrolabe.expr.TypedExpr[astrolabe.expr.Deferred[Literal["pl.col('a') > 1"]]]"

- case: arithmetic_over_constants_is_written_as_its_value
  main: |
    from typing import Final
    import polars as pl

    reveal_type(pl.col("a") + 2**10)  # N: Revealed type is "astrolabe.expr.TypedExpr[astrolabe.expr.Deferred[Literal["pl.col('a') + 1024"]]]"
    reveal_type(pl.col("a") * (1 << 9))  # N: Revealed type is "astrolabe.expr.TypedExpr[astrolabe.expr.Deferred[Literal["pl.col('a') * 512"]]]"
    reveal_type(pl.col("a") - (True + 1))  # N: Revealed type is "astrolabe.expr.TypedExpr[astrolabe.expr.Deferred[Literal["pl.col('a') - 2"]]]"
    reveal_type(pl.col("a") + -(2**3))  # N: Revealed type is "astrolabe.expr.TypedExpr[astrolabe.expr.Deferred[Literal["pl.col('a') + -8"]]]"
    reveal_type(pl.col("a") + 1 // 0)  # N: Revealed type is "astrolabe.expr.TypedExpr[astrolabe.expr.Deferred[Literal["pl.col('a') + hole('int')"]]]"
    reveal_type(pl.col("a") + ~1)  # N: Revealed type is "astrolabe.expr.TypedExpr[astrolabe.expr.Deferred[Literal["pl.col('a') + -2"]]]"
    # Python deprecates ~ on a bool, so the recorder does not fold it.
    reveal_type(pl.col("a") + ~True)  # N: Revealed type is "astrolabe.expr.TypedExpr[astrolabe.expr.Deferred[Literal["pl.col('a') + hole('int')"]]]"
    reveal_type(pl.col("a") + 2**40 * 2**40)  # N: Revealed type is "astrolabe.expr.TypedExpr[astrolabe.expr.Deferred[Literal["pl.col('a') + 1208925819614629174706176"]]]"

    # A Final name whose type keeps no value gives no constant either.
    def local(n: int) -> None:
        declared: Final[int] = n
        reveal_type(pl.col("a") + declared)  # N: Revealed type is "astrolabe.expr.TypedExpr[astrolabe.expr.Deferred[Literal["pl.col('a') + hole('int')"]]]"
        reveal_type(pl.col("a") + 2**declared)  # N: Revealed type is "Any"

- case: a_float_that_folds_to_an_infinity_is_written_as_float_of_a_text
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class FrameSchema(Columns):
        a: pl.Float64
        u: pl.UInt8

    df: TypedDataFrame[FrameSchema]
    # The tree of polars writes an infinity as null, so the code holds the
    # text of the float, which the evaluation reads back.
    reveal_type(pl.col("a") + 1e308 * 10)  # N: Revealed type is "astrolabe.expr.TypedExpr[astrolabe.expr.Deferred[Literal["pl.col('a') + float('inf')"]]]"
    reveal_type(pl.col("a").fill_null(-1e309))  # N: Revealed type is "astrolabe.expr.TypedExpr[astrolabe.expr.Deferred[Literal["pl.col('a').fill_null(float('-inf'))"]]]"
    reveal_type(pl.col("a") + float("1.5"))  # N: Revealed type is "astrolabe.expr.TypedExpr[astrolabe.expr.Deferred[Literal["pl.col('a') + float('1.5')"]]]"
    reveal_type(df.select(pl.col("u") + 1e308 * 10, pl.col("a").fill_null(-1e309)))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'u': polars.datatypes.classes.Float64, 'a': polars.datatypes.classes.Float64}, closed=True), None]"
    reveal_type(df.select(pl.col("u").fill_null(float("1.5"))))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'u': polars.datatypes.classes.Float64}, closed=True), None]"

- case: a_data_type_argument_is_written_by_its_constructor
  main: |
    import polars as pl
    import polars.selectors as cs

    Stamp = pl.Datetime("ms", "UTC")
    reveal_type(pl.col("a").cast(Stamp))  # N: Revealed type is "astrolabe.expr.TypedExpr[astrolabe.expr.Deferred[Literal["pl.col('a').cast(pl.Datetime(time_unit='ms', time_zone='UTC'))"]]]"
    reveal_type(pl.col("a").cast(pl.List(pl.Int8)))  # N: Revealed type is "astrolabe.expr.TypedExpr[astrolabe.expr.Deferred[Literal["pl.col('a').cast(pl.List(pl.Int8))"]]]"
    # A class stays a class: in a selector, it picks every data type of its kind.
    reveal_type(cs.by_dtype(pl.Datetime))  # N: Revealed type is "astrolabe.expr.TypedSelector[astrolabe.expr.Deferred[Literal['cs.by_dtype(pl.Datetime)']]]"

