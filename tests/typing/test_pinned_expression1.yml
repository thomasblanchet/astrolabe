- case: a_branch_cast_to_a_time_unit_joins_the_other_branch
  main: |
    from typing import Literal
    import polars as pl
    from astrolabe import Columns, Datetime, TypedDataFrame

    class Events(Columns):
        i: pl.Int32
        ns: Datetime[Literal["ns"], None]

    df: TypedDataFrame[Events]
    c = pl.col("i") > 0
