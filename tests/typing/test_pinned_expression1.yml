- case: append_joins_lists_arrays_and_structs
  main: |
    from typing import Literal
    import polars as pl
    from astrolabe import Array, Column, Columns, List, Struct, TypedDataFrame, Unchecked

    class Nested(Columns):
        l8: List[pl.Int8]
        lu: List[Unchecked]
        a2: Array[pl.Int8, Literal[2]]
        a3: Array[pl.Int8, Literal[3]]
        sa: Struct[Column[Literal["a"], pl.Int32], Column[Literal["c"], pl.Int8]]
        sb: Struct[Column[Literal["a"], pl.Int64], Column[Literal["b"], pl.String]]

    df: TypedDataFrame[Nested]

    # An operand with an unknown element type gives an unknown answer.
    reveal_type(df.select(pl.col("l8").append(pl.col("lu"))))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'l8': astrolabe.frame.List[astrolabe.frame.Unchecked]}, closed=True), None]"

    # A list beside an array gives a list, in either order.
    reveal_type(df.select(pl.col("l8").append(pl.col("a2"))))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'l8': astrolabe.frame.List[polars.datatypes.classes.Int8]}, closed=True), None]"
    reveal_type(df.select(pl.col("a2").append(pl.col("l8"))))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'a2': astrolabe.frame.List[polars.datatypes.classes.Int8]}, closed=True), None]"

    # Two arrays of different widths give a list.
    reveal_type(df.select(pl.col("a2").append(pl.col("a3"))))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'a2': astrolabe.frame.List[polars.datatypes.classes.Int8]}, closed=True), None]"

    # Two arrays of one shape keep that shape.
    reveal_type(df.select(pl.col("a2").append(pl.col("a2"))))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'a2': astrolabe.frame.Array[polars.datatypes.classes.Int8, Literal[2]]}, closed=True), None]"

    # Two structs keep the fields of the left struct first, and join each shared field.
    reveal_type(df.select(pl.col("sa").append(pl.col("sb"))))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'sa': astrolabe.frame.Struct[tuple[astrolabe.frame.Column[Literal['a'], polars.datatypes.classes.Int64], astrolabe.frame.Column[Literal['c'], polars.datatypes.classes.Int8], astrolabe.frame.Column[Literal['b'], polars.datatypes.classes.String]]]}, closed=True), None]"

- case: a_selection_cast_refuses_the_kinds_that_polars_refuses
  main: |
    import polars as pl
    import polars.selectors as cs
    from astrolabe import Columns, TypedDataFrame

    class Flags(Columns):
        b: pl.Boolean
        k: pl.Int64

    df: TypedDataFrame[Flags]

    # Polars casts a Boolean to an integer.
    reveal_type(df.select(cs.boolean().cast(pl.Int8)))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'b': polars.datatypes.classes.Int8}, closed=True), None]"

    # Polars refuses to cast a Boolean to a Decimal.
    reveal_type(df.select(cs.boolean().cast(pl.Decimal(10, 2))))  # E: This expression cannot cast from Boolean to Decimal(precision=10, scale=2)  [invalid-cast]  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'b': astrolabe.frame.Unchecked}, closed=True), None]"

    # Polars refuses to cast a Datetime to a Boolean.
    reveal_type(df.select(cs.integer().cast(pl.Datetime("ms")).cast(pl.Boolean)))  # E: This expression cannot cast from Datetime(time_unit='ms', time_zone=None) to Boolean  [invalid-cast]  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'k': astrolabe.frame.Unchecked}, closed=True), None]"

- case: agg_keeps_the_mean_of_a_string
  main: |
    import polars as pl
    from astrolabe import Columns, TypedDataFrame

    class Words(Columns):
        k: pl.Int64
        s: pl.String

    df: TypedDataFrame[Words]

    # Inside agg, the mean of a String is a String.
    # A method or an operator after it keeps that rule.
    reveal_type(df.group_by("k").agg(pl.col("s").mean().reverse().alias("r")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'k': polars.datatypes.classes.Int64, 'r': polars.datatypes.classes.String}, closed=True), None]"
    reveal_type(df.group_by("k").agg((pl.col("s").mean() + pl.lit("x")).alias("r")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'k': polars.datatypes.classes.Int64, 'r': polars.datatypes.classes.String}, closed=True), None]"
    reveal_type(df.group_by("k").agg((pl.lit("x") + pl.col("s").mean()).alias("r")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'k': polars.datatypes.classes.Int64, 'r': polars.datatypes.classes.String}, closed=True), None]"
    reveal_type(df.group_by("k").agg(pl.struct(pl.col("s").mean()).alias("r")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'k': polars.datatypes.classes.Int64, 'r': astrolabe.frame.Struct[tuple[astrolabe.frame.Column[Literal['s'], polars.datatypes.classes.String]]]}, closed=True), None]"

    # A cast, a rank and a return_dtype name the answer, and they keep that rule too.
    reveal_type(df.group_by("k").agg(pl.col("s").mean().cast(pl.String)))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'k': polars.datatypes.classes.Int64, 's': polars.datatypes.classes.String}, closed=True), None]"
    reveal_type(df.group_by("k").agg(pl.col("s").mean().cast(pl.Binary)))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'k': polars.datatypes.classes.Int64, 's': polars.datatypes.classes.Binary}, closed=True), None]"
    reveal_type(df.group_by("k").agg(pl.col("s").mean().rank("dense")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'k': polars.datatypes.classes.Int64, 's': polars.datatypes.classes.UInt32}, closed=True), None]"
    reveal_type(df.group_by("k").agg(pl.col("s").mean().map_elements(lambda s: s, return_dtype=pl.String)))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'k': polars.datatypes.classes.Int64, 's': polars.datatypes.classes.String}, closed=True), None]"

    # In a select, mean refuses a String, so the cast is refused too.
    reveal_type(df.select(pl.col("s").mean().cast(pl.String)))  # E: "s" has no result type at this frame's column types: mean does not accept String, and polars raises InvalidOperationError  [unsupported-dtype-op]  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'s': astrolabe.frame.Unchecked}, closed=True), None]"

- case: struct_and_list_comparisons_follow_the_element_rule
  main: |
    from typing import Literal
    import polars as pl
    from astrolabe import Column, Columns, List, Struct, TypedDataFrame

    class Nested(Columns):
        s: pl.String
        l8: List[pl.Int8]
        l16: List[pl.Int16]
        ll: List[pl.List]
        l2: List[List[pl.Int8]]
        sbare: pl.Struct
        ls: List[Struct[Column[Literal["a"], pl.Int8]]]
        ll8: List[List[pl.Int8]]
        sl: Struct[Column[Literal["a"], List[pl.Int8]]]
        ss: Struct[Column[Literal["a"], Struct[Column[Literal["b"], pl.Int8]]]]
        sa: Struct[Column[Literal["a"], pl.Int32], Column[Literal["c"], pl.Int8]]
        sb: Struct[Column[Literal["a"], pl.Int64], Column[Literal["b"], pl.String]]

    df: TypedDataFrame[Nested]

    # Two lists compare where their elements compare.
    reveal_type(df.select((pl.col("l8") == pl.col("l16")).alias("r")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'r': polars.datatypes.classes.Boolean}, closed=True), None]"

    # A list whose element type is unknown gives an unknown answer.
    reveal_type(df.select((pl.col("ll") == pl.col("l2")).alias("r")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'r': polars.datatypes.classes.Boolean}, closed=True), None]"
    reveal_type(df.select((pl.col("l2") == pl.col("ll")).alias("r")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'r': polars.datatypes.classes.Boolean}, closed=True), None]"

    # A struct whose fields are unknown gives an unknown answer.
    reveal_type(df.select((pl.col("sa") == pl.col("sbare")).alias("r")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'r': polars.datatypes.classes.Boolean}, closed=True), None]"

    # Two structs compare by the fields that they share.
    reveal_type(df.select((pl.col("sa") == pl.col("sb")).alias("r")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'r': polars.datatypes.classes.Boolean}, closed=True), None]"

    # A String orders against a struct on its right.
    reveal_type(df.select((pl.col("s") < pl.col("sa")).alias("r")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'r': polars.datatypes.classes.Boolean}, closed=True), None]"

    # Polars refuses to compare a struct with a list.
    reveal_type(df.select((pl.col("sa") == pl.col("l8")).alias("r")))  # E: "r" has no result type at this frame's column types: could not evaluate comparison of Struct({'a': Int32, 'c': Int8}) and List(Int8), and polars raises SchemaError  [unsupported-dtype-op]  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'r': astrolabe.frame.Unchecked}, closed=True), None]"

    # The same rule holds inside a list and inside a field.
    reveal_type(df.select((pl.col("ls") == pl.col("ll8")).alias("r")))  # E: "r" has no result type at this frame's column types: could not evaluate comparison of List(Struct({'a': Int8})) and List(List(Int8)), and polars raises SchemaError  [unsupported-dtype-op]  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'r': astrolabe.frame.Unchecked}, closed=True), None]"
    reveal_type(df.select((pl.col("sl") == pl.col("ss")).alias("r")))  # E: "r" has no result type at this frame's column types: could not evaluate comparison of Struct({'a': List(Int8)}) and Struct({'a': Struct({'b': Int8})}), and polars raises SchemaError  [unsupported-dtype-op]  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'r': astrolabe.frame.Unchecked}, closed=True), None]"

