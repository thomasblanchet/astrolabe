# Cases that pin rules of the expression engine: parameter joins, append,
# casts of a selection, the aggregation context, nested comparisons,
# struct arithmetic, literal bounds and the remainder of a selection.
# Every expected type is checked against real polars by the runtime cross-check.

- case: decimal_branches_keep_the_digits_that_both_branches_need
  main: |
    from typing import Literal
    import polars as pl
    from astrolabe import Columns, Decimal, TypedDataFrame

    class Prices(Columns):
        i: pl.Int32
        n: pl.Null
        big: Decimal[Literal[12], Literal[4]]
        small: Decimal[Literal[6], Literal[2]]
        wide: Decimal[Literal[12], Literal[2]]
        fine: Decimal[Literal[10], Literal[4]]

    df: TypedDataFrame[Prices]
    c = pl.col("i") > 0

    # Two decimals give the larger precision and the larger scale, in either order.
    reveal_type(df.select(pl.when(c).then(pl.col("big")).otherwise(pl.col("small")).alias("r")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'r': astrolabe.frame.Decimal[Literal[12], Literal[4]]}, closed=True), None]"
    reveal_type(df.select(pl.when(c).then(pl.col("small")).otherwise(pl.col("big")).alias("r")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'r': astrolabe.frame.Decimal[Literal[12], Literal[4]]}, closed=True), None]"

    # An integer beside a decimal keeps the precision where its digits fit before the point.
    reveal_type(df.select(pl.coalesce(pl.col("i"), pl.col("wide")).alias("r")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'r': astrolabe.frame.Decimal[Literal[12], Literal[2]]}, closed=True), None]"

    # An integer beside a decimal takes the full precision where its digits do not fit.
    reveal_type(df.select(pl.coalesce(pl.col("i"), pl.col("fine")).alias("r")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'r': astrolabe.frame.Decimal[Literal[38], Literal[4]]}, closed=True), None]"
    reveal_type(df.select(pl.coalesce(pl.col("fine"), pl.col("i")).alias("r")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'r': astrolabe.frame.Decimal[Literal[38], Literal[4]]}, closed=True), None]"

    # A null operand takes the full decimal type of the other operand.
    reveal_type(df.select(pl.coalesce(pl.col("n"), pl.col("wide")).alias("r")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'r': astrolabe.frame.Decimal[Literal[12], Literal[2]]}, closed=True), None]"
    reveal_type(df.select(pl.coalesce(pl.col("wide"), pl.col("n")).alias("r")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'r': astrolabe.frame.Decimal[Literal[12], Literal[2]]}, closed=True), None]"

- case: a_branch_with_an_unknown_time_unit_leaves_the_unit_open
  main: |
    from typing import Literal
    import polars as pl
    from astrolabe import Columns, Datetime, TypedDataFrame

    class Events(Columns):
        i: pl.Int32
        d: pl.Date
        ns: Datetime[Literal["ns"], None]

    df: TypedDataFrame[Events]
    c = pl.col("i") > 0

    # The class pl.Datetime names Datetime("us", None), and polars joins
    # the two branches to that unit in either order.
    reveal_type(df.select(pl.when(c).then(pl.col("ns")).otherwise(pl.col("d").cast(pl.Datetime)).alias("r")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'r': astrolabe.frame.Datetime[Literal['us'], None]}, closed=True), None]"

    def open_unit(unit: pl.Datetime) -> None:
        # A Datetime whose type names no time unit leaves the unit open,
        # whichever branch holds the cast.
        reveal_type(df.select(pl.when(c).then(pl.col("ns")).otherwise(pl.col("d").cast(unit)).alias("r")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'r': polars.datatypes.classes.Datetime}, closed=True), None]"
        reveal_type(df.select(pl.when(c).then(pl.col("d").cast(unit)).otherwise(pl.col("ns")).alias("r")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'r': polars.datatypes.classes.Datetime}, closed=True), None]"

- case: a_datetime_comparison_needs_one_time_zone
  main: |
    from typing import Literal
    import polars as pl
    from astrolabe import Columns, Datetime, TypedDataFrame

    class Events(Columns):
        utc: Datetime[Literal["us"], Literal["UTC"]]
        utc2: Datetime[Literal["us"], Literal["UTC"]]
        naive: Datetime[Literal["us"], None]

    df: TypedDataFrame[Events]

    # Two datetimes in one time zone compare.
    reveal_type(df.select((pl.col("utc") == pl.col("utc2")).alias("r")))  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'r': polars.datatypes.classes.Boolean}, closed=True), None]"

    # Polars refuses to compare two datetimes in different time zones.
    reveal_type(df.select((pl.col("utc") == pl.col("naive")).alias("r")))  # E: "r" has no result type at this frame's column types: could not evaluate comparison of Datetime(time_unit='us', time_zone='UTC') and Datetime(time_unit='us', time_zone=None), and polars raises SchemaError  [unsupported-dtype-op]  # N: Revealed type is "astrolabe.frame.TypedDataFrame[TypedDict({'r': astrolabe.frame.Unchecked}, closed=True), None]"

